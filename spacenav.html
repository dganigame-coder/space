<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Interstellar: The Web Simulator</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; }
        #ui { position: fixed; top: 20px; left: 20px; z-index: 10; pointer-events: none; text-shadow: 0 0 5px #0f0; }
        #overlay { position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        .hud-line { margin-bottom: 5px; background: rgba(0, 40, 0, 0.5); padding: 5px; }
        canvas { display: block; }
        #warp-indicator { position: fixed; bottom: 50px; width: 100%; text-align: center; color: cyan; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="hud-line">SYSTEM: <span id="location">EARTH ORBIT</span></div>
        <div class="hud-line">VELOCITY: <span id="vel">0</span> km/s</div>
        <div class="hud-line">TARGET: <span id="target-ui">MOON</span></div>
    </div>

    <div id="warp-indicator">WARP DRIVE ACTIVE - BENDING SPACETIME</div>

    <div id="overlay">
        <h1 style="color: white;">MISSION: INTERSTELLAR</h1>
        <p style="color: #888;">[ TAP TO INITIATE SEPARATION ]</p>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. ENGINE INITIALIZATION ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Mobile performance cap
        document.body.appendChild(renderer.domElement);

        const loader = new THREE.TextureLoader();
        let stage = 0; // 0: Launch, 1: Separation/Float, 2: Deep Space, 3: Warp
        let velocity = 0;

        // --- 2. CELESTIAL BODIES (Local & Star Systems) ---
        
        // Earth (Hyperrealistic textures)
        const earthGroup = new THREE.Group();
        const earth = new THREE.Mesh(
            new THREE.SphereGeometry(5, 64, 64),
            new THREE.MeshPhongMaterial({
                map: loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'),
                bumpMap: loader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg'),
                bumpScale: 0.05
            })
        );
        earthGroup.add(earth);
        scene.add(earthGroup);

        // The "Fuel Burner" (Rocket Stage)
        const burner = new THREE.Mesh(
            new THREE.CylinderGeometry(0.4, 0.5, 2, 32),
            new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.9, roughness: 0.1 })
        );
        burner.position.set(0, -1, 8); // Positioned right in front of camera
        scene.add(burner);

        // The Moon (Target 1)
        const moon = new THREE.Mesh(
            new THREE.SphereGeometry(1.5, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xaaaaaa })
        );
        moon.position.set(20, 10, -200);
        scene.add(moon);

        // Alpha Centauri (Interstellar Target)
        const alphaCentauri = new THREE.Group();
        alphaCentauri.position.set(0, 0, -2000);
        const starGeo = new THREE.SphereGeometry(10, 32, 32);
        const starMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        alphaCentauri.add(new THREE.Mesh(starGeo, starMat));
        scene.add(alphaCentauri);

        // --- 3. PHYSICS & INTERACTION ---
        const sunLight = new THREE.DirectionalLight(0xffffff, 2);
        sunLight.position.set(10, 10, 20);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x111111));

        // Interaction state
        let isTouching = false;
        const overlay = document.getElementById('overlay');
        const warpUI = document.getElementById('warp-indicator');

        // Mobile Touch Support: Toggle Warp or Start
        overlay.addEventListener('touchstart', startMission);
        overlay.addEventListener('mousedown', startMission);

        function startMission() {
            if (stage === 0) {
                stage = 1; // Start Separation
                overlay.style.display = 'none';
            }
        }

        // Warp trigger for mobile (long press) or desktop (space)
        window.addEventListener('touchstart', () => { if(stage >= 2) isTouching = true; });
        window.addEventListener('touchend', () => { isTouching = false; });
        window.addEventListener('keydown', (e) => { if(e.code === 'Space') isTouching = true; });
        window.addEventListener('keyup', (e) => { if(e.code === 'Space') isTouching = false; });

        // --- 4. THE ANIMATION LOOP (The Physics Engine) ---
        camera.position.z = 12;

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            // Rotation of planets
            earth.rotation.y += 0.0005;

            if (stage === 1) {
                // SEPARATION PHYSICS:
                // Simulate the burner disconnecting and drifting with momentum
                burner.position.z += 0.02;
                burner.position.y -= 0.005;
                burner.rotation.x += 0.002;
                
                // Camera slowly floats back to reveal Earth scale
                camera.position.z += 0.01;
                velocity = 7.8; // Orbital velocity
                
                if (burner.position.z > 30) stage = 2; // Move to deep space
            }

            if (stage >= 2) {
                // NAVIGATION / WARP PHYSICS:
                // If user touches screen/holds space, simulate FTL (Faster Than Light)
                if (isTouching) {
                    velocity = THREE.MathUtils.lerp(velocity, 5000, 0.02);
                    warpUI.style.display = 'block';
                    camera.fov = THREE.MathUtils.lerp(camera.fov, 100, 0.05); // "Tunnel vision" effect
                } else {
                    velocity = THREE.MathUtils.lerp(velocity, 20, 0.02);
                    warpUI.style.display = 'none';
                    camera.fov = THREE.MathUtils.lerp(camera.fov, 75, 0.05);
                }
                camera.updateProjectionMatrix();

                // Move camera forward based on calculated velocity
                camera.position.z -= (velocity * 0.01);

                // UI Updates based on distance
                const distToMoon = camera.position.distanceTo(moon.position);
                const distToStar = camera.position.distanceTo(alphaCentauri.position);

                if (distToMoon < 50) {
                    document.getElementById('location').innerText = "LUNAR ORBIT";
                    document.getElementById('target-ui').innerText = "ALPHA CENTAURI";
                }
                if (distToStar < 200) {
                    document.getElementById('location').innerText = "ALPHA CENTAURI SYSTEM";
                    document.getElementById('target-ui').innerText = "PROXIMA B (Exoplanet)";
                }
            }

            document.getElementById('vel').innerText = velocity.toFixed(1);
            renderer.render(scene, camera);
        }

        // Handle window scaling for mobile rotation
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
