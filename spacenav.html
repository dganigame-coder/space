<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Wonders: Relativity Sim</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; text-shadow: 0 0 5px #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Celestial Simulator v2.6</h1>
        <p>Object: <span id="target">Schwarzschild Black Hole</span></p>
        <p>Time Dilation: <span id="dilation">Active (1s : 100y)</span></p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. CORE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // High res, but capped for mobile heat
        document.body.appendChild(renderer.domElement);

        // --- 2. THE BLACK HOLE SHADER (General Relativity) ---
        // This shader calculates light bending around the singularity
        const bhGeometry = new THREE.SphereGeometry(2, 64, 64);
        const bhMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                varying vec2 vUv;

                void main() {
                    vec2 uv = vUv - 0.5;
                    float r = length(uv);
                    
                    // Gravitational Lensing Simulation
                    // Light paths bend more as they get closer to the center (r < 0.2)
                    float distortion = 0.02 / (r + 0.01);
                    vec2 distortedUv = vUv + (uv * distortion);

                    // The Event Horizon (The Blackness)
                    float horizon = smoothstep(0.15, 0.16, r);

                    // The Accretion Disk (Swirling plasma)
                    float angle = atan(uv.y, uv.x) + time * 2.0;
                    float disk = sin(angle * 5.0 + r * 50.0) * 0.5 + 0.5;
                    disk *= smoothstep(0.4, 0.2, r) * smoothstep(0.18, 0.25, r);

                    vec3 color = vec3(1.0, 0.6, 0.2) * disk * 2.0; // Orange hot plasma
                    color *= horizon; // Cut out the middle for the hole

                    // Add a slight blue shift on the "approaching" side (Doppler)
                    if(uv.x > 0.0) color.b += 0.2;

                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            transparent: true
        });

        const blackHole = new THREE.Mesh(bhGeometry, bhMaterial);
        scene.add(blackHole);

        // --- 3. WORMHOLE BACKGROUND ---
        // Creating a "tunnel" of stars to represent the wormhole exit
        const starGeom = new THREE.BufferGeometry();
        const starCount = 5000;
        const posArray = new Float32Array(starCount * 3);
        for(let i=0; i < starCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 100;
        }
        starGeom.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starMat = new THREE.PointsMaterial({ size: 0.05, color: 0xffffff });
        const stars = new THREE.Points(starGeom, starMat);
        scene.add(stars);

        camera.position.z = 5;

        // --- 4. INTERACTION ---
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        // --- 5. ANIMATION LOOP ---
        function animate(t) {
            requestAnimationFrame(animate);
            
            const time = t * 0.001;
            bhMaterial.uniforms.time.value = time;

            // Simulate Time Twisting: Move stars based on gravity
            stars.rotation.y = time * 0.1;
            stars.position.z = Math.sin(time * 0.5) * 2;

            // Camera movement
            camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 2 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        animate(0);

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
