<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hyperspace Sim v3.0</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; touch-action: none; }
        #overlay { position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #111, #000); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; text-align: center; }
        #ui { position: absolute; bottom: 20px; left: 20px; pointer-events: none; opacity: 0.7; font-size: 12px; letter-spacing: 1px; }
        .btn { border: 1px solid #fff; padding: 15px 30px; border-radius: 30px; text-transform: uppercase; font-weight: bold; margin-top: 20px; transition: 0.3s; }
        .btn:hover { background: #fff; color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>SINGULARITY ENGINE</h1>
        <p>Schwarzschild Metric & Gravitational Lensing</p>
        <div class="btn">Initiate Simulation</div>
    </div>

    <div id="ui">
        LOCATION: EVENT HORIZON [R = 2M]<br>
        TIME DILATION: INFINITE<br>
        STATUS: STABLE
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- SCENE & RENDERER ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- RELATIVITY SHADER (The Black Hole) ---
        const bhGeometry = new THREE.SphereGeometry(2, 64, 64);
        const bhMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                mouse: { value: new THREE.Vector2(0, 0) }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec2 mouse;
                varying vec2 vUv;

                void main() {
                    vec2 uv = vUv - 0.5;
                    float r = length(uv);
                    
                    // Gravitational Lensing (Schwarzschild-like warp)
                    float distortion = 0.03 / (r + 0.005);
                    vec2 distortedUv = vUv + (uv * distortion);

                    // Event Horizon
                    float horizon = smoothstep(0.14, 0.15, r);

                    // Accretion Disk Physics
                    float angle = atan(uv.y, uv.x) + time * 1.5;
                    float disk = sin(angle * 4.0 + r * 60.0) * 0.5 + 0.5;
                    disk *= smoothstep(0.45, 0.2, r) * smoothstep(0.18, 0.25, r);

                    // Color: Blue shift vs Red shift (Doppler approximation)
                    vec3 color = vec3(1.0, 0.5, 0.1) * disk * 2.5;
                    if(uv.x > 0.0) color += vec3(0.0, 0.1, 0.3) * disk; 

                    gl_FragColor = vec4(color * horizon, 1.0);
                }
            `,
            transparent: true
        });

        const blackHole = new THREE.Mesh(bhGeometry, bhMaterial);
        scene.add(blackHole);

        // --- WORMHOLE / STARFIELD ---
        const starGeom = new THREE.BufferGeometry();
        const starCount = 8000;
        const posArray = new Float32Array(starCount * 3);
        for(let i=0; i < starCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 150;
        }
        starGeom.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starMat = new THREE.PointsMaterial({ size: 0.07, color: 0xaaaaaa, transparent: true, opacity: 0.8 });
        const stars = new THREE.Points(starGeom, starMat);
        scene.add(stars);

        camera.position.z = 6;

        // --- INTERACTION & SOUND ---
        let targetX = 0, targetY = 0;
        const overlay = document.getElementById('overlay');
        const listener = new THREE.AudioListener();
        const sound = new THREE.Audio(listener);

        // Load Ambient Deep Space Sound
        const audioLoader = new THREE.AudioLoader();
        audioLoader.load('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3', (buffer) => {
            sound.setBuffer(buffer);
            sound.setLoop(true);
            sound.setVolume(0.4);
        });

        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            if (THREE.AudioContext.getContext().state === 'suspended') {
                THREE.AudioContext.getContext().resume();
            }
            if (sound.buffer) sound.play();
        });

        function updateInput(x, y) {
            targetX = (x / window.innerWidth - 0.5) * 4;
            targetY = (y / window.innerHeight - 0.5) * 4;
        }

        window.addEventListener('mousemove', (e) => updateInput(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            updateInput(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        // --- ANIMATION LOOP ---
        function animate(t) {
            requestAnimationFrame(animate);
            const time = t * 0.001;

            bhMaterial.uniforms.time.value = time;
            
            // Subtle rotation of the universe
            stars.rotation.y = time * 0.02;
            stars.position.z = Math.sin(time * 0.2) * 5;

            // Smooth Camera Follow
            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.y += (-targetY - camera.position.y) * 0.05;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate(0);
    </script>
</body>
</html>
