<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VOYAGER 2026: FINAL</title>
    <style>
        body { margin: 0; background: #000; color: #00ffff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        #hud { position: fixed; top: 20px; left: 20px; z-index: 10; pointer-events: none; border-left: 2px solid #00ffff; padding-left: 15px; background: rgba(0,0,0,0.5); font-size: 14px; }
        #surface-intel { position: fixed; bottom: 20px; width: 100%; text-align: center; color: #fff; font-weight: bold; background: rgba(0,255,255,0.1); padding: 10px 0; display: none; }
        
        /* Smooth Joystick UI */
        .js-base { position: fixed; bottom: 50px; width: 100px; height: 100px; border: 2px solid rgba(0,255,255,0.3); border-radius: 50%; background: rgba(0,255,255,0.05); }
        #js-left { left: 40px; }
        #js-right { right: 40px; }
        .js-knob { width: 30px; height: 30px; background: #00ffff; border-radius: 50%; position: absolute; top: 35px; left: 35px; box-shadow: 0 0 20px #00ffff; }
        
        #overlay { position: fixed; z-index: 1000; width: 100%; height: 100%; background: radial-gradient(circle, #111, #000); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

    <div id="hud">
        <div style="font-weight: bold;">COMMANDER: ON MISSION</div>
        <div id="loc-ui">LOC: EARTH ORBIT</div>
        <div id="spd-ui">SPD: 0.0 AU/s</div>
        <div id="tgt-ui">TARGET: MOON</div>
    </div>

    <div id="surface-intel"></div>

    <div id="js-left" class="js-base"><div class="js-knob" id="knob-l"></div></div>
    <div id="js-right" class="js-base"><div class="js-knob" id="knob-r"></div></div>

    <div id="overlay">
        <h1 style="color: white; letter-spacing: 5px;">MISSION START</h1>
        <p style="color: #00ffff;">[ TAP TO SEPARATE FROM EARTH ]</p>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. SETUP & REALISTIC LIGHTING ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const loader = new THREE.TextureLoader();

        // High-Quality Stars
        const starGeom = new THREE.SphereGeometry(900000, 32, 32);
        const starMat = new THREE.MeshBasicMaterial({ 
            map: loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'), // Using as star noise
            side: THREE.BackSide, transparent: true, opacity: 0.2, color: 0x8888ff
        });
        scene.add(new THREE.Mesh(starGeom, starMat));

        // --- 2. PLANET GENERATOR (TEXTURING) ---
        const planets = [
            { name: "SUN", r: 4000, pos: [0, 0, -60000], color: 0xffaa00, map: '', info: "WARNING: EXTERNAL HEAT 5000K" },
            { name: "EARTH", r: 600, pos: [0, 0, 0], color: 0x4488ff, map: 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg', info: "LANDED: EARTH. 1G GRAVITY. OXYGEN STABLE." },
            { name: "MOON", r: 150, pos: [1500, 800, -5000], color: 0xaaaaaa, map: 'https://threejs.org/examples/textures/planets/moon_1024.jpg', info: "LANDED: MOON. LOW GRAVITY. VACUUM." },
            { name: "MARS", r: 350, pos: [-8000, 0, -40000], color: 0xff5522, map: 'https://threejs.org/examples/textures/planets/mars_1k_color.jpg', info: "LANDED: MARS. THIN ATMOSPHERE. COLD." }
        ];

        const bodies = [];
        planets.forEach(p => {
            const group = new THREE.Group();
            const mat = new THREE.MeshPhongMaterial({
                color: p.color,
                map: p.map ? loader.load(p.map) : null,
                emissive: p.name === "SUN" ? p.color : 0x000000,
                emissiveIntensity: 2
            });
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.r, 64, 64), mat);
            group.add(mesh);

            // Atmospheric Glow (Makes them look like spheres of gas/rock)
            const glow = new THREE.Mesh(
                new THREE.SphereGeometry(p.r * 1.05, 32, 32),
                new THREE.MeshBasicMaterial({ color: p.color, transparent: true, opacity: 0.1, side: THREE.BackSide })
            );
            group.add(glow);

            group.position.set(...p.pos);
            group.userData = p;
            scene.add(group);
            bodies.push(group);
        });

        const sunLight = new THREE.PointLight(0xffffff, 8, 1000000);
        sunLight.position.set(0, 0, -60000);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x222222));

        // --- 3. PHYSICS & SMOOTH CONTROLS ---
        let velocity = new THREE.Vector3();
        let targetVelocity = new THREE.Vector3();
        let currentRot = new THREE.Euler(0, 0, 0, 'YXZ');
        let controls = { yaw: 0, pitch: 0, thrust: 0 };
        let active = false;

        document.getElementById('overlay').onclick = () => { active = true; document.getElementById('overlay').style.display = 'none'; };

        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for(let t of e.touches) {
                if(t.clientX < window.innerWidth/2) {
                    controls.yaw = -((t.clientX - 90)/50) * 0.03;
                    controls.pitch = -((t.clientY - (window.innerHeight - 100))/50) * 0.03;
                } else {
                    controls.thrust = (window.innerHeight - 100 - t.clientY) * 0.05;
                }
            }
        }, {passive: false});

        window.addEventListener('touchend', () => { controls = { yaw:0, pitch:0, thrust:0 }; });

        // --- 4. FLIGHT LOOP ---
        camera.position.set(0, 610, 100);

        function animate() {
            requestAnimationFrame(animate);
            if(!active) return;

            // Rotate
            currentRot.y += controls.yaw;
            currentRot.x += controls.pitch;
            camera.setRotationFromEuler(currentRot);

            // Move
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            velocity.add(dir.multiplyScalar(controls.thrust * 0.02));
            velocity.multiplyScalar(0.98); // Space Damping
            camera.position.add(velocity);

            // Landing & Tidal Info
            let near = "DEEP SPACE";
            let intel = "";
            bodies.forEach(b => {
                const d = camera.position.distanceTo(b.position);
                const r = b.userData.r;
                if (d < r * 10) near = b.userData.name;
                if (d < r + 15) {
                    velocity.set(0,0,0);
                    const push = new THREE.Vector3().subVectors(camera.position, b.position).setLength(r + 15);
                    camera.position.copy(b.position).add(push);
                    intel = b.userData.info;
                }
            });

            document.getElementById('loc-ui').innerText = "LOC: " + near;
            document.getElementById('spd-ui').innerText = "SPD: " + (velocity.length() * 10).toFixed(1) + " AU/s";
            document.getElementById('surface-intel').innerText = intel;
            document.getElementById('surface-intel').style.display = intel ? "block" : "none";

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
