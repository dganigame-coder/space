<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Interstellar Mission Control</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; }
        #ui { position: fixed; top: 10px; left: 10px; z-index: 10; pointer-events: none; }
        #overlay { position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; text-align: center; color: white; }
        
        /* Joystick Styles */
        .joystick { position: fixed; bottom: 40px; width: 100px; height: 100px; border: 1px solid #0f0; border-radius: 50%; display: none; }
        #left-stick { left: 40px; }
        #right-stick { right: 40px; border-color: cyan; }
        .knob { width: 30px; height: 30px; background: rgba(0, 255, 0, 0.5); border-radius: 50%; position: absolute; top: 35px; left: 35px; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="mission-log">STATUS: WAITING FOR IGNITION</div>
        <div>DIST TO TARGET: <span id="dist-ui">--</span> km</div>
    </div>

    <div id="left-stick" class="joystick"><div class="knob" id="left-knob"></div></div>
    <div id="right-stick" class="joystick"><div class="knob" id="right-knob"></div></div>

    <div id="overlay">
        <h1>LAUNCH SEQUENCE READY</h1>
        <p>TAP TO INITIATE LIFT-OFF</p>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. ENGINE SETUP
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. THE SOLAR SYSTEM (Scale-correct positioning)
        const loader = new THREE.TextureLoader();
        const starGeo = new THREE.SphereGeometry(50000, 32, 32);
        const starMat = new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.BackSide });
        scene.add(new THREE.Mesh(starGeo, starMat));

        // Create Earth (Start Point)
        const earth = new THREE.Mesh(new THREE.SphereGeometry(500, 64, 64), new THREE.MeshPhongMaterial({ map: loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg') }));
        scene.add(earth);

        // Create Moon (Target 1)
        const moon = new THREE.Mesh(new THREE.SphereGeometry(130, 32, 32), new THREE.MeshStandardMaterial({ color: 0x888888 }));
        moon.position.set(0, 500, -15000); // Placed far for realistic travel
        scene.add(moon);

        // Lighting
        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(10000, 10000, 10000);
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0x222222));

        // 3. FLIGHT CONTROLS & STATE
        let phase = "WAIT"; // WAIT -> LAUNCH -> SEPARATE -> FREE
        let velocity = new THREE.Vector3();
        let targetRot = new THREE.Euler(0, 0, 0, 'YXZ');
        let controls = { left: {x:0, y:0}, right: {x:0, y:0} };

        // 4. ANIMATION HANDLER
        document.getElementById('overlay').onclick = () => {
            phase = "LAUNCH";
            document.getElementById('overlay').style.display = 'none';
        };

        // Touch Interaction (Joysticks)
        function handleTouch(e, side) {
            const touch = e.touches[0];
            const rect = document.getElementById(side + '-stick').getBoundingClientRect();
            controls[side].x = (touch.clientX - (rect.left + 50)) / 50;
            controls[side].y = (touch.clientY - (rect.top + 50)) / 50;
        }

        window.addEventListener('touchmove', (e) => {
            if (e.touches[0].clientX < window.innerWidth/2) handleTouch(e, 'left');
            else handleTouch(e, 'right');
        });

        // 5. MAIN LOOP
        camera.position.set(0, 495, 20); // Starting just above Earth's surface
        camera.lookAt(0, 500, 0);

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            if (phase === "LAUNCH") {
                // SCRIPTED: Ascend from Earth
                camera.position.y += 0.5;
                camera.position.z += 0.1;
                document.getElementById('mission-log').innerText = "STATUS: ASCENDING TO ORBIT...";
                if (camera.position.y > 700) phase = "SEPARATE";
            }

            if (phase === "SEPARATE") {
                // SCRIPTED: Level out and activate controls
                camera.lookAt(moon.position);
                document.getElementById('left-stick').style.display = 'block';
                document.getElementById('right-stick').style.display = 'block';
                document.getElementById('mission-log').innerText = "STATUS: BOOSTER SEPARATED. PILOT CONTROL ACTIVE.";
                phase = "FREE";
            }

            if (phase === "FREE") {
                // PILOT CONTROLLED PHYSICS
                // Steering (Left Stick)
                targetRot.y -= controls.left.x * 0.02;
                targetRot.x -= controls.left.y * 0.02;
                camera.setRotationFromEuler(targetRot);

                // Thrust (Right Stick)
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                velocity.add(dir.multiplyScalar(-controls.right.y * 0.5));
                camera.position.add(velocity);

                // Tidal/Gravity Feeling
                const distToMoon = camera.position.distanceTo(moon.position);
                document.getElementById('dist-ui').innerText = Math.round(distToMoon);

                if (distToMoon < 500) {
                    document.getElementById('mission-log').innerText = "STATUS: LUNAR GRAVITY DETECTED. PREPARE TO LAND.";
                    velocity.multiplyScalar(0.98); // Simulate atmospheric/gravity drag
                }
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
