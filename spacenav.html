<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Interstellar 2026: Pro Edition</title>
    <style>
        body { margin: 0; background: #000; color: #00ffff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        #hud { position: fixed; top: 20px; left: 20px; z-index: 10; pointer-events: none; border-left: 2px solid #00ffff; padding-left: 15px; background: rgba(0,0,0,0.4); }
        #surface-card { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 20, 40, 0.9); padding: 30px; border: 1px solid #00ffff; display: none; text-align: center; }
        
        /* THE JOYSTICKS */
        .joystick-base { position: fixed; bottom: 50px; width: 120px; height: 120px; border: 2px solid rgba(0,255,255,0.3); border-radius: 50%; background: rgba(0,255,255,0.05); }
        #left-js { left: 40px; }
        #right-js { right: 40px; }
        .knob { width: 40px; height: 40px; background: #00ffff; border-radius: 50%; position: absolute; top: 40px; left: 40px; box-shadow: 0 0 15px #00ffff; opacity: 0.8; }
        
        #overlay { position: fixed; z-index: 1000; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
    </style>
</head>
<body>

    <div id="hud">
        <div style="font-weight: bold; letter-spacing: 2px;">Vessel: X-1 EXPLORER</div>
        <div id="loc-display">Location: Earth Surface</div>
        <div id="spd-display">Speed: 0.0 AU/s</div>
        <div style="color: #55ff55; margin-top: 5px;">[Left Stick: Rotate | Right Stick: Thrust]</div>
    </div>

    <div id="surface-card">
        <h2 id="planet-name">PLANET</h2>
        <p id="planet-info">Surface details loading...</p>
        <button onclick="this.parentElement.style.display='none'" style="background:none; color:white; border:1px solid white; padding:5px 15px; cursor:pointer;">EXIT COCKPIT</button>
    </div>

    <div id="left-js" class="joystick-base"><div class="knob" id="knob-l"></div></div>
    <div id="right-js" class="joystick-base"><div class="knob" id="knob-r"></div></div>

    <div id="overlay">
        <h1 style="color: white; margin-bottom: 0;">IGNITION READY</h1>
        <p style="color: #00ffff;">TAP TO BEGIN ASCENT</p>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. ENGINE SETUP WITH LOGARITHMIC DEPTH (Stops flicker) ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const loader = new THREE.TextureLoader();

        // --- 2. BRIGHTENING SPACE (The Starfield Fix) ---
        // Instead of dark, we create 15,000 bright stars of varying sizes
        const starGeom = new THREE.BufferGeometry();
        const starCoords = [];
        const starColors = [];
        for(let i=0; i<15000; i++) {
            const x = (Math.random() - 0.5) * 100000;
            const y = (Math.random() - 0.5) * 100000;
            const z = (Math.random() - 0.5) * 100000;
            starCoords.push(x, y, z);
            starColors.push(0.5 + Math.random(), 0.5 + Math.random(), 1);
        }
        starGeom.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
        starGeom.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));
        const starMat = new THREE.PointsMaterial({ size: 25, vertexColors: true, transparent: true, opacity: 0.8 });
        scene.add(new THREE.Points(starGeom, starMat));

        // --- 3. PLANETARY BODIES ---
        const planets = [
            { name: "SUN", r: 4000, pos: [0, 0, -50000], color: 0xffaa00, info: "The center of our system. Extreme heat and radiation." },
            { name: "EARTH", r: 600, pos: [0, 0, 0], color: 0x2266ff, info: "The Blue Marble. Nitrogen-Oxygen atmosphere. Perfect for life." },
            { name: "MOON", r: 150, pos: [1000, 500, -3000], color: 0x888888, info: "Earth's companion. Low gravity and craters." },
            { name: "MARS", r: 350, pos: [-5000, 0, -20000], color: 0xff4400, info: "The Red Planet. Iron oxide surface and thin air." },
            { name: "JUPITER", r: 6000, pos: [15000, -2000, -80000], color: 0xccaa88, info: "The Giant. Intense gravity and a massive storm system." }
        ];

        const bodies = [];
        planets.forEach(p => {
            const group = new THREE.Group();
            group.position.set(...p.pos);
            
            // Core Sphere
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(p.r, 64, 64),
                new THREE.MeshStandardMaterial({ 
                    color: p.color, 
                    emissive: p.name === "SUN" ? p.color : 0x000000,
                    emissiveIntensity: 2
                })
            );
            group.add(mesh);

            // Atmosphere Glow (Fixes the "Too Dark" look)
            const glow = new THREE.Mesh(
                new THREE.SphereGeometry(p.r * 1.1, 32, 32),
                new THREE.MeshBasicMaterial({ color: p.color, transparent: true, opacity: 0.15, side: THREE.BackSide })
            );
            group.add(glow);

            group.userData = p;
            scene.add(group);
            bodies.push(group);
        });

        const sunLight = new THREE.PointLight(0xffffff, 5, 500000);
        sunLight.position.set(0, 0, -50000);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x333333)); // General space brightness

        // --- 4. SMOOTH CONTROL ENGINE ---
        let velocity = new THREE.Vector3();
        let targetRot = new THREE.Euler(0, 0, 0, 'YXZ');
        let controls = { yaw: 0, pitch: 0, thrust: 0 };
        let active = false;

        document.getElementById('overlay').onclick = () => {
            active = true;
            document.getElementById('overlay').style.display = 'none';
        };

        // Joystick Logic with Smoothing
        const updateStick = (e) => {
            for(let t of e.touches) {
                if(t.clientX < window.innerWidth/2) { // LEFT STICK: ROTATION
                    controls.yaw = -((t.clientX - 100) / 60) * 0.03;
                    controls.pitch = -((t.clientY - (window.innerHeight - 110)) / 60) * 0.03;
                } else { // RIGHT STICK: THRUST
                    controls.thrust = -(t.clientY - (window.innerHeight - 110)) * 0.02;
                }
            }
        };

        window.addEventListener('touchmove', (e) => { e.preventDefault(); updateStick(e); }, {passive: false});
        window.addEventListener('touchend', () => { controls.thrust = 0; controls.yaw = 0; controls.pitch = 0; });

        // --- 5. THE LOOP ---
        camera.position.set(0, 610, 50); // Start just off Earth surface

        function animate() {
            requestAnimationFrame(animate);
            if(!active) return;

            // Rotation with Inertia
            targetRot.y += controls.yaw;
            targetRot.x += controls.pitch;
            camera.setRotationFromEuler(targetRot);

            // Thrust
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            velocity.add(dir.multiplyScalar(controls.thrust * 0.1));
            velocity.multiplyScalar(0.99); // Drag
            camera.position.add(velocity);

            // Landing & Proximity
            let nearest = "Deep Space";
            bodies.forEach(b => {
                const d = camera.position.distanceTo(b.position);
                const r = b.userData.r;
                if(d < r * 5) nearest = b.userData.name;

                if(d < r + 10) { // LANDING
                    velocity.set(0,0,0);
                    const push = new THREE.Vector3().subVectors(camera.position, b.position).setLength(r + 10);
                    camera.position.copy(b.position).add(push);
                    document.getElementById('surface-card').style.display = 'block';
                    document.getElementById('planet-name').innerText = b.userData.name;
                    document.getElementById('planet-info').innerText = b.userData.info;
                }
            });

            document.getElementById('loc-display').innerText = "Location: " + nearest;
            document.getElementById('spd-display').innerText = "Speed: " + (velocity.length() * 10).toFixed(1) + " AU/s";

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
