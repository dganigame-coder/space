<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Cosmic Lab V2.0 - Hyper-Realistic</title>
    <style>
        body { margin: 0; background: #000; color: #00f2ff; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; }
        #sidebar { width: 280px; height: 100vh; overflow-y: auto; background: #05050a; border-left: 2px solid #1a1a2e; padding: 15px; z-index: 100; }
        .version { font-size: 12px; color: #555; text-align: left; margin-bottom: 10px; }
        .category { margin: 20px 0 10px; font-size: 14px; color: #ff00ff; text-transform: uppercase; border-bottom: 1px solid #333; }
        button { width: 100%; text-align: right; background: rgba(255,255,255,0.05); border: 1px solid #222; color: #ccc; padding: 10px; margin: 3px 0; cursor: pointer; transition: 0.2s; border-radius: 4px; }
        button:hover { background: #00f2ff; color: #000; font-weight: bold; }
        #canvas-container { flex-grow: 1; position: relative; }
        #info { position: absolute; bottom: 30px; left: 30px; pointer-events: none; }
        #obj-name { font-size: 42px; margin: 0; text-shadow: 0 0 15px #00f2ff; }
    </style>
    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
</head>
<body>

<div id="sidebar">
    <div class="version">Build Version: 2.0.4b</div>
    <div class="category">מערכת השמש (V2 High-Res)</div>
    <button onclick="load(0)">כוכב חמה</button>
    <button onclick="load(1)">נוגה</button>
    <button onclick="load(2)">כדור הארץ</button>
    <button onclick="load(3)">מאדים</button>
    <button onclick="load(4)">צדק</button>
    <button onclick="load(5)">שבתאי</button>
    <button onclick="load(6)">אורנוס</button>
    <button onclick="load(7)">נפטון</button>
    <button onclick="load(8)">פלוטו</button>

    <div class="category">אנומליות ובוסים</div>
    <button onclick="load(9)">השמש (Star)</button>
    <button onclick="load(10)">חור שחור (Black Hole)</button>
    <button onclick="load(11)">חור תולעת</button>
    <button onclick="load(12)">סופרנובה</button>
    <button onclick="load(13)">פאלסאר</button>
    <button onclick="load(14)">ערפילית</button>
    <button onclick="load(15)">קוואזר</button>
</div>

<div id="canvas-container">
    <div id="info"><h1 id="obj-name">בחר אובייקט V2.0</h1></div>
</div>

<script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, (window.innerWidth - 280) / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth - 280, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // תאורה היפר-ריאליסטית: אור שמש ממוקד
    const sunLight = new THREE.DirectionalLight(0xffffff, 4);
    sunLight.position.set(5, 3, 5);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x111111)); // צללים עמוקים בחלל

    camera.position.z = 5;
    let currentObject = null;
    const clock = new THREE.Clock();

    // מנוע ה-Shaders לטקסטורה פרוצדורלית (בלי תמונות)
    const PlanetShader = {
        getMaterial: (color1, color2, isGas = false) => {
            return new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    c1: { value: new THREE.Color(color1) },
                    c2: { value: new THREE.Color(color2) }
                },
                vertexShader: `
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    void main() {
                        vUv = uv;
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    uniform vec3 c1;
                    uniform vec3 c2;
                    uniform float time;

                    float noise(vec2 p) {
                        return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
                    }

                    void main() {
                        // יצירת טקסטורה מורכבת של מכתשים או פסי גז
                        float n = noise(vUv * ${isGas ? '20.0' : '80.0'});
                        float f = ${isGas ? 'sin(vUv.y * 30.0 + sin(vUv.x * 5.0))' : 'smoothstep(0.4, 0.5, n)'};
                        
                        // אפקט Fresnel (זוהר אטמוספרי בקצוות)
                        float atmos = pow(1.0 - dot(vNormal, vec3(0,0,1)), 4.0);
                        
                        vec3 base = mix(c1, c2, f * 0.5 + 0.5);
                        gl_FragColor = vec4(base + (atmos * 0.3), 1.0);
                    }
                `
            });
        }
    };

    const data = [
        { name: "כוכב חמה", func: () => new THREE.Mesh(new THREE.SphereGeometry(1.2, 128, 128), PlanetShader.getMaterial(0x666666, 0x222222)) },
        { name: "נוגה", func: () => new THREE.Mesh(new THREE.SphereGeometry(1.5, 128, 128), PlanetShader.getMaterial(0xe3bb76, 0xaa8844, true)) },
        { name: "כדור הארץ", func: () => new THREE.Mesh(new THREE.SphereGeometry(1.5, 128, 128), PlanetShader.getMaterial(0x0044ff, 0x00ff44)) },
        { name: "מאדים", func: () => new THREE.Mesh(new THREE.SphereGeometry(1.3, 128, 128), PlanetShader.getMaterial(0xff4400, 0x661100)) },
        { name: "צדק", func: () => new THREE.Mesh(new THREE.SphereGeometry(2.2, 128, 128), PlanetShader.getMaterial(0xd8ca9d, 0xa5643a, true)) },
        { name: "שבתאי", func: () => {
            const g = new THREE.Group();
            g.add(new THREE.Mesh(new THREE.SphereGeometry(1.8, 128, 128), PlanetShader.getMaterial(0xdfd3a3, 0xc2b280, true)));
            const ring = new THREE.Mesh(new THREE.RingGeometry(2.2, 3.8, 64), new THREE.MeshBasicMaterial({color:0x998877, side:2, transparent:true, opacity:0.6}));
            ring.rotation.x = Math.PI/2; g.add(ring); return g;
        }},
        { name: "אורנוס", func: () => new THREE.Mesh(new THREE.SphereGeometry(1.6, 128, 128), PlanetShader.getMaterial(0xafeeee, 0x4682b4, true)) },
        { name: "נפטון", func: () => new THREE.Mesh(new THREE.SphereGeometry(1.6, 128, 128), PlanetShader.getMaterial(0x4169e1, 0x00008b, true)) },
        { name: "פלוטו", func: () => new THREE.Mesh(new THREE.SphereGeometry(0.7, 128, 128), PlanetShader.getMaterial(0xdddddd, 0x888888)) },
        // אנומליות (ללא שינוי מהותי מהקוד הקודם, רק תאורה משופרת)
        { name: "השמש", func: () => {
            const m = new THREE.Mesh(new THREE.SphereGeometry(2, 64, 64), new THREE.MeshBasicMaterial({color: 0xffaa00}));
            return m;
        }},
        { name: "חור שחור", func: () => {
            const g = new THREE.Group();
            g.add(new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), new THREE.MeshBasicMaterial({color: 0x000000})));
            const ring = new THREE.Mesh(new THREE.TorusGeometry(2.5, 0.1, 2, 100), new THREE.MeshBasicMaterial({color: 0xff6600, transparent: true, opacity: 0.8}));
            ring.rotation.x = Math.PI/2; g.add(ring); return g;
        }}
    ];

    window.load = (idx) => {
        if(currentObject) scene.remove(currentObject);
        const item = data[idx];
        document.getElementById('obj-name').innerText = item.name;
        currentObject = item.func();
        scene.add(currentObject);
    };

    function animate() {
        requestAnimationFrame(animate);
        if(currentObject) {
            currentObject.rotation.y += 0.003;
            // עדכון זמן ל-Shaders
            if (currentObject.material && currentObject.material.uniforms) {
                currentObject.material.uniforms.time.value = clock.getElapsedTime();
            }
        }
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
