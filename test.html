<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Lab V2.3 - Final Hyper-Realistic</title>
    <style>
        body { margin: 0; background: #000; color: #00f2ff; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; display: flex; }
        #sidebar { 
            width: 250px; height: 100vh; overflow-y: auto; background: #050505; 
            border-left: 1px solid #1a1a2e; padding: 15px; z-index: 100;
        }
        .category { margin: 15px 0 5px; font-size: 13px; color: #ff00ff; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 3px; }
        button { 
            width: 100%; text-align: right; background: rgba(255,255,255,0.05); 
            border: 1px solid #222; color: #ccc; padding: 10px; margin: 3px 0; 
            cursor: pointer; border-radius: 4px; font-size: 14px; transition: 0.3s;
        }
        button:hover { background: #00f2ff; color: #000; font-weight: bold; transform: scale(1.02); }
        #canvas-container { flex-grow: 1; position: relative; cursor: grab; }
        #info { position: absolute; bottom: 20px; right: 20px; pointer-events: none; text-align: right; }
        #obj-name { font-size: 32px; margin: 0; text-shadow: 0 0 15px #00f2ff; color: #fff; }
        
        /* התאמה למובייל */
        @media (max-width: 768px) {
            #sidebar { width: 140px; padding: 10px; }
            button { padding: 8px; font-size: 12px; }
            #obj-name { font-size: 22px; }
        }
    </style>
    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
</head>
<body>

<div id="sidebar">
    <div style="font-size: 10px; opacity: 0.4; margin-bottom: 10px;">Build 2.3.0 - Mobile Optimized</div>
    <div class="category">מערכת השמש</div>
    <div id="cat-solar"></div>
    <div class="category">בוסים ואנומליות</div>
    <div id="cat-boss"></div>
    <div class="category">אזורי סכנה</div>
    <div id="cat-danger"></div>
    <div class="category">עולמות רחוקים</div>
    <div id="cat-exo"></div>
</div>

<div id="canvas-container">
    <div id="info"><h1 id="obj-name">בחר אובייקט</h1></div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    // 1. אתחול סצנה
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, (window.innerWidth - 250) / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    
    const updateSize = () => {
        const w = window.innerWidth - (window.innerWidth < 768 ? 140 : 250);
        renderer.setSize(w, window.innerHeight);
        camera.aspect = w / window.innerHeight;
        camera.updateProjectionMatrix();
    };
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    updateSize();

    // 2. שליטה במגע וזום
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    camera.position.z = window.innerWidth < 768 ? 10 : 6;

    // 3. תאורה
    const mainLight = new THREE.PointLight(0xffffff, 10, 100);
    mainLight.position.set(10, 10, 10);
    scene.add(mainLight, new THREE.AmbientLight(0x222222, 1.5));

    let currentObj = null;

    // 4. מפעל ה-Shaders (היפר-ריאליזם)
    const Factory = {
        createPlanet: (c1, c2, size, isGas = false) => {
            const geo = new THREE.SphereGeometry(size, 64, 64);
            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    color1: { value: new THREE.Color(c1) },
                    color2: { value: new THREE.Color(c2) },
                    time: { value: 0 }
                },
                vertexShader: `
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    void main() {
                        vUv = uv;
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 color1;
                    uniform vec3 color2;
                    uniform float time;
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    void main() {
                        float noise = sin(vUv.y * ${isGas ? '25.0' : '60.0'} + vUv.x * 5.0) * 0.5 + 0.5;
                        float atmos = pow(1.0 - dot(vNormal, vec3(0,0,1)), 3.0);
                        vec3 color = mix(color1, color2, noise);
                        gl_FragColor = vec4(color + (atmos * 0.4), 1.0);
                    }
                `
            });
            return new THREE.Mesh(geo, mat);
        },
        createBlackHole: () => {
            const g = new THREE.Group();
            g.add(new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), new THREE.MeshBasicMaterial({color: 0x000000})));
            const ring = new THREE.Mesh(new THREE.TorusGeometry(2.5, 0.15, 2, 100), new THREE.MeshBasicMaterial({color: 0xff4400, transparent: true, opacity: 0.8}));
            ring.rotation.x = Math.PI/2.1;
            g.add(ring); return g;
        },
        createStar: (color) => {
            const g = new THREE.Group();
            const core = new THREE.Mesh(new THREE.SphereGeometry(2, 64, 64), new THREE.MeshBasicMaterial({color: color}));
            const aura = new THREE.Mesh(new THREE.SphereGeometry(2.3, 64, 64), new THREE.MeshBasicMaterial({color: color, transparent: true, opacity: 0.2, side: THREE.BackSide}));
            g.add(core, aura); return g;
        }
    };

    // 5. רשימת 22 האובייקטים המלאה
    const db = [
        { name: "כוכב חמה", cat: "cat-solar", f: () => Factory.createPlanet(0x777777, 0x333333, 0.9) },
        { name: "נוגה", cat: "cat-solar", f: () => Factory.createPlanet(0xe3bb76, 0x8b4513, 1.4, true) },
        { name: "כדור הארץ", cat: "cat-solar", f: () => Factory.createPlanet(0x0044ff, 0x22ff22, 1.5) },
        { name: "מאדים", cat: "cat-solar", f: () => Factory.createPlanet(0xff4400, 0x551100, 1.2) },
        { name: "צדק", cat: "cat-solar", f: () => Factory.createPlanet(0xd8ca9d, 0xa5643a, 2.3, true) },
        { name: "שבתאי", cat: "cat-solar", f: () => {
            const g = new THREE.Group();
            g.add(Factory.createPlanet(0xdfd3a3, 0xc2b280, 1.8, true));
            const ring = new THREE.Mesh(new THREE.RingGeometry(2.2, 4.2, 64), new THREE.MeshBasicMaterial({color: 0x998877, side: THREE.DoubleSide, transparent: true, opacity: 0.6}));
            ring.rotation.x = Math.PI/2; g.add(ring); return g;
        }},
        { name: "אורנוס", cat: "cat-solar", f: () => Factory.createPlanet(0xafeeee, 0x4682b4, 1.7, true) },
        { name: "נפטון", cat: "cat-solar", f: () => Factory.createPlanet(0x4169e1, 0x00008b, 1.7, true) },
        { name: "פלוטו", cat: "cat-solar", f: () => Factory.createPlanet(0xdddddd, 0x666666, 0.7) },
        { name: "השמש", cat: "cat-boss", f: () => Factory.createStar(0xffaa00) },
        { name: "חור שחור", cat: "cat-boss", f: () => Factory.createBlackHole() },
        { name: "חור תולעת", cat: "cat-boss", f: () => new THREE.Mesh(new THREE.TorusKnotGeometry(1.5, 0.4, 100, 16), new THREE.MeshBasicMaterial({color: 0x00f2ff, wireframe: true})) },
        { name: "סופרנובה", cat: "cat-boss", f: () => new THREE.Points(new THREE.BufferGeometry().setFromPoints(Array.from({length:3000}, () => new THREE.Vector3().setFromSphericalCoords(Math.random()*4, Math.random()*Math.PI, Math.random()*Math.PI*2))), new THREE.PointsMaterial({color:0xff4400, size:0.05})) },
        { name: "פאלסאר", cat: "cat-boss", f: () => Factory.createStar(0x00ffff) },
        { name: "ערפילית", cat: "cat-boss", f: () => new THREE.Points(new THREE.BufferGeometry().setFromPoints(Array.from({length:4000}, () => new THREE.Vector3((Math.random()-0.5)*10,(Math.random()-0.5)*10,(Math.random()-0.5)*10))), new THREE.PointsMaterial({color:0xff00ff, size:0.02, transparent:true, opacity:0.5})) },
        { name: "קוואזר", cat: "cat-boss", f: () => Factory.createStar(0xffffff) },
        { name: "אסטרואידים", cat: "cat-danger", f: () => {
            const g = new THREE.Group();
            for(let i=0; i<100; i++) {
                const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.15), new THREE.MeshStandardMaterial({color:0x777777}));
                m.position.set((Math.random()-0.5)*8, (Math.random()-0.5)*8, (Math.random()-0.5)*8);
                g.add(m);
            }
            return g;
        }},
        { name: "ענן אורט", cat: "cat-danger", f: () => new THREE.Points(new THREE.BufferGeometry().setFromPoints(Array.from({length:1000}, () => new THREE.Vector3().setFromSphericalCoords(6, Math.random()*Math.PI, Math.random()*Math.PI*2))), new THREE.PointsMaterial({color:0xffffff, size:0.02})) },
        { name: "שביט", cat: "cat-danger", f: () => Factory.createPlanet(0xffffff, 0x00ffff, 0.4) },
        { name: "Kepler-452b", cat: "cat-exo", f: () => Factory.createPlanet(0x225522, 0x112211, 1.6) },
        { name: "TRAPPIST-1e", cat: "cat-exo", f: () => Factory.createPlanet(0x552222, 0x221111, 1.4) },
        { name: "Proxima b", cat: "cat-exo", f: () => Factory.createPlanet(0x444466, 0x111122, 1.3) }
    ];

    // 6. הפעלה
    db.forEach((obj, i) => {
        const btn = document.createElement('button');
        btn.innerText = obj.name;
        btn.onclick = () => {
            if(currentObj) scene.remove(currentObj);
            currentObj = obj.f();
            scene.add(currentObj);
            document.getElementById('obj-name').innerText = obj.name;
        };
        document.getElementById(obj.cat).appendChild(btn);
    });

    function animate() {
        requestAnimationFrame(animate);
        if(currentObj) currentObj.rotation.y += 0.003;
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', updateSize);
</script>
</body>
</html>
