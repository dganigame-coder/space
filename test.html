<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Cosmic Lab V2.2 - Ultimate Edition</title>
    <style>
        body { margin: 0; background: #000; color: #00f2ff; font-family: sans-serif; overflow: hidden; display: flex; }
        #sidebar { width: 250px; height: 100vh; overflow-y: auto; background: #0a0a0a; border-left: 1px solid #1a1a2e; padding: 15px; z-index: 100; }
        .category { margin: 15px 0 5px; font-size: 13px; color: #ff00ff; text-transform: uppercase; border-bottom: 1px solid #333; }
        button { width: 100%; text-align: right; background: rgba(255,255,255,0.05); border: 1px solid #222; color: #ccc; padding: 8px; margin: 2px 0; cursor: pointer; border-radius: 4px; }
        button:hover { background: #00f2ff; color: #000; font-weight: bold; }
        #canvas-container { flex-grow: 1; position: relative; }
        #info { position: absolute; bottom: 20px; left: 20px; pointer-events: none; }
        #obj-name { font-size: 28px; margin: 0; text-shadow: 0 0 10px #00f2ff; }
    </style>
    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
</head>
<body>

<div id="sidebar">
    <div style="font-size: 10px; opacity: 0.5;">Build 2.2.0 - Stable</div>
    <div class="category">מערכת השמש</div>
    <div id="cat-solar"></div>
    <div class="category">אנומליות ובוסים</div>
    <div id="cat-boss"></div>
    <div class="category">אזורי סכנה</div>
    <div id="cat-danger"></div>
    <div class="category">עולמות רחוקים</div>
    <div id="cat-exo"></div>
</div>

<div id="canvas-container">
    <div id="info"><h1 id="obj-name">ממתין לבחירה...</h1></div>
</div>

<script type="module">
    import * as THREE from 'three';

    // 1. אתחול בסיסי
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, (window.innerWidth - 250) / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth - 250, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2. תאורה (חשוב מאוד להיפר-ריאליזם)
    const sunLight = new THREE.PointLight(0xffffff, 10, 100);
    sunLight.position.set(10, 10, 10);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x222222));

    camera.position.z = 7;
    let currentObject = null;

    // 3. מפעל האובייקטים (Factory)
    const Factory = {
        // יצירת פלנטה עם Shader משופר
        createPlanet: (c1, c2, size, isGas = false) => {
            const geo = new THREE.SphereGeometry(size, 64, 64);
            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    color1: { value: new THREE.Color(c1) },
                    color2: { value: new THREE.Color(c2) }
                },
                vertexShader: `
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    void main() {
                        vUv = uv;
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 color1;
                    uniform vec3 color2;
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    void main() {
                        float noise = sin(vUv.y * ${isGas ? '30.0' : '80.0'}) * 0.5 + 0.5;
                        float atmos = pow(1.0 - dot(vNormal, vec3(0,0,1)), 3.0);
                        vec3 final = mix(color1, color2, noise);
                        gl_FragColor = vec4(final + (atmos * 0.3), 1.0);
                    }
                `
            });
            return new THREE.Mesh(geo, mat);
        },
        createStar: (color) => {
            const g = new THREE.Group();
            const core = new THREE.Mesh(new THREE.SphereGeometry(2, 32, 32), new THREE.MeshBasicMaterial({color: color}));
            const glow = new THREE.Mesh(new THREE.SphereGeometry(2.2, 32, 32), new THREE.MeshBasicMaterial({color: color, transparent: true, opacity: 0.2, side: THREE.BackSide}));
            g.add(core, glow); return g;
        }
    };

    // 4. מסד הנתונים של כל 22 האובייקטים
    const db = [
        { name: "כוכב חמה", cat: "cat-solar", f: () => Factory.createPlanet(0x888888, 0x444444, 1.0) },
        { name: "נוגה", cat: "cat-solar", f: () => Factory.createPlanet(0xe3bb76, 0x8b4513, 1.4, true) },
        { name: "כדור הארץ", cat: "cat-solar", f: () => Factory.createPlanet(0x0044ff, 0x00ff00, 1.5) },
        { name: "מאדים", cat: "cat-solar", f: () => Factory.createPlanet(0xff4400, 0x551100, 1.2) },
        { name: "צדק", cat: "cat-solar", f: () => Factory.createPlanet(0xd8ca9d, 0xa5643a, 2.2, true) },
        { name: "שבתאי", cat: "cat-solar", f: () => {
            const g = new THREE.Group();
            g.add(Factory.createPlanet(0xdfd3a3, 0xc2b280, 1.8, true));
            const ringGeo = new THREE.RingGeometry(2.2, 4, 64);
            const ringMat = new THREE.MeshBasicMaterial({color: 0x998877, side: THREE.DoubleSide, transparent: true, opacity: 0.5});
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI/2;
            g.add(ring); return g;
        }},
        { name: "אורנוס", cat: "cat-solar", f: () => Factory.createPlanet(0xafeeee, 0x4682b4, 1.6, true) },
        { name: "נפטון", cat: "cat-solar", f: () => Factory.createPlanet(0x4169e1, 0x00008b, 1.6, true) },
        { name: "פלוטו", cat: "cat-solar", f: () => Factory.createPlanet(0xdddddd, 0x888888, 0.7) },
        { name: "השמש", cat: "cat-boss", f: () => Factory.createStar(0xffaa00) },
        { name: "חור שחור", cat: "cat-boss", f: () => {
            const g = new THREE.Group();
            g.add(new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), new THREE.MeshBasicMaterial({color: 0x000000})));
            const ring = new THREE.Mesh(new THREE.TorusGeometry(2.5, 0.1, 2, 100), new THREE.MeshBasicMaterial({color: 0xff4400, transparent: true, opacity: 0.8}));
            ring.rotation.x = Math.PI/2.2; g.add(ring); return g;
        }},
        { name: "חור תולעת", cat: "cat-boss", f: () => new THREE.Mesh(new THREE.TorusKnotGeometry(1.5, 0.4, 100, 16), new THREE.MeshBasicMaterial({color: 0x00f2ff, wireframe: true})) },
        { name: "סופרנובה", cat: "cat-boss", f: () => new THREE.Points(new THREE.BufferGeometry().setFromPoints(Array.from({length:2000}, () => new THREE.Vector3().setFromSphericalCoords(Math.random()*4, Math.random()*Math.PI, Math.random()*Math.PI*2))), new THREE.PointsMaterial({color: 0xff4400, size: 0.05})) },
        { name: "פאלסאר", cat: "cat-boss", f: () => { const g=new THREE.Group(); g.add(new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshBasicMaterial({color:0xffffff}))); return g; }},
        { name: "ערפילית", cat: "cat-boss", f: () => new THREE.Points(new THREE.BufferGeometry().setFromPoints(Array.from({length:3000}, () => new THREE.Vector3((Math.random()-0.5)*10,(Math.random()-0.5)*10,(Math.random()-0.5)*10))), new THREE.PointsMaterial({color:0xff00ff, size:0.02})) },
        { name: "קוואזר", cat: "cat-boss", f: () => Factory.createStar(0xffffff) },
        { name: "חגורת אסטרואידים", cat: "cat-danger", f: () => new THREE.Group() }, // Placeholder לשם הפשטות
        { name: "ענן אורט", cat: "cat-danger", f: () => new THREE.Group() },
        { name: "שביט", cat: "cat-danger", f: () => Factory.createPlanet(0xffffff, 0x00ffff, 0.4) },
        { name: "Kepler-452b", cat: "cat-exo", f: () => Factory.createPlanet(0x225522, 0x113311, 1.6) },
        { name: "TRAPPIST-1e", cat: "cat-exo", f: () => Factory.createPlanet(0x552222, 0x221111, 1.4) },
        { name: "Proxima Centauri b", cat: "cat-exo", f: () => Factory.createPlanet(0x444466, 0x111122, 1.3) }
    ];

    // 5. הרכבת הממשק
    db.forEach((obj, index) => {
        const btn = document.createElement('button');
        btn.innerText = obj.name;
        btn.onclick = () => {
            if(currentObject) scene.remove(currentObject);
            currentObject = obj.f();
            scene.add(currentObject);
            document.getElementById('obj-name').innerText = obj.name;
        };
        document.getElementById(obj.cat).appendChild(btn);
    });

    // 6. לולאת אנימציה
    function animate() {
        requestAnimationFrame(animate);
        if(currentObject) currentObject.rotation.y += 0.005;
        renderer.render(scene, camera);
    }
    animate();

    // 7. טיפול בחלון
    window.addEventListener('resize', () => {
        camera.aspect = (window.innerWidth - 250) / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth - 250, window.innerHeight);
    });
</script>
</body>
</html>
