<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>3D Solar System + Black Hole + Wormhole</title>

<style>
body { margin:0; overflow:hidden; background:black; }
#label {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>

<body>
<div id="label">🌌 3D Cosmic System</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

// ---------------- SCENE ----------------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0, 40, 80);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);

// ---------------- LIGHT (SUN) ----------------
const sunLight = new THREE.PointLight(0xffffff, 3, 300);
scene.add(sunLight);

// ---------------- STARFIELD ----------------
function stars(){
  const g = new THREE.BufferGeometry();
  const arr = [];
  for(let i=0;i<6000;i++){
    arr.push((Math.random()-0.5)*2000);
    arr.push((Math.random()-0.5)*2000);
    arr.push((Math.random()-0.5)*2000);
  }
  g.setAttribute("position", new THREE.Float32BufferAttribute(arr,3));
  const m = new THREE.PointsMaterial({ color:0xffffff, size:0.7 });
  return new THREE.Points(g,m);
}
scene.add(stars());

// ---------------- SUN ----------------
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(6,64,64),
  new THREE.MeshBasicMaterial({ color:0xffaa00 })
);
scene.add(sun);
sunLight.position.copy(sun.position);

// ---------------- PLANET FACTORY ----------------
function planet(size,color,distance,speed){
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(size,64,64),
    new THREE.MeshStandardMaterial({ color })
  );

  mesh.userData = { distance, speed, angle: Math.random()*Math.PI*2 };
  return mesh;
}

// ---------------- PLANETS (from your image) ----------------
const planets = [
  planet(0.7,0xaaaaaa,10,0.02), // Mercury
  planet(1.2,0xffcc88,15,0.015), // Venus
  planet(1.3,0x3399ff,20,0.01), // Earth
  planet(1.1,0xff4444,25,0.009), // Mars
  planet(2.8,0xffaa66,35,0.006), // Jupiter
  planet(2.4,0xffddaa,45,0.004), // Saturn
  planet(2.0,0x66ccff,55,0.003), // Uranus
  planet(2.0,0x3355ff,65,0.002)  // Neptune
];

planets.forEach(p=>scene.add(p));

// ---------------- RINGS (Saturn style) ----------------
const saturnRing = new THREE.Mesh(
  new THREE.RingGeometry(3.2,5,64),
  new THREE.MeshBasicMaterial({ color:0xaaaaaa, side:THREE.DoubleSide, transparent:true, opacity:0.6 })
);
planets[5].add(saturnRing);

// ---------------- BLACK HOLE ----------------
const blackHole = new THREE.Mesh(
  new THREE.SphereGeometry(3,64,64),
  new THREE.MeshBasicMaterial({ color:0x000000 })
);
blackHole.position.set(30,0,-40);
scene.add(blackHole);

// glow ring
const bhRing = new THREE.Mesh(
  new THREE.RingGeometry(4,7,128),
  new THREE.MeshBasicMaterial({ color:0xff3300, side:THREE.DoubleSide, transparent:true, opacity:0.7 })
);
bhRing.position.copy(blackHole.position);
bhRing.rotation.x = Math.PI/2;
scene.add(bhRing);

// ---------------- WORMHOLE ----------------
const wormhole = new THREE.Mesh(
  new THREE.TorusGeometry(5,1.2,16,100),
  new THREE.MeshBasicMaterial({ color:0x00f2ff, wireframe:true })
);
wormhole.position.set(-40,10,-30);
scene.add(wormhole);

// ---------------- ANIMATION ----------------
function animate(){
  requestAnimationFrame(animate);

  // planets orbit
  planets.forEach(p=>{
    p.userData.angle += p.userData.speed;
    p.position.x = Math.cos(p.userData.angle)*p.userData.distance;
    p.position.z = Math.sin(p.userData.angle)*p.userData.distance;
  });

  // rotation effects
  sun.rotation.y += 0.002;
  planets.forEach(p=>p.rotation.y += 0.01);

  // wormhole spin
  wormhole.rotation.z += 0.01;
  wormhole.rotation.x += 0.005;

  // black hole spin illusion
  bhRing.rotation.z += 0.02;

  controls.update();
  renderer.render(scene,camera);
}
animate();

// resize
addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
