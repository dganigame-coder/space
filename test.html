<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Cosmic Lab V2.1 - The Full Universe</title>
    <style>
        body { margin: 0; background: #000; color: #00f2ff; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; }
        #sidebar { width: 280px; height: 100vh; overflow-y: auto; background: #05050a; border-left: 2px solid #1a1a2e; padding: 15px; z-index: 100; }
        .version { font-size: 12px; color: #555; margin-bottom: 10px; }
        .category { margin: 15px 0 5px; font-size: 13px; color: #ff00ff; text-transform: uppercase; border-bottom: 1px solid #333; }
        button { width: 100%; text-align: right; background: rgba(255,255,255,0.05); border: 1px solid #222; color: #ccc; padding: 8px; margin: 2px 0; cursor: pointer; transition: 0.2s; border-radius: 4px; font-size: 13px; }
        button:hover { background: #00f2ff; color: #000; font-weight: bold; }
        #canvas-container { flex-grow: 1; position: relative; }
        #info { position: absolute; bottom: 30px; left: 30px; pointer-events: none; }
        #obj-name { font-size: 36px; margin: 0; text-shadow: 0 0 15px #00f2ff; }
    </style>
    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
</head>
<body>

<div id="sidebar">
    <div class="version">Version 2.1.0 (Stable Universe)</div>
    
    <div class="category">מערכת השמש</div>
    <div id="solar-system"></div>

    <div class="category">אנומליות ובוסים</div>
    <div id="anomalies"></div>

    <div class="category">אזורי סכנה</div>
    <div id="danger-zones"></div>

    <div class="category">עולמות רחוקים</div>
    <div id="exoplanets"></div>
</div>

<div id="canvas-container">
    <div id="info"><h1 id="obj-name">בחר אובייקט V2.1</h1></div>
</div>

<script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, (window.innerWidth - 280) / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth - 280, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // תאורה משופרת
    const sunLight = new THREE.PointLight(0xffffff, 5, 100);
    sunLight.position.set(10, 7, 10);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x222222));

    camera.position.z = 6;
    let currentObject = null;
    const clock = new THREE.Clock();

    // --- מנוע יצירה היפר-ריאליסטי V2.1 ---
    const Creator = {
        // פלנטה סלעית/גזית עם Shader
        createPlanet: (c1, c2, size, isGas=false) => {
            const geo = new THREE.SphereGeometry(size, 128, 128);
            const mat = new THREE.ShaderMaterial({
                uniforms: { time: { value: 0 }, color1: { value: new THREE.Color(c1) }, color2: { value: new THREE.Color(c2) } },
                vertexShader: `varying vec2 vUv; varying vec3 vNormal; void main() { vUv = uv; vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                fragmentShader: `
                    varying vec2 vUv; varying vec3 vNormal; uniform vec3 color1; uniform vec3 color2; uniform float time;
                    float noise(vec2 p) { return fract(sin(dot(p, vec2(12.9, 78.2))) * 43758.5); }
                    void main() {
                        float n = noise(vUv * ( ${isGas ? '25.0' : '85.0'} ));
                        float f = ${isGas ? 'sin(vUv.y * 30.0 + sin(vUv.x * 5.0)) * 0.5 + 0.5' : 'smoothstep(0.3, 0.6, n)'};
                        float atmos = pow(1.0 - dot(vNormal, vec3(0,0,1)), 3.5);
                        gl_FragColor = vec4(mix(color1, color2, f) + (atmos * 0.4), 1.0);
                    }
                `
            });
            return new THREE.Mesh(geo, mat);
        },

        createSun: () => {
            const g = new THREE.Group();
            const core = new THREE.Mesh(new THREE.SphereGeometry(2, 64, 64), new THREE.MeshBasicMaterial({color: 0xffcc00}));
            const corona = new THREE.Mesh(new THREE.SphereGeometry(2.1, 64, 64), new THREE.MeshBasicMaterial({color: 0xff6600, transparent: true, opacity: 0.3, side: THREE.BackSide}));
            g.add(core, corona); return g;
        },

        createBlackHole: () => {
            const g = new THREE.Group();
            g.add(new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), new THREE.MeshBasicMaterial({color: 0x000000})));
            const ring = new THREE.Mesh(new THREE.TorusGeometry(2.5, 0.2, 2, 100), new THREE.MeshBasicMaterial({color: 0xff4400, transparent: true, opacity: 0.7}));
            ring.rotation.x = Math.PI/2.1; g.add(ring); return g;
        },

        createAsteroids: (count=150) => {
            const g = new THREE.Group();
            const geo = new THREE.DodecahedronGeometry(0.1, 0);
            const mat = new THREE.MeshStandardMaterial({color: 0x777777});
            for(let i=0; i<count; i++) {
                const m = new THREE.Mesh(geo, mat);
                m.position.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
                m.rotation.set(Math.random(), Math.random(), Math.random());
                g.add(m);
            }
            return g;
        }
    };

    const database = [
        { name: "כוכב חמה", cat: "solar", f: () => Creator.createPlanet(0x666666, 0x333333, 1.0) },
        { name: "נוגה", cat: "solar", f: () => Creator.createPlanet(0xe3bb76, 0x8b4513, 1.4, true) },
        { name: "כדור הארץ", cat: "solar", f: () => Creator.createPlanet(0x1122ff, 0x22ff22, 1.5) },
        { name: "מאדים", cat: "solar", f: () => Creator.createPlanet(0xff4400, 0x661100, 1.2) },
        { name: "צדק", cat: "solar", f: () => Creator.createPlanet(0xd8ca9d, 0xa5643a, 2.2, true) },
        { name: "שבתאי", cat: "solar", f: () => {
            const g = new THREE.Group();
            g.add(Creator.createPlanet(0xdfd3a3, 0xc2b280, 1.8, true));
            const ring = new THREE.Mesh(new THREE.RingGeometry(2.2, 4, 64), new THREE.MeshBasicMaterial({color: 0x998877, side: THREE.DoubleSide, transparent: true, opacity: 0.5}));
            ring.rotation.x = Math.PI/2; g.add(ring); return g;
        }},
        { name: "אורנוס", cat: "solar", f: () => Creator.createPlanet(0xafeeee, 0x4682b4, 1.6, true) },
        { name: "נפטון", cat: "solar", f: () => Creator.createPlanet(0x4169e1, 0x00008b, 1.6, true) },
        { name: "פלוטו", cat: "solar", f: () => Creator.createPlanet(0xdddddd, 0x888888, 0.7) },
        { name: "השמש", cat: "anomalies", f: () => Creator.createSun() },
        { name: "חור שחור", cat: "anomalies", f: () => Creator.createBlackHole() },
        { name: "חור תולעת", cat: "anomalies", f: () => new THREE.Mesh(new THREE.TorusKnotGeometry(1.5, 0.4, 100, 16), new THREE.MeshBasicMaterial({color: 0x00f2ff, wireframe: true})) },
        { name: "סופרנובה", cat: "anomalies", f: () => new THREE.Points(new THREE.BufferGeometry().setFromPoints(Array.from({length:2000}, () => new THREE.Vector3().setFromSphericalCoords(Math.random()*4, Math.random()*Math.PI, Math.random()*Math.PI*2))), new THREE.PointsMaterial({color: 0xff4400, size: 0.05})) },
        { name: "פאלסאר", cat: "anomalies", f: () => { const g=new THREE.Group(); g.add(new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshBasicMaterial({color:0xffffff}))); const c=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.5,10), new THREE.MeshBasicMaterial({color:0x00ffff, transparent:true, opacity:0.3})); g.add(c); return g; }},
        { name: "ערפילית", cat: "anomalies", f: () => new THREE.Points(new THREE.BufferGeometry().setFromPoints(Array.from({length:5000}, () => new THREE.Vector3((Math.random()-0.5)*10,(Math.random()-0.5)*10,(Math.random()-0.5)*10))), new THREE.PointsMaterial({color:0xff00ff, size:0.02, transparent:true, opacity:0.4})) },
        { name: "קוואזר", cat: "anomalies", f: () => Creator.createBlackHole() },
        { name: "חגורת אסטרואידים", cat: "danger-zones", f: () => Creator.createAsteroids() },
        { name: "ענן אורט", cat: "danger-zones", f: () => Creator.createAsteroids(300) },
        { name: "שביט", cat: "danger-zones", f: () => Creator.createPlanet(0xffffff, 0x00ffff, 0.3) },
        { name: "Kepler-452b", cat: "exoplanets", f: () => Creator.createPlanet(0x225522, 0x00ff00, 1.6) },
        { name: "TRAPPIST-1e", cat: "exoplanets", f: () => Creator.createPlanet(0x552222, 0x221111, 1.4) },
        { name: "Proxima Centauri b", cat: "exoplanets", f: () => Creator.createPlanet(0x444466, 0x111122, 1.3) }
    ];

    // בניית כפתורים אוטומטית
    database.forEach((item, idx) => {
        const btn = document.createElement('button');
        btn.innerText = item.name;
        btn.onclick = () => {
            if(currentObject) scene.remove(currentObject);
            document.getElementById('obj-name').innerText = item.name;
            currentObject = item.f();
            scene.add(currentObject);
        };
        document.getElementById(item.cat).appendChild(btn);
    });

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        if(currentObject) {
            currentObject.rotation.y += 0.005;
            if(currentObject.children) currentObject.children.forEach(c => { if(c instanceof THREE.Points) c.rotation.y += 0.002; });
        }
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
