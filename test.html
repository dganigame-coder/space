<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Cosmic Lab ULTRA V3</title>

<style>
body { margin:0; overflow:hidden; background:black; font-family:Segoe UI; display:flex; }
#sidebar { width:260px; background:#050510; color:#0ff; overflow-y:auto; padding:12px; }
button { width:100%; margin:4px 0; padding:10px; background:#111; color:#ccc; border:1px solid #222; cursor:pointer; }
button:hover { background:#00f2ff; color:black; }
#canvas-container { flex:1; }
#obj-name { position:absolute; bottom:20px; right:20px; color:white; font-size:28px; text-shadow:0 0 20px cyan; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="sidebar">
<div id="cat-solar"></div>
<div id="cat-boss"></div>
<div id="cat-danger"></div>
<div id="cat-exo"></div>
</div>

<div id="canvas-container">
<div id="obj-name">בחר אובייקט</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { EffectComposer } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';

// ---------- SCENE ----------
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 8;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById("canvas-container").appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ---------- BLOOM (REALISM BOOST) ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
composer.addPass(bloom);

// ---------- STARFIELD ----------
function createStars(count=8000){
  const geo = new THREE.BufferGeometry();
  const pos = [];
  for(let i=0;i<count;i++){
    pos.push((Math.random()-0.5)*2000);
    pos.push((Math.random()-0.5)*2000);
    pos.push((Math.random()-0.5)*2000);
  }
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({ color:0xffffff, size:0.7 });
  return new THREE.Points(geo,mat);
}
scene.add(createStars());

// ---------- LIGHT ----------
scene.add(new THREE.AmbientLight(0x222222, 1));
const sunLight = new THREE.PointLight(0xffffff, 3);
scene.add(sunLight);

// ---------- REALISTIC PLANET ----------
function planet(c1,c2,size){
  const geo = new THREE.SphereGeometry(size,128,128);
  const mat = new THREE.MeshStandardMaterial({
    color: c1,
    roughness: 0.8,
    metalness: 0.1
  });
  const mesh = new THREE.Mesh(geo,mat);

  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(size*1.1,64,64),
    new THREE.MeshBasicMaterial({ color:c2, transparent:true, opacity:0.15 })
  );

  const g = new THREE.Group();
  g.add(mesh,glow);
  return g;
}

// ---------- COMET ----------
function comet(){
  const g = new THREE.Group();
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.4,32,32), new THREE.MeshBasicMaterial({color:0xffffff}));
  const trail = new THREE.Points(
    new THREE.BufferGeometry().setFromPoints(Array.from({length:300},()=>new THREE.Vector3((Math.random()-0.5)*2,0,0))),
    new THREE.PointsMaterial({color:0x88ccff,size:0.05})
  );
  g.add(core,trail);
  return g;
}

// ---------- BLACK HOLE (better illusion) ----------
function blackHole(){
  const g = new THREE.Group();
  const core = new THREE.Mesh(new THREE.SphereGeometry(1,64,64), new THREE.MeshBasicMaterial({color:0x000000}));
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(2,3.5,128),
    new THREE.MeshBasicMaterial({color:0xff5500, side:THREE.DoubleSide, transparent:true, opacity:0.7})
  );
  ring.rotation.x = Math.PI/2;
  g.add(core,ring);
  return g;
}

// ---------- DATA ----------
const db = [
  {name:"כדור הארץ",cat:"cat-solar",f:()=>planet(0x2266ff,0x44ff88,1.5)},
  {name:"צדק",cat:"cat-solar",f:()=>planet(0xd8b98a,0xffaa55,2.5)},
  {name:"שבתאי",cat:"cat-solar",f:()=>planet(0xe6d3a3,0xffcc77,2)},
  {name:"ירח",cat:"cat-solar",f:()=>planet(0xaaaaaa,0xffffff,0.5)},

  {name:"חור שחור",cat:"cat-boss",f:blackHole},
  {name:"שמש",cat:"cat-boss",f:()=>planet(0xffaa00,0xff4400,3)},
  {name:"סופרנובה",cat:"cat-boss",f:()=>createStars(5000)},

  {name:"ענן אורט",cat:"cat-danger",f:()=>createStars(2000)},
  {name:"שביט",cat:"cat-danger",f:comet},

  {name:"Kepler-452b",cat:"cat-exo",f:()=>planet(0x225522,0x55ff99,1.4)}
];

// ---------- UI ----------
db.forEach(o=>{
  const b=document.createElement("button");
  b.innerText=o.name;
  b.onclick=()=>{
    scene.clear();
    scene.add(createStars());
    const obj=o.f();
    scene.add(obj);
    document.getElementById("obj-name").innerText=o.name;
  };
  document.getElementById(o.cat).appendChild(b);
});

// ---------- LOOP ----------
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  composer.render();
}
animate();

window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
