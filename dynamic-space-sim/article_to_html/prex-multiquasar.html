<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYPERREAL — Casimir Wormhole Transit</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; }
  canvas { display:block; width:100vw; height:100vh; }
  .hud {
    position:fixed; left:18px; top:18px; z-index:10;
    font:12px/1.45 "SF Mono",Consolas,monospace; color:#cfe9ff;
    background:rgba(4,10,22,.55); border:1px solid rgba(90,170,255,.22);
    backdrop-filter:blur(14px); padding:14px 16px; border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.65);
    max-width:330px; user-select:none;
  }
  .hud h1 { font-size:11px; letter-spacing:.16em; color:#7fd8ff; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; gap:14px; margin:5px 0; }
  .val { color:#8ef7c3; }
  input[type=range] { width:100%; accent-color:#38bdf8; margin:6px 0 12px; }
  .btns { display:flex; gap:8px; margin-top:10px; }
  button {
    flex:1; padding:8px 6px; font:600 10.5px Inter,system-ui,sans-serif; color:#dff3ff;
    background:rgba(30,70,130,.35); border:1px solid rgba(110,190,255,.28);
    border-radius:9px; cursor:pointer; transition:.18s;
  }
  button:hover { background:rgba(45,100,180,.55); }
  .title {
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:10;
    font:600 11px Inter,system-ui,sans-serif; letter-spacing:.28em; color:rgba(190,225,255,.72);
    text-shadow:0 0 22px rgba(70,160,255,.55); pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud">
  <h1>HYPERREAL WORMHOLE TRANSIT</h1>
  <div class="row"><span>MISSION TIME</span><span class="val" id="t">0.00 / 6.10 d</span></div>
  <div class="row"><span>VELOCITY</span><span class="val" id="v">0.000 c</span></div>
  <div class="row"><span>THROAT RADIUS</span><span class="val" id="r">100,000 km</span></div>
  <div class="row"><span>TIDAL LOAD</span><span class="val" id="g">0.85 g</span></div>

  <label>THROAT RADIUS</label>
  <input id="radius" type="range" min="0.18" max="1.65" step="0.01" value="0.85">

  <label>ACCRETION ENERGY</label>
  <input id="energy" type="range" min="0" max="2.2" step="0.01" value="1.05">

  <label>GRAVITATIONAL LENSING</label>
  <input id="lens" type="range" min="0" max="2.5" step="0.01" value="1.25">

  <label>EXPOSURE</label>
  <input id="expo" type="range" min="0.35" max="2.4" step="0.01" value="1.15">

  <div class="btns">
    <button id="pause">PAUSE</button>
    <button id="cinema">CINEMA CAM</button>
    <button id="quality">QUALITY: HIGH</button>
  </div>
</div>

<div class="title">DRAG TO ORBIT · SCROLL TO ZOOM · SPACE TO PAUSE</div>

<script>
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias:false, powerPreference:'high-performance' });
if (!gl) document.body.innerHTML = '<p style="color:#fff;padding:30px">WebGL2 is required.</p>';

const vert = `#version 300 es
layout(location=0) in vec2 p;
void main(){ gl_Position=vec4(p,0.,1.); }`;

const frag = `#version 300 es
precision highp float;
out vec4 outColor;

uniform vec2 uRes;
uniform float uTime;
uniform float uRadius;
uniform float uEnergy;
uniform float uLens;
uniform float uExposure;
uniform vec3 uCam;
uniform vec3 uTarget;
uniform float uTransit;

#define PI 3.14159265359
#define TAU 6.28318530718

mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }

float hash21(vec2 p){
  p=fract(p*vec2(233.34,851.73));
  p+=dot(p,p+23.45);
  return fract(p.x*p.y);
}

float noise(vec3 p){
  vec3 i=floor(p), f=fract(p);
  f=f*f*(3.-2.*f);
  float n=mix(mix(mix(hash21(i.xy+i.z*17.13),hash21(i.xy+vec2(1,0)+i.z*17.13),f.x),
                  mix(hash21(i.xy+vec2(0,1)+i.z*17.13),hash21(i.xy+vec2(1,1)+i.z*17.13),f.x),f.y),
              mix(mix(hash21(i.xy+(i.z+1.)*17.13),hash21(i.xy+vec2(1,0)+(i.z+1.)*17.13),f.x),
                  mix(hash21(i.xy+vec2(0,1)+(i.z+1.)*17.13),hash21(i.xy+vec2(1,1)+(i.z+1.)*17.13),f.x),f.y),f.z);
  return n;
}

float fbm(vec3 p){
  float a=.5,v=0.;
  for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.02; a*=.5; }
  return v;
}

vec3 starfield(vec3 dir){
  vec3 col=vec3(0.);
  for(int layer=0;layer<3;layer++){
    float depth=float(layer)+1.;
    vec3 q=dir*180./depth;
    vec3 id=floor(q);
    vec3 f=fract(q)-.5;
    float h=hash21(id.xy+id.z*37.71);
    if(h>.986){
      vec3 off=vec3(hash21(id.xy+3.7),hash21(id.zx+8.1),hash21(id.yz+5.3))-.5;
      float d=length(f-off*.7);
      float core=smoothstep(.09,.004,d);
      float halo=exp(-d*13.)*.35;
      vec3 tint=mix(vec3(.72,.86,1.),vec3(1.,.83,.62),hash21(id.xy*3.1));
      col+=tint*(core*2.2+halo)/depth;
    }
  }
  return col;
}

vec3 nebula(vec3 dir){
  float n1=fbm(dir*2.6+vec3(2.1,-.7,1.4));
  float n2=fbm(dir*5.4-vec3(1.2,3.1,.8));
  vec3 c=vec3(0.);
  c+=vec3(.035,.10,.28)*smoothstep(.42,.95,n1);
  c+=vec3(.16,.05,.32)*smoothstep(.52,.98,n2)*.75;
  c+=vec3(.02,.09,.20)*smoothstep(.60,1.,fbm(dir*9.5+uTime*.006));
  return c;
}

vec3 diskColor(float r,float angle){
  float t=fract(angle/TAU - uTime*.045/(pow(r,1.5)+.05));
  float bands=fbm(vec3(r*22.,angle*3.2,uTime*.12));
  float heat=smoothstep(2.6,.55,r);
  vec3 hot=vec3(1.45,1.02,.46);
  vec3 cool=vec3(.18,.42,1.05);
  vec3 violet=vec3(.55,.18,1.05);
  vec3 c=mix(cool,hot,heat);
  c=mix(c,violet,smoothstep(.15,.75,bands)*.45);
  c*=1.15+.75*bands;
  c*=pow(heat,1.35);
  return c;
}

vec3 renderRay(vec3 ro,vec3 rd){
  vec3 col=vec3(0.);
  vec3 trans=vec3(1.);
  float captured=0.;

  vec3 p=ro;
  float dt;

  for(int i=0;i<190;i++){
    vec3 toC=-p;
    float r=length(toC);

    if(r<.085){ captured=1.; break; }
    if(r>34.){ break; }

    // Approximate curved-spacetime photon deflection.
    float bend=uLens*0.055/(r*r+.012);
    rd=normalize(rd+normalize(toC)*bend);

    dt=max(.018,r*.055);
    p+=rd*dt;

    // Accretion disk / exotic-energy torus
    float diskR=length(p.xz);
    float diskY=abs(p.y);
    float diskMask=smoothstep(.16,.015,diskY)*smoothstep(3.4,.55,diskR)*smoothstep(.30,.72,diskR);

    if(diskMask>.001){
      float angle=atan(p.z,p.x);
      float turb=fbm(vec3(p.xz*4.2,angle*2.4+uTime*.22));
      float density=diskMask*(.45+.85*turb);
      vec3 emission=diskColor(diskR,angle)*uEnergy;
      emission+=vec3(.25,.65,1.4)*pow(max(0.,1.-diskR/3.2),4.)*uEnergy*.55;
      float shadow=exp(-density*.85);
      col+=trans*emission*density*.13;
      trans*=shadow;
    }

    // Wormhole throat: luminous exotic-matter filament
    float throat=length(p.xz);
    float throatGlow=exp(-pow((throat-uRadius*.85)*7.5,2.))
                   * exp(-abs(p.y)*3.2)
                   * (.35+.35*sin(uTime*2.3+p.y*9.));
    col+=trans*vec3(.28,.72,1.55)*throatGlow*.09;
    col+=trans*vec3(.65,.18,1.25)*throatGlow*.05;
  }

  if(captured>.5){
    col=vec3(0.);
  } else {
    vec3 sky=nebula(rd)+starfield(rd);
    col+=trans*sky;
  }

  return col;
}

vec3 aces(vec3 x){
  return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);
}

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;

  vec3 ro=uCam;
  vec3 ww=normalize(uTarget-ro);
  vec3 uu=normalize(cross(vec3(0.,1.,0.),ww));
  vec3 vv=cross(ww,uu);
  vec3 rd=normalize(uu*uv.x+vv*uv.y+ww*1.35);

  vec3 col=renderRay(ro,rd);

  // Relativistic Doppler / beaming impression
  float speed=abs(sin(PI*clamp(uTransit,0.,1.)))*.66;
  vec3 doppler=mix(vec3(1.),vec3(.55,.75,1.55),speed*.55);
  col*=doppler;

  // Cinematic bloom approximation
  vec3 blur=vec3(0.);
  for(int i=0;i<8;i++){
    float a=float(i)*.785;
    vec2 o=vec2(cos(a),sin(a))*.0045;
    blur+=renderRay(ro,normalize(uu*(uv.x+o.x)+vv*(uv.y+o.y)+ww*1.35));
  }
  blur*=.125;
  col+=pow(max(blur-0.035,0.),1.45)*.85;

  col*=uExposure;
  col=aces(col);

  // Chromatic aberration
  float ca=.0016+length(uv)*.0025;
  col.r=textureColorR(uv,ca);
  col.g=col.g;
  col.b=textureColorB(uv,ca);

  // Vignette + film grain
  float vig=smoothstep(1.35,.18,length(uv*vec2(1.,.82)));
  col*=vig;
  float grain=hash21(gl_FragCoord.xy+uTime*61.7)-.5;
  col+=grain*.016;

  outColor=vec4(pow(max(col,0.),vec3(.4545)),1.);
}

vec3 textureColorR(vec2 uv,float ca){
  vec2 d=(uv-.5)*ca;
  return vec3(0.);
}
vec3 textureColorB(vec2 uv,float ca){
  return vec3(0.);
}
`;

// NOTE: The two helper functions above are intentionally replaced below.
// WebGL2 GLSL requires functions declared before use, so the final shader is assembled with them inline.

const finalFrag = frag.replace(
`  // Chromatic aberration
  float ca=.0016+length(uv)*.0025;
  col.r=textureColorR(uv,ca);
  col.g=col.g;
  col.b=textureColorB(uv,ca);`,
`  // Chromatic aberration: offset sampled luminance channels
  float ca=.0016+length(uv)*.0028;
  vec2 dir=normalize(uv+.0001);
  float lum=dot(col,vec3(.299,.587,.114));
  col.r=mix(col.r,lum,ca*38.);
  col.b=mix(col.b,lum,ca*22.);`
).replace(
`vec3 textureColorR(vec2 uv,float ca){
  vec2 d=(uv-.5)*ca;
  return vec3(0.);
}
vec3 textureColorB(vec2 uv,float ca){
  return vec3(0.);
}`,``);

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}

const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,vert));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,finalFrag));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw gl.getProgramInfoLog(prog);
gl.useProgram(prog);

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

const U=n=>gl.getUniformLocation(prog,n);
const uRes=U('uRes'), uTime=U('uTime'), uRadius=U('uRadius'),
      uEnergy=U('uEnergy'), uLens=U('uLens'), uExposure=U('uExposure'),
      uCam=U('uCam'), uTarget=U('uTarget'), uTransit=U('uTransit');

let quality=1.25;
let paused=false, cinema=true;
let yaw=0.65, pitch=0.18, dist=5.4;
let transit=0;

const radiusInput=document.getElementById('radius');
const energyInput=document.getElementById('energy');
const lensInput=document.getElementById('lens');
const expoInput=document.getElementById('expo');

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,quality);
  canvas.width=Math.floor(innerWidth*dpr);
  canvas.height=Math.floor(innerHeight*dpr);
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize',resize);
resize();

let drag=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{
  if(!drag)return;
  yaw+=(e.clientX-lx)*.0045;
  pitch=Math.max(-1.35,Math.min(1.35,pitch+(e.clientY-ly)*.0035));
  lx=e.clientX;ly=e.clientY;
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  dist=Math.max(1.35,Math.min(16.,dist*Math.pow(1.0016,e.deltaY)));
},{passive:false});

addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); paused=!paused; document.getElementById('pause').textContent=paused?'RESUME':'PAUSE'; }
});

document.getElementById('pause').onclick=()=>{
  paused=!paused;
  document.getElementById('pause').textContent=paused?'RESUME':'PAUSE';
};
document.getElementById('cinema').onclick=()=>cinema=!cinema;
document.getElementById('quality').onclick=e=>{
  quality=quality===1.25?2:quality===2?3:1.25;
  e.target.textContent='QUALITY: '+(quality===1.25?'HIGH':quality===2?'4K':'ULTRA 4K');
  resize();
};

const start=performance.now();
function frame(){
  const now=performance.now();
  const t=(now-start)*.001;
  if(!paused) transit=(transit+.0022)%1.15;

  if(cinema){
    yaw+=.00065;
    pitch=.16+.055*Math.sin(t*.19);
    dist=4.6+.75*Math.sin(t*.13);
  }

  const camTarget=new Float32Array([0,0,0]);
  const cam=new Float32Array([
    dist*Math.cos(pitch)*Math.sin(yaw),
    dist*Math.sin(pitch),
    dist*Math.cos(pitch)*Math.cos(yaw)
  ]);

  const radius=parseFloat(radiusInput.value);
  const tidal=.85*Math.pow(.85/radius,2);

  gl.uniform2f(uRes,canvas.width,canvas.height);
  gl.uniform1f(uTime,t);
  gl.uniform1f(uRadius,radius);
  gl.uniform1f(uEnergy,parseFloat(energyInput.value));
  gl.uniform1f(uLens,parseFloat(lensInput.value));
  gl.uniform1f(uExposure,parseFloat(expoInput.value));
  gl.uniform3fv(uCam,cam);
  gl.uniform3fv(uTarget,camTarget);
  gl.uniform1f(uTransit,transit);

  gl.drawArrays(gl.TRIANGLES,0,3);

  document.getElementById('t').textContent=
    (Math.min(transit,1)*6.1).toFixed(2)+' / 6.10 d';
  document.getElementById('v').textContent=
    (Math.abs(Math.sin(PI*Math.min(transit,1)))*.66).toFixed(3)+' c';
  document.getElementById('r').textContent=
    Math.round(radius*117647).toLocaleString()+' km';
  const g=document.getElementById('g');
  g.textContent=tidal.toFixed(2)+' g';
  g.style.color=tidal>1?'#ff6b81':'#8ef7c3';

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
