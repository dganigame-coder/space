<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYPERREAL — Casimir Wormhole Transit</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Inter, system-ui, sans-serif;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }

  .hud {
    position: fixed;
    left: 18px;
    top: 18px;
    z-index: 10;
    max-width: 330px;
    padding: 14px 16px;
    color: #cfe9ff;
    font: 12px/1.45 "SF Mono", Consolas, monospace;
    background: rgba(4, 10, 22, .55);
    border: 1px solid rgba(90, 170, 255, .22);
    border-radius: 14px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .65);
    user-select: none;
  }

  .hud h1 {
    margin-bottom: 10px;
    color: #7fd8ff;
    font-size: 11px;
    letter-spacing: .16em;
  }

  .row {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    margin: 5px 0;
  }

  .val {
    color: #8ef7c3;
  }

  label {
    display: block;
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: .08em;
    color: rgba(160, 205, 255, .75);
    text-transform: uppercase;
  }

  input[type=range] {
    width: 100%;
    margin: 6px 0 4px;
    accent-color: #38bdf8;
  }

  .btns {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  button {
    flex: 1;
    padding: 8px 6px;
    color: #dff3ff;
    font: 600 10.5px Inter, system-ui, sans-serif;
    background: rgba(30, 70, 130, .35);
    border: 1px solid rgba(110, 190, 255, .28);
    border-radius: 9px;
    cursor: pointer;
    transition: background .18s ease;
  }

  button:hover {
    background: rgba(45, 100, 180, .55);
  }

  .title {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 10;
    color: rgba(190, 225, 255, .72);
    font: 600 11px Inter, system-ui, sans-serif;
    letter-spacing: .28em;
    text-shadow: 0 0 22px rgba(70, 160, 255, .55);
    pointer-events: none;
    white-space: nowrap;
  }

  @media (max-width: 640px) {
    .hud {
      max-width: calc(100vw - 28px);
    }

    .title {
      display: none;
    }
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div class="hud">
  <h1>HYPERREAL WORMHOLE TRANSIT</h1>

  <div class="row">
    <span>MISSION TIME</span>
    <span class="val" id="t">0.00 / 6.10 d</span>
  </div>

  <div class="row">
    <span>VELOCITY</span>
    <span class="val" id="v">0.000 c</span>
  </div>

  <div class="row">
    <span>THROAT RADIUS</span>
    <span class="val" id="r">100,000 km</span>
  </div>

  <div class="row">
    <span>TIDAL LOAD</span>
    <span class="val" id="g">0.85 g</span>
  </div>

  <label>Throat Radius</label>
  <input id="radius" type="range" min="0.18" max="1.65" step="0.01" value="0.85">

  <label>Accretion Energy</label>
  <input id="energy" type="range" min="0" max="2.2" step="0.01" value="1.05">

  <label>Gravitational Lensing</label>
  <input id="lens" type="range" min="0" max="2.5" step="0.01" value="1.25">

  <label>Exposure</label>
  <input id="expo" type="range" min="0.35" max="2.4" step="0.01" value="1.15">

  <div class="btns">
    <button id="pause">PAUSE</button>
    <button id="cinema">CINEMA CAM</button>
    <button id="quality">QUALITY: HIGH</button>
  </div>
</div>

<div class="title">
  DRAG TO ORBIT · SCROLL TO ZOOM · SPACE TO PAUSE
</div>

<script>
const canvas = document.getElementById('gl');

const gl = canvas.getContext('webgl2', {
  antialias: false,
  powerPreference: 'high-performance'
});

if (!gl) {
  document.body.innerHTML =
    '<p style="color:#fff;padding:30px;font-family:sans-serif">This browser does not support WebGL2.</p>';

  throw new Error('WebGL2 is required.');
}

const vertexShaderSource = `#version 300 es
layout(location = 0) in vec2 position;

void main() {
  gl_Position = vec4(position, 0.0, 1.0);
}`;

const fragmentShaderSource = `#version 300 es
precision highp float;

out vec4 fragColor;

uniform vec2 uResolution;
uniform float uTime;
uniform float uThroatRadius;
uniform float uEnergy;
uniform float uLensing;
uniform float uExposure;
uniform vec3 uCameraPosition;
uniform vec3 uCameraTarget;
uniform float uTransitPhase;

#define PI 3.14159265359
#define TAU 6.28318530718

mat2 rotate2D(float angle) {
  float c = cos(angle);
  float s = sin(angle);
  return mat2(c, -s, s, c);
}

float hash21(vec2 p) {
  p = fract(p * vec2(233.34, 851.73));
  p += dot(p, p + 23.45);
  return fract(p.x * p.y);
}

float noise3D(vec3 p) {
  vec3 cell = floor(p);
  vec3 local = fract(p);
  local = local * local * (3.0 - 2.0 * local);

  float n000 = hash21(cell.xy + cell.z * 17.13);
  float n100 = hash21(cell.xy + vec2(1.0, 0.0) + cell.z * 17.13);
  float n010 = hash21(cell.xy + vec2(0.0, 1.0) + cell.z * 17.13);
  float n110 = hash21(cell.xy + vec2(1.0, 1.0) + cell.z * 17.13);

  float n001 = hash21(cell.xy + (cell.z + 1.0) * 17.13);
  float n101 = hash21(cell.xy + vec2(1.0, 0.0) + (cell.z + 1.0) * 17.13);
  float n011 = hash21(cell.xy + vec2(0.0, 1.0) + (cell.z + 1.0) * 17.13);
  float n111 = hash21(cell.xy + vec2(1.0, 1.0) + (cell.z + 1.0) * 17.13);

  return mix(
    mix(mix(n000, n100, local.x), mix(n010, n110, local.x), local.y),
    mix(mix(n001, n101, local.x), mix(n011, n111, local.x), local.y),
    local.z
  );
}

float fbm3D(vec3 p) {
  float value = 0.0;
  float amplitude = 0.5;

  for (int i = 0; i < 5; i++) {
    value += amplitude * noise3D(p);
    p *= 2.02;
    amplitude *= 0.5;
  }

  return value;
}

vec3 starfield(vec3 direction) {
  vec3 color = vec3(0.0);

  for (int layer = 0; layer < 3; layer++) {
    float depth = float(layer) + 1.0;
    vec3 coordinate = direction * (180.0 / depth);
    vec3 cell = floor(coordinate);
    vec3 local = fract(coordinate) - 0.5;

    float random = hash21(cell.xy + cell.z * 37.71);

    if (random > 0.986) {
      vec3 offset = vec3(
        hash21(cell.xy + 3.7),
        hash21(cell.zx + 8.1),
        hash21(cell.yz + 5.3)
      ) - 0.5;

      float distance = length(local - offset * 0.7);
      float core = smoothstep(0.09, 0.004, distance);
      float halo = exp(-distance * 13.0) * 0.35;

      vec3 tint = mix(
        vec3(0.72, 0.86, 1.0),
        vec3(1.0, 0.83, 0.62),
        hash21(cell.xy * 3.1)
      );

      color += tint * (core * 2.2 + halo) / depth;
    }
  }

  return color;
}

vec3 nebula(vec3 direction) {
  float layer1 = fbm3D(direction * 2.6 + vec3(2.1, -0.7, 1.4));
  float layer2 = fbm3D(direction * 5.4 - vec3(1.2, 3.1, 0.8));
  float layer3 = fbm3D(direction * 9.5 + uTime * 0.006);

  vec3 color = vec3(0.0);

  color += vec3(0.035, 0.10, 0.28) * smoothstep(0.42, 0.95, layer1);
  color += vec3(0.16, 0.05, 0.32) * smoothstep(0.52, 0.98, layer2) * 0.75;
  color += vec3(0.02, 0.09, 0.20) * smoothstep(0.60, 1.0, layer3);

  return color;
}

vec3 diskColor(float radius, float angle) {
  float rotation = fract(
    angle / TAU - uTime * 0.045 / (pow(radius, 1.5) + 0.05)
  );

  float turbulence = fbm3D(vec3(
    radius * 22.0,
    angle * 3.2,
    uTime * 0.12
  ));

  float heat = smoothstep(2.6, 0.55, radius);

  vec3 hot = vec3(1.45, 1.02, 0.46);
  vec3 cool = vec3(0.18, 0.42, 1.05);
  vec3 violet = vec3(0.55, 0.18, 1.05);

  vec3 color = mix(cool, hot, heat);
  color = mix(color, violet, smoothstep(0.15, 0.75, turbulence) * 0.45);

  color *= 1.15 + 0.75 * turbulence;
  color *= pow(max(heat, 0.0), 1.35);

  return color;
}

vec3 renderRay(vec3 rayOrigin, vec3 rayDirection) {
  vec3 color = vec3(0.0);
  vec3 transmittance = vec3(1.0);
  float captured = 0.0;

  vec3 position = rayOrigin;
  float stepSize;

  for (int i = 0; i < 190; i++) {
    vec3 toCenter = -position;
    float distanceToCenter = length(toCenter);

    if (distanceToCenter < 0.085) {
      captured = 1.0;
      break;
    }

    if (distanceToCenter > 34.0) {
      break;
    }

    float bending = uLensing * 0.055 /
      (distanceToCenter * distanceToCenter + 0.012);

    rayDirection = normalize(
      rayDirection + normalize(toCenter) * bending
    );

    stepSize = max(0.018, distanceToCenter * 0.055);
    position += rayDirection * stepSize;

    float diskRadius = length(position.xz);
    float diskHeight = abs(position.y);

    float diskMask =
      smoothstep(0.16, 0.015, diskHeight) *
      smoothstep(3.4, 0.55, diskRadius) *
      smoothstep(0.30, 0.72, diskRadius);

    if (diskMask > 0.001) {
      float angle = atan(position.z, position.x);

      float turbulence = fbm3D(vec3(
        position.xz * 4.2,
        angle * 2.4 + uTime * 0.22
      ));

      float density = diskMask * (0.45 + 0.85 * turbulence);
      vec3 emission = diskColor(diskRadius, angle) * uEnergy;

      float innerFalloff = max(0.0, 1.0 - diskRadius / 3.2);

      emission += vec3(0.25, 0.65, 1.4) *
        pow(innerFalloff, 4.0) *
        uEnergy * 0.55;

      float shadow = exp(-density * 0.85);

      color += transmittance * emission * density * 0.13;
      transmittance *= shadow;
    }

    float throatRadius = length(position.xz);
    float throatDistance =
      (throatRadius - uThroatRadius * 0.85) * 7.5;

    float throatGlow =
      exp(-throatDistance * throatDistance) *
      exp(-abs(position.y) * 3.2) *
      (0.35 + 0.35 * sin(uTime * 2.3 + position.y * 9.0));

    color += transmittance *
      vec3(0.28, 0.72, 1.55) * throatGlow * 0.09;

    color += transmittance *
      vec3(0.65, 0.18, 1.25) * throatGlow * 0.05;
  }

  if (captured > 0.5) {
    color = vec3(0.0);
  } else {
    vec3 sky = nebula(rayDirection) + starfield(rayDirection);
    color += transmittance * sky;
  }

  return color;
}

vec3 ACESFilmic(vec3 color) {
  return clamp(
    (color * (2.51 * color + 0.03)) /
    (color * (2.43 * color + 0.59) + 0.14),
    0.0,
    1.0
  );
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y;

  vec3 rayOrigin = uCameraPosition;

  vec3 forward = normalize(uCameraTarget - rayOrigin);
  vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), forward));
  vec3 up = cross(forward, right);

  vec3 rayDirection = normalize(
    right * uv.x +
    up * uv.y +
    forward * 1.35
  );

  vec3 color = renderRay(rayOrigin, rayDirection);

  float speed = abs(sin(PI * clamp(uTransitPhase, 0.0, 1.0))) * 0.66;

  vec3 doppler = mix(
    vec3(1.0),
    vec3(0.55, 0.75, 1.55),
    speed * 0.55
  );

  color *= doppler;

  vec3 bloom = vec3(0.0);

  for (int i = 0; i < 8; i++) {
    float angle = float(i) * 0.785;
    vec2 offset = vec2(cos(angle), sin(angle)) * 0.0045;

    vec3 bloomDirection = normalize(
      right * (uv.x + offset.x) +
      up * (uv.y + offset.y) +
      forward * 1.35
    );

    bloom += renderRay(rayOrigin, bloomDirection);
  }

  bloom *= 0.125;

  vec3 bloomInput = max(bloom - vec3(0.035), vec3(0.0));

  color += pow(bloomInput, vec3(1.45)) * 0.85;

  color *= uExposure;
  color = ACESFilmic(color);

  float aberration = 0.0016 + length(uv) * 0.0028;
  float luminance = dot(color, vec3(0.299, 0.587, 0.114));

  color.r = mix(color.r, luminance, aberration * 38.0);
  color.b = mix(color.b, luminance, aberration * 22.0);

  float vignette = smoothstep(
    1.35,
    0.18,
    length(uv * vec2(1.0, 0.82))
  );

  color *= vignette;

  float grain = hash21(gl_FragCoord.xy + uTime * 61.7) - 0.5;
  color += grain * 0.016;

  fragColor = vec4(pow(max(color, vec3(0.0)), vec3(0.4545)), 1.0);
}`;

function compileShader(type, source) {
  const shader = gl.createShader(type);

  gl.shaderSource(shader, source);
  gl.compileShader(shader);

  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    const error = gl.getShaderInfoLog(shader);
    console.error(error);
    throw new Error(error);
  }

  return shader;
}

const program = gl.createProgram();

gl.attachShader(
  program,
  compileShader(gl.VERTEX_SHADER, vertexShaderSource)
);

gl.attachShader(
  program,
  compileShader(gl.FRAGMENT_SHADER, fragmentShaderSource)
);

gl.linkProgram(program);

if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
  const error = gl.getProgramInfoLog(program);
  console.error(error);
  throw new Error(error);
}

gl.useProgram(program);

const fullscreenBuffer = gl.createBuffer();

gl.bindBuffer(gl.ARRAY_BUFFER, fullscreenBuffer);

gl.bufferData(
  gl.ARRAY_BUFFER,
  new Float32Array([
    -1.0, -1.0,
     3.0, -1.0,
    -1.0,  3.0
  ]),
  gl.STATIC_DRAW
);

gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const uniform = name => gl.getUniformLocation(program, name);

const uResolution = uniform('uResolution');
const uTime = uniform('uTime');
const uThroatRadius = uniform('uThroatRadius');
const uEnergy = uniform('uEnergy');
const uLensing = uniform('uLensing');
const uExposure = uniform('uExposure');
const uCameraPosition = uniform('uCameraPosition');
const uCameraTarget = uniform('uCameraTarget');
const uTransitPhase = uniform('uTransitPhase');

let renderScale = 1.25;
let paused = false;
let cinemaCamera = true;

let yaw = 0.65;
let pitch = 0.18;
let cameraDistance = 5.4;
let transitPhase = 0.0;

const PI = Math.PI;

const radiusInput = document.getElementById('radius');
const energyInput = document.getElementById('energy');
const lensInput = document.getElementById('lens');
const exposureInput = document.getElementById('expo');

function resize() {
  const pixelRatio = Math.min(window.devicePixelRatio || 1, renderScale);

  canvas.width = Math.floor(window.innerWidth * pixelRatio);
  canvas.height = Math.floor(window.innerHeight * pixelRatio);

  gl.viewport(0, 0, canvas.width, canvas.height);
}

window.addEventListener('resize', resize);
resize();

let dragging = false;
let lastX = 0;
let lastY = 0;

canvas.addEventListener('pointerdown', event => {
  dragging = true;
  lastX = event.clientX;
  lastY = event.clientY;
});

window.addEventListener('pointerup', () => {
  dragging = false;
});

window.addEventListener('pointermove', event => {
  if (!dragging) return;

  yaw += (event.clientX - lastX) * 0.0045;

  pitch = Math.max(
    -1.35,
    Math.min(1.35, pitch + (event.clientY - lastY) * 0.0035)
  );

  lastX = event.clientX;
  lastY = event.clientY;
});

canvas.addEventListener('wheel', event => {
  event.preventDefault();

  cameraDistance = Math.max(
    1.35,
    Math.min(16.0, cameraDistance * Math.pow(1.0016, event.deltaY))
  );
}, { passive: false });

window.addEventListener('keydown', event => {
  if (event.code === 'Space') {
    event.preventDefault();
    togglePause();
  }
});

function togglePause() {
  paused = !paused;

  document.getElementById('pause').textContent =
    paused ? 'RESUME' : 'PAUSE';
}

document.getElementById('pause').addEventListener('click', togglePause);

document.getElementById('cinema').addEventListener('click', event => {
  cinemaCamera = !cinemaCamera;

  event.target.textContent = cinemaCamera
    ? 'CINEMA CAM'
    : 'FREE CAM';
});

document.getElementById('quality').addEventListener('click', event => {
  if (renderScale === 1.25) {
    renderScale = 2.0;
    event.target.textContent = 'QUALITY: 4K';
  } else if (renderScale === 2.0) {
    renderScale = 3.0;
    event.target.textContent = 'QUALITY: ULTRA 4K';
  } else {
    renderScale = 1.25;
    event.target.textContent = 'QUALITY: HIGH';
  }

  resize();
});

const startTime = performance.now();

function frame() {
  const currentTime = performance.now();
  const elapsed = (currentTime - startTime) * 0.001;

  if (!paused) {
    transitPhase = (transitPhase + 0.0022) % 1.15;
  }

  if (cinemaCamera) {
    yaw += 0.00065;
    pitch = 0.16 + 0.055 * Math.sin(elapsed * 0.19);
    cameraDistance = 4.6 + 0.75 * Math.sin(elapsed * 0.13);
  }

  const cameraPosition = new Float32Array([
    cameraDistance * Math.cos(pitch) * Math.sin(yaw),
    cameraDistance * Math.sin(pitch),
    cameraDistance * Math.cos(pitch) * Math.cos(yaw)
  ]);

  const cameraTarget = new Float32Array([0.0, 0.0, 0.0]);

  const throatRadius = parseFloat(radiusInput.value);
  const tidalLoad = 0.85 * Math.pow(0.85 / throatRadius, 2);

  gl.uniform2f(uResolution, canvas.width, canvas.height);
  gl.uniform1f(uTime, elapsed);
  gl.uniform1f(uThroatRadius, throatRadius);
  gl.uniform1f(uEnergy, parseFloat(energyInput.value));
  gl.uniform1f(uLensing, parseFloat(lensInput.value));
  gl.uniform1f(uExposure, parseFloat(exposureInput.value));
  gl.uniform3fv(uCameraPosition, cameraPosition);
  gl.uniform3fv(uCameraTarget, cameraTarget);
  gl.uniform1f(uTransitPhase, transitPhase);

  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const missionTime = Math.min(transitPhase, 1.0) * 6.1;

  const velocity = Math.abs(
    Math.sin(Math.PI * Math.min(transitPhase, 1.0))
  ) * 0.66;

  document.getElementById('t').textContent =
    missionTime.toFixed(2) + ' / 6.10 d';

  document.getElementById('v').textContent =
    velocity.toFixed(3) + ' c';

  document.getElementById('r').textContent =
    Math.round(throatRadius * 117647).toLocaleString() + ' km';

  const tidalElement = document.getElementById('g');
  tidalElement.textContent = tidalLoad.toFixed(2) + ' g';
  tidalElement.style.color = tidalLoad > 1.0 ? '#ff6b81' : '#8ef7c3';

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>

</body>
</html>
