<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type I X-Ray Burst — Accreting Neutron Star Binary</title>
    <!-- Tailwind CSS for responsive sci-fi HUD -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Space Grotesk & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Three.js & OrbitControls (r128) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #02040a;
            font-family: 'Space Grotesk', sans-serif;
            color: #e2e8f0;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #flash-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(circle at center, rgba(186, 230, 253, 0.35) 0%, rgba(56, 189, 248, 0.08) 55%, rgba(2, 4, 10, 0) 100%);
            opacity: 0;
            transition: opacity 0.08s ease-out;
        }
        .font-mono-tech {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass-panel {
            background: rgba(6, 11, 25, 0.76);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.75), inset 0 0 18px rgba(56, 189, 248, 0.06);
        }
        .btn-ui {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .btn-ui:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.85);
            transform: translateY(-1px);
        }
        .btn-ui.active {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.45), rgba(99, 102, 241, 0.45));
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
        }
        .btn-burst {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: 1px solid #7dd3fc;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.45);
            transition: all 0.18s ease;
        }
        .btn-burst:hover {
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            box-shadow: 0 0 28px rgba(56, 189, 248, 0.75);
            transform: translateY(-1px) scale(1.01);
        }
        .btn-burst:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Fullscreen 3D WebGL Canvas -->
    <div id="canvas-container"></div>
    <!-- Subtle High-Energy X-Ray Screen Bloom Overlay -->
    <div id="flash-overlay"></div>

    <!-- Top Header & Live Telemetry -->
    <header class="fixed top-0 left-0 right-0 z-10 p-3 sm:p-5 pointer-events-none flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
        <div class="glass-panel rounded-xl px-4 py-3 pointer-events-auto max-w-lg">
            <div class="flex items-center gap-2 mb-1">
                <span id="phase-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="phase-label" class="font-mono-tech text-[11px] uppercase tracking-widest text-amber-300">Phase: Fuel Accumulation</span>
            </div>
            <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white">
                Type I X-Ray Burst <span class="text-cyan-400 font-normal text-sm sm:text-base">/ LMXB System</span>
            </h1>
            <p class="text-xs text-slate-300 mt-0.5">
                Thermonuclear runaway ignition of accreted H/He fuel on a 1.4 M☉ neutron star.
            </p>
        </div>

        <!-- Real-Time X-Ray Light Curve HUD -->
        <div class="glass-panel rounded-xl p-3 pointer-events-auto w-full sm:w-80 md:w-96">
            <div class="flex justify-between items-center mb-1.5">
                <span class="font-mono-tech text-[10px] uppercase tracking-wider text-cyan-300">X-Ray Light Curve (2–20 keV)</span>
                <span id="flux-readout" class="font-mono-tech text-xs font-bold text-white">1.2 × 10³⁶ erg/s</span>
            </div>
            <canvas id="lightcurve-canvas" class="w-full h-20 rounded-lg bg-slate-950/90 border border-slate-800 block"></canvas>
            <div class="flex justify-between items-center mt-1.5 text-[10px] font-mono-tech text-slate-400">
                <span>Profile: Fast-Rise Exponential-Decay</span>
                <span id="temp-readout" class="text-amber-300">kT ≈ 1.1 keV</span>
            </div>
        </div>
    </header>

    <!-- Bottom Left Control Deck -->
    <aside class="fixed bottom-16 sm:bottom-20 left-3 sm:left-5 z-10 w-[calc(100vw-1.5rem)] sm:w-80 glass-panel rounded-xl p-4 pointer-events-auto space-y-3.5">
        <!-- Manual Trigger Button -->
        <button id="trigger-burst-btn" class="btn-burst w-full py-2.5 px-4 rounded-xl font-bold text-sm text-white tracking-wide flex items-center justify-center gap-2 cursor-pointer">
            <svg class="w-4 h-4 text-cyan-200" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            TRIGGER X-RAY BURST
        </button>

        <!-- Fuel Column Depth Progress Bar -->
        <div>
            <div class="flex justify-between text-[11px] font-mono-tech mb-1">
                <span class="text-slate-400">H/He FUEL LAYER DEPTH</span>
                <span id="fuel-percent" class="text-amber-300 font-semibold">0%</span>
            </div>
            <div class="w-full h-2.5 bg-slate-900 rounded-full overflow-hidden border border-slate-700/80">
                <div id="fuel-bar" class="h-full bg-gradient-to-r from-amber-500 via-orange-400 to-cyan-300 transition-all duration-75" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Accretion Rate Slider -->
        <div class="pt-1 border-t border-slate-800">
            <div class="flex justify-between items-center text-[11px] font-mono-tech mb-1">
                <label for="accretion-slider" class="text-slate-400">ACCRETION RATE (Ṁ)</label>
                <span id="accretion-val" class="text-cyan-300">1.0x</span>
            </div>
            <input id="accretion-slider" type="range" min="0.2" max="3.0" step="0.1" value="1.0" class="w-full accent-cyan-400 cursor-pointer">
        </div>

        <!-- Auto-Burst Cycle Toggle -->
        <div class="flex items-center justify-between pt-1 border-t border-slate-800">
            <span class="text-xs text-slate-300 font-medium">Auto-Burst Cycle</span>
            <button id="auto-toggle-btn" class="px-3 py-1 rounded-lg font-mono-tech text-xs font-semibold bg-cyan-500/20 text-cyan-300 border border-cyan-400/50 cursor-pointer">
                ENABLED
            </button>
        </div>
    </aside>

    <!-- Bottom Camera Presets Bar -->
    <footer class="fixed bottom-3 sm:bottom-4 left-3 right-3 z-10 pointer-events-none flex justify-center">
        <div class="glass-panel rounded-2xl p-1.5 pointer-events-auto flex flex-wrap justify-center items-center gap-1.5">
            <button data-cam="overview" class="btn-ui active rounded-xl px-3 py-1.5 text-xs font-semibold text-slate-200">
                System Overview
            </button>
            <button data-cam="neutron" class="btn-ui rounded-xl px-3 py-1.5 text-xs font-semibold text-slate-200">
                Neutron Star Close-Up
            </button>
            <button data-cam="polar" class="btn-ui rounded-xl px-3 py-1.5 text-xs font-semibold text-slate-200">
                Polar Disk View
            </button>
        </div>
    </footer>

    <script>
        /**
         * Type I X-Ray Burst — 3D Low-Mass X-Ray Binary (LMXB) Simulation
         * Built with Three.js (r128)
         *
         * Physics & Visual Architecture:
         * 1. Neutron Star (1.4 M☉): Rapidly spinning compact sphere with dipolar magnetic field lines,
         *    magnetic polar hotspots, and an accreted Hydrogen/Helium envelope that heats up prior to ignition.
         * 2. Companion Donor Star: Roche-lobe teardrop-distorted star overflowing through the L1 Lagrange point.
         * 3. Accretion Stream & Disk: Ballistic gas stream feeding a Keplerian accretion disk with hot spot impact.
         * 4. Thermonuclear Runaway (Type I Burst):
         *    - Phase 0 (ACCUMULATION): Fuel depth builds up; surface shifts from dull crimson to bright orange-gold.
         *    - Phase 1 (IGNITION & PRE): Rapid (<1s) runaway fusion flash; Photospheric Radius Expansion (PRE)
         *      swells the glowing envelope, launching expanding spherical X-ray shockwave shells & flare rays.
         *    - Phase 2 (COOLING TAIL): Exponential thermal decay (FRED profile) back to baseline accretion.
         */

        let scene, camera, renderer, controls;
        let clock = new THREE.Clock();

        // System Groups & Meshes
        let binarySystemGroup;
        let neutronStarGroup, neutronCoreMesh, fuelEnvelopeMesh, nsCoronaSprite, nsPointLight;
        let magneticFieldGroup, polarHotspotNorth, polarHotspotSouth;
        let companionGroup, donorStarMesh;
        let accretionDiskMesh, diskParticles, diskParticleMeta = [];
        let streamParticles, streamParticleMeta = [];
        let starfield;

        // Active expanding X-ray shockwave shells & radiation flares
        let activeShockwaves = [];
        let burstFlareGroup;

        // Simulation State Variables
        let fuelLevel = 0.25;          // 0.0 to 1.0 (triggers burst at 1.0)
        let accretionRate = 1.0;       // User multiplier (0.2x - 3.0x)
        let autoBurstEnabled = true;

        // Burst State Machine: 'ACCUMULATION' | 'IGNITION' | 'COOLING'
        let burstState = 'ACCUMULATION';
        let burstTimer = 0;
        let currentIntensity = 0.0;    // Normalized burst intensity (0.0 baseline -> 1.0 peak Eddington flash)

        // Camera smooth transition state
        let currentCamPreset = 'overview';
        let isCameraLerping = false;
        let targetCamPos = new THREE.Vector3(-4, 13, 36);
        let targetLookAt = new THREE.Vector3(-3, 0, 0);

        // Live Light Curve History Buffer
        const LIGHTCURVE_SAMPLES = 180;
        let lightCurveData = new Array(LIGHTCURVE_SAMPLES).fill(0.08);
        let lcCanvas, lcCtx;

        // Spatial Constants
        const NEUTRON_STAR_POS = new THREE.Vector3(-8.5, 0, 0);
        const DONOR_STAR_POS = new THREE.Vector3(14.5, 0, 0);
        const L1_POINT_POS = new THREE.Vector3(4.2, 0, 0);

        /**
         * Creates a smooth radial glow texture on an offscreen canvas
         */
        function createGlowTexture(innerRGBA, midRGBA, outerRGBA) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            grad.addColorStop(0.0, innerRGBA);
            grad.addColorStop(0.35, midRGBA);
            grad.addColorStop(0.75, outerRGBA);
            grad.addColorStop(1.0, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);
            return new THREE.CanvasTexture(canvas);
        }

        /**
         * Creates a procedural spiral accretion disk texture
         */
        function createAccretionDiskTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const cx = 256, cy = 256;

            const grad = ctx.createRadialGradient(cx, cy, 34, cx, cy, 250);
            grad.addColorStop(0.0, 'rgba(0,0,0,0)');
            grad.addColorStop(0.06, 'rgba(224, 242, 254, 0.95)');
            grad.addColorStop(0.22, 'rgba(56, 189, 248, 0.78)');
            grad.addColorStop(0.52, 'rgba(245, 158, 11, 0.55)');
            grad.addColorStop(0.84, 'rgba(180, 83, 9, 0.22)');
            grad.addColorStop(1.0, 'rgba(0,0,0,0)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 512);

            // Spiral shock arms inside the viscous accretion disk
            ctx.globalCompositeOperation = 'lighter';
            for (let arm = 0; arm < 4; arm++) {
                const baseAngle = (arm / 4) * Math.PI * 2;
                ctx.beginPath();
                for (let step = 0; step < 90; step++) {
                    const r = 42 + step * 2.1;
                    const theta = baseAngle + step * 0.065;
                    const x = cx + Math.cos(theta) * r;
                    const y = cy + Math.sin(theta) * r;
                    if (step === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            return new THREE.CanvasTexture(canvas);
        }

        /**
         * Builds the rapidly spinning Neutron Star, dipolar magnetic field lines,
         * polar hotspots, and thermonuclear fuel envelope
         */
        function buildNeutronStarSystem() {
            neutronStarGroup = new THREE.Group();
            neutronStarGroup.position.copy(NEUTRON_STAR_POS);
            binarySystemGroup.add(neutronStarGroup);

            // 1. Ultra-dense Neutron Star Crust
            const coreGeo = new THREE.SphereGeometry(1.15, 48, 48);
            const coreMat = new THREE.MeshStandardMaterial({
                color: 0x38bdf8,
                emissive: 0x0284c7,
                emissiveIntensity: 0.9,
                roughness: 0.3,
                metalness: 0.6
            });
            neutronCoreMesh = new THREE.Mesh(coreGeo, coreMat);
            neutronStarGroup.add(neutronCoreMesh);

            // 2. Accumulating H/He Fuel Envelope (changes color & expands during PRE flash)
            const envGeo = new THREE.SphereGeometry(1.21, 48, 48);
            const envMat = new THREE.MeshBasicMaterial({
                color: 0xf59e0b,
                transparent: true,
                opacity: 0.25,
                blending: THREE.AdditiveBlending
            });
            fuelEnvelopeMesh = new THREE.Mesh(envGeo, envMat);
            neutronStarGroup.add(fuelEnvelopeMesh);

            // 3. Magnetic Axis Group (tilted 22 degrees relative to spin axis for pulsar-like wobble)
            magneticFieldGroup = new THREE.Group();
            magneticFieldGroup.rotation.z = 0.38;
            neutronStarGroup.add(magneticFieldGroup);

            // Polar Magnetic Hotspots (North & South)
            const spotGeo = new THREE.SphereGeometry(0.28, 20, 20);
            const spotMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            polarHotspotNorth = new THREE.Mesh(spotGeo, spotMat);
            polarHotspotNorth.position.set(0, 1.05, 0);
            polarHotspotSouth = new THREE.Mesh(spotGeo, spotMat);
            polarHotspotSouth.position.set(0, -1.05, 0);
            magneticFieldGroup.add(polarHotspotNorth, polarHotspotSouth);

            // Dipolar Magnetic Field Loops (r = R_max * sin^2(theta))
            const numLoops = 10;
            const fieldMat = new THREE.LineBasicMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.32,
                blending: THREE.AdditiveBlending
            });

            for (let i = 0; i < numLoops; i++) {
                const phi = (i / numLoops) * Math.PI * 2;
                const rMax = 4.2;
                const pts = [];
                for (let step = 6; step <= 54; step++) {
                    const theta = (step / 60) * Math.PI;
                    const r = rMax * Math.pow(Math.sin(theta), 2);
                    const x = r * Math.sin(theta) * Math.cos(phi);
                    const y = r * Math.cos(theta);
                    const z = r * Math.sin(theta) * Math.sin(phi);
                    pts.push(new THREE.Vector3(x, y, z));
                }
                const loopGeo = new THREE.BufferGeometry().setFromPoints(pts);
                const loopLine = new THREE.Line(loopGeo, fieldMat);
                magneticFieldGroup.add(loopLine);
            }

            // 4. Neutron Star Corona Glow Sprite
            const coronaTex = createGlowTexture(
                'rgba(255, 255, 255, 1.0)',
                'rgba(56, 189, 248, 0.7)',
                'rgba(14, 165, 233, 0.0)'
            );
            const coronaMat = new THREE.SpriteMaterial({
                map: coronaTex,
                transparent: true,
                opacity: 0.75,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            nsCoronaSprite = new THREE.Sprite(coronaMat);
            nsCoronaSprite.scale.set(6.5, 6.5, 1);
            neutronStarGroup.add(nsCoronaSprite);

            // 5. Dynamic Point Light illuminating the disk and companion star during bursts
            nsPointLight = new THREE.PointLight(0x7dd3fc, 2.2, 65);
            neutronStarGroup.add(nsPointLight);

            // 6. Transient X-Ray Burst Flare Rays Group
            burstFlareGroup = new THREE.Group();
            const rayGeo = new THREE.CylinderGeometry(0.03, 0.45, 18, 12, 1, true);
            const rayMat = new THREE.MeshBasicMaterial({
                color: 0xe0f2fe,
                transparent: true,
                opacity: 0.0,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            for (let r = 0; r < 14; r++) {
                const ray = new THREE.Mesh(rayGeo, rayMat);
                ray.rotation.set(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );
                burstFlareGroup.add(ray);
            }
            neutronStarGroup.add(burstFlareGroup);
        }

        /**
         * Builds the Roche-lobe filling companion donor star (low-mass K/M subgiant)
         */
        function buildCompanionStar() {
            companionGroup = new THREE.Group();
            companionGroup.position.copy(DONOR_STAR_POS);
            binarySystemGroup.add(companionGroup);

            // Create Roche-lobe teardrop geometry stretched toward the L1 Lagrange point (-X)
            const donorGeo = new THREE.SphereGeometry(4.6, 48, 48);
            const posAttr = donorGeo.attributes.position;
            const v = new THREE.Vector3();

            for (let i = 0; i < posAttr.count; i++) {
                v.fromBufferAttribute(posAttr, i);
                // Stretch vertices pointing toward the neutron star (-X direction)
                if (v.x < 0) {
                    const pullFactor = Math.pow(Math.abs(v.x) / 4.6, 1.8);
                    v.x -= pullFactor * 2.4;
                    v.y *= (1 - pullFactor * 0.28);
                    v.z *= (1 - pullFactor * 0.28);
                }
                posAttr.setXYZ(i, v.x, v.y, v.z);
            }
            donorGeo.computeVertexNormals();

            const donorMat = new THREE.MeshStandardMaterial({
                color: 0xf97316,
                emissive: 0xea580c,
                emissiveIntensity: 0.85,
                roughness: 0.7
            });
            donorStarMesh = new THREE.Mesh(donorGeo, donorMat);
            companionGroup.add(donorStarMesh);

            // Warm stellar atmosphere halo
            const haloTex = createGlowTexture(
                'rgba(253, 186, 116, 0.75)',
                'rgba(234, 88, 12, 0.3)',
                'rgba(0, 0, 0, 0)'
            );
            const haloMat = new THREE.SpriteMaterial({
                map: haloTex,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const haloSprite = new THREE.Sprite(haloMat);
            haloSprite.scale.set(17, 15, 1);
            haloSprite.position.set(-0.6, 0, 0);
            companionGroup.add(haloSprite);
        }

        /**
         * Builds the Keplerian Accretion Disk and the Roche-Lobe Overflow Gas Stream
         */
        function buildAccretionDiskAndStream() {
            // 1. Accretion Disk Plane around the Neutron Star
            const diskTex = createAccretionDiskTexture();
            const diskGeo = new THREE.PlaneGeometry(15.5, 15.5);
            const diskMat = new THREE.MeshBasicMaterial({
                map: diskTex,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            accretionDiskMesh = new THREE.Mesh(diskGeo, diskMat);
            accretionDiskMesh.rotation.x = Math.PI / 2;
            accretionDiskMesh.position.copy(NEUTRON_STAR_POS);
            binarySystemGroup.add(accretionDiskMesh);

            // 2. Orbiting Plasma Clumps inside the Accretion Disk
            const diskCount = 420;
            const diskPGeo = new THREE.BufferGeometry();
            const diskPositions = new Float32Array(diskCount * 3);

            for (let i = 0; i < diskCount; i++) {
                const r = 1.55 + Math.pow(Math.random(), 1.3) * 5.8;
                const angle = Math.random() * Math.PI * 2;
                const y = (Math.random() - 0.5) * 0.25;

                diskPositions[i * 3] = NEUTRON_STAR_POS.x + Math.cos(angle) * r;
                diskPositions[i * 3 + 1] = y;
                diskPositions[i * 3 + 2] = NEUTRON_STAR_POS.z + Math.sin(angle) * r;

                diskParticleMeta.push({
                    radius: r,
                    angle: angle,
                    speed: 3.6 / Math.pow(r, 1.15),
                    y: y
                });
            }
            diskPGeo.setAttribute('position', new THREE.BufferAttribute(diskPositions, 3));
            const diskPMat = new THREE.PointsMaterial({
                color: 0xfde68a,
                size: 0.14,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            diskParticles = new THREE.Points(diskPGeo, diskPMat);
            binarySystemGroup.add(diskParticles);

            // 3. Ballistic Accretion Stream (L1 Lagrange Point -> Outer Rim of Accretion Disk)
            // Uses a quadratic Bezier curve bent by the Coriolis force in the rotating frame
            const streamCurve = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(7.6, 0, 0),    // Donor star L1 nozzle
                new THREE.Vector3(1.5, 0, 3.8),    // Coriolis deflection arc
                new THREE.Vector3(-3.8, 0, 4.8)    // Hot-spot impact point on outer disk
            );

            const streamCount = 240;
            const streamGeo = new THREE.BufferGeometry();
            const streamPositions = new Float32Array(streamCount * 3);

            for (let i = 0; i < streamCount; i++) {
                const t = i / streamCount;
                streamParticleMeta.push({
                    t: t,
                    speed: 0.42 + Math.random() * 0.12,
                    jitterX: (Math.random() - 0.5) * 0.35,
                    jitterY: (Math.random() - 0.5) * 0.25,
                    jitterZ: (Math.random() - 0.5) * 0.35,
                    curve: streamCurve
                });
            }
            streamGeo.setAttribute('position', new THREE.BufferAttribute(streamPositions, 3));
            const streamMat = new THREE.PointsMaterial({
                color: 0xfdba74,
                size: 0.18,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            streamParticles = new THREE.Points(streamGeo, streamMat);
            binarySystemGroup.add(streamParticles);
        }

        /**
         * Builds the deep space starfield background
         */
        function buildStarfield() {
            const starCount = 3500;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(starCount * 3);
            const col = new Float32Array(starCount * 3);

            const palette = [
                new THREE.Color(0xbae6fd),
                new THREE.Color(0xfef08a),
                new THREE.Color(0xe2e8f0),
                new THREE.Color(0xc4b5fd)
            ];

            for (let i = 0; i < starCount; i++) {
                const r = 120 + Math.random() * 260;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                pos[i * 3 + 2] = r * Math.cos(phi);

                const c = palette[Math.floor(Math.random() * palette.length)];
                col[i * 3] = c.r;
                col[i * 3 + 1] = c.g;
                col[i * 3 + 2] = c.b;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.9,
                vertexColors: true,
                transparent: true,
                opacity: 0.85
            });
            starfield = new THREE.Points(geo, mat);
            scene.add(starfield);
        }

        /**
         * Spawns an expanding spherical X-ray radiation shockwave shell
         */
        function spawnXRayShockwave(colorHex, speed, maxScale) {
            const geo = new THREE.SphereGeometry(1.25, 36, 36);
            const mat = new THREE.MeshBasicMaterial({
                color: colorHex,
                transparent: true,
                opacity: 0.75,
                wireframe: false,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(NEUTRON_STAR_POS);
            binarySystemGroup.add(mesh);

            activeShockwaves.push({
                mesh,
                scale: 1.0,
                speed,
                maxScale
            });
        }

        /**
         * Triggers a Type I Thermonuclear X-Ray Burst immediately
         */
        function triggerXRayBurst() {
            if (burstState === 'IGNITION') return; // Already at peak ignition

            burstState = 'IGNITION';
            burstTimer = 0;
            fuelLevel = 0.0;

            // Launch primary & secondary expanding X-ray shockwave shells
            spawnXRayShockwave(0xffffff, 18.0, 26.0);
            setTimeout(() => {
                spawnXRayShockwave(0x38bdf8, 13.5, 22.0);
            }, 140);

            // Screen bloom pulse
            const flashOverlay = document.getElementById('flash-overlay');
            flashOverlay.style.opacity = '1';
            setTimeout(() => {
                flashOverlay.style.opacity = '0';
            }, 180);
        }

        /**
         * Renders the real-time Fast-Rise Exponential-Decay (FRED) X-Ray Light Curve on Canvas
         */
        function renderLightCurve() {
            if (!lcCtx) return;
            const w = lcCanvas.width;
            const h = lcCanvas.height;

            lcCtx.clearRect(0, 0, w, h);

            // Subtle scientific grid lines
            lcCtx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
            lcCtx.lineWidth = 1;
            for (let gx = 0; gx < w; gx += 40) {
                lcCtx.beginPath();
                lcCtx.moveTo(gx, 0);
                lcCtx.lineTo(gx, h);
                lcCtx.stroke();
            }
            for (let gy = 16; gy < h; gy += 22) {
                lcCtx.beginPath();
                lcCtx.moveTo(0, gy);
                lcCtx.lineTo(w, gy);
                lcCtx.stroke();
            }

            // Plot X-ray flux curve with gradient fill
            const grad = lcCtx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, 'rgba(125, 211, 252, 0.55)');
            grad.addColorStop(1, 'rgba(14, 165, 233, 0.02)');

            lcCtx.beginPath();
            for (let i = 0; i < lightCurveData.length; i++) {
                const x = (i / (lightCurveData.length - 1)) * w;
                const val = Math.min(1.0, Math.max(0.02, lightCurveData[i]));
                const y = h - 6 - val * (h - 14);
                if (i === 0) lcCtx.moveTo(x, y);
                else lcCtx.lineTo(x, y);
            }

            lcCtx.strokeStyle = '#38bdf8';
            lcCtx.lineWidth = 2.2;
            lcCtx.stroke();

            // Close path for shaded area under curve
            lcCtx.lineTo(w, h);
            lcCtx.lineTo(0, h);
            lcCtx.closePath();
            lcCtx.fillStyle = grad;
            lcCtx.fill();

            // Glowing live detector dot at right edge
            const latestVal = lightCurveData[lightCurveData.length - 1];
            const dotY = h - 6 - Math.min(1.0, latestVal) * (h - 14);
            lcCtx.beginPath();
            lcCtx.arc(w - 3, dotY, 3.5, 0, Math.PI * 2);
            lcCtx.fillStyle = '#ffffff';
            lcCtx.fill();
        }

        /**
         * Initializes the Three.js Scene, Lights, Camera, and UI Listeners
         */
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x02040a, 0.0025);

            camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(targetCamPos);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.target.copy(targetLookAt);
            controls.minDistance = 4;
            controls.maxDistance = 110;

            controls.addEventListener('start', () => {
                isCameraLerping = false;
            });

            // Ambient illumination so donor star dark side remains subtly visible
            const ambientLight = new THREE.AmbientLight(0x1e293b, 1.4);
            scene.add(ambientLight);

            binarySystemGroup = new THREE.Group();
            scene.add(binarySystemGroup);

            buildStarfield();
            buildNeutronStarSystem();
            buildCompanionStar();
            buildAccretionDiskAndStream();

            // Setup Light Curve 2D Canvas
            lcCanvas = document.getElementById('lightcurve-canvas');
            lcCanvas.width = 360;
            lcCanvas.height = 80;
            lcCtx = lcCanvas.getContext('2d');

            setupUI();
            window.addEventListener('resize', onWindowResize, false);
        }

        /**
         * Connects HUD buttons, sliders, and camera presets
         */
        function setupUI() {
            document.getElementById('trigger-burst-btn').addEventListener('click', () => {
                triggerXRayBurst();
            });

            const accretionSlider = document.getElementById('accretion-slider');
            const accretionVal = document.getElementById('accretion-val');
            accretionSlider.addEventListener('input', (e) => {
                accretionRate = parseFloat(e.target.value);
                accretionVal.textContent = accretionRate.toFixed(1) + 'x';
            });

            const autoBtn = document.getElementById('auto-toggle-btn');
            autoBtn.addEventListener('click', () => {
                autoBurstEnabled = !autoBurstEnabled;
                autoBtn.textContent = autoBurstEnabled ? 'ENABLED' : 'PAUSED';
                autoBtn.className = autoBurstEnabled
                    ? 'px-3 py-1 rounded-lg font-mono-tech text-xs font-semibold bg-cyan-500/20 text-cyan-300 border border-cyan-400/50 cursor-pointer'
                    : 'px-3 py-1 rounded-lg font-mono-tech text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700 cursor-pointer';
            });

            const camButtons = document.querySelectorAll('[data-cam]');
            camButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    camButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    setCameraPreset(btn.getAttribute('data-cam'));
                });
            });
        }

        /**
         * Sets target camera coordinates for smooth interpolation
         */
        function setCameraPreset(preset) {
            currentCamPreset = preset;
            isCameraLerping = true;

            if (preset === 'overview') {
                targetCamPos.set(-4, 13, 36);
                targetLookAt.set(-2, 0, 0);
            } else if (preset === 'neutron') {
                targetCamPos.set(NEUTRON_STAR_POS.x + 1.5, 3.8, 9.5);
                targetLookAt.copy(NEUTRON_STAR_POS);
            } else if (preset === 'polar') {
                targetCamPos.set(-2.5, 34, 2.5);
                targetLookAt.set(-2.5, 0, 0);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        /**
         * Updates physics state machine, fuel accumulation, thermonuclear detonation,
         * photospheric radius expansion, and HUD telemetry
         */
        function updateSimulation(delta, elapsed) {
            // 1. Rapid Neutron Star Spin (simulating millisecond pulsar rotation)
            neutronStarGroup.rotation.y += delta * 14.0;

            // 2. State Machine: Fuel Accumulation -> Thermonuclear Ignition -> Cooling Tail
            const phaseLabel = document.getElementById('phase-label');
            const phaseDot = document.getElementById('phase-dot');

            if (burstState === 'ACCUMULATION') {
                fuelLevel += delta * 0.11 * accretionRate;
                currentIntensity = THREE.MathUtils.lerp(currentIntensity, 0.06 + fuelLevel * 0.08, delta * 5);

                phaseLabel.textContent = 'Phase: H/He Fuel Accumulation';
                phaseLabel.className = 'font-mono-tech text-[11px] uppercase tracking-widest text-amber-300';
                phaseDot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse';

                if (fuelLevel >= 1.0) {
                    if (autoBurstEnabled) {
                        triggerXRayBurst();
                    } else {
                        fuelLevel = 1.0;
                    }
                }
            } else if (burstState === 'IGNITION') {
                // Fast rise (< 0.45 seconds) to Eddington luminosity peak
                burstTimer += delta;
                currentIntensity = Math.min(1.0, burstTimer / 0.35);

                phaseLabel.textContent = 'Phase: Thermonuclear Flash (PRE)';
                phaseLabel.className = 'font-mono-tech text-[11px] uppercase tracking-widest text-cyan-300 font-bold';
                phaseDot.className = 'w-2.5 h-2.5 rounded-full bg-cyan-300 animate-ping';

                if (burstTimer >= 0.45) {
                    burstState = 'COOLING';
                    burstTimer = 0;
                }
            } else if (burstState === 'COOLING') {
                // Exponential thermal decay tail (~4.5 seconds scaled)
                burstTimer += delta;
                currentIntensity = 0.06 + 0.94 * Math.exp(-burstTimer * 0.85);

                phaseLabel.textContent = 'Phase: Photospheric Cooling Tail';
                phaseLabel.className = 'font-mono-tech text-[11px] uppercase tracking-widest text-sky-400';
                phaseDot.className = 'w-2.5 h-2.5 rounded-full bg-sky-400';

                // Gradually resume fuel buildup as surface cools
                fuelLevel += delta * 0.04 * accretionRate;

                if (currentIntensity <= 0.09) {
                    burstState = 'ACCUMULATION';
                }
            }

            // 3. Visual Feedback on Neutron Star Surface & Fuel Envelope
            // During accumulation, envelope shifts from deep orange to hot gold; during burst, blinding white-cyan
            const envScale = 1.0 + fuelLevel * 0.04 + currentIntensity * 0.38; // Photospheric Radius Expansion (PRE)
            fuelEnvelopeMesh.scale.setScalar(envScale);

            if (burstState === 'ACCUMULATION') {
                fuelEnvelopeMesh.material.color.setHSL(0.08 + fuelLevel * 0.04, 0.95, 0.52);
                fuelEnvelopeMesh.material.opacity = 0.18 + fuelLevel * 0.45;
                neutronCoreMesh.material.emissive.setHex(0x0284c7);
                neutronCoreMesh.material.emissiveIntensity = 0.8 + fuelLevel * 0.7;
            } else {
                fuelEnvelopeMesh.material.color.setHex(0xe0f2fe);
                fuelEnvelopeMesh.material.opacity = 0.25 + currentIntensity * 0.72;
                neutronCoreMesh.material.emissive.setHex(0xbae6fd);
                neutronCoreMesh.material.emissiveIntensity = 1.0 + currentIntensity * 4.5;
            }

            // Corona & PointLight intensity scaling
            const coronaScale = 6.2 + currentIntensity * 14.5;
            nsCoronaSprite.scale.set(coronaScale, coronaScale, 1);
            nsCoronaSprite.material.opacity = 0.65 + currentIntensity * 0.35;
            nsPointLight.intensity = 2.0 + currentIntensity * 11.0;

            // Transient Burst Flare Rays
            burstFlareGroup.rotation.y -= delta * 1.8;
            burstFlareGroup.rotation.x += delta * 1.1;
            burstFlareGroup.children.forEach((ray, idx) => {
                ray.material.opacity = Math.max(0, (currentIntensity - 0.15) * 0.65);
                const s = 0.6 + currentIntensity * (1.1 + (idx % 3) * 0.25);
                ray.scale.set(1, s, 1);
            });

            // 4. Update Expanding X-Ray Shockwave Shells
            for (let i = activeShockwaves.length - 1; i >= 0; i--) {
                const sw = activeShockwaves[i];
                sw.scale += delta * sw.speed;
                sw.mesh.scale.setScalar(sw.scale);
                const progress = sw.scale / sw.maxScale;
                sw.mesh.material.opacity = Math.max(0, 0.72 * (1 - progress));

                if (sw.scale >= sw.maxScale) {
                    binarySystemGroup.remove(sw.mesh);
                    sw.mesh.geometry.dispose();
                    sw.mesh.material.dispose();
                    activeShockwaves.splice(i, 1);
                }
            }

            // 5. Update Accretion Disk & Ballistic Gas Stream Particles
            accretionDiskMesh.rotation.z -= delta * (0.9 + accretionRate * 0.35);

            const dPos = diskParticles.geometry.attributes.position.array;
            for (let i = 0; i < diskParticleMeta.length; i++) {
                const p = diskParticleMeta[i];
                p.angle -= delta * p.speed * (0.7 + accretionRate * 0.35);
                dPos[i * 3] = NEUTRON_STAR_POS.x + Math.cos(p.angle) * p.radius;
                dPos[i * 3 + 2] = NEUTRON_STAR_POS.z + Math.sin(p.angle) * p.radius;
            }
            diskParticles.geometry.attributes.position.needsUpdate = true;

            const sPos = streamParticles.geometry.attributes.position.array;
            const pt = new THREE.Vector3();
            for (let i = 0; i < streamParticleMeta.length; i++) {
                const sp = streamParticleMeta[i];
                sp.t = (sp.t + delta * sp.speed * (0.6 + accretionRate * 0.45)) % 1.0;
                sp.curve.getPoint(sp.t, pt);
                // Narrow stream near L1 nozzle, slightly wider near disk impact
                const spread = 0.3 + sp.t * 0.9;
                sPos[i * 3] = pt.x + sp.jitterX * spread;
                sPos[i * 3 + 1] = pt.y + sp.jitterY * spread;
                sPos[i * 3 + 2] = pt.z + sp.jitterZ * spread;
            }
            streamParticles.geometry.attributes.position.needsUpdate = true;

            // 6. Push Sample to Live X-Ray Light Curve & Update HUD Readouts
            const noise = (Math.random() - 0.5) * 0.018;
            lightCurveData.push(Math.max(0.04, currentIntensity + noise));
            if (lightCurveData.length > LIGHTCURVE_SAMPLES) {
                lightCurveData.shift();
            }
            renderLightCurve();

            // Update Telemetry Text
            const pct = Math.min(100, Math.round(fuelLevel * 100));
            document.getElementById('fuel-percent').textContent = pct + '%';
            document.getElementById('fuel-bar').style.width = pct + '%';

            // Eddington luminosity (~2-3 x 10^38 erg/s at burst peak)
            const lumVal = (1.2 + currentIntensity * 280).toFixed(1);
            const expStr = currentIntensity > 0.25 ? '10³⁸' : '10³⁶';
            const scaledLum = currentIntensity > 0.25 ? (currentIntensity * 2.8).toFixed(2) : (1.2 + fuelLevel * 1.4).toFixed(1);
            document.getElementById('flux-readout').textContent = `${scaledLum} × ${expStr} erg/s`;

            const kT = (1.05 + currentIntensity * 1.85).toFixed(2);
            document.getElementById('temp-readout').textContent = `kT ≈ ${kT} keV`;
        }

        /**
         * Main Animation Loop
         */
        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();

            updateSimulation(delta, elapsed);

            if (starfield) {
                starfield.rotation.y += delta * 0.006;
            }

            if (isCameraLerping) {
                camera.position.lerp(targetCamPos, 0.06);
                controls.target.lerp(targetLookAt, 0.06);
                if (camera.position.distanceTo(targetCamPos) < 0.15) {
                    isCameraLerping = false;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = function () {
            init();
            animate();
        };
    </script>
</body>
</html>
