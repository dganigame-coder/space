<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rogue Black Hole — Solar System N-Body Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js & OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03050a;
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
            touch-action: none; /* Prevent browser pull-to-refresh or pinch zoom */
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Custom Range Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.14);
            height: 6px;
            border-radius: 999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #f97316;
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.8);
            transition: transform 0.1s ease;
        }
        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }
        .glass-panel {
            background: rgba(10, 14, 26, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
        }
        .btn-pill {
            transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .btn-pill:active {
            transform: scale(0.95);
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Floating Planet Labels */
        .planet-label {
            position: absolute;
            pointer-events: none;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: rgba(241, 245, 249, 0.85);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
            transform: translate(-50%, -140%);
            white-space: nowrap;
            transition: opacity 0.2s ease;
        }
        .bh-badge {
            color: #fdba74;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(249, 115, 22, 0.9);
        }
        /* Hide scrollbars on horizontal button bar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>

    <!-- WebGL Viewport -->
    <div id="canvas-container"></div>

    <!-- 2D Projected Labels Layer -->
    <div id="labels-layer" class="fixed inset-0 pointer-events-none z-10 overflow-hidden"></div>

    <!-- Top Header & Live Telemetry Feed -->
    <header class="fixed top-0 left-0 right-0 z-20 p-3 sm:p-4 pointer-events-none flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
        <div class="glass-panel rounded-2xl px-3.5 py-2.5 pointer-events-auto flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-orange-600 via-amber-400 to-black border border-orange-300/50 shadow-[0_0_15px_rgba(249,115,22,0.65)] flex items-center justify-center shrink-0">
                <div class="w-3.5 h-3.5 rounded-full bg-black"></div>
            </div>
            <div>
                <h1 class="text-sm sm:text-base font-semibold tracking-tight text-white leading-tight">Rogue Black Hole Simulator</h1>
                <p class="text-[11px] text-slate-400 leading-tight">Drag black hole with finger/mouse to disrupt orbits</p>
            </div>
        </div>

        <!-- Live Event Alert Pill -->
        <div id="telemetry-pill" class="glass-panel rounded-full px-3.5 py-1.5 pointer-events-auto flex items-center gap-2 text-xs border border-orange-500/30">
            <span id="telemetry-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="telemetry-text" class="mono text-[11px] sm:text-xs text-slate-200">System nominal — Drag black hole to begin</span>
        </div>
    </header>

    <!-- Touch / Interaction Mode Floating Switch (Top Right below header on mobile) -->
    <div class="fixed top-24 sm:top-20 right-3 sm:right-4 z-20 flex flex-col gap-2 pointer-events-auto">
        <div class="glass-panel rounded-2xl p-1 flex flex-col gap-1">
            <button id="mode-drag-btn" class="btn-pill px-3 py-2 rounded-xl text-xs font-medium flex items-center gap-2 bg-orange-500 text-white shadow-lg shadow-orange-500/25" title="Touch/drag anywhere to move the Black Hole">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/></svg>
                <span>Move Black Hole</span>
            </button>
            <button id="mode-cam-btn" class="btn-pill px-3 py-2 rounded-xl text-xs font-medium flex items-center gap-2 text-slate-300 hover:bg-white/10" title="Touch/drag to rotate and zoom camera">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/></svg>
                <span>Orbit Camera</span>
            </button>
        </div>

        <!-- Visual Scale & Labels Toggles -->
        <div class="glass-panel rounded-2xl p-1.5 flex flex-col gap-1 text-[11px]">
            <button id="toggle-scale-btn" class="btn-pill px-2.5 py-1.5 rounded-xl bg-white/10 text-slate-200 hover:bg-white/15 flex items-center justify-between gap-2">
                <span>Visibility Boost</span>
                <span id="scale-badge" class="mono text-[10px] px-1.5 py-0.5 rounded bg-orange-500/30 text-orange-300">ON</span>
            </button>
            <button id="toggle-labels-btn" class="btn-pill px-2.5 py-1.5 rounded-xl bg-white/10 text-slate-200 hover:bg-white/15 flex items-center justify-between gap-2">
                <span>Labels & Trails</span>
                <span id="labels-badge" class="mono text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/30 text-emerald-300">ON</span>
            </button>
        </div>
    </div>

    <!-- Bottom Control Deck -->
    <footer class="fixed bottom-0 left-0 right-0 z-20 p-2.5 sm:p-4 pointer-events-none flex flex-col items-center gap-2">
        
        <!-- Quick Jump Target Presets -->
        <div class="w-full max-w-3xl pointer-events-auto overflow-x-auto no-scrollbar">
            <div class="flex items-center justify-start sm:justify-center gap-1.5 px-1">
                <span class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold mr-1 shrink-0">Jump To:</span>
                <button data-preset="sun" class="preset-btn btn-pill shrink-0 px-3 py-1.5 rounded-full glass-panel hover:border-amber-400/60 text-xs font-medium text-amber-300 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amber-400"></span> Next to Sun
                </button>
                <button data-preset="earth" class="preset-btn btn-pill shrink-0 px-3 py-1.5 rounded-full glass-panel hover:border-sky-400/60 text-xs font-medium text-sky-300 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-sky-400"></span> Next to Earth
                </button>
                <button data-preset="jupiter" class="preset-btn btn-pill shrink-0 px-3 py-1.5 rounded-full glass-panel hover:border-orange-400/60 text-xs font-medium text-orange-300 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-orange-400"></span> Next to Jupiter
                </button>
                <button data-preset="saturn" class="preset-btn btn-pill shrink-0 px-3 py-1.5 rounded-full glass-panel hover:border-yellow-200/60 text-xs font-medium text-yellow-200 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-yellow-200"></span> Next to Saturn
                </button>
                <button data-preset="outer" class="preset-btn btn-pill shrink-0 px-3 py-1.5 rounded-full glass-panel hover:border-indigo-400/60 text-xs font-medium text-indigo-300 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-indigo-400"></span> Outer Rim
                </button>
            </div>
        </div>

        <!-- Sliders & Simulation Playback Controls -->
        <div class="glass-panel rounded-2xl p-3 sm:px-5 sm:py-3.5 w-full max-w-3xl pointer-events-auto grid grid-cols-1 sm:grid-cols-12 gap-3 items-center">
            
            <!-- Black Hole Mass Slider -->
            <div class="sm:col-span-5 flex flex-col gap-1">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-300 font-medium">Black Hole Mass</span>
                    <span id="bh-mass-val" class="mono text-orange-400 font-semibold">15.0 M☉</span>
                </div>
                <input id="bh-mass-slider" type="range" min="1" max="50" step="0.5" value="15">
            </div>

            <!-- Simulation Speed Slider -->
            <div class="sm:col-span-4 flex flex-col gap-1">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-300 font-medium">Time Speed</span>
                    <span id="sim-speed-val" class="mono text-sky-400 font-semibold">1.0x</span>
                </div>
                <input id="sim-speed-slider" type="range" min="0.1" max="3.0" step="0.1" value="1.0">
            </div>

            <!-- Play/Pause & Reset Actions -->
            <div class="sm:col-span-3 flex items-center justify-end gap-2">
                <button id="pause-btn" class="btn-pill flex-1 sm:flex-initial px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-semibold text-white flex items-center justify-center gap-1.5">
                    <span id="pause-icon">⏸</span>
                    <span id="pause-text">Pause</span>
                </button>
                <button id="reset-btn" class="btn-pill flex-1 sm:flex-initial px-3 py-2 rounded-xl bg-rose-500/20 hover:bg-rose-500/35 border border-rose-500/40 text-xs font-semibold text-rose-200 flex items-center justify-center gap-1">
                    <span>↺ Reset</span>
                </button>
            </div>
        </div>
    </footer>

    <script>
        /**
         * ============================================================================
         * ROGUE BLACK HOLE & SOLAR SYSTEM N-BODY WEBGL SIMULATION
         * ============================================================================
         * Architecture:
         * 1. Procedural Texture & Shader Synthesis: Generates realistic surface maps
         *    for the Sun, all 8 planets, Saturn's rings, deep-space starfield, and
         *    a custom GLSL relativistic accretion disk + gravitational lensing shader.
         * 2. N-Body Gravitational Integrator: Velocity Verlet integration with
         *    softened point-mass gravity (G * M1 * M2 / (r^2 + eps^2)). All bodies
         *    interact mutually—the Sun is NOT pinned, so a heavy black hole pulls
         *    the Sun itself while flinging planets into hyperbolic/eccentric orbits!
         * 3. Tidal Disruption & Accretion Stream System: Computes proximity to the
         *    black hole's tidal radius; spawns glowing plasma particles pulled off
         *    nearby stars/planets and spirals them into the black hole's event horizon.
         * 4. Unified Touch & Mouse Raycasting: Projects finger/cursor onto the Y=0
         *    ecliptic plane for 1:1 responsive dragging of the black hole.
         */

        // --- GLOBAL STATE & CONFIGURATION ---
        const state = {
            paused: false,
            timeScale: 1.0,
            bhMassSolar: 15.0,       // In Solar Masses (M_sun)
            interactionMode: 'drag', // 'drag' (default grabs BH easily) or 'camera'
            visibilityBoost: true,   // Enlarges planet radii for clarity while keeping true orbital positions
            showLabelsAndTrails: true,
            isDraggingBH: false,
            bhTargetPos: new THREE.Vector3(68, 0, -42), // Initial approach position
            lastAlertTime: 0,
            accretionBoost: 0        // Extra glow when consuming stellar/planetary plasma
        };

        // Physics Constants (Scaled for smooth real-time 60fps orbital mechanics)
        // 1 AU = 18 scene units. Earth orbital velocity v = sqrt(G * M_sun / r)
        const AU = 18.0;
        const G_CONST = 180.0;       // Gravitational constant in simulation units
        const SUN_MASS = 1.0;        // Normalized to 1.0 Solar Mass
        const SOFTENING_SQ = 1.25;   // Gravitational softening to prevent infinite singularities

        // --- SCENE, CAMERA & RENDERER SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x03050a, 0.0014);

        const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 115, 145);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        container.appendChild(renderer.domElement);

        // OrbitControls for Camera inspection
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxDistance = 420;
        controls.minDistance = 8;
        controls.maxPolarAngle = Math.PI * 0.85;

        // Lighting: Sun point light + subtle galactic ambient light
        const ambientLight = new THREE.AmbientLight(0x222b45, 0.55);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xfff3d6, 2.8, 650, 0.45);
        scene.add(sunLight);

        // --- PROCEDURAL TEXTURE GENERATOR (No external image URLs) ---
        function createPlanetTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            if (type === 'mercury') {
                ctx.fillStyle = '#8c8680';
                ctx.fillRect(0, 0, 512, 256);
                for (let i = 0; i < 450; i++) {
                    const x = Math.random() * 512;
                    const y = Math.random() * 256;
                    const r = Math.random() * 9 + 1;
                    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(60,55,50,0.35)' : 'rgba(175,170,165,0.25)';
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (type === 'venus') {
                const grad = ctx.createLinearGradient(0, 0, 0, 256);
                grad.addColorStop(0, '#c29b61');
                grad.addColorStop(0.5, '#e6be7a');
                grad.addColorStop(1, '#b88b4a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 256);
                for (let i = 0; i < 40; i++) {
                    ctx.fillStyle = 'rgba(255, 240, 200, 0.12)';
                    ctx.fillRect(0, Math.random() * 256, 512, Math.random() * 14 + 3);
                }
            } else if (type === 'earth') {
                // Deep oceans
                ctx.fillStyle = '#0b3d91';
                ctx.fillRect(0, 0, 512, 256);
                // Continents
                ctx.fillStyle = '#2e7d32';
                const continents = [
                    [110, 80, 45, 35], [135, 145, 30, 45], [260, 75, 55, 35],
                    [275, 130, 38, 50], [340, 85, 65, 40], [410, 165, 32, 24]
                ];
                continents.forEach(([cx, cy, rx, ry]) => {
                    for (let j = 0; j < 18; j++) {
                        ctx.fillStyle = j % 3 === 0 ? '#689f38' : '#2e7d32';
                        ctx.beginPath();
                        ctx.ellipse(
                            cx + (Math.random() - 0.5) * rx,
                            cy + (Math.random() - 0.5) * ry,
                            rx * (0.3 + Math.random() * 0.4),
                            ry * (0.3 + Math.random() * 0.4),
                            Math.random() * Math.PI, 0, Math.PI * 2
                        );
                        ctx.fill();
                    }
                });
                // Polar ice caps
                ctx.fillStyle = '#f1f5f9';
                ctx.fillRect(0, 0, 512, 16);
                ctx.fillRect(0, 240, 512, 16);
                // Swirling cloud wisps
                ctx.fillStyle = 'rgba(255,255,255,0.28)';
                for (let i = 0; i < 75; i++) {
                    ctx.beginPath();
                    ctx.ellipse(Math.random() * 512, Math.random() * 256, Math.random() * 35 + 10, 4, 0.1, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (type === 'mars') {
                ctx.fillStyle = '#c1440e';
                ctx.fillRect(0, 0, 512, 256);
                for (let i = 0; i < 120; i++) {
                    ctx.fillStyle = Math.random() > 0.4 ? 'rgba(110, 30, 8, 0.32)' : 'rgba(230, 120, 70, 0.25)';
                    ctx.beginPath();
                    ctx.ellipse(Math.random() * 512, Math.random() * 256, Math.random() * 28 + 6, Math.random() * 14 + 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#f8fafc';
                ctx.fillRect(0, 0, 512, 10);
                ctx.fillRect(0, 246, 512, 10);
            } else if (type === 'jupiter') {
                const bands = ['#8c6d53', '#d9c5b2', '#b5653b', '#e6d7c3', '#9e502c', '#cbb399', '#7d5c43', '#dfd0be'];
                for (let y = 0; y < 256; y += 8) {
                    ctx.fillStyle = bands[(y / 8) % bands.length];
                    ctx.fillRect(0, y, 512, 9);
                }
                // Great Red Spot
                ctx.fillStyle = '#b83b21';
                ctx.beginPath();
                ctx.ellipse(320, 162, 26, 15, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#f3e5d8';
                ctx.lineWidth = 3;
                ctx.stroke();
            } else if (type === 'saturn') {
                const bands = ['#d8c28d', '#ebd9a7', '#c4aa6e', '#f2e4bd', '#b89b5c', '#e3cf9b'];
                for (let y = 0; y < 256; y += 6) {
                    ctx.fillStyle = bands[(y / 6) % bands.length];
                    ctx.fillRect(0, y, 512, 7);
                }
            } else if (type === 'uranus') {
                const grad = ctx.createLinearGradient(0, 0, 0, 256);
                grad.addColorStop(0, '#7de3f4');
                grad.addColorStop(0.5, '#a5f3fc');
                grad.addColorStop(1, '#67e8f9');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 256);
            } else if (type === 'neptune') {
                const grad = ctx.createLinearGradient(0, 0, 0, 256);
                grad.addColorStop(0, '#1e3a8a');
                grad.addColorStop(0.5, '#2563eb');
                grad.addColorStop(1, '#1d4ed8');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 256);
                ctx.fillStyle = 'rgba(147, 197, 253, 0.25)';
                for (let i = 0; i < 18; i++) {
                    ctx.fillRect(0, Math.random() * 256, 512, 4);
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.ClampToEdgeWrapping;
            return tex;
        }

        function createSaturnRingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            for (let x = 0; x < 512; x++) {
                const t = x / 512;
                // Cassini Division gap around t = 0.65
                let alpha = Math.sin(t * Math.PI) * 0.85;
                if (t > 0.62 && t < 0.68) alpha = 0.06;
                if (t < 0.12) alpha *= t / 0.12;
                const shade = 200 + Math.sin(t * 75) * 30;
                ctx.fillStyle = `rgba(${shade}, ${shade - 18}, ${shade - 55}, ${alpha})`;
                ctx.fillRect(x, 0, 1, 32);
            }
            return new THREE.CanvasTexture(canvas);
        }

        // --- DEEP SPACE STARFIELD ---
        function buildStarfield() {
            const starCount = 4500;
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);

            const starPalette = [
                new THREE.Color(0xffffff),
                new THREE.Color(0xffe9c4),
                new THREE.Color(0xcad8ff),
                new THREE.Color(0xffd2a1)
            ];

            for (let i = 0; i < starCount; i++) {
                const r = 450 + Math.random() * 750;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.cos(phi);
                positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

                const col = starPalette[Math.floor(Math.random() * starPalette.length)];
                const brightness = 0.5 + Math.random() * 0.5;
                colors[i * 3] = col.r * brightness;
                colors[i * 3 + 1] = col.g * brightness;
                colors[i * 3 + 2] = col.b * brightness;
            }

            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const mat = new THREE.PointsMaterial({
                size: 1.4,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                sizeAttenuation: true
            });
            scene.add(new THREE.Points(geom, mat));

            // Subtle Ecliptic Reference Grid
            const gridHelper = new THREE.PolarGridHelper(175, 16, 10, 64, 0x1e293b, 0x0f172a);
            gridHelper.position.y = -0.2;
            scene.add(gridHelper);
        }
        buildStarfield();

        // --- PLANETARY DATA & REALISTIC PROPORTIONAL DISTANCES ---
        // Orbital distances use proportional scaling (sqrt/compressed AU so inner rocky planets
        // and outer gas giants fit simultaneously on screen while honoring Kepler's 3rd Law).
        const SOLAR_DATA = [
            { name: 'Sun',     type: 'sun',     dist: 0,    mass: 1.0,        baseR: 1.8, boostR: 3.6, color: '#fbbf24', rotSpeed: 0.008 },
            { name: 'Mercury', type: 'mercury', dist: 9.5,  mass: 1.65e-7,    baseR: 0.25, boostR: 0.65, color: '#a8a29e', rotSpeed: 0.004 },
            { name: 'Venus',   type: 'venus',   dist: 13.5, mass: 2.45e-6,    baseR: 0.42, boostR: 0.95, color: '#fde047', rotSpeed: -0.003 },
            { name: 'Earth',   type: 'earth',   dist: 18.0, mass: 3.00e-6,    baseR: 0.45, boostR: 1.05, color: '#38bdf8', rotSpeed: 0.025 },
            { name: 'Mars',    type: 'mars',    dist: 23.5, mass: 3.20e-7,    baseR: 0.32, boostR: 0.80, color: '#f87171', rotSpeed: 0.024 },
            { name: 'Jupiter', type: 'jupiter', dist: 38.0, mass: 9.54e-4,    baseR: 1.15, boostR: 2.25, color: '#fb923c', rotSpeed: 0.045 },
            { name: 'Saturn',  type: 'saturn',  dist: 54.0, mass: 2.85e-4,    baseR: 0.98, boostR: 1.95, color: '#fef08a', rotSpeed: 0.040, hasRings: true },
            { name: 'Uranus',  type: 'uranus',  dist: 72.0, mass: 4.36e-5,    baseR: 0.68, boostR: 1.45, color: '#67e8f9', rotSpeed: -0.030 },
            { name: 'Neptune', type: 'neptune', dist: 90.0, mass: 5.15e-5,    baseR: 0.66, boostR: 1.40, color: '#60a5fa', rotSpeed: 0.032 }
        ];

        const bodies = [];
        const labelsLayer = document.getElementById('labels-layer');
        const MAX_TRAIL_POINTS = 140;

        // Custom Animated Solar Plasma Shader
        const sunUniforms = {
            uTime: { value: 0 }
        };
        const sunMaterial = new THREE.ShaderMaterial({
            uniforms: sunUniforms,
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = position;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                varying vec3 vNormal;
                varying vec3 vPosition;
                float hash(vec3 p) {
                    p = fract(p * 0.3183099 + 0.1);
                    p *= 17.0;
                    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
                }
                float noise(vec3 x) {
                    vec3 i = floor(x);
                    vec3 f = fract(x);
                    f = f * f * (3.0 - 2.0 * f);
                    return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                                   mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                               mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                                   mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
                }
                void main() {
                    float n = noise(vPosition * 2.2 + vec3(uTime * 0.6)) * 0.6
                            + noise(vPosition * 5.0 - vec3(uTime * 1.1)) * 0.4;
                    vec3 coreColor = vec3(1.0, 0.95, 0.65);
                    vec3 flareColor = vec3(1.0, 0.42, 0.05);
                    vec3 col = mix(flareColor, coreColor, n);
                    float fresnel = pow(1.0 - abs(dot(vNormal, vec3(0.0, 0.0, 1.0))), 2.0);
                    col += vec3(1.0, 0.5, 0.1) * fresnel * 0.75;
                    gl_FragColor = vec4(col * 1.35, 1.0);
                }
            `
        });

        function initSolarSystem() {
            // Clear existing bodies if resetting
            bodies.forEach(b => {
                scene.remove(b.mesh);
                if (b.trailLine) scene.remove(b.trailLine);
                if (b.labelEl) b.labelEl.remove();
            });
            bodies.length = 0;

            SOLAR_DATA.forEach((cfg, idx) => {
                const radius = state.visibilityBoost ? cfg.boostR : cfg.baseR;
                const geom = new THREE.SphereGeometry(1, 36, 36);
                let mat;

                if (cfg.type === 'sun') {
                    mat = sunMaterial;
                } else {
                    mat = new THREE.MeshStandardMaterial({
                        map: createPlanetTexture(cfg.type),
                        roughness: 0.78,
                        metalness: 0.05
                    });
                }

                const mesh = new THREE.Mesh(geom, mat);
                mesh.scale.setScalar(radius);

                // Sun Corona Glow Sprite
                if (cfg.type === 'sun') {
                    const glowCanvas = document.createElement('canvas');
                    glowCanvas.width = 128;
                    glowCanvas.height = 128;
                    const gctx = glowCanvas.getContext('2d');
                    const grad = gctx.createRadialGradient(64, 64, 12, 64, 64, 64);
                    grad.addColorStop(0, 'rgba(255, 220, 130, 0.95)');
                    grad.addColorStop(0.35, 'rgba(255, 140, 30, 0.45)');
                    grad.addColorStop(1, 'rgba(255, 80, 0, 0)');
                    gctx.fillStyle = grad;
                    gctx.fillRect(0, 0, 128, 128);
                    const spriteMat = new THREE.SpriteMaterial({
                        map: new THREE.CanvasTexture(glowCanvas),
                        blending: THREE.AdditiveBlending,
                        transparent: true
                    });
                    const corona = new THREE.Sprite(spriteMat);
                    corona.scale.set(4.6, 4.6, 1);
                    mesh.add(corona);
                }

                // Earth Atmosphere Halo
                if (cfg.type === 'earth') {
                    const atmoGeom = new THREE.SphereGeometry(1.06, 24, 24);
                    const atmoMat = new THREE.MeshBasicMaterial({
                        color: 0x38bdf8,
                        transparent: true,
                        opacity: 0.22,
                        blending: THREE.AdditiveBlending
                    });
                    mesh.add(new THREE.Mesh(atmoGeom, atmoMat));
                }

                // Saturn Ring System
                if (cfg.hasRings) {
                    const ringGeom = new THREE.RingGeometry(1.35, 2.35, 64);
                    // Remap UVs radially
                    const pos = ringGeom.attributes.position;
                    const uv = ringGeom.attributes.uv;
                    for (let i = 0; i < pos.count; i++) {
                        const vx = pos.getX(i);
                        const vy = pos.getY(i);
                        const len = Math.sqrt(vx * vx + vy * vy);
                        uv.setXY(i, (len - 1.35) / 1.0, 0.5);
                    }
                    const ringMat = new THREE.MeshStandardMaterial({
                        map: createSaturnRingTexture(),
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.9,
                        roughness: 0.6
                    });
                    const ringMesh = new THREE.Mesh(ringGeom, ringMat);
                    ringMesh.rotation.x = Math.PI * 0.42;
                    mesh.add(ringMesh);
                }

                // Initial Orbital Position & Keplerian Circular Velocity
                const angle = idx === 0 ? 0 : (idx * 1.15 + Math.random() * 0.4);
                const pos = new THREE.Vector3(
                    Math.cos(angle) * cfg.dist,
                    0,
                    Math.sin(angle) * cfg.dist
                );
                mesh.position.copy(pos);
                scene.add(mesh);

                // Circular orbital speed v = sqrt(G * M_sun / r)
                const speed = cfg.dist > 0 ? Math.sqrt((G_CONST * SUN_MASS) / cfg.dist) : 0;
                const vel = new THREE.Vector3(
                    -Math.sin(angle) * speed,
                    0,
                    Math.cos(angle) * speed
                );

                // Orbital Trail Line
                const trailPositions = new Float32Array(MAX_TRAIL_POINTS * 3);
                for (let k = 0; k < MAX_TRAIL_POINTS; k++) {
                    trailPositions[k * 3] = pos.x;
                    trailPositions[k * 3 + 1] = pos.y;
                    trailPositions[k * 3 + 2] = pos.z;
                }
                const trailGeom = new THREE.BufferGeometry();
                trailGeom.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
                const trailMat = new THREE.LineBasicMaterial({
                    color: cfg.color,
                    transparent: true,
                    opacity: cfg.type === 'sun' ? 0.35 : 0.48
                });
                const trailLine = new THREE.Line(trailGeom, trailMat);
                trailLine.frustumCulled = false;
                scene.add(trailLine);

                // Floating HTML Label
                const labelEl = document.createElement('div');
                labelEl.className = 'planet-label';
                labelEl.textContent = cfg.name;
                labelsLayer.appendChild(labelEl);

                bodies.push({
                    ...cfg,
                    mesh,
                    pos,
                    vel,
                    acc: new THREE.Vector3(),
                    trailLine,
                    trailHistory: Array(MAX_TRAIL_POINTS).fill(null).map(() => pos.clone()),
                    labelEl,
                    ejected: false,
                    consumed: false
                });
            });
        }

        // --- ASTEROID BELT & COMET PARTICLES (React dynamically to Black Hole!) ---
        const ASTEROID_COUNT = 650;
        const asteroidData = [];
        const asteroidGeom = new THREE.BufferGeometry();
        const asteroidPositions = new Float32Array(ASTEROID_COUNT * 3);
        const asteroidColors = new Float32Array(ASTEROID_COUNT * 3);

        function initAsteroids() {
            asteroidData.length = 0;
            for (let i = 0; i < ASTEROID_COUNT; i++) {
                // 80% Main Belt (between Mars 23.5 and Jupiter 38), 20% Outer Kuiper/Comets
                const isKuiper = i > ASTEROID_COUNT * 0.8;
                const r = isKuiper ? (95 + Math.random() * 35) : (27.5 + Math.random() * 6.5);
                const angle = Math.random() * Math.PI * 2;
                const yOffset = (Math.random() - 0.5) * (isKuiper ? 3.5 : 1.1);

                const pos = new THREE.Vector3(Math.cos(angle) * r, yOffset, Math.sin(angle) * r);
                const speed = Math.sqrt((G_CONST * SUN_MASS) / r);
                const vel = new THREE.Vector3(-Math.sin(angle) * speed, 0, Math.cos(angle) * speed);

                asteroidData.push({ pos, vel });
                asteroidPositions[i * 3] = pos.x;
                asteroidPositions[i * 3 + 1] = pos.y;
                asteroidPositions[i * 3 + 2] = pos.z;

                const shade = isKuiper ? 0.75 : 0.55 + Math.random() * 0.3;
                asteroidColors[i * 3] = isKuiper ? 0.65 : shade;
                asteroidColors[i * 3 + 1] = isKuiper ? 0.85 : shade * 0.92;
                asteroidColors[i * 3 + 2] = isKuiper ? 1.0 : shade * 0.85;
            }
            asteroidGeom.setAttribute('position', new THREE.BufferAttribute(asteroidPositions, 3));
            asteroidGeom.setAttribute('color', new THREE.BufferAttribute(asteroidColors, 3));
        }

        initAsteroids();
        const asteroidPoints = new THREE.Points(
            asteroidGeom,
            new THREE.PointsMaterial({ size: 0.42, vertexColors: true, transparent: true, opacity: 0.78 })
        );
        scene.add(asteroidPoints);

        // --- INTERACTIVE ROGUE BLACK HOLE (Event Horizon + Accretion Disk + Lensing Halo) ---
        const blackHoleGroup = new THREE.Group();
        blackHoleGroup.position.copy(state.bhTargetPos);
        scene.add(blackHoleGroup);

        // 1. Pitch-Black Event Horizon Sphere
        const ehGeom = new THREE.SphereGeometry(1, 36, 36);
        const ehMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const eventHorizonMesh = new THREE.Mesh(ehGeom, ehMat);
        blackHoleGroup.add(eventHorizonMesh);

        // 2. Photon Sphere Thin Rim Glow
        const photonGeom = new THREE.RingGeometry(1.02, 1.14, 64);
        const photonMat = new THREE.MeshBasicMaterial({
            color: 0xffedd5,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending
        });
        const photonRing = new THREE.Mesh(photonGeom, photonMat);
        blackHoleGroup.add(photonRing);

        // 3. Relativistic Swirling Accretion Disk Shader
        const diskUniforms = {
            uTime: { value: 0 },
            uBoost: { value: 0 }
        };
        const diskMat = new THREE.ShaderMaterial({
            uniforms: diskUniforms,
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vLocalPos;
                void main() {
                    vUv = uv;
                    vLocalPos = position;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform float uBoost;
                varying vec2 vUv;
                varying vec3 vLocalPos;

                void main() {
                    float r = length(vLocalPos.xy);
                    float angle = atan(vLocalPos.y, vLocalPos.x);
                    
                    // Radial mask between inner ISCO (1.15) and outer disk (4.6)
                    float innerFade = smoothstep(1.12, 1.45, r);
                    float outerFade = 1.0 - smoothstep(2.4, 4.6, r);
                    float mask = innerFade * outerFade;
                    if (mask <= 0.001) discard;

                    // Differential Keplerian spiral arms
                    float spiral1 = sin(angle * 3.0 + r * 4.5 - uTime * 4.5) * 0.5 + 0.5;
                    float spiral2 = sin(angle * 5.0 - r * 7.0 - uTime * 6.2) * 0.5 + 0.5;
                    float turbulence = mix(spiral1, spiral2, 0.45);

                    // Relativistic Doppler beaming (brighter on approaching side)
                    float doppler = 0.78 + 0.35 * cos(angle + 0.6);

                    // Temperature gradient from white-gold inner edge to deep fiery orange outer edge
                    vec3 innerHot = vec3(1.0, 0.96, 0.85);
                    vec3 midGold  = vec3(1.0, 0.52, 0.12);
                    vec3 outerRed = vec3(0.75, 0.14, 0.02);

                    float temp = clamp(1.0 - (r - 1.15) / 3.2, 0.0, 1.0);
                    vec3 col = mix(outerRed, midGold, smoothstep(0.0, 0.6, temp));
                    col = mix(col, innerHot, smoothstep(0.55, 1.0, temp));

                    float intensity = mask * (0.55 + 0.65 * turbulence) * doppler * (1.15 + uBoost);
                    gl_FragColor = vec4(col * intensity, clamp(intensity, 0.0, 0.95));
                }
            `
        });
        const accretionDisk = new THREE.Mesh(new THREE.RingGeometry(1.1, 4.6, 80), diskMat);
        accretionDisk.rotation.x = Math.PI * 0.44;
        accretionDisk.rotation.y = 0.18;
        blackHoleGroup.add(accretionDisk);

        // 4. Gravitational Lensing / Einstein Ring Billboard Halo (Always faces camera)
        const lensingUniforms = {
            uTime: { value: 0 },
            uBoost: { value: 0 }
        };
        const lensingMat = new THREE.ShaderMaterial({
            uniforms: lensingUniforms,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv * 2.0 - 1.0;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform float uBoost;
                varying vec2 vUv;
                void main() {
                    float d = length(vUv);
                    // Sharp Einstein ring distortion right outside shadow radius (~0.34)
                    float ring = exp(-pow((d - 0.35) * 14.0, 2.0));
                    float outerHalo = exp(-d * 3.8) * 0.45;
                    float shimmer = 0.9 + 0.1 * sin(atan(vUv.y, vUv.x) * 4.0 + uTime * 3.0);
                    vec3 col = mix(vec3(1.0, 0.55, 0.18), vec3(0.85, 0.92, 1.0), ring * 0.65);
                    float alpha = (ring * 0.85 + outerHalo) * shimmer * (1.0 + uBoost * 0.6);
                    if (d < 0.28) alpha *= smoothstep(0.22, 0.28, d);
                    gl_FragColor = vec4(col, clamp(alpha, 0.0, 0.95));
                }
            `
        });
        const lensingHalo = new THREE.Mesh(new THREE.PlaneGeometry(7.2, 7.2), lensingMat);
        blackHoleGroup.add(lensingHalo);

        // Invisible Large Hit-Sphere for effortless mobile finger grabbing
        const bhHitMesh = new THREE.Mesh(
            new THREE.SphereGeometry(5.5, 16, 16),
            new THREE.MeshBasicMaterial({ visible: false })
        );
        blackHoleGroup.add(bhHitMesh);

        // Black Hole HTML Label
        const bhLabel = document.createElement('div');
        bhLabel.className = 'planet-label bh-badge';
        bhLabel.textContent = 'Black Hole (15 M☉)';
        labelsLayer.appendChild(bhLabel);

        function updateBlackHoleVisualScale() {
            // Schwarzschild visual scaling proportional to cube-root/sqrt of solar mass
            const scale = 0.65 + Math.pow(state.bhMassSolar / 15.0, 0.45) * 0.85;
            blackHoleGroup.scale.setScalar(scale);
            bhLabel.textContent = `Black Hole (${state.bhMassSolar.toFixed(1)} M☉)`;
        }
        updateBlackHoleVisualScale();

        // --- TIDAL DISRUPTION PLASMA STREAM PARTICLES ---
        const STREAM_COUNT = 260;
        const streamParticles = [];
        const streamGeom = new THREE.BufferGeometry();
        const streamPosArr = new Float32Array(STREAM_COUNT * 3);
        const streamColArr = new Float32Array(STREAM_COUNT * 3);

        for (let i = 0; i < STREAM_COUNT; i++) {
            streamParticles.push({
                active: false,
                pos: new THREE.Vector3(),
                vel: new THREE.Vector3(),
                life: 0,
                color: new THREE.Color(0xffaa33)
            });
            streamPosArr[i * 3 + 1] = -9999;
        }
        streamGeom.setAttribute('position', new THREE.BufferAttribute(streamPosArr, 3));
        streamGeom.setAttribute('color', new THREE.BufferAttribute(streamColArr, 3));
        const streamPoints = new THREE.Points(
            streamGeom,
            new THREE.PointsMaterial({
                size: 0.75,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            })
        );
        streamPoints.frustumCulled = false;
        scene.add(streamPoints);

        let streamCursor = 0;
        function spawnTidalPlasma(sourcePos, bhPos, hexColor) {
            const p = streamParticles[streamCursor];
            streamCursor = (streamCursor + 1) % STREAM_COUNT;

            p.active = true;
            p.life = 1.0;
            // Start near the surface of the disrupted planet/star
            p.pos.copy(sourcePos).add(new THREE.Vector3(
                (Math.random() - 0.5) * 1.4,
                (Math.random() - 0.5) * 0.8,
                (Math.random() - 0.5) * 1.4
            ));

            // Initial velocity directed toward BH with tangential swirl
            const toBH = new THREE.Vector3().subVectors(bhPos, p.pos).normalize();
            const tangent = new THREE.Vector3(-toBH.z, 0, toBH.x);
            p.vel.copy(toBH).multiplyScalar(8 + Math.random() * 6).addScaledVector(tangent, 9.0);
            p.color.set(hexColor).lerp(new THREE.Color(0xffedd5), 0.45);
        }

        // --- TELEMETRY FEED HELPER ---
        const telemetryText = document.getElementById('telemetry-text');
        const telemetryDot = document.getElementById('telemetry-dot');
        function triggerAlert(msg, severity = 'warn') {
            const now = performance.now();
            if (now - state.lastAlertTime < 1400) return;
            state.lastAlertTime = now;
            telemetryText.textContent = msg;
            telemetryDot.className = severity === 'danger'
                ? 'w-2 h-2 rounded-full bg-rose-500 animate-ping'
                : 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
        }

        // --- N-BODY GRAVITATIONAL PHYSICS STEP (Velocity Verlet) ---
        function computeAccelerations() {
            const bhPos = blackHoleGroup.position;
            const bhMass = state.bhMassSolar;

            for (let i = 0; i < bodies.length; i++) {
                const b = bodies[i];
                b.acc.set(0, 0, 0);
                if (b.consumed) continue;

                // 1. Mutual N-Body Gravity from all other Solar System bodies (Sun + Planets)
                for (let j = 0; j < bodies.length; j++) {
                    if (i === j || bodies[j].consumed) continue;
                    const other = bodies[j];
                    const dx = other.pos.x - b.pos.x;
                    const dy = other.pos.y - b.pos.y;
                    const dz = other.pos.z - b.pos.z;
                    const distSq = dx * dx + dy * dy + dz * dz + SOFTENING_SQ;
                    const invDist = 1.0 / Math.sqrt(distSq);
                    const invDist3 = invDist * invDist * invDist;
                    const f = G_CONST * other.mass * invDist3;
                    b.acc.x += dx * f;
                    b.acc.y += dy * f;
                    b.acc.z += dz * f;
                }

                // 2. Gravity from the Rogue Black Hole
                const bx = bhPos.x - b.pos.x;
                const by = bhPos.y - b.pos.y;
                const bz = bhPos.z - b.pos.z;
                const bDistSq = bx * bx + by * by + bz * bz;
                const bDist = Math.sqrt(bDistSq);
                const softenedSq = bDistSq + SOFTENING_SQ * 1.6;
                const invBDist = 1.0 / Math.sqrt(softenedSq);
                const invBDist3 = invBDist * invBDist * invBDist;
                const bf = G_CONST * bhMass * invBDist3;

                b.acc.x += bx * bf;
                b.acc.y += by * bf;
                b.acc.z += bz * bf;

                // 3. Check Tidal Disruption / Roche Limit & Ejection Telemetry
                const tidalRadius = 2.4 + Math.pow(bhMass, 0.38) * 1.45;
                if (bDist < tidalRadius) {
                    // Spaghettification / Tidal Plasma Stripping!
                    state.accretionBoost = Math.min(1.8, state.accretionBoost + 0.08);
                    for (let s = 0; s < 3; s++) {
                        spawnTidalPlasma(b.pos, bhPos, b.color);
                    }
                    // Stretch planet visually toward the Black Hole (tidal bulge)
                    b.mesh.lookAt(bhPos);
                    const stretch = 1.0 + (1.0 - bDist / tidalRadius) * 0.85;
                    const baseScale = state.visibilityBoost ? b.boostR : b.baseR;
                    b.mesh.scale.set(baseScale / Math.sqrt(stretch), baseScale / Math.sqrt(stretch), baseScale * stretch);

                    triggerAlert(`${b.name} inside tidal zone — plasma accreting!`, 'danger');
                } else {
                    // Restore normal spherical scale smoothly
                    const baseScale = state.visibilityBoost ? b.boostR : b.baseR;
                    b.mesh.scale.lerp(new THREE.Vector3(baseScale, baseScale, baseScale), 0.12);

                    if (b.name !== 'Sun' && bDist < tidalRadius * 2.3) {
                        triggerAlert(`${b.name} trajectory severely deflected by gravity!`, 'warn');
                    }
                }

                // Check interstellar ejection (escaped > 165 units with outward velocity)
                if (b.name !== 'Sun' && !b.ejected && b.pos.length() > 165) {
                    b.ejected = true;
                    triggerAlert(`${b.name} ejected into interstellar space!`, 'danger');
                }
            }
        }

        function stepPhysics(dt) {
            // Sub-stepped Velocity Verlet for high orbital accuracy during close flybys
            const subSteps = 4;
            const subDt = dt / subSteps;

            for (let step = 0; step < subSteps; step++) {
                // Half-step velocity & full-step position
                for (let i = 0; i < bodies.length; i++) {
                    const b = bodies[i];
                    if (b.consumed) continue;
                    b.vel.addScaledVector(b.acc, 0.5 * subDt);
                    b.pos.addScaledVector(b.vel, subDt);
                }

                computeAccelerations();

                // Second half-step velocity
                for (let i = 0; i < bodies.length; i++) {
                    const b = bodies[i];
                    if (b.consumed) continue;
                    b.vel.addScaledVector(b.acc, 0.5 * subDt);
                }
            }

            // Update meshes & trails
            for (let i = 0; i < bodies.length; i++) {
                const b = bodies[i];
                b.mesh.position.copy(b.pos);
                b.mesh.rotation.y += b.rotSpeed;

                // Push trail history
                b.trailHistory.pop();
                b.trailHistory.unshift(b.pos.clone());
                const posAttr = b.trailLine.geometry.attributes.position;
                for (let k = 0; k < MAX_TRAIL_POINTS; k++) {
                    const pt = b.trailHistory[k];
                    posAttr.setXYZ(k, pt.x, pt.y, pt.z);
                }
                posAttr.needsUpdate = true;
            }

            // Update Sun light position so lighting stays physically accurate if Sun moves!
            if (bodies[0]) {
                sunLight.position.copy(bodies[0].pos);
            }

            // Update Asteroids & Comets
            const bhPos = blackHoleGroup.position;
            const bhMass = state.bhMassSolar;
            const sunPos = bodies[0] ? bodies[0].pos : new THREE.Vector3();
            const astArr = asteroidGeom.attributes.position.array;

            for (let i = 0; i < ASTEROID_COUNT; i++) {
                const a = asteroidData[i];
                // Sun pull
                const sx = sunPos.x - a.pos.x;
                const sy = sunPos.y - a.pos.y;
                const sz = sunPos.z - a.pos.z;
                const sDistSq = sx * sx + sy * sy + sz * sz + 2.0;
                const sInv3 = 1.0 / Math.pow(sDistSq, 1.5);

                // Black hole pull
                const bx = bhPos.x - a.pos.x;
                const by = bhPos.y - a.pos.y;
                const bz = bhPos.z - a.pos.z;
                const bDistSq = bx * bx + by * by + bz * bz + 2.5;
                const bInv3 = 1.0 / Math.pow(bDistSq, 1.5);

                a.vel.x += (sx * G_CONST * SUN_MASS * sInv3 + bx * G_CONST * bhMass * bInv3) * dt;
                a.vel.y += (sy * G_CONST * SUN_MASS * sInv3 + by * G_CONST * bhMass * bInv3) * dt;
                a.vel.z += (sz * G_CONST * SUN_MASS * sInv3 + bz * G_CONST * bhMass * bInv3) * dt;

                a.pos.addScaledVector(a.vel, dt);
                astArr[i * 3] = a.pos.x;
                astArr[i * 3 + 1] = a.pos.y;
                astArr[i * 3 + 2] = a.pos.z;
            }
            asteroidGeom.attributes.position.needsUpdate = true;

            // Update Tidal Accretion Stream Particles
            const stPos = streamGeom.attributes.position.array;
            const stCol = streamGeom.attributes.color.array;
            for (let i = 0; i < STREAM_COUNT; i++) {
                const p = streamParticles[i];
                if (!p.active) {
                    stPos[i * 3 + 1] = -9999;
                    continue;
                }
                const toBH = new THREE.Vector3().subVectors(bhPos, p.pos);
                const d = toBH.length();
                if (d < 1.1 || p.life <= 0) {
                    p.active = false;
                    stPos[i * 3 + 1] = -9999;
                    continue;
                }
                toBH.normalize();
                const swirl = new THREE.Vector3(-toBH.z, 0, toBH.x);
                p.vel.lerp(toBH.multiplyScalar(24).addScaledVector(swirl, 14), 0.14);
                p.pos.addScaledVector(p.vel, dt * 1.4);
                p.life -= dt * 0.85;

                stPos[i * 3] = p.pos.x;
                stPos[i * 3 + 1] = p.pos.y;
                stPos[i * 3 + 2] = p.pos.z;

                stCol[i * 3] = p.color.r * p.life;
                stCol[i * 3 + 1] = p.color.g * p.life;
                stCol[i * 3 + 2] = p.color.b * p.life;
            }
            streamGeom.attributes.position.needsUpdate = true;
            streamGeom.attributes.color.needsUpdate = true;
        }

        // --- UNIFIED TOUCH & MOUSE RAYCASTING FOR BLACK HOLE DRAGGING ---
        const raycaster = new THREE.Raycaster();
        const pointerNDC = new THREE.Vector2();
        const eclipticPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        const dragOffset = new THREE.Vector3();
        const planeIntersect = new THREE.Vector3();

        function updatePointerNDC(clientX, clientY) {
            const rect = renderer.domElement.getBoundingClientRect();
            pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
        }

        function handlePointerStart(clientX, clientY) {
            updatePointerNDC(clientX, clientY);
            raycaster.setFromCamera(pointerNDC, camera);

            // In 'drag' mode, touching near the black hole OR tapping anywhere on the orbital plane
            // smoothly grabs and moves the black hole under your finger!
            const hitsBH = raycaster.intersectObject(bhHitMesh).length > 0;
            if (state.interactionMode === 'drag' || hitsBH) {
                if (raycaster.ray.intersectPlane(eclipticPlane, planeIntersect)) {
                    state.isDraggingBH = true;
                    controls.enabled = false;
                    if (hitsBH) {
                        dragOffset.subVectors(blackHoleGroup.position, planeIntersect);
                    } else {
                        // Direct finger placement on the orbital plane for effortless mobile control
                        dragOffset.set(0, 0, 0);
                        state.bhTargetPos.copy(planeIntersect);
                    }
                }
            }
        }

        function handlePointerMove(clientX, clientY) {
            if (!state.isDraggingBH) return;
            updatePointerNDC(clientX, clientY);
            raycaster.setFromCamera(pointerNDC, camera);

            if (raycaster.ray.intersectPlane(eclipticPlane, planeIntersect)) {
                state.bhTargetPos.copy(planeIntersect).add(dragOffset);
                // Clamp within reasonable solar system bounds
                state.bhTargetPos.x = THREE.MathUtils.clamp(state.bhTargetPos.x, -155, 155);
                state.bhTargetPos.z = THREE.MathUtils.clamp(state.bhTargetPos.z, -155, 155);
            }
        }

        function handlePointerEnd() {
            if (state.isDraggingBH) {
                state.isDraggingBH = false;
                controls.enabled = (state.interactionMode === 'camera');
            }
        }

        // Mouse Listeners
        const domEl = renderer.domElement;
        domEl.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            handlePointerStart(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => {
            handlePointerMove(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', handlePointerEnd);

        // Touch Listeners (Single finger drags Black Hole; 2 fingers pinch/orbit camera automatically!)
        domEl.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                handlePointerStart(e.touches[0].clientX, e.touches[0].clientY);
            } else {
                // Multi-touch pinch/zoom fallback
                state.isDraggingBH = false;
                controls.enabled = true;
            }
        }, { passive: false });

        domEl.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && state.isDraggingBH) {
                e.preventDefault();
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        domEl.addEventListener('touchend', handlePointerEnd);
        domEl.addEventListener('touchcancel', handlePointerEnd);

        // --- UI CONTROLS & PRESET JUMP HANDLERS ---
        const modeDragBtn = document.getElementById('mode-drag-btn');
        const modeCamBtn = document.getElementById('mode-cam-btn');

        function setInteractionMode(mode) {
            state.interactionMode = mode;
            if (mode === 'drag') {
                controls.enabled = false;
                modeDragBtn.className = 'btn-pill px-3 py-2 rounded-xl text-xs font-medium flex items-center gap-2 bg-orange-500 text-white shadow-lg shadow-orange-500/25';
                modeCamBtn.className = 'btn-pill px-3 py-2 rounded-xl text-xs font-medium flex items-center gap-2 text-slate-300 hover:bg-white/10';
            } else {
                controls.enabled = true;
                modeCamBtn.className = 'btn-pill px-3 py-2 rounded-xl text-xs font-medium flex items-center gap-2 bg-sky-500 text-white shadow-lg shadow-sky-500/25';
                modeDragBtn.className = 'btn-pill px-3 py-2 rounded-xl text-xs font-medium flex items-center gap-2 text-slate-300 hover:bg-white/10';
            }
        }
        setInteractionMode('drag'); // Default to immediate finger/mouse dragging of the Black Hole

        modeDragBtn.addEventListener('click', () => setInteractionMode('drag'));
        modeCamBtn.addEventListener('click', () => setInteractionMode('camera'));

        // Quick Jump Preset Buttons ("Next to Sun", "Next to Earth", "Next to Jupiter", etc.)
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetName = btn.getAttribute('data-preset');
                if (targetName === 'outer') {
                    state.bhTargetPos.set(95, 0, -65);
                    triggerAlert('Black hole positioned in outer Kuiper belt', 'warn');
                    return;
                }
                const targetBody = bodies.find(b => b.type === targetName);
                if (targetBody) {
                    // Place Black Hole right next to the target body (offset slightly ahead/beside its orbit)
                    const radialDir = targetBody.pos.length() > 0.1
                        ? targetBody.pos.clone().normalize()
                        : new THREE.Vector3(1, 0, 0);
                    const offsetDist = targetName === 'sun' ? 7.5 : 4.2;
                    state.bhTargetPos.copy(targetBody.pos).addScaledVector(radialDir, offsetDist);
                    triggerAlert(`Black hole jumped next to ${targetBody.name}!`, 'danger');
                }
            });
        });

        // Black Hole Mass Slider
        const massSlider = document.getElementById('bh-mass-slider');
        const massVal = document.getElementById('bh-mass-val');
        massSlider.addEventListener('input', (e) => {
            state.bhMassSolar = parseFloat(e.target.value);
            massVal.textContent = `${state.bhMassSolar.toFixed(1)} M☉`;
            updateBlackHoleVisualScale();
        });

        // Simulation Speed Slider
        const speedSlider = document.getElementById('sim-speed-slider');
        const speedVal = document.getElementById('sim-speed-val');
        speedSlider.addEventListener('input', (e) => {
            state.timeScale = parseFloat(e.target.value);
            speedVal.textContent = `${state.timeScale.toFixed(1)}x`;
        });

        // Pause / Play Button
        const pauseBtn = document.getElementById('pause-btn');
        const pauseIcon = document.getElementById('pause-icon');
        const pauseText = document.getElementById('pause-text');
        pauseBtn.addEventListener('click', () => {
            state.paused = !state.paused;
            pauseIcon.textContent = state.paused ? '▶' : '⏸';
            pauseText.textContent = state.paused ? 'Resume' : 'Pause';
        });

        // Reset Solar System Button
        document.getElementById('reset-btn').addEventListener('click', () => {
            initSolarSystem();
            initAsteroids();
            state.bhTargetPos.set(68, 0, -42);
            blackHoleGroup.position.copy(state.bhTargetPos);
            state.accretionBoost = 0;
            triggerAlert('Solar System restored to stable Keplerian orbits', 'warn');
        });

        // Visibility Scale Toggle
        const scaleBadge = document.getElementById('scale-badge');
        document.getElementById('toggle-scale-btn').addEventListener('click', () => {
            state.visibilityBoost = !state.visibilityBoost;
            scaleBadge.textContent = state.visibilityBoost ? 'ON' : 'REAL';
            bodies.forEach(b => {
                const r = state.visibilityBoost ? b.boostR : b.baseR;
                b.mesh.scale.setScalar(r);
            });
        });

        // Labels & Trails Toggle
        const labelsBadge = document.getElementById('labels-badge');
        document.getElementById('toggle-labels-btn').addEventListener('click', () => {
            state.showLabelsAndTrails = !state.showLabelsAndTrails;
            labelsBadge.textContent = state.showLabelsAndTrails ? 'ON' : 'OFF';
            labelsLayer.style.opacity = state.showLabelsAndTrails ? '1' : '0';
            bodies.forEach(b => {
                b.trailLine.visible = state.showLabelsAndTrails;
            });
        });

        // --- 2D SCREEN LABEL PROJECTION ---
        const projVec = new THREE.Vector3();
        function updateScreenLabels() {
            if (!state.showLabelsAndTrails) return;
            const w = window.innerWidth;
            const h = window.innerHeight;

            for (let i = 0; i < bodies.length; i++) {
                const b = bodies[i];
                projVec.copy(b.pos);
                projVec.y += (state.visibilityBoost ? b.boostR : b.baseR) + 0.6;
                projVec.project(camera);

                if (projVec.z > 1) {
                    b.labelEl.style.display = 'none';
                } else {
                    b.labelEl.style.display = 'block';
                    const x = (projVec.x * 0.5 + 0.5) * w;
                    const y = (-projVec.y * 0.5 + 0.5) * h;
                    b.labelEl.style.left = `${x}px`;
                    b.labelEl.style.top = `${y}px`;
                }
            }

            // Black Hole Label
            projVec.copy(blackHoleGroup.position);
            projVec.y += 2.6;
            projVec.project(camera);
            if (projVec.z > 1) {
                bhLabel.style.display = 'none';
            } else {
                bhLabel.style.display = 'block';
                bhLabel.style.left = `${(projVec.x * 0.5 + 0.5) * w}px`;
                bhLabel.style.top = `${(-projVec.y * 0.5 + 0.5) * h}px`;
            }
        }

        // --- WINDOW RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- MAIN ANIMATION & PHYSICS LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const rawDt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();

            // Smoothly interpolate Black Hole position toward finger/cursor target
            blackHoleGroup.position.lerp(state.bhTargetPos, 0.24);

            // Keep Gravitational Lensing Einstein Ring facing the camera
            lensingHalo.quaternion.copy(camera.quaternion);
            photonRing.quaternion.copy(camera.quaternion);

            // Decay accretion flare boost smoothly
            state.accretionBoost = Math.max(0, state.accretionBoost - rawDt * 0.65);

            // Update Shaders
            sunUniforms.uTime.value = elapsed;
            diskUniforms.uTime.value = elapsed;
            diskUniforms.uBoost.value = state.accretionBoost;
            lensingUniforms.uTime.value = elapsed;
            lensingUniforms.uBoost.value = state.accretionBoost;

            // Step N-Body Physics
            if (!state.paused) {
                stepPhysics(rawDt * state.timeScale * 1.15);
            }

            controls.update();
            updateScreenLabels();
            renderer.render(scene, camera);
        }

        // Initialize & Start on Window Load
        window.onload = function () {
            initSolarSystem();
            computeAccelerations();
            animate();
        };
    </script>
</body>
</html>
