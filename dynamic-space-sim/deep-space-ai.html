<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Space AI & NASA Live Pipeline</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #111827;
            --card-border: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-cyan: #38bdf8;
            --accent-indigo: #818cf8;
            --glow-color: rgba(56, 189, 248, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container { max-width: 900px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 2rem; }
        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p { color: var(--text-secondary); font-size: 1rem; }

        .control-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label { font-size: 0.875rem; color: var(--text-secondary); font-weight: 500; }

        input[type="password"] {
            background-color: #0b0f19;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus { border-color: var(--accent-cyan); }

        button {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
            color: #030712;
            border: none;
            border-radius: 8px;
            padding: 0.8rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media(min-width: 768px) {
            .results-grid { grid-template-columns: 1fr 1fr; }
        }

        .panel-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .panel-card h3 { color: var(--accent-cyan); font-size: 1.2rem; }

        .nasa-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #0b0f19;
        }

        .loader {
            display: none;
            text-align: center;
            color: var(--accent-cyan);
            font-style: italic;
            padding: 1rem;
        }

        .ai-output {
            white-space: pre-wrap;
            font-size: 0.925rem;
            color: var(--text-secondary);
            background-color: #0b0f19;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            max-height: 350px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Deep Space Live AI Pipeline</h1>
            <p>Pulling raw telemetry data from NASA APIs and running real-time Gemini AI anomaly detection.</p>
        </header>

        <!-- Configuration Panel -->
        <div class="control-panel">
            <div class="input-group">
                <label for="apiKey">Gemini API Key (stored locally in your session only)</label>
                <input type="password" id="apiKey" placeholder="AIzaSy...">
            </div>
            <button onclick="runPipeline()">🚀 Run Deep Space AI Pipeline</button>
        </div>

        <div id="loader" class="loader">🌌 Fetching data from NASA & running Gemini neural pipeline... Please wait...</div>

        <!-- Live Results Section -->
        <div class="results-grid" id="resultsSection" style="display: none;">
            <!-- NASA Input Data -->
            <div class="panel-card">
                <h3>1. Live NASA APOD Feed</h3>
                <div id="nasaContent">
                    <!-- Dynamically populated -->
                </div>
            </div>

            <!-- Gemini Analysis Output -->
            <div class="panel-card">
                <h3>2. Gemini Anomaly & Enhancement AI</h3>
                <div class="ai-output" id="aiOutput">Waiting for pipeline execution...</div>
            </div>
        </div>
    </div>

    <script>
        async function runPipeline() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                alert('Please enter your Gemini API key first!');
                return;
            }

            const loader = document.getElementById('loader');
            const resultsSection = document.getElementById('resultsSection');
            const nasaContent = document.getElementById('nasaContent');
            const aiOutput = document.getElementById('aiOutput');

            loader.style.display = 'block';
            resultsSection.style.display = 'none';

            try {
                // 1. Fetch real live data from NASA API (Using NASA's public APOD API)
                const nasaRes = await fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY');
                const nasaData = await nasaRes.json();

                // Display NASA data
                nasaContent.innerHTML = `
                    <p><strong>Title:</strong> ${nasaData.title}</p>
                    <p><strong>Date:</strong> ${nasaData.date}</p>
                    ${nasaData.media_type === 'image' ? `<img src="${nasaData.url}" class="nasa-img" alt="NASA Image">` : `<p><em>Media type is video/other</em></p>`}
                    <p style="font-size: 0.85rem; color: #9ca3af; margin-top: 0.5rem;">${nasaData.explanation.substring(0, 180)}...</p>
                `;

                // 2. Call Gemini API to perform Deep Space Anomaly & Enhancement Analysis
                const prompt = `You are an elite astrophysicist and computer vision AI engine analyzing space data. 
                Here is today's NASA object data:
                Title: ${nasaData.title}
                Description: ${nasaData.explanation}

                Please perform a simulated automated discovery breakdown:
                1. Super-Resolution & Noise Profile (Identify potential hidden details masked by stellar noise).
                2. Anomaly Detection (What subtle background structures or redshifted phenomena could an AI pipeline flag here?).
                3. Engagement Score & Next Steps for Python automation.`;

                const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                
                const geminiRes = await fetch(geminiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const geminiData = await geminiRes.json();
                
                if (geminiData.candidates && geminiData.candidates[0].content) {
                    aiOutput.textContent = geminiData.candidates[0].content.parts[0].text;
                } else {
                    aiOutput.textContent = "Error: Invalid response structure from Gemini API. Check your API key.";
                }

                loader.style.display = 'none';
                resultsSection.style.display = 'grid';

            } catch (error) {
                loader.style.display = 'none';
                alert('An error occurred during execution: ' + error.message);
            }
        }
    </script>
</body>
</html>
