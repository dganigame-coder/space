<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic NASA 3D Space Coordinate Query Engine</title>
    <style>
        body { margin: 0; background-color: #030712; font-family: 'Inter', sans-serif; overflow: hidden; color: white; }
        
        #control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid #1f2937;
            padding: 1.5rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            width: 320px;
            z-index: 10;
        }

        h2 { font-size: 1rem; margin: 0 0 1rem 0; color: #38bdf8; }
        
        .input-group {
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label { font-size: 0.8rem; color: #9ca3af; }
        
        input {
            width: 90px;
            background: #0b0f19;
            border: 1px solid #374151;
            color: white;
            padding: 0.4rem;
            border-radius: 6px;
            text-align: center;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #030712;
            border: none;
            padding: 0.7rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        button:hover { opacity: 0.9; }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid #1f2937;
            padding: 1.2rem;
            border-radius: 10px;
            pointer-events: none;
            backdrop-filter: blur(8px);
            max-width: 280px;
        }
        #info-panel h3 { font-size: 1rem; margin: 0 0 0.4rem 0; color: #38bdf8; }
        #info-panel p { font-size: 0.8rem; margin: 0; color: #9ca3af; }
        #status { font-size: 0.75rem; color: #34d399; margin-top: 0.5rem; text-align: center; }
    </style>
</head>
<body>

    <div id="info-panel">
        <h3 id="objectTitle">Deep Space Sector</h3>
        <p id="objectDesc">Enter coordinates and query NASA's live TAP database.</p>
    </div>

    <div id="control-panel">
        <h2>🌌 Query Sector Coordinates</h2>
        <div class="input-group">
            <label>RA Min / Max (°):</label>
            <div>
                <input type="number" id="raMin" value="0">
                <input type="number" id="raMax" value="45">
            </div>
        </div>
        <div class="input-group">
            <label>Dec Min / Max (°):</label>
            <div>
                <input type="number" id="decMin" value="-20">
                <input type="number" id="decMax" value="20">
            </div>
        </div>
        <button onclick="fetchNASAQuery()">Fetch & Render 3D</button>
        <div id="status">Ready for query</div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 0, 80);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));

        let starGroup = new THREE.Group();
        scene.add(starGroup);

        // 2. Dynamic Query Function to NASA TAP API
        async function fetchNASAQuery() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = "Connecting to NASA IPAC Archive...";

            const raMin = document.getElementById('raMin').value;
            const raMax = document.getElementById('raMax').value;
            const decMin = document.getElementById('decMin').value;
            const decMax = document.getElementById('decMax').value;

            // Construct ADQL query limiting results to prevent browser overload (e.g., limit 100)
            const query = `select top 100 pl_name, hostname, ra, dec, sy_dist, pl_eqt, st_teff, st_rad from ps where sy_dist is not null and ra between ${raMin} and ${raMax} and dec between ${decMin} and ${decMax} and pl_eqt is not null`;
            
            const url = `https://exoplanetarchive.ipac.caltech.edu/TAP/sync?query=${encodeURIComponent(query)}&format=json`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response failed');
                const rawData = await response.json();

                statusEl.textContent = `Rendered ${rawData.length} planetary objects!`;
                
                // Clear previous render nodes
                while(starGroup.children.length > 0){ 
                    starGroup.remove(starGroup.children[0]); 
                }

                // Parse and map records into 3D space
                rawData.forEach(row => {
                    const name = row.pl_name || "Unknown Planet";
                    const starTemp = parseFloat(row.st_teff || 5778);
                    const distance = parseFloat(row.sy_dist || 10);
                    
                    // Convert celestial spherical coordinates to Cartesian 3D vectors
                    const raRad = THREE.MathUtils.degToRad(parseFloat(row.ra));
                    const decRad = THREE.MathUtils.degToRad(parseFloat(row.dec));

                    const x = distance * Math.cos(decRad) * Math.cos(raRad);
                    const y = distance * Math.cos(decRad) * Math.sin(raRad);
                    const z = distance * Math.sin(decRad);

                    // Assign color based on star temperature
                    let color = "#ffffff";
                    if (starTemp >= 10000) color = "#9bb0ff";
                    else if (starTemp >= 6000) color = "#ffffff";
                    else if (starTemp >= 5200) color = "#fffaed";
                    else if (starTemp >= 3700) color = "#ffcc66";
                    else color = "#ff3300";

                    // Create 3D Mesh representation
                    const geometry = new THREE.SphereGeometry(Math.max(parseFloat(row.st_rad || 1), 0.5) * 0.8, 16, 16);
                    const material = new THREE.MeshBasicMaterial({ color: color });
                    const mesh = new THREE.Mesh(geometry, material);

                    mesh.position.set(x, y, z);
                    mesh.userData = { name: name, host: row.hostname, dist: distance, temp: row.pl_eqt };
                    
                    starGroup.add(mesh);
                });

            } catch (error) {
                statusEl.textContent = "Error fetching data.";
                console.error(error);
            }
        }

        // 3. Animation loop
        function animate() {
            requestAnimationFrame(animate);
            starGroup.rotation.y += 0.0005;
            renderer.render(scene, camera);
        }
        animate();

        // 4. Hover Raycasting for UI details
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(starGroup.children);

            const titleEl = document.getElementById('objectTitle');
            const descEl = document.getElementById('objectDesc');

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                titleEl.textContent = data.name;
                descEl.innerHTML = `Host Star: ${data.host}<br>Distance: ${data.dist} parsecs<br>Eq. Temp: ${data.temp} K`;
            } else {
                titleEl.textContent = "Deep Space Sector";
                descEl.textContent = "Hover over plotted nodes for telemetry details.";
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Run initial query on load
        fetchNASAQuery();
    </script>
</body>
</html>
