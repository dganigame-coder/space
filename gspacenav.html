<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHERIS | 6DOF Mobile Space Navigator</title>
    <style>
        :root { --ui-color: #00f2ff; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; color: var(--ui-color); user-select: none; touch-action: none; }
        canvas { display: block; }

        /* HUD UI */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; padding: 20px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .hud-top { display: flex; justify-content: space-between; font-size: 12px; text-shadow: 0 0 5px var(--ui-color); }
        .hud-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
        #log { max-width: 300px; background: rgba(0,0,0,0.3); padding: 10px; border-left: 2px solid var(--ui-color); }
        
        #crosshair { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 30px; height: 30px; border: 1px solid rgba(0, 242, 255, 0.5); border-radius: 50%;
        }

        /* Mobile Joysticks (Hidden by default, shown via JS) */
        .joystick-base {
            width: 120px; height: 120px; border: 2px solid var(--ui-color);
            border-radius: 50%; background: rgba(0, 242, 255, 0.1);
            position: relative; display: none; pointer-events: auto;
        }
        .joystick-knob {
            width: 40px; height: 40px; background: var(--ui-color);
            border-radius: 50%; position: absolute; top: 40px; left: 40px;
            box-shadow: 0 0 15px var(--ui-color);
        }

        /* Impact FX */
        .impact { animation: shake 0.1s infinite; border: 10px solid rgba(255,0,0,0.4) !important; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-2px, -1px); } 100% { transform: translate(1px, -1px); } }

        /* Welcome Screen */
        #overlay {
            position: fixed; inset: 0; background: #000; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        button { 
            background: transparent; border: 1px solid var(--ui-color); color: var(--ui-color);
            padding: 15px 30px; cursor: pointer; font-size: 18px; margin-top: 20px;
            transition: 0.3s;
        }
        button:hover { background: var(--ui-color); color: #000; }
    </style>
</head>
<body>

<div id="hud">
    <div class="hud-top">
        <div>SYS_STATUS: NOMINAL<br>SECTOR: HAZARD_4</div>
        <div>VEL: <span id="vel-val">0</span> M/S<br>HULL: 100%</div>
    </div>
    
    <div id="crosshair"></div>

    <div class="hud-bottom">
        <div id="log">> STANDBY...</div>
        <div id="mobile-controls" style="display: flex; gap: 100px;">
            <div id="joy-left" class="joystick-base"><div class="joystick-knob"></div></div>
            <div id="joy-right" class="joystick-base"><div class="joystick-knob"></div></div>
        </div>
    </div>
</div>

<div id="overlay">
    <h1>AETHERIS ENGINE V3</h1>
    <p>6DOF DEEP SPACE NAVIGATION PROTOCOL</p>
    <button id="start-btn">INITIALIZE NEURAL LINK</button>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.167.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/"
        }
    }
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// Global Logic
let scene, camera, renderer, composer, clock;
let shipInertia = new THREE.Vector3();
let shipRotation = new THREE.Euler(0, 0, 0, 'YXZ');
let asteroids = [];
let audioCtx, filterNode;
const keys = {};
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
let touchData = { left: { x: 0, y: 0 }, right: { x: 0, y: 0 } };

const CONFIG = {
    accel: isMobile ? 0.08 : 0.04,
    friction: 0.97,
    lookSens: 0.002,
    rollSpeed: 0.03
};

document.getElementById('start-btn').addEventListener('click', init);

async function init() {
    document.getElementById('overlay').style.display = 'none';
    if (isMobile) {
        document.querySelectorAll('.joystick-base').forEach(el => el.style.display = 'block');
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            await DeviceOrientationEvent.requestPermission();
        }
    }

    // Audio
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    setupAudio();

    // Scene Setup
    scene = new THREE.Scene();
    clock = new THREE.Clock();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 5000);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    // World Building
    createStars();
    createCelestialBody();
    spawnAsteroids();
    
    // Post-Process
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.85));

    // Input Listeners
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);
    
    if (isMobile) {
        setupTouch(document.getElementById('joy-left'), 'left');
        setupTouch(document.getElementById('joy-right'), 'right');
        window.addEventListener('deviceorientation', e => {
            if (e.gamma) shipRotation.z = e.gamma * (Math.PI / 180) * 0.4;
        });
    } else {
        window.addEventListener('mousemove', e => {
            if (document.pointerLockElement) {
                shipRotation.y -= e.movementX * CONFIG.lookSens;
                shipRotation.x -= e.movementY * CONFIG.lookSens;
            }
        });
        renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
    }

    animate();
    logHUD("SYSTEM: Drive active. Roll ship via tilt/QE.");
}

function createStars() {
    const starGeo = new THREE.SphereGeometry(1500, 32, 32);
    const starMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: { time: { value: 0 } },
        vertexShader: `varying vec3 vN; void main() { vN = normal; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `varying vec3 vN; void main() { float n = fract(sin(dot(vN, vec3(12.9, 78.2, 45.1))) * 43758.5); float s = pow(n, 60.0); gl_FragColor = vec4(vec3(s), 1.0); }`
    });
    scene.add(new THREE.Mesh(starGeo, starMat));
}

function createCelestialBody() {
    const geo = new THREE.SphereGeometry(100, 64, 64);
    const mat = new THREE.MeshStandardMaterial({ color: 0x110022, emissive: 0x4400ff, emissiveIntensity: 0.2 });
    const planet = new THREE.Mesh(geo, mat);
    planet.position.set(0, 0, -800);
    scene.add(planet);

    const light = new THREE.PointLight(0x00f2ff, 2, 2000);
    light.position.set(0, 0, -700);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x111111));
}

function spawnAsteroids() {
    const geo = new THREE.DodecahedronGeometry(1, 1);
    const mat = new THREE.MeshStandardMaterial({ color: 0x333333, flatShading: true });
    for(let i=0; i<250; i++) {
        const m = new THREE.Mesh(geo, mat);
        m.position.set((Math.random()-0.5)*1200, (Math.random()-0.5)*1200, (Math.random()-0.5)*1200);
        m.scale.setScalar(Math.random()*20 + 2);
        m.rotation.set(Math.random(), Math.random(), 0);
        scene.add(m);
        asteroids.push(m);
    }
}

function setupTouch(el, side) {
    const knob = el.querySelector('.joystick-knob');
    el.addEventListener('touchmove', e => {
        const t = e.touches[0];
        const r = el.getBoundingClientRect();
        const x = (t.clientX - (r.left + 60));
        const y = (t.clientY - (r.top + 60));
        const dist = Math.min(Math.sqrt(x*x + y*y), 50);
        const angle = Math.atan2(y, x);
        const lx = Math.cos(angle) * dist;
        const ly = Math.sin(angle) * dist;
        knob.style.transform = `translate(${lx}px, ${ly}px)`;
        touchData[side].x = lx / 50;
        touchData[side].y = ly / 50;
    });
    el.addEventListener('touchend', () => {
        knob.style.transform = `translate(0, 0)`;
        touchData[side] = { x: 0, y: 0 };
    });
}

function setupAudio() {
    const osc = audioCtx.createOscillator();
    filterNode = audioCtx.createBiquadFilter();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    filterNode.type = 'lowpass';
    gain.gain.value = 0.05;
    osc.connect(filterNode);
    filterNode.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
}

function logHUD(m) { document.getElementById('log').innerText = `> ${m}`; }

function animate() {
    requestAnimationFrame(animate);
    const move = new THREE.Vector3();
    
    // Key Logic
    if (keys['KeyW']) move.z -= 1; if (keys['KeyS']) move.z += 1;
    if (keys['KeyA']) move.x -= 1; if (keys['KeyD']) move.x += 1;
    if (keys['KeyQ']) shipRotation.z += CONFIG.rollSpeed;
    if (keys['KeyE']) shipRotation.z -= CONFIG.rollSpeed;

    // Touch Logic
    if (isMobile) {
        move.z = touchData.left.y; move.x = touchData.left.x;
        shipRotation.y -= touchData.right.x * 0.04;
        shipRotation.x -= touchData.right.y * 0.04;
    }

    move.applyEuler(shipRotation);
    shipInertia.addScaledVector(move, CONFIG.accel);
    shipInertia.multiplyScalar(CONFIG.friction);
    camera.position.add(shipInertia);
    camera.setRotationFromEuler(shipRotation);

    // Collisions
    asteroids.forEach(a => {
        if (camera.position.distanceTo(a.position) < a.scale.x + 2) {
            shipInertia.multiplyScalar(-0.8);
            if(navigator.vibrate) navigator.vibrate(100);
            document.body.classList.add('impact');
            setTimeout(() => document.body.classList.remove('impact'), 200);
        }
    });

    if(filterNode) filterNode.frequency.value = 150 + (shipInertia.length() * 400);
    document.getElementById('vel-val').innerText = (shipInertia.length() * 100).toFixed(1);
    composer.render();
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
