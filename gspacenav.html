<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AETHERIS v7.5 | Voice & Sound Edition</title>
    <style>
        :root { --ui: #00f2ff; --bg: #000; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Consolas', monospace; color: var(--ui); }
        #hud { position: absolute; inset: 0; pointer-events: none; padding: 25px; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; }
        .top-bar { display: flex; gap: 40px; background: rgba(0,15,25,0.7); padding: 15px; border: 1px solid var(--ui); width: fit-content; }
        #ai-sidebar { position: absolute; right: 20px; top: 100px; width: 320px; pointer-events: auto; background: rgba(0,10,15,0.9); border: 1px solid var(--ui); padding: 15px; backdrop-filter: blur(10px); }
        #ai-log { height: 180px; overflow-y: auto; font-size: 12px; margin-bottom: 10px; color: #fff; }
        #ai-input { width: 100%; background: #000; border: 1px solid var(--ui); color: var(--ui); padding: 10px; outline: none; }
        #boot-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #boot-btn { background: none; border: 2px solid var(--ui); color: var(--ui); padding: 25px 80px; font-size: 20px; cursor: pointer; letter-spacing: 10px; transition: 0.3s; }
        #boot-btn:hover { background: var(--ui); color: #000; box-shadow: 0 0 50px var(--ui); }
    </style>
</head>
<body>

<div id="boot-screen">
    <h1 style="letter-spacing: 20px; margin-bottom: 10px;">AETHERIS</h1>
    <p style="margin-bottom: 40px; opacity: 0.6;">NEURAL VOICE & ENGINE AUDIO INITIALIZING...</p>
    <button id="boot-btn">ENGAGE PILOT LINK</button>
</div>

<div id="hud">
    <div class="top-bar">
        <div>VELOCITY: <span id="vel">0</span>c</div>
        <div>ENGINE: <span id="eng-stat" style="color:#0f0">READY</span></div>
    </div>
    <div id="ai-sidebar">
        <div style="font-size: 10px; opacity: 0.5; margin-bottom: 5px;">VOICE_AI_ACTIVE</div>
        <div id="ai-log">AI: Systems online. Click the input to speak.</div>
        <input type="text" id="ai-input" placeholder="Enter neural command...">
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

let scene, camera, renderer, composer, worldGroup = new THREE.Group();
let velocity = new THREE.Vector3(0,0,0), rotation = new THREE.Euler(0,0,0,'YXZ');
let keys = {}, audioCtx, engineOsc, engineGain;

document.getElementById('boot-btn').onclick = () => {
    document.getElementById('boot-screen').style.display = 'none';
    initAudio();
    initGame();
    speak("Pilot link established. Engines at zero percent. Navigation is yours.");
};

function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    engineOsc = audioCtx.createOscillator();
    engineGain = audioCtx.createGain();
    
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.setValueAtTime(40, audioCtx.currentTime); 
    engineGain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    
    engineOsc.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    engineOsc.start();
}

function speak(text) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.pitch = 0.6; // Deep space robotic tone
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
}

function initGame() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    scene.add(worldGroup);

    // ATMOSPHERIC PLANET
    const pGeo = new THREE.SphereGeometry(800, 64, 64);
    const pMat = new THREE.MeshStandardMaterial({ color: 0x0044ff, emissive: 0x001133 });
    const planet = new THREE.Mesh(pGeo, pMat);
    planet.position.set(0, 0, -3000);
    worldGroup.add(planet);

    // GALAXY
    const galPoints = [];
    for(let i=0; i<10000; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * 8000 + 2000;
        galPoints.push(new THREE.Vector3(Math.cos(angle)*radius, (Math.random()-0.5)*1000, Math.sin(angle)*radius));
    }
    const galGeo = new THREE.BufferGeometry().setFromPoints(galPoints);
    const galMat = new THREE.PointsMaterial({ color: 0xaa44ff, size: 3, blending: THREE.AdditiveBlending });
    const galaxy = new THREE.Points(galGeo, galMat);
    galaxy.position.set(-15000, 5000, -25000);
    worldGroup.add(galaxy);

    // BLACK HOLE
    const bh = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 32), new THREE.MeshBasicMaterial({color:0x000000}));
    bh.position.set(10000, -2000, -20000);
    worldGroup.add(bh);

    scene.add(new THREE.AmbientLight(0x222222));
    const sun = new THREE.PointLight(0xffffff, 10, 50000);
    sun.position.set(5000, 5000, 5000);
    scene.add(sun);

    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85));

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    document.getElementById('ai-input').onkeypress = (e) => {
        if(e.key === 'Enter') {
            const cmd = e.target.value;
            e.target.value = "";
            document.getElementById('ai-log').innerText += `\nPILOT: ${cmd}`;
            const response = "Processing " + cmd + ". Navigation remains stable.";
            document.getElementById('ai-log').innerText += `\nAI: ${response}`;
            speak(response);
        }
    };

    animate();
}

function animate() {
    requestAnimationFrame(animate);

    // NEW PHYSICS: Only move if W is pressed
    if(keys['KeyW']) {
        velocity.z -= 0.05; 
        document.getElementById('eng-stat').innerText = "THRUST ACTIVE";
        document.getElementById('eng-stat').style.color = "#0f0";
    } else {
        document.getElementById('eng-stat').innerText = "COASTING";
        document.getElementById('eng-stat').style.color = "#aaa";
    }

    if(keys['KeyS']) velocity.z += 0.05;
    if(keys['KeyA']) rotation.y += 0.02;
    if(keys['KeyD']) rotation.y -= 0.02;
    if(keys['Space']) velocity.multiplyScalar(0.95); // Brake

    // Sound modulation based on speed
    if(engineOsc) {
        const speedFactor = Math.abs(velocity.z);
        engineOsc.frequency.setTargetAtTime(40 + (speedFactor * 10), audioCtx.currentTime, 0.1);
        engineGain.gain.setTargetAtTime(0.02 + (speedFactor * 0.01), audioCtx.currentTime, 0.1);
    }

    camera.setRotationFromEuler(rotation);
    const move = velocity.clone().applyEuler(rotation);
    worldGroup.position.sub(move);

    document.getElementById('vel').innerText = Math.abs(Math.round(velocity.z * 100));
    composer.render();
}
</script>
</body>
</html>
