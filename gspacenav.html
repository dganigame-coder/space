<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AETHERIS v9 | STABLE CORE</title>

<style>
:root { --ui:#00f2ff; }
body { margin:0; overflow:hidden; background:#000; font-family:Consolas; color:var(--ui); }
#boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; background:#000; z-index:10; }
button { padding:20px 60px; border:2px solid var(--ui); background:none; color:var(--ui); cursor:pointer; }
#hud { position:absolute; top:10px; left:10px; z-index:5; }
</style>
</head>

<body>

<div id="boot">
<h1>AETHERIS</h1>
<button id="start">INIT</button>
</div>

<div id="hud">
Velocity: <span id="vel">0</span>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

let scene, camera, renderer, clock;
let velocity = new THREE.Vector3();
let keys = {};

document.getElementById('start').onclick = init;

function init() {

document.getElementById('boot').remove();

try {
renderer = new THREE.WebGLRenderer({ antialias:true });
} catch(e) {
alert("WebGL not supported");
return;
}

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene = new THREE.Scene();
camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000000);
clock = new THREE.Clock();

addLights();
addSkybox();
addPlanet();
addStars();
addBlackHole();
addWormhole();
addAsteroids();

window.addEventListener('keydown', e=>keys[e.code]=true);
window.addEventListener('keyup', e=>keys[e.code]=false);
window.addEventListener('resize', onResize);

animate();
}

function addLights() {
scene.add(new THREE.AmbientLight(0x222244));

const sun = new THREE.PointLight(0xffffff, 5, 100000);
sun.position.set(5000,5000,5000);
scene.add(sun);
}

function addSkybox() {
const loader = new THREE.CubeTextureLoader();
scene.background = loader.load([
'https://threejs.org/examples/textures/cube/space/px.jpg',
'https://threejs.org/examples/textures/cube/space/nx.jpg',
'https://threejs.org/examples/textures/cube/space/py.jpg',
'https://threejs.org/examples/textures/cube/space/ny.jpg',
'https://threejs.org/examples/textures/cube/space/pz.jpg',
'https://threejs.org/examples/textures/cube/space/nz.jpg'
]);
}

function addPlanet() {
const tex = new THREE.TextureLoader();

const planet = new THREE.Mesh(
new THREE.SphereGeometry(1000,64,64),
new THREE.MeshStandardMaterial({
map: tex.load('https://planetpixelemporium.com/images/earthmap1k.jpg'),
roughness:1
})
);
planet.position.z = -4000;
scene.add(planet);
}

function addStars() {
const geo = new THREE.BufferGeometry();
const vertices = [];

for(let i=0;i<20000;i++){
vertices.push(
(Math.random()-0.5)*50000,
(Math.random()-0.5)*50000,
(Math.random()-0.5)*50000
);
}

geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices,3));

const stars = new THREE.Points(geo, new THREE.PointsMaterial({
color:0xffffff,
size:2
}));

scene.add(stars);
}

function addBlackHole() {
const bh = new THREE.Mesh(
new THREE.SphereGeometry(300,64,64),
new THREE.MeshBasicMaterial({color:0x000000})
);
bh.position.set(5000,0,-15000);
scene.add(bh);
}

function addWormhole() {
const worm = new THREE.Mesh(
new THREE.TorusGeometry(600,150,32,100),
new THREE.MeshBasicMaterial({color:0x00ffff, wireframe:true})
);
worm.position.set(-6000,0,-20000);
scene.add(worm);

worm.userData.animate = () => worm.rotation.z += 0.01;
}

function addAsteroids() {
const geo = new THREE.IcosahedronGeometry(50,1);
const mat = new THREE.MeshStandardMaterial({color:0x888888});

for(let i=0;i<200;i++){
const m = new THREE.Mesh(geo,mat);
m.position.set(
(Math.random()-0.5)*20000,
(Math.random()-0.5)*2000,
(Math.random()-0.5)*20000
);
scene.add(m);
}
}

function animate() {
requestAnimationFrame(animate);

if(keys['KeyW']) velocity.z -= 0.2;
if(keys['KeyS']) velocity.z += 0.1;

velocity.multiplyScalar(0.99);
camera.position.add(velocity);

document.getElementById('vel').innerText = Math.abs(velocity.z.toFixed(2));

scene.traverse(o=>{
if(o.userData.animate) o.userData.animate();
});

renderer.render(scene,camera);
}

function onResize() {
camera.aspect = innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
}

</script>
</body>
</html>
