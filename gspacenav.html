<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AETHERIS AI NAV SYSTEM</title>

<style>
body { margin:0; overflow:hidden; background:black; font-family:monospace; color:#0ff; }
#log {
    position:absolute;
    top:10px;
    left:10px;
    width:420px;
    max-height:60vh;
    overflow:auto;
    background:rgba(0,0,0,0.6);
    padding:10px;
    border:1px solid #0ff;
}
#input {
    position:absolute;
    bottom:10px;
    left:10px;
    width:400px;
    padding:10px;
    background:black;
    color:#0ff;
    border:1px solid #0ff;
}
canvas { display:block; }
</style>
</head>

<body>

<div id="log">🚀 AETHERIS BOOTING...</div>
<input id="input" placeholder="Command ship AI..." />

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

// -------------------- UI --------------------
const log = document.getElementById("log");
const input = document.getElementById("input");

function print(t){
    log.innerHTML += "<br>" + t;
    log.scrollTop = log.scrollHeight;
}

// -------------------- AI ENGINE --------------------
let engine = null;
let aiReady = false;

async function initAI(){
    print("🧠 Loading SLM AI...");

    try {
        engine = await webllm.CreateMLCEngine(
            "SmolLM2-360M-Instruct-q4f16_1-MLC",
            {
                initProgressCallback: (p) => {
                    print("AI Loading: " + Math.round(p.progress * 100) + "%");
                }
            }
        );

        aiReady = true;
        print("✅ AI ONLINE");
    } catch(e){
        print("❌ AI failed → fallback mode");
    }
}

// -------------------- FALLBACK AI --------------------
function fakeAI(text){
    if(text.includes("earth")) return "APPROACH EARTH";
    if(text.includes("sun")) return "SCAN SUN";
    if(text.includes("stop")) return "STOP";
    return "MOVE_FORWARD 200";
}

// -------------------- SHIP STATE --------------------
let ship = {
    speed: 0,
    rotation: 0
};

// -------------------- COMMAND EXECUTOR --------------------
function executeCommand(cmd){

    const parts = cmd.trim().split(" ");
    const action = parts[0];

    switch(action){

        case "MOVE_FORWARD":
            ship.speed += Number(parts[1] || 100) * 0.01;
            print("🚀 Moving forward");
            break;

        case "MOVE_BACK":
            ship.speed -= Number(parts[1] || 100) * 0.01;
            print("🔻 Moving back");
            break;

        case "ROTATE_LEFT":
            camera.rotation.y += 0.1;
            break;

        case "ROTATE_RIGHT":
            camera.rotation.y -= 0.1;
            break;

        case "STOP":
            ship.speed *= 0.5;
            print("🛑 Stop engines");
            break;

        case "APPROACH":
            print("🎯 Target locked: " + parts[1]);
            ship.speed = 0.5;
            break;

        case "SCAN":
            print("🔍 Scanning space sector...");
            break;
    }
}

// -------------------- AI REQUEST --------------------
async function askAI(text){

    print("👤 You: " + text);

    let reply;

    if(!aiReady){
        reply = fakeAI(text);
        print("🤖 AI (offline): " + reply);
        executeCommand(reply);
        return;
    }

    const res = await engine.chat.completions.create({
        messages:[
            {
                role:"system",
                content:`
You are AETHERIS NAVIGATION AI.

ONLY respond with commands:

MOVE_FORWARD <num>
MOVE_BACK <num>
ROTATE_LEFT
ROTATE_RIGHT
STOP
SCAN
APPROACH <object>

NO explanations.
                `
            },
            { role:"user", content:text }
        ]
    });

    reply = res.choices[0].message.content;

    print("🤖 AI: " + reply);
    executeCommand(reply);
}

// -------------------- THREE.JS WORLD --------------------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// light
scene.add(new THREE.PointLight(0xffffff, 2));

// textures
const loader = new THREE.TextureLoader();
const tex = (u)=>loader.load(u);

// SUN
const sun = new THREE.Mesh(
    new THREE.SphereGeometry(2000,64,64),
    new THREE.MeshBasicMaterial({
        map: tex("https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Solarsystemscope_texture_2k_sun.jpg/1280px-Solarsystemscope_texture_2k_sun.jpg")
    })
);
scene.add(sun);

// EARTH
const earth = new THREE.Mesh(
    new THREE.SphereGeometry(800,64,64),
    new THREE.MeshStandardMaterial({
        map: tex("https://www.solarsystemscope.com/textures/download/8k_earth_daymap.jpg")
    })
);
earth.position.set(5000,0,0);
scene.add(earth);

// MARS
const mars = new THREE.Mesh(
    new THREE.SphereGeometry(600,64,64),
    new THREE.MeshStandardMaterial({
        map: tex("https://www.solarsystemscope.com/textures/download/8k_mars.jpg")
    })
);
mars.position.set(-4000,0,0);
scene.add(mars);

// GALAXY SKYBOX
const galaxy = new THREE.Mesh(
    new THREE.SphereGeometry(50000,32,32),
    new THREE.MeshBasicMaterial({
        map: tex("https://static.vecteezy.com/system/resources/thumbnails/012/827/025/small_2x/hand-painted-watercolor-cosmic-texture-with-stars-space-starry-night-sky-galaxy-illustration-vector.jpg"),
        side: THREE.BackSide
    })
);
scene.add(galaxy);

// camera
camera.position.z = 9000;

// controls
let keys = {};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

// input
input.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"){
        askAI(input.value);
        input.value="";
    }
});

// AI start
initAI();

// loop
function animate(){
    requestAnimationFrame(animate);

    // manual fallback controls
    if(keys["ArrowLeft"]) camera.rotation.y += 0.01;
    if(keys["ArrowRight"]) camera.rotation.y -= 0.01;
    if(keys["ArrowUp"]) camera.position.z -= 50;
    if(keys["ArrowDown"]) camera.position.z += 50;

    // ship movement from AI
    camera.position.z -= ship.speed * 50;
    ship.speed *= 0.98;

    earth.rotation.y += 0.002;
    mars.rotation.y += 0.003;
    sun.rotation.y += 0.001;

    renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
