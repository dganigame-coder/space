<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AETHERIS v7.0 | Deep Space 4K</title>
    <style>
        :root { --ui: #00f2ff; --bg: #000; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Consolas', monospace; color: var(--ui); }
        #hud { position: absolute; inset: 0; pointer-events: none; padding: 20px; z-index: 10; }
        .top-stats { display: flex; gap: 40px; background: rgba(0,0,0,0.5); padding: 10px; border: 1px solid var(--ui); width: fit-content; }
        #ai-sidebar { position: absolute; right: 20px; top: 100px; width: 300px; pointer-events: auto; background: rgba(0,10,15,0.9); border: 1px solid var(--ui); padding: 15px; }
        #boot-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #boot-btn { background: none; border: 2px solid var(--ui); color: var(--ui); padding: 20px 60px; cursor: pointer; letter-spacing: 5px; }
    </style>
</head>
<body>

<div id="boot-screen">
    <h1>AETHERIS v7.0</h1>
    <p>GENERATING MULTIVERSE ASSETS...</p>
    <button id="boot-btn">ENTER DIMENSION</button>
</div>

<div id="hud">
    <div class="top-stats">
        <div>VEL: <span id="vel">0</span>c</div>
        <div>SCAN: <span id="scan">IDLE</span></div>
    </div>
    <div id="ai-sidebar">
        <div id="ai-log" style="height:150px; overflow-y:auto; font-size:11px;">AI: Awaiting neural sync...</div>
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

let scene, camera, renderer, composer, worldGroup = new THREE.Group();
let velocity = new THREE.Vector3(0,0,0), rotation = new THREE.Euler(0,0,0,'YXZ');
let keys = {};

document.getElementById('boot-btn').onclick = () => {
    document.getElementById('boot-screen').style.display = 'none';
    init();
};

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000000);
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    scene.add(worldGroup);

    // 1. GALAXY GENERATOR (Using Points)
    const points = [];
    for (let i = 0; i < 15000; i++) {
        const r = Math.random() * 5000;
        const a = Math.random() * Math.PI * 2;
        points.push(new THREE.Vector3(Math.cos(a)*r, (Math.random()-0.5)*500, Math.sin(a)*r));
    }
    const galGeo = new THREE.BufferGeometry().setFromPoints(points);
    const galMat = new THREE.PointsMaterial({ color: 0x8844ff, size: 2, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
    const galaxy = new THREE.Points(galGeo, galMat);
    galaxy.position.set(-10000, 2000, -20000);
    worldGroup.add(galaxy);

    // 2. ATMOSPHERIC PLANET
    const pGeo = new THREE.SphereGeometry(1000, 64, 64);
    const pMat = new THREE.MeshStandardMaterial({ color: 0x0044ff, roughness: 0.8 });
    const planet = new THREE.Mesh(pGeo, pMat);
    planet.position.set(0, 0, -5000);
    worldGroup.add(planet);

    // Atmosphere Layer (Rayleigh-ish glow)
    const atmGeo = new THREE.SphereGeometry(1050, 64, 64);
    const atmMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        transparent: true,
        uniforms: { "c": { value: 0.1 }, "p": { value: 4.0 }, glowColor: { value: new THREE.Color(0x00f2ff) }, viewVector: { value: camera.position } },
        vertexShader: `varying float intensity; void main() { vec3 vNormal = normalize( normalMatrix * normal ); gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); intensity = pow( 0.6 - dot( vNormal, vec3( 0, 0, 1.0 ) ), 4.0 ); }`,
        fragmentShader: `uniform vec3 glowColor; varying float intensity; void main() { gl_FragColor = vec4( glowColor, intensity ); }`
    });
    const atmosphere = new THREE.Mesh(atmGeo, atmMat);
    planet.add(atmosphere);

    // 3. BLACK HOLE (Event Horizon)
    const bhGeo = new THREE.SphereGeometry(500, 32, 32);
    const bhMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const blackHole = new THREE.Mesh(bhGeo, bhMat);
    blackHole.position.set(15000, 0, -30000);
    worldGroup.add(blackHole);

    // Accretion Disk
    const diskGeo = new THREE.TorusGeometry(1200, 100, 2, 100);
    const diskMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.5 });
    const disk = new THREE.Mesh(diskGeo, diskMat);
    disk.rotation.x = Math.PI / 2;
    blackHole.add(disk);

    // Lighting & Stars
    scene.add(new THREE.AmbientLight(0x0a0a0a));
    const sun = new THREE.DirectionalLight(0xffffff, 2);
    sun.position.set(5000, 5000, 5000);
    scene.add(sun);

    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85));

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    animate();
}

function animate() {
    requestAnimationFrame(animate);
    if(keys['KeyW']) rotation.x -= 0.01;
    if(keys['KeyS']) rotation.x += 0.01;
    if(keys['KeyA']) rotation.y += 0.01;
    if(keys['KeyD']) rotation.y -= 0.01;
    
    velocity.z -= 0.1; // Thrust
    if(keys['Space']) velocity.multiplyScalar(0.9); // Brake

    camera.setRotationFromEuler(rotation);
    const move = velocity.clone().applyEuler(rotation);
    worldGroup.position.sub(move);

    document.getElementById('vel').innerText = Math.abs(Math.round(velocity.z * 100));
    composer.render();
}
</script>
</body>
</html>
