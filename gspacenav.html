<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AETHERIS v8.0 | Live AI & Voice 4K</title>
    <style>
        :root { --ui: #00f2ff; --bg: #000; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Consolas', monospace; color: var(--ui); }
        #hud { position: absolute; inset: 0; pointer-events: none; padding: 25px; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; }
        .top-bar { display: flex; gap: 40px; background: rgba(0,15,25,0.8); padding: 15px; border: 1px solid var(--ui); width: fit-content; box-shadow: 0 0 15px rgba(0,242,255,0.2); }
        #ai-sidebar { position: absolute; right: 20px; top: 100px; width: 350px; pointer-events: auto; background: rgba(0,10,15,0.95); border: 1px solid var(--ui); padding: 15px; backdrop-filter: blur(15px); transition: 0.5s; }
        #ai-sidebar.minimized { transform: translateX(370px); }
        .toggle-btn { position: absolute; left: -40px; top: -1px; width: 40px; height: 40px; background: var(--ui); color: #000; border: none; cursor: pointer; font-weight: bold; }
        #ai-log { height: 250px; overflow-y: auto; font-size: 12px; margin-bottom: 10px; color: #fff; line-height: 1.5; border-bottom: 1px solid rgba(0,242,255,0.2); padding-bottom: 5px; }
        #ai-input { width: 100%; background: rgba(0,242,255,0.05); border: 1px solid var(--ui); color: var(--ui); padding: 12px; outline: none; box-sizing: border-box; }
        #boot-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #boot-btn { background: none; border: 2px solid var(--ui); color: var(--ui); padding: 25px 80px; font-size: 20px; cursor: pointer; letter-spacing: 10px; transition: 0.3s; }
        #boot-btn:hover { background: var(--ui); color: #000; box-shadow: 0 0 50px var(--ui); }
        .stat-val { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

<div id="boot-screen">
    <h1 style="letter-spacing: 20px; margin-bottom: 10px;">AETHERIS</h1>
    <p style="margin-bottom: 40px; opacity: 0.6;">v8.0 | NEURAL ENGINE INITIALIZING...</p>
    <button id="boot-btn">INITIATE PILOT LINK</button>
</div>

<div id="hud">
    <div class="top-bar">
        <div>VELOCITY: <span id="vel" class="stat-val">0</span>c</div>
        <div>COORDS: <span id="coord" class="stat-val">0, 0</span></div>
        <div>ENGINE: <span id="eng-stat" style="color:#0f0">STANDBY</span></div>
    </div>
    <div id="ai-sidebar">
        <button class="toggle-btn" onclick="document.getElementById('ai-sidebar').classList.toggle('minimized')">AI</button>
        <div style="font-size: 10px; opacity: 0.5; margin-bottom: 8px;">QUANTUM_VOICE_LINK_v8</div>
        <div id="ai-log">AI: Systems standby. Waiting for hardware handshake...</div>
        <input type="text" id="ai-input" placeholder="Type to interact with ship AI..." disabled>
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "@mlc-ai/webllm": "https://esm.run/@mlc-ai/web-llm"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import * as webllm from "@mlc-ai/webllm";

let scene, camera, renderer, composer, worldGroup = new THREE.Group();
let velocity = new THREE.Vector3(0,0,0), rotation = new THREE.Euler(0,0,0,'YXZ');
let keys = {}, engine, audioCtx, engineOsc, engineGain;

// 1. BOOT SEQUENCE
document.getElementById('boot-btn').onclick = async () => {
    document.getElementById('boot-screen').style.display = 'none';
    initAudio();
    initGame();
    initAI(); // Start loading the brain
};

// 2. LIVE VOICE AI (WebLLM)
async function initAI() {
    const log = document.getElementById('ai-log');
    const input = document.getElementById('ai-input');
    
    try {
        // Using SmolLM2-360M: Tiny, fast, and smart for browser use
        engine = await webllm.CreateMLCEngine("SmolLM2-360M-Instruct-q4f16_1-MLC", {
            initProgressCallback: (p) => { 
                log.innerText = `AI: Syncing Brain... ${Math.round(p.progress * 100)}%`; 
            }
        });
        
        log.innerHTML = "AI: <span style='color:#0f0'>NEURAL LINK STABLE.</span> I am ready to answer your questions about Jupiter or the cosmos.";
        input.disabled = false;
        speak("Ship artificial intelligence is now fully operational. All systems are green.");
    } catch (e) {
        log.innerHTML = "AI: <span style='color:orange'>WEBGPU ERROR.</span> Using simulation sub-routines.";
        input.disabled = false;
    }

    input.onkeypress = async (e) => {
        if(e.key === 'Enter' && input.value.trim() !== "") {
            const userMsg = input.value;
            input.value = "";
            log.innerHTML += `<br><br><span style="color:#00f2ff">PILOT:</span> ${userMsg}`;
            log.scrollTop = log.scrollHeight;
            
            if(engine) {
                log.innerHTML += `<br><span id='ai-thinking' style='opacity:0.5'>AI is thinking...</span>`;
                const chat = await engine.chat.completions.create({ 
                    messages: [
                        {role: "system", content: "You are the AETHERIS ship AI. You are knowledgeable, scientific, and concise. Speak clearly as a helpful navigator."},
                        {role: "user", content: userMsg}
                    ] 
                });
                const aiReply = chat.choices[0].message.content;
                document.getElementById('ai-thinking').remove();
                log.innerHTML += `<br><span style="color:#fff">AI:</span> ${aiReply}`;
                speak(aiReply); // PHYSICALLY SPEAKS THE ANSWER
            } else {
                const fallback = "Manual mode active. Processing: " + userMsg;
                log.innerHTML += `<br>AI: ${fallback}`;
                speak(fallback);
            }
            log.scrollTop = log.scrollHeight;
        }
    };
}

// 3. VOICE ENGINE
function speak(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.pitch = 0.7; // Robotic/Deep Space tone
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    }
}

// 4. AUDIO ENGINE (Thrust Hum)
function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    engineOsc = audioCtx.createOscillator();
    engineGain = audioCtx.createGain();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.setValueAtTime(45, audioCtx.currentTime);
    engineGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
    engineOsc.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    engineOsc.start();
}

// 5. 3D RENDER ENGINE (Objects: Planet, Galaxy, Black Hole)
function initGame() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    scene.add(worldGroup);

    // ATMOSPHERIC PLANET (Target for Jupiter)
    const pGeo = new THREE.SphereGeometry(1000, 64, 64);
    const pMat = new THREE.MeshStandardMaterial({ color: 0x0066ff, emissive: 0x001133 });
    const planet = new THREE.Mesh(pGeo, pMat);
    planet.position.set(0, 0, -4000);
    worldGroup.add(planet);

    // GALAXY CORE
    const points = [];
    for(let i=0; i<12000; i++) {
        const r = Math.random() * 8000 + 1000;
        const a = Math.random() * Math.PI * 2;
        points.push(new THREE.Vector3(Math.cos(a)*r, (Math.random()-0.5)*800, Math.sin(a)*r));
    }
    const galGeo = new THREE.BufferGeometry().setFromPoints(points);
    const galaxy = new THREE.Points(galGeo, new THREE.PointsMaterial({color: 0xaa44ff, size: 2, blending: THREE.AdditiveBlending}));
    galaxy.position.set(-10000, 2000, -20000);
    worldGroup.add(galaxy);

    scene.add(new THREE.AmbientLight(0x111122));
    const sun = new THREE.PointLight(0xffffff, 3, 50000);
    sun.position.set(5000, 5000, 2000);
    scene.add(sun);

    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.6, 0.4, 0.85));

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    animate();
}

function animate() {
    requestAnimationFrame(animate);

    // CONTROLS: W=Thrust, S=Reverse, A/D=Rotate, Space=Brake
    if(keys['KeyW']) velocity.z -= 0.08; 
    if(keys['KeyS']) velocity.z += 0.05;
    if(keys['KeyA']) rotation.y += 0.02;
    if(keys['KeyD']) rotation.y -= 0.02;
    if(keys['Space']) velocity.multiplyScalar(0.92);

    // Sound modulation
    if(engineOsc) {
        const s = Math.abs(velocity.z);
        engineOsc.frequency.setTargetAtTime(45 + (s * 15), audioCtx.currentTime, 0.1);
        engineGain.gain.setTargetAtTime(0.01 + (s * 0.015), audioCtx.currentTime, 0.1);
        document.getElementById('eng-stat').innerText = s > 0.1 ? "THRUSTERS ACTIVE" : "COASTING";
    }

    camera.setRotationFromEuler(rotation);
    const move = velocity.clone().applyEuler(rotation);
    worldGroup.position.sub(move);

    document.getElementById('vel').innerText = Math.abs(Math.round(velocity.z * 100));
    document.getElementById('coord').innerText = `${Math.round(worldGroup.position.x)}, ${Math.round(worldGroup.position.z)}`;
    composer.render();
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
