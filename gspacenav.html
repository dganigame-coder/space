<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHERIS v5.2 | Production AI Build</title>
    <style>
        :root { --ui: #00f2ff; --bg: #000; --laser: #ff1144; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; color: var(--ui); touch-action: none; }
        
        #hud { position: absolute; inset: 0; pointer-events: none; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; z-index: 10; }
        .top-bar { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 2px; background: rgba(0,0,0,0.5); padding: 8px; border-bottom: 1px solid rgba(0,242,255,0.2); }
        
        /* AI NEURAL TERMINAL */
        #ai-terminal {
            pointer-events: auto; background: rgba(0, 15, 20, 0.9); border: 1px solid var(--ui);
            padding: 15px; width: 340px; max-width: 85vw; align-self: center; margin-bottom: 20px;
            backdrop-filter: blur(15px); box-shadow: 0 0 40px rgba(0,0,0,1);
        }
        #ai-bar { height: 2px; width: 0%; background: var(--ui); margin-bottom: 10px; transition: width 0.3s; }
        #ai-log { height: 80px; overflow-y: auto; font-size: 12px; line-height: 1.4; color: #fff; margin-bottom: 10px; scrollbar-width: none; }
        #ai-input { background: transparent; border: none; border-bottom: 1px solid var(--ui); color: var(--ui); width: 100%; outline: none; font-size: 14px; padding: 5px 0; }

        .joystick { width: 120px; height: 120px; border: 1px solid rgba(0,242,255,0.3); border-radius: 50%; position: relative; pointer-events: auto; background: radial-gradient(circle, rgba(0,242,255,0.05), transparent); }
        .knob { width: 40px; height: 40px; background: var(--ui); border-radius: 50%; position: absolute; top: 40px; left: 40px; box-shadow: 0 0 20px var(--ui); }
        
        #boot-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #boot-btn { background: transparent; border: 1px solid var(--ui); color: var(--ui); padding: 20px 50px; font-size: 16px; cursor: pointer; letter-spacing: 5px; }
        .v-num { position: absolute; bottom: 10px; right: 10px; font-size: 10px; opacity: 0.5; }
    </style>
</head>
<body>

<div id="boot-screen">
    <h1 style="letter-spacing: 12px;">AETHERIS</h1>
    <button id="boot-btn">INITIALIZE CORE v5.2</button>
    <div class="v-num">BUILD_VER: 5.2.0-STABLE</div>
</div>

<div id="hud">
    <div class="top-bar">
        <div>PROBE_ID: VOID-WLR<br>CORE: <span id="cpu-stat">OK</span></div>
        <div style="text-align: right;">VEL: <span id="vel">0</span>c<br>MEM: <span id="mem">GPU_ACCEL</span></div>
    </div>

    <div id="ai-terminal">
        <div id="ai-bar"></div>
        <div id="ai-log">AI: Awaiting neural synchronization...</div>
        <input type="text" id="ai-input" placeholder="Querying Neural Link..." disabled>
    </div>

    <div style="display:flex; justify-content: space-between; width:100%; pointer-events:none;">
        <div id="joy-l" class="joystick"><div class="knob"></div></div>
        <div id="joy-r" class="joystick"><div class="knob"></div></div>
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.167.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/",
            "@mlc-ai/webllm": "https://esm.run/@mlc-ai/web-llm"
        }
    }
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import * as webllm from "@mlc-ai/webllm";

let scene, camera, renderer, composer, planet, engine;
let vel = new THREE.Vector3(), rot = new THREE.Euler(0,0,0,'YXZ');
let touch = { l: {x:0, y:0}, r: {x:0, y:0} };

document.getElementById('boot-btn').onclick = () => {
    document.getElementById('boot-screen').style.display = 'none';
    init();
};

async function init() {
    // 1. 8K Renderer Setup
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 20000);
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 2. 8K Starfield (Optimized)
    const starGeo = new THREE.SphereGeometry(15000, 32, 32);
    const starMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        vertexShader: `varying vec3 vN; void main() { vN = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `varying vec3 vN; 
            float noise(vec3 p) { return fract(sin(dot(p, vec3(12.9898,78.233,45.164))) * 43758.5453); }
            void main() { float n = noise(vN); gl_FragColor = vec4(vec3(pow(n, 80.0)), 1.0); }`
    });
    scene.add(new THREE.Mesh(starGeo, starMat));

    // 3. Objects
    planet = new THREE.Mesh(new THREE.SphereGeometry(200, 64, 64), new THREE.MeshStandardMaterial({color: 0x00f2ff, roughness: 0.3, metalness: 0.8}));
    planet.position.z = -3000;
    scene.add(planet);
    scene.add(new THREE.DirectionalLight(0xffffff, 2.5));
    scene.add(new THREE.AmbientLight(0x222244));

    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85));

    setupControls();
    initAI();
    animate();
}

async function initAI() {
    const log = document.getElementById('ai-log');
    const bar = document.getElementById('ai-bar');
    try {
        // Updated 2026 Import Logic for Stable WebLLM
        engine = await webllm.CreateMLCEngine("Llama-3.2-1B-Instruct-q4f16_1-MLC", {
            initProgressCallback: (p) => {
                bar.style.width = (p.progress * 100) + "%";
                log.innerText = `AI: Syncing Neural Link... ${Math.round(p.progress * 100)}%`;
            }
        });
        log.innerText = "AI: Connection Stable. Ready for query.";
        document.getElementById('ai-input').disabled = false;
        document.getElementById('ai-input').onkeypress = async (e) => {
            if(e.key === 'Enter') {
                const q = e.target.value; e.target.value = '';
                log.innerText = "AI: Processing...";
                const res = await engine.chat.completions.create({
                    messages: [{role:"system", content:"You are an AI probe in deep space. Be brief."}, {role:"user", content:q}]
                });
                log.innerText = "AI: " + res.choices[0].message.content;
            }
        };
    } catch(err) {
        log.innerText = "AI: WebGPU not detected. AI disabled.";
        console.error(err);
    }
}

function setupControls() {
    const mapJoy = (id, side) => {
        const el = document.getElementById(id);
        el.addEventListener('touchmove', e => {
            const r = el.getBoundingClientRect();
            const x = (e.touches[0].clientX - (r.left + 60)) / 60;
            const y = (e.touches[0].clientY - (r.top + 60)) / 60;
            el.querySelector('.knob').style.transform = `translate(${x*40}px, ${y*40}px)`;
            touch[side] = {x, y};
        });
        el.addEventListener('touchend', () => {
            el.querySelector('.knob').style.transform = '';
            touch[side] = {x:0, y:0};
        });
    };
    mapJoy('joy-l', 'l'); mapJoy('joy-r', 'r');
}

function animate() {
    requestAnimationFrame(animate);
    
    // Constant Laser Force
    vel.z -= 0.15;
    
    // Rotation + Flight
    rot.y -= touch.r.x * 0.04;
    rot.x -= touch.r.y * 0.04;
    
    const forward = vel.clone().applyEuler(rot);
    camera.position.add(forward);
    camera.setRotationFromEuler(rot);

    // Orbiting target
    const t = Date.now() * 0.0005;
    planet.position.x = Math.sin(t) * 2000;
    planet.position.z = Math.cos(t) * 2000 - 3000;

    document.getElementById('vel').innerText = Math.abs(Math.round(vel.z * 100));
    composer.render();
}
</script>
</body>
</html>
