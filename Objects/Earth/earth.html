<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NASA Earth Engine</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>

<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>

<script>
// =====================
// DEVICE ADAPTIVE MODE
// =====================
const isMobile = /Mobi|Android/i.test(navigator.userAgent);

// =====================
// SCENE SETUP
// =====================
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.z = 3.2;

const renderer = new THREE.WebGLRenderer({
  antialias: !isMobile,
  alpha: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.2 : 2));
document.body.appendChild(renderer.domElement);

// =====================
// SUN DIRECTION (ORBITING)
// =====================
const sunDirection = new THREE.Vector3();

// =====================
// TEXTURES
// =====================
const loader = new THREE.TextureLoader();

const dayMap = loader.load("https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg");
const nightMap = loader.load("https://assets.science.nasa.gov/content/dam/science/esd/eo/images/imagerecords/144000/144898/BlackMarble_2016_01deg.jpg");
const cloudMap = loader.load("https://www.shadedrelief.com/natural3/images/earth_clouds.jpg");

// =====================
// EARTH SHADER (NASA STYLE)
// =====================
const earthMat = new THREE.ShaderMaterial({
  uniforms: {
    dayMap: { value: dayMap },
    nightMap: { value: nightMap },
    sunDir: { value: sunDirection }
  },

  vertexShader: `
    varying vec2 vUv;
    varying vec3 vNormal;

    void main() {
      vUv = uv;
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,

  fragmentShader: `
    uniform sampler2D dayMap;
    uniform sampler2D nightMap;
    uniform vec3 sunDir;

    varying vec2 vUv;
    varying vec3 vNormal;

    void main() {

      vec3 day = texture2D(dayMap, vUv).rgb;
      vec3 night = texture2D(nightMap, vUv).rgb;

      float light = dot(vNormal, sunDir);

      float dayFactor = smoothstep(-0.1, 0.35, light);
      float nightFactor = 1.0 - dayFactor;

      // 🌍 Earth lighting blend
      vec3 color = day * dayFactor + night * nightFactor * 1.25;

      gl_FragColor = vec4(color, 1.0);
    }
  `
});

// =====================
// EARTH MESH
// =====================
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(1, isMobile ? 64 : 128, isMobile ? 64 : 128),
  earthMat
);
scene.add(earth);

// =====================
// CLOUD LAYER
// =====================
const clouds = new THREE.Mesh(
  new THREE.SphereGeometry(1.01, isMobile ? 64 : 128, isMobile ? 64 : 128),
  new THREE.MeshPhongMaterial({
    map: cloudMap,
    transparent: true,
    opacity: 0.35,
    depthWrite: false
  })
);
scene.add(clouds);

// =====================
// ATMOSPHERE (NASA glow)
// =====================
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.15, 128, 128),
  new THREE.MeshBasicMaterial({
    color: 0x4aa3ff,
    transparent: true,
    opacity: 0.12,
    side: THREE.BackSide
  })
);
scene.add(atmosphere);

// =====================
// LIGHT (SUN)
// =====================
const light = new THREE.DirectionalLight(0xffffff, 1.4);
scene.add(light);

// =====================
// STARS
// =====================
function addStars() {
  const geo = new THREE.BufferGeometry();
  const count = isMobile ? 2000 : 6000;

  const pos = [];
  for (let i = 0; i < count; i++) {
    pos.push((Math.random() - 0.5) * 300);
    pos.push((Math.random() - 0.5) * 300);
    pos.push((Math.random() - 0.5) * 300);
  }

  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));

  const stars = new THREE.Points(
    geo,
    new THREE.PointsMaterial({ color: 0xffffff, size: isMobile ? 0.5 : 0.7 })
  );

  scene.add(stars);
}
addStars();

// =====================
// TOUCH / DRAG CONTROL
// =====================
let dragging = false;
let lastX = 0;

renderer.domElement.addEventListener("pointerdown", (e) => {
  dragging = true;
  lastX = e.clientX;
});

renderer.domElement.addEventListener("pointerup", () => dragging = false);

renderer.domElement.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;

  earth.rotation.y += dx * 0.005;
  clouds.rotation.y += dx * 0.006;

  lastX = e.clientX;
});

// =====================
// ANIMATION LOOP
// =====================
let t = 0;

function animate() {
  requestAnimationFrame(animate);

  t += 0.001;

  // 🌞 moving sun (simulates orbit)
  sunDirection.set(
    Math.sin(t) * 5,
    1.5,
    Math.cos(t) * 5
  ).normalize();

  earthMat.uniforms.sunDir.value = sunDirection;

  light.position.copy(sunDirection);

  // 🌍 auto rotation
  if (!dragging) {
    earth.rotation.y += 0.0012;
    clouds.rotation.y += 0.0016;
  }

  renderer.render(scene, camera);
}

animate();

// =====================
// RESIZE
// =====================
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
