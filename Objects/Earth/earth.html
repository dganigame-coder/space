<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Professional Earth</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; }
</style>
</head>
<body>

<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.z = 3;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// 🌞 Sun direction (fixed)
const sunDirection = new THREE.Vector3(5, 0, 5).normalize();

// Textures
const loader = new THREE.TextureLoader();

const dayTex = loader.load("https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg");
const nightTex = loader.load("https://assets.science.nasa.gov/content/dam/science/esd/eo/images/imagerecords/144000/144898/BlackMarble_2016_01deg.jpg");
const cloudTex = loader.load("https://www.shadedrelief.com/natural3/images/earth_clouds.jpg");

// 🌍 EARTH SHADER MATERIAL (day/night blend)
const earthMaterial = new THREE.ShaderMaterial({
  uniforms: {
    dayMap: { value: dayTex },
    nightMap: { value: nightTex },
    sunDirection: { value: sunDirection }
  },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vWorldPosition;

    void main() {
      vUv = uv;
      vNormal = normalize(normalMatrix * normal);

      vec4 worldPos = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPos.xyz;

      gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
  `,
  fragmentShader: `
    uniform sampler2D dayMap;
    uniform sampler2D nightMap;
    uniform vec3 sunDirection;

    varying vec2 vUv;
    varying vec3 vNormal;

    void main() {

      vec3 dayColor = texture2D(dayMap, vUv).rgb;
      vec3 nightColor = texture2D(nightMap, vUv).rgb;

      float light = dot(vNormal, sunDirection);

      float dayFactor = smoothstep(-0.1, 0.3, light);
      float nightFactor = 1.0 - dayFactor;

      vec3 color = dayColor * dayFactor + nightColor * nightFactor * 1.2;

      gl_FragColor = vec4(color, 1.0);
    }
  `
});

// 🌍 Earth mesh
const earthGeo = new THREE.SphereGeometry(1, 128, 128);
const earth = new THREE.Mesh(earthGeo, earthMaterial);
scene.add(earth);

// ☁️ Clouds
const cloudMat = new THREE.MeshPhongMaterial({
  map: cloudTex,
  transparent: true,
  opacity: 0.35,
  depthWrite: false
});

const clouds = new THREE.Mesh(
  new THREE.SphereGeometry(1.01, 128, 128),
  cloudMat
);
scene.add(clouds);

// 🌫️ Atmosphere glow (fake Rayleigh)
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.15, 128, 128),
  new THREE.MeshBasicMaterial({
    color: 0x4aa3ff,
    transparent: true,
    opacity: 0.15,
    side: THREE.BackSide
  })
);
scene.add(atmosphere);

// 💡 Key light (sun feel)
const light = new THREE.DirectionalLight(0xffffff, 1.2);
light.position.copy(sunDirection);
scene.add(light);

// 🌌 Stars
function addStars() {
  const geo = new THREE.BufferGeometry();
  const count = 6000;
  const pos = [];

  for (let i = 0; i < count; i++) {
    pos.push((Math.random() - 0.5) * 250);
    pos.push((Math.random() - 0.5) * 250);
    pos.push((Math.random() - 0.5) * 250);
  }

  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));

  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6 });
  const stars = new THREE.Points(geo, mat);
  scene.add(stars);
}
addStars();

// 🎬 Animation
function animate() {
  requestAnimationFrame(animate);

  earth.rotation.y += 0.0012;
  clouds.rotation.y += 0.0018;

  renderer.render(scene, camera);
}

animate();

// resize
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
