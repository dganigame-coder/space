<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NASA Physical Earth Engine</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>

<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.158.0/examples/js/controls/OrbitControls.js"></script>

<script>
const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.z = 3.2;

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);

// Controls (fixes up/down rotation issue)
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 2;
controls.maxDistance = 6;

// Textures
const loader = new THREE.TextureLoader();

const dayMap = loader.load("https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg");
const nightMap = loader.load("https://assets.science.nasa.gov/content/dam/science/esd/eo/images/imagerecords/144000/144898/BlackMarble_2016_01deg.jpg");
const cloudMap = loader.load("https://www.shadedrelief.com/natural3/images/earth_clouds.jpg");

// ☀️ SUN DIRECTION (physical model)
const sunDir = new THREE.Vector3(5, 2, 5).normalize();

// 🌍 EARTH SHADER (PHYSICALLY CORRECT)
const earthMat = new THREE.ShaderMaterial({
  uniforms: {
    dayMap: { value: dayMap },
    nightMap: { value: nightMap },
    sunDir: { value: sunDir }
  },

  vertexShader: `
    varying vec2 vUv;
    varying vec3 vNormal;

    void main() {
      vUv = uv;
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,

  fragmentShader: `
    uniform sampler2D dayMap;
    uniform sampler2D nightMap;
    uniform vec3 sunDir;

    varying vec2 vUv;
    varying vec3 vNormal;

    void main() {

      vec3 day = texture2D(dayMap, vUv).rgb;
      vec3 night = texture2D(nightMap, vUv).rgb;

      // ☀️ PHYSICS CORE
      float light = dot(normalize(vNormal), normalize(sunDir));

      // 🌍 smooth terminator
      float dayFactor = smoothstep(-0.1, 0.35, light);

      // 🌃 blend
      vec3 color = mix(night * 1.2, day, dayFactor);

      gl_FragColor = vec4(color, 1.0);
    }
  `
});

// 🌍 Earth
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 64),
  earthMat
);
scene.add(earth);

// ☁️ Clouds
const clouds = new THREE.Mesh(
  new THREE.SphereGeometry(1.01, 64, 64),
  new THREE.MeshPhongMaterial({
    map: cloudMap,
    transparent: true,
    opacity: 0.35,
    depthWrite: false
  })
);
scene.add(clouds);

// 🌫️ Atmosphere glow
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.15, 64, 64),
  new THREE.MeshBasicMaterial({
    color: 0x4aa3ff,
    transparent: true,
    opacity: 0.12,
    side: THREE.BackSide
  })
);
scene.add(atmosphere);

// 💡 Light (visual support)
const light = new THREE.DirectionalLight(0xffffff, 1.2);
scene.add(light);

// 🌌 Stars
function addStars() {
  const geo = new THREE.BufferGeometry();
  const pos = [];

  for (let i = 0; i < 4000; i++) {
    pos.push((Math.random() - 0.5) * 250);
    pos.push((Math.random() - 0.5) * 250);
    pos.push((Math.random() - 0.5) * 250);
  }

  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));

  const stars = new THREE.Points(
    geo,
    new THREE.PointsMaterial({ color: 0xffffff, size: 0.6 })
  );

  scene.add(stars);
}
addStars();

// 🎬 Animation
let t = 0;

function animate() {
  requestAnimationFrame(animate);

  t += 0.001;

  // ☀️ physical sun orbit
  sunDir.set(
    Math.sin(t) * 5,
    2,
    Math.cos(t) * 5
  ).normalize();

  earthMat.uniforms.sunDir.value = sunDir;

  light.position.copy(sunDir);

  // 🌍 rotation
  earth.rotation.y += 0.0008;
  clouds.rotation.y += 0.0012;

  controls.update();
  renderer.render(scene, camera);
}

animate();

// 📱 resize
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
