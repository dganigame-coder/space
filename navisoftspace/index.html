<style>
    /* Deep Space UI Theme */
    body { 
        margin: 0; 
        background: #000; 
        overflow: hidden; 
        /* Prevents the browser from handling touch (scrolling/zooming) */
        touch-action: none; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        user-select: none; /* Prevents text highlighting while flying */
    }

    #hud { 
        position: fixed; top: 20px; left: 20px; color: #00ffff; z-index: 100; 
        pointer-events: none; border-left: 2px solid #00ffff; padding-left: 15px;
        background: rgba(0, 40, 40, 0.2); backdrop-filter: blur(5px);
    }

    /* Joystick Bases: These should be the "touch zones" */
    .stick-base { 
        position: fixed; bottom: 50px; width: 110px; height: 110px; 
        border: 2px solid rgba(0, 255, 255, 0.2); border-radius: 50%; 
        background: rgba(0, 255, 255, 0.05); 
        z-index: 500; /* Higher than the 3D canvas */
        touch-action: none; /* Critical for mobile */
    }
    
    #left-stick { left: 40px; }
    #right-stick { right: 40px; }

    .knob { 
        position: absolute; width: 40px; height: 40px; background: #00ffff; 
        border-radius: 50%; top: 35px; left: 35px; box-shadow: 0 0 20px #00ffff; 
        opacity: 0.8; 
        transition: transform 0.1s ease-out;
        pointer-events: none; /* The knob itself shouldn't block the base */
    }

    #surface-intel {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(0, 10, 20, 0.9); border: 1px solid #0ff; color: white;
        padding: 20px; text-align: center; display: none; z-index: 600;
    }

    #overlay { 
        position: fixed; inset: 0; background: radial-gradient(circle, #111, #000); 
        z-index: 1000; display: flex; flex-direction: column; justify-content: center; 
        align-items: center; cursor: pointer; color: white; 
    }
    
    .btn-exit { margin-top: 15px; background: none; border: 1px solid #0ff; color: #0ff; padding: 5px 10px; cursor: pointer; }
    
    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
    }

    #planet-hud {
        position: fixed;
        top: 20%;
        left: 20px;
        color: #00f2ff;
        font-family: 'Courier New', Courier, monospace;
        font-size: 24px;
        text-shadow: 0 0 10px #00f2ff;
        pointer-events: none; /* So it doesn't block clicks */
        display: none; /* Hidden by default */
        z-index: 100;
    }
#autopilot-btn {
    position: fixed;
    bottom: 30px;      /* Distance from the bottom */
    left: 50%;         /* Move to horizontal center */
    transform: translateX(-50%); /* Center it perfectly */

    border: 1px solid rgba(0, 204, 255, 0.3);

    border-right: 4px solid #00ccff;

    box-shadow: 0 0 15px rgba(0, 204, 255, 0.2);
    
    cursor: pointer;
    transition: all 0.3s ease;
    user-select: none;
    z-index: 1000;
}

/* Add a pulsing effect when Autopilot is ACTIVE */

    border-right-color: #ffcc00;

<script>
    const debugBox = document.getElementById('mobile-debug');

    function toggleDebug() {
        const isHidden = debugBox.style.display === 'none' || debugBox.style.display === '';
        debugBox.style.display = isHidden ? 'block' : 'none';
    }

    const btn = document.createElement('button');
    btn.id = 'debug-toggle';
    btn.innerText = '🛠️ LOGS';
    btn.onclick = toggleDebug;
    document.body.appendChild(btn);

    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'l') toggleDebug();
    });

    function logToScreen(msg, isError = false) {
        const line = document.createElement('div');
        line.style.color = isError ? "#ff4444" : "#00ff00";
        line.style.borderBottom = "1px solid #222";
        line.style.padding = "2px 0";
        line.innerText = `> ${msg}`;
        debugBox.appendChild(line);
        debugBox.scrollTop = debugBox.scrollHeight;
    }

    window.onerror = (msg, url, line) => logToScreen(`${msg} (Line: ${line})`, true);
    window.onunhandledrejection = (event) => logToScreen(`Promise Error: ${event.reason}`, true);

    const oldLog = console.log;
    console.log = function(...args) {
        const message = args.map(arg => 
            typeof arg === 'object' ? JSON.stringify(arg) : arg
        ).join(' ');
        logToScreen(message);
        //oldLog.apply(console, args);
    };
</script>

<script type="module">
    window.blockShipControls = false;
    function setupCockpitButton(id, callback) {
        const targetBtn = document.getElementById(id);
        if (!targetBtn) return;

        targetBtn.addEventListener('touchstart', (e) => {
            window.blockShipControls = true; 
            e.stopPropagation(); 
            
            if (typeof navigator !== 'undefined' && 'vibrate' in navigator) {
                navigator.vibrate(12); 
            }
        }, { passive: true });

        targetBtn.addEventListener('touchend', (e) => {
            e.stopPropagation();
            e.preventDefault(); 
            if(SaveSystem) callback(targetBtn);
            
            setTimeout(() => {
                window.blockShipControls = false; 
            }, 120);
        }, { passive: false });

        targetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if(SaveSystem) callback(targetBtn);
        });
    }

    // Bind Log Position
    setupCockpitButton('saveBtn', (buttonEl) => {
        if (typeof engine !== 'undefined' && engine.camera) {
            SaveSystem.save(engine.camera, velocity || 0); 
        } else {
            console.log("Cannot log position: Engine instance not ready yet.");
        }
        
        buttonEl.innerText = "LOCKED";
        buttonEl.style.color = "#00ff00";
        buttonEl.style.borderColor = "#00ff00";
        
        setTimeout(() => {
            buttonEl.innerText = "LOG POSITION";
            buttonEl.style.color = "#00ffff";
            buttonEl.style.borderColor = "#00ffff";
        }, 2000);
    });

    // Bind Abort Mission
    setupCockpitButton('resetBtn', () => {
        SaveSystem.clear();
    });
</script>

                if (dist < minDistance) {
                    minDistance = dist;
                    closestBody = b;
                }
            });
            
            // 🔍 LOG 4: Output the final winner of the closest calculation loop
            if (closestBody) {
                console.log(`🎯 [Result] Closest body is officially: "${closestBody.name || 'Unnamed'}" at distance: ${Math.round(minDistance)}`);
            }
            // 3. AUTO-PILOT LOGIC (RUNS EVERY FRAME)
            if (autoPilotActive && closestBody) {
                engine.camera.lookAt(closestBody.position);
                engine.camera.translateZ(-2000);

                const planetRadius = closestBody.userData.r || 500;
                if (minDistance < planetRadius + 1200) {
                    autoPilotActive = false;
                    apBtn.style.borderColor = "#00ccff";
                    apBtn.style.backgroundColor = "rgba(0, 0, 0, 0.7)";
                    apBtn.style.color = "#00ccff";
                    if (apStatusText) apStatusText.innerText = "OFF";
                }
            }

            // 4. PHYSICS & MOVEMENT
            checkCollisions(engine.camera, bodies, engine.scene);
            updateFlight(engine.camera, bodies);

            if (mainBelt) {
                mainBelt.rotation.y += 0.0001;
                mainBelt.updateMatrix(); // Add this line!
            }
            
            if (kuiperBelt) {
                kuiperBelt.rotation.y += 0.00002;
                kuiperBelt.updateMatrix(); // Add this line!
            }
            
            if (oortCloud) {
                oortCloud.rotation.y += 0.000005; 
                oortCloud.updateMatrix(); // Add this line!
            }

            // in case createBelt defaults it to the solar system center (0,0,0)
            // Add this alongside your other belt rotation if statements!
            if (sharedBelt) {
                sharedBelt.rotation.y += 0.00001; // Nice slow cosmic drift
                sharedBelt.updateMatrix(); 
            }
  

            // 6. HUD VISUALS - NEAREST BODY
            if (closestBody && nearestLabel) {
                const auDist = (minDistance / 60000).toFixed(2);
                const name = closestBody.userData.name;
                const planetRadius = closestBody.userData.r || 500;

                nearestLabel.innerText = `NEAREST: ${name} (${auDist} AU)`;
                
                if (autoPilotActive) {
                    nearestLabel.innerText += " [WARP ACTIVE]";
                    nearestLabel.style.color = "#00ffff"; 
                } else if (minDistance < planetRadius + 1000) {
                    nearestLabel.style.color = "#ff5555"; 
                } else {
                    nearestLabel.style.color = "#55ff55"; 
                }
            }

            // 7. HORIZON OBJECT DISPLAY
            const shipPos = engine.camera.position;
            const shipDist = shipPos.length();
            const horizonObjElement = document.getElementById('horizon-object-display');
        
            // Optimized HUD update
            const distToVoyager = engine.camera.position.distanceTo(voyager.position);
            
            if (shipDist >= 15000 && shipDist <= 30000) {
                horizonObjElement.innerText = ">> PASSING: MAIN ASTEROID BELT";
            } 
            else if (shipDist >= 2000000 && shipDist <= 3500000) {
                horizonObjElement.innerText = ">> PASSING: KUIPER BELT";
            } 
            // NEW: Heliopause Boundary (approx 120 AU)
            else if (Math.abs(shipDist - 18000000) < 200000) {
                horizonObjElement.innerText = ">> PASSING: HELIOPAUSE BOUNDARY";
                horizonObjElement.style.color = "#bb00ff"; // Optional: Purple tint for plasma
            }
            // NEW: Voyager 1 Encounter (approx 160 AU)
            else if (distToVoyager < 50000) {
                horizonObjElement.innerText = ">> SIGNAL DETECTED: VOYAGER 1";
                horizonObjElement.style.color = "#ffd700"; // Optional: Gold tint for the probe
            }
            else if (shipDist >= 60000000 && shipDist <= 85000000) {
                // Reset color if you used the tints above
                horizonObjElement.style.color = "#00ccff"; 
                horizonObjElement.innerText = ">> PASSING: OORT CLOUD";
            } 
                /*
            else if (shipDist > 85000000) {
                horizonObjElement.innerText = ">> STATUS: INTERSTELLAR SPACE";
            }
            else {
                horizonObjElement.style.color = "#00ccff";
                horizonObjElement.innerText = ""; 
            }
              */

            if (blackHole) {
                const time = Date.now();
                const dist = engine.camera.position.distanceTo(blackHole.position);
            
                // --- 1. HYPER-REALISTIC VISUAL ANIMATION ---
                blackHole.children.forEach((child, index) => {
                    // A. Mesh Rotation (The physical movement of the rings)
                    if (child.name === "mainDisk") child.rotation.z += 0.02;
                    if (child.name === "halo") child.rotation.z -= 0.01;
                    
                    // Handle both "glowLayer" and "glowRing" naming conventions
                    if (child.name && (child.name.includes("glowLayer") || child.name.includes("glowRing"))) {
                        child.rotation.z += 0.005 + (index * 0.002);
                        
                        // B. Subtle Pulsing (Atmospheric shimmer)
                        if (child.material) {
                            child.material.opacity = (0.1 + Math.sin(time * 0.001 + index) * 0.1);
                        }
                    }
            
                    // C. THE SECRET SAUCE: Texture Flow
                    // This makes the lava texture look like it's being sucked into the void
                    if (child.material && child.material.map) {
                        child.material.map.offset.x -= 0.005; 
                        child.material.map.offset.y += 0.002;
                    }
                });
            
                // --- 2. DISTANCE & CAMERA ZOOM (The "Cinematic" Perspective) ---
                if (dist < 5000000) { 
                    // Slowly narrow the FOV as you approach to make the hole look massive
                    const zoomFactor = (5000000 / dist); 
                    // As you get closer, FOV drops to 30 (Zoomed in) before the Spaghettification kicks in
                    engine.camera.fov = Math.max(30, 75 - zoomFactor); 
                }
            
                // --- 3. THE TERROR REACTION (Inside 1,000,000 units) ---
                if (dist < 1000000) {
                    // A. HUD Warning
                    horizonObjElement.innerText = ">> WARNING: GRAVITATIONAL WELL DETECTED";
                    horizonObjElement.style.color = "#ff0000";
            
                    // B. Gravitational Pull (Lerp)
                    const pullStrength = (1000000 - dist) * 0.0000001; 
                    engine.camera.position.lerp(blackHole.position, pullStrength);
            
                    // C. Hull Shake (The "Interstellar" Vibration)
                    const shakePower = (1000000 / dist) * 15; 
                    engine.camera.position.x += Math.sin(time * 0.1) * (shakePower / 2);
                    engine.camera.position.y += Math.cos(time * 0.11) * (shakePower / 2);
            
                    // D. Spaghettification (Warping reality)
                    // This overrides the zoom-FOV once you are in the danger zone
                    engine.camera.fov += (1000000 / dist) * 5;
            
                    // E. The Event Horizon
                    if (dist < 100000) {
                        horizonObjElement.innerText = ">> CRITICAL: EVENT HORIZON BREACH";
                        horizonObjElement.style.opacity = (Math.sin(time * 0.02) > 0) ? 1 : 0.3;
                    }
                } else {
                    // Reset FOV smoothly if the player manages to escape the pull
                    if (engine.camera.fov > 75) {
                        engine.camera.fov -= 0.5;
                    } else if (engine.camera.fov < 75) {
                        engine.camera.fov += 0.1;
                    }
                }
                
                // Final check to update the matrix after all FOV changes
                engine.camera.updateProjectionMatrix();
            }
            // 8. DISTANCE CALCULATIONS
            if(sun && sun.position)
            {
                const distanceUnits = engine.camera.position.distanceTo(sun.position);
                const distanceElementKM = document.getElementById('km-val');
                const distanceElementLH = document.getElementById('lh-val');
                const distanceKM = distanceUnits * 2500;
                const distanceMiles = distanceUnits * 1550;
            
                const formattedKM = Math.floor(distanceKM).toLocaleString();
                distanceElementKM.innerText = `${formattedKM}`; 
               
                const lightSeconds = distanceKM / 300000;
                if (lightSeconds > 3600) {
                    const lightHours = (lightSeconds / 3600).toFixed(2);
                    distanceElementLH.innerText = `${lightHours}`;
                } else if (lightSeconds > 60) {
                    const lightMinutes = (lightSeconds / 60).toFixed(2);
                    distanceElementLH.innerText = `${lightMinutes}`;
                }
                                
                 }

            if (exoSystem) {
                    // 1. Orbital Rotation: The planet rotates slowly around the Star
                    // This moves the 'exoplanetPivot' group we created in the JS file
                    const pivot = exoSystem.getObjectByName("exoplanetPivot");
                    if (pivot) {
                        pivot.rotation.y += 0.0002; 
                    }
            
                    // 2. Planetary Rotation: The actual ground spinning
                    const planetBody = exoSystem.getObjectByName("planetBody");
                    if (planetBody) {
                        planetBody.rotation.y += 0.001;
                    }
            
                    // 3. Cloud Drift: Clouds move faster than the ground for a 4K weather effect
                    const clouds = exoSystem.getObjectByName("planetClouds");
                    if (clouds) {
                        clouds.rotation.y += 0.0015;
                        clouds.rotation.z += 0.0002; // Adds a slight tilt to the cloud movement
                    }
                }

            const time = Date.now();
        
            // Update the wormhole's pulse and rotation
            updateWormhole(wormhole, time);

            const distToRemnant = phoenixRemnant.position.distanceTo(engine.camera.position);
            // 1. HOIST CONSTANTS: Define these OUTSIDE the loop so they aren't recreated every frame
            const cullRange = 50000000;
            const cullBuffer = 5000000;
            // OPTIMIZATION: Use squared distances to avoid expensive Math.sqrt() calculations
            const maxDistSq = (cullRange + cullBuffer) * (cullRange + cullBuffer);
            const hudRangeSq = cullRange * cullRange; 
            
            let closestSupernova = null;
            let minDistanceSq = Infinity;
            const camPos = engine.camera.position;
            
            // 2. USE A STANDARD FOR-LOOP: Slightly faster than .forEach() in a heavy render loop
            for (let i = 0; i < supernovas.length; i++) {
                const star = supernovas[i];
                
                // OPTIMIZATION: distanceToSquared is MUCH faster than distanceTo
                const distSq = star.position.distanceToSquared(camPos);
            
                if (distSq < maxDistSq) {
                    if (star.onUpdate) star.onUpdate();
                    star.visible = true; // Render it
            
                    // Check if it's the closest one for our HUD
                    if (distSq < hudRangeSq && distSq < minDistanceSq) {
                        minDistanceSq = distSq;
                        closestSupernova = star;
                    }
                } else {
                    star.visible = false; // Hide it to save GPU
                }
            }
            
            // 3. OPTIMIZED DOM UPDATE: Prevent "Layout Thrashing"
            if (horizonObjElement) {
                let newText = "";
                
                if (closestSupernova) {
                    newText = `Supernova Status: ${closestSupernova.userData.state} | Next phase in: ${closestSupernova.userData.timeToChange}`;
                } else {
                    // Use squared lengths here too for consistency and speed
                    const interstellarDistSq = 85000000 * 85000000;
                    newText = (camPos.lengthSq() > interstellarDistSq) ? ">> STATUS: INTERSTELLAR SPACE" : ">> STATUS: CRUISE MODE";
                }
            
                // ONLY update the DOM if the text actually changed this frame
                if (horizonObjElement._currentText !== newText) {
                    horizonObjElement.innerText = newText;
                    horizonObjElement._currentText = newText; // Cache it
                }
            }
            // 1. Tell the universe to check if the pilot entered a new sector chunk
            //universe.update(engine.camera.position);
        
            // 9. RENDER
            engine.renderer.render(engine.scene, engine.camera);
        }            
        
        frame();
    </script>
</body>
