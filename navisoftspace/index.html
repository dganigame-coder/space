<style>
    /* Deep Space UI Theme */
    body { 
        margin: 0; 
        background: #000; 
        overflow: hidden; 
        /* Prevents the browser from handling touch (scrolling/zooming) */
        touch-action: none; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        user-select: none; /* Prevents text highlighting while flying */
    }

    #hud { 
        position: fixed; top: 20px; left: 20px; color: #00ffff; z-index: 100; 
        pointer-events: none; border-left: 2px solid #00ffff; padding-left: 15px;
        background: rgba(0, 40, 40, 0.2); backdrop-filter: blur(5px);
    }

    /* Joystick Bases: These should be the "touch zones" */
    .stick-base { 
        position: fixed; bottom: 50px; width: 110px; height: 110px; 
        border: 2px solid rgba(0, 255, 255, 0.2); border-radius: 50%; 
        background: rgba(0, 255, 255, 0.05); 
        z-index: 500; /* Higher than the 3D canvas */
        touch-action: none; /* Critical for mobile */
    }
    
    #left-stick { left: 40px; }
    #right-stick { right: 40px; }

    .knob { 
        position: absolute; width: 40px; height: 40px; background: #00ffff; 
        border-radius: 50%; top: 35px; left: 35px; box-shadow: 0 0 20px #00ffff; 
        opacity: 0.8; 
        transition: transform 0.1s ease-out;
        pointer-events: none; /* The knob itself shouldn't block the base */
    }

    #surface-intel {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(0, 10, 20, 0.9); border: 1px solid #0ff; color: white;
        padding: 20px; text-align: center; display: none; z-index: 600;
    }

    #overlay { 
        position: fixed; inset: 0; background: radial-gradient(circle, #111, #000); 
        z-index: 1000; display: flex; flex-direction: column; justify-content: center; 
        align-items: center; cursor: pointer; color: white; 
    }
    
    .btn-exit { margin-top: 15px; background: none; border: 1px solid #0ff; color: #0ff; padding: 5px 10px; cursor: pointer; }
    
    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
    }

    #planet-hud {
        position: fixed;
        top: 20%;
        left: 20px;
        color: #00f2ff;
        font-family: 'Courier New', Courier, monospace;
        font-size: 24px;
        text-shadow: 0 0 10px #00f2ff;
        pointer-events: none; /* So it doesn't block clicks */
        display: none; /* Hidden by default */
        z-index: 100;
    }
#autopilot-btn {
    position: fixed;
    bottom: 30px;      /* Distance from the bottom */
    left: 50%;         /* Move to horizontal center */
    transform: translateX(-50%); /* Center it perfectly */
    
    /* Creative "Cockpit" Aesthetic */
    padding: 10px 30px;
    background: linear-gradient(180deg, rgba(0, 40, 60, 0.9) 0%, rgba(0, 0, 0, 0.9) 100%);
    color: #00ccff;
    font-family: 'Orbitron', monospace; /* Modern sci-fi font if you have it */
    font-size: 0.85em;
    letter-spacing: 2px;
    text-transform: uppercase;

    /* The "Bracket" Border Look */
    border: 1px solid rgba(0, 204, 255, 0.3);
    border-left: 4px solid #00ccff;
    border-right: 4px solid #00ccff;
    
    /* Subtle Sci-Fi Details */
    clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%);
    box-shadow: 0 0 15px rgba(0, 204, 255, 0.2);
    
    cursor: pointer;
    transition: all 0.3s ease;
    user-select: none;
    z-index: 1000;
}

/* Add a pulsing effect when Autopilot is ACTIVE */
#autopilot-btn.active {
    border-left-color: #ffcc00;
    border-right-color: #ffcc00;
    color: #ffcc00;
    box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
    background: rgba(40, 30, 0, 0.9);
}

<script>
    const debugBox = document.getElementById('mobile-debug');

    function toggleDebug() {
        const isHidden = debugBox.style.display === 'none' || debugBox.style.display === '';
        debugBox.style.display = isHidden ? 'block' : 'none';
    }

    const btn = document.createElement('button');
    btn.id = 'debug-toggle';
    btn.innerText = '🛠️ LOGS';
    btn.onclick = toggleDebug;
    document.body.appendChild(btn);

    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'l') toggleDebug();
    });

    function logToScreen(msg, isError = false) {
        const line = document.createElement('div');
        line.style.color = isError ? "#ff4444" : "#00ff00";
        line.style.borderBottom = "1px solid #222";
        line.style.padding = "2px 0";
        line.innerText = `> ${msg}`;
        debugBox.appendChild(line);
        debugBox.scrollTop = debugBox.scrollHeight;
    }

    window.onerror = (msg, url, line) => logToScreen(`${msg} (Line: ${line})`, true);
    window.onunhandledrejection = (event) => logToScreen(`Promise Error: ${event.reason}`, true);

    const oldLog = console.log;
    console.log = function(...args) {
        const message = args.map(arg => 
            typeof arg === 'object' ? JSON.stringify(arg) : arg
        ).join(' ');
        logToScreen(message);
        //oldLog.apply(console, args);
    };
</script>

<script type="module">
    window.blockShipControls = false;
    function setupCockpitButton(id, callback) {
        const targetBtn = document.getElementById(id);
        if (!targetBtn) return;

        targetBtn.addEventListener('touchstart', (e) => {
            window.blockShipControls = true; 
            e.stopPropagation(); 
            
            if (typeof navigator !== 'undefined' && 'vibrate' in navigator) {
                navigator.vibrate(12); 
            }
        }, { passive: true });

        targetBtn.addEventListener('touchend', (e) => {
            e.stopPropagation();
            e.preventDefault(); 
            if(SaveSystem) callback(targetBtn);
            
            setTimeout(() => {
                window.blockShipControls = false; 
            }, 120);
        }, { passive: false });

        targetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if(SaveSystem) callback(targetBtn);
        });
    }

    // Bind Log Position
    setupCockpitButton('saveBtn', (buttonEl) => {
        if (typeof engine !== 'undefined' && engine.camera) {
            SaveSystem.save(engine.camera, velocity || 0); 
        } else {
            console.log("Cannot log position: Engine instance not ready yet.");
        }
        
        buttonEl.innerText = "LOCKED";
        buttonEl.style.color = "#00ff00";
        buttonEl.style.borderColor = "#00ff00";
        
        setTimeout(() => {
            buttonEl.innerText = "LOG POSITION";
            buttonEl.style.color = "#00ffff";
            buttonEl.style.borderColor = "#00ffff";
        }, 2000);
    });

    // Bind Abort Mission
    setupCockpitButton('resetBtn', () => {
        SaveSystem.clear();
    });
</script>

                function jumpTo(dest) {
                    const offset = 5000000;
                
                    // 1. Reset Joystick State (Prevents input locking on mobile)
                    if (window.joystick) {
                        window.joystick.velocity.set(0, 0);
                        window.joystick.active = false;
                    }
                
                    // 2. Perform Jump & Camera Positioning
                    engine.camera.position.set(dest.x + offset, dest.y + offset, dest.z + offset);
                    engine.camera.lookAt(dest.x, dest.y, dest.z);
                
                    // 3. Dynamic Far Plane Adjustment (Ensures the destination is visible)
                    const distanceToTarget = Math.abs(dest.z) + offset + 10000000;
                    if (engine.camera.far < distanceToTarget) {
                        engine.camera.far = distanceToTarget;
                        engine.camera.updateProjectionMatrix();
                    }
                
                    // 4. Clear Modal & Reset Pointer Events
                    const modal = document.getElementById('nav-modal');
                    /*
                    if (modal) {
                        modal.style.display = 'none';
                        modal.style.pointerEvents = 'none';
                    }*/

                    if (modal) {
                        modal.style.display = 'none';
                        modal.style.pointerEvents = 'auto'; // CRITICAL: Reset this so it works next time
                    }
                    
                    // 5. Force Reactivation of Controls
                    setTimeout(() => {
                        if (window.joystick) {
                            window.joystick.active = true;
                        }
                        console.log("Jump successful:", dest.name);
                    }, 100);
                }
        
            // --- 2. UI INITIALIZATION ---
            function initNavHub() {
                const container = document.getElementById('button-container');
                const modal = document.getElementById('nav-modal');
                const trigger = document.getElementById('nav-trigger');
            
                // 1. CLEAR PREVIOUS BUTTONS (Prevents duplicates if init is called twice)
                container.innerHTML = '';
            
                // 2. TRIGGER LOGIC
                // Use one single listener to open the modal
                trigger.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    modal.style.display = 'flex';
                    modal.style.pointerEvents = 'auto'; // Force interactivity
                }, { passive: false });
            
                // 3. DESTINATION BUTTON LOGIC
                destinations.forEach(dest => {
                    const btn = document.createElement('button');
                    btn.innerText = dest.name;
                    
                    // Mobile-friendly styling
                    btn.style.cssText = "padding: 15px; margin: 5px 0; background: #1a1a1a; color: #00ffcc; border: 1px solid #00ffcc; width: 100%; display: block; font-size: 16px; touch-action: manipulation;";
            
                    btn.addEventListener('pointerdown', (e) => {
                        e.stopPropagation();
                        
                        // Execute the jump logic
                        jumpTo(dest);
                        
                        // Hide modal but ensure it remains interactive for next time
                        modal.style.display = 'none';
                        modal.style.pointerEvents = 'auto'; 
                    }, { passive: false });
            
                    container.appendChild(btn);
                });
            }
                    
            window.addEventListener('DOMContentLoaded', initNavHub);
