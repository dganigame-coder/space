<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <title>NaviSoft Space Simulator</title>
<style>
    /* Deep Space UI Theme */
    body { 
        margin: 0; 
        background: #000; 
        overflow: hidden; 
        /* Prevents the browser from handling touch (scrolling/zooming) */
        touch-action: none; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        user-select: none; /* Prevents text highlighting while flying */
    }

    #hud { 
        position: fixed; top: 20px; left: 20px; color: #00ffff; z-index: 100; 
        pointer-events: none; border-left: 2px solid #00ffff; padding-left: 15px;
        background: rgba(0, 40, 40, 0.2); backdrop-filter: blur(5px);
    }

    /* Joystick Bases: These should be the "touch zones" */
    .stick-base { 
        position: fixed; bottom: 50px; width: 110px; height: 110px; 
        border: 2px solid rgba(0, 255, 255, 0.2); border-radius: 50%; 
        background: rgba(0, 255, 255, 0.05); 
        z-index: 500; /* Higher than the 3D canvas */
        touch-action: none; /* Critical for mobile */
    }
    
    #left-stick { left: 40px; }
    #right-stick { right: 40px; }

    .knob { 
        position: absolute; width: 40px; height: 40px; background: #00ffff; 
        border-radius: 50%; top: 35px; left: 35px; box-shadow: 0 0 20px #00ffff; 
        opacity: 0.8; 
        transition: transform 0.1s ease-out;
        pointer-events: none; /* The knob itself shouldn't block the base */
    }

    #surface-intel {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(0, 10, 20, 0.9); border: 1px solid #0ff; color: white;
        padding: 20px; text-align: center; display: none; z-index: 600;
    }

    #overlay { 
        position: fixed; inset: 0; background: radial-gradient(circle, #111, #000); 
        z-index: 1000; display: flex; flex-direction: column; justify-content: center; 
        align-items: center; cursor: pointer; color: white; 
    }
    
    .btn-exit { margin-top: 15px; background: none; border: 1px solid #0ff; color: #0ff; padding: 5px 10px; cursor: pointer; }
    
    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
    }

    #planet-hud {
        position: fixed;
        top: 20%;
        left: 20px;
        color: #00f2ff;
        font-family: 'Courier New', Courier, monospace;
        font-size: 24px;
        text-shadow: 0 0 10px #00f2ff;
        pointer-events: none; /* So it doesn't block clicks */
        display: none; /* Hidden by default */
        z-index: 100;
    }
    
  
</style>
</head>
<body>

    <div id="hud">
        <div style="font-size: 10px; opacity: 0.7;">[ SYSTEM STATUS: ONLINE ]</div>
        <div id="loc-display">LOCATION: EARTH SURFACE</div>
        <div id="spd-display">VELOCITY: 0.0 AU/s</div>
        <div id="target-display" style="color: #55ff55;">NEAREST: --</div>
    </div>
<!-- 1. Load Tone.js before your modules -->
    
    <div id="right-monitor" style="
    position: absolute; 
    right: 30px; 
    top: 30%; 
    width: 250px;
    color: #00ffff; 
    font-family: 'Courier New', monospace; 
    text-transform: uppercase;
    letter-spacing: 1px;
    pointer-events: none; /* So it doesn't block mouse clicks */
    opacity: 0; 
    transition: opacity 0.5s ease-in-out;">
    <!-- Just a div for the raw data stream -->
    <div id="monitor-text" style="line-height: 1.6;"></div>
    </div>

    <div id="left-stick" class="stick-base"><div class="knob" id="knob-l"></div></div>
    <div id="right-stick" class="stick-base"><div class="knob" id="knob-r"></div></div>

    <div id="overlay">
        <h1 style="letter-spacing: 10px;">NAVISOFT</h1>
        <p style="color: #0ff; font-weight: 100;">DEPARTURE SEQUENCE READY</p>
        <p style="font-size: 12px; opacity: 0.5;">[ TAP TO INITIATE IGNITION ]</p>
    </div>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "engine": "https://cdn.jsdelivr.net/gh/dganigame-coder/space@68a3edb/navisoftspace/engine.js",
        "audio":"https://cdn.jsdelivr.net/gh/dganigame-coder/space@68a3edb/navisoftspace/audio.js",
        "pilot": "https://cdn.jsdelivr.net/gh/dganigame-coder/space@10a63d6/navisoftspace/pilot.js",
        "stars":"https://cdn.jsdelivr.net/gh/dganigame-coder/space/navisoftspace/stars.js",
        "mars":"https://cdn.jsdelivr.net/gh/dganigame-coder/space@e20c044/navisoftspace/planets/mars.js",
        "jupiter":"https://cdn.jsdelivr.net/gh/dganigame-coder/space@e7735dd/navisoftspace/planets/jupiter.js",
        "earth": "https://cdn.jsdelivr.net/gh/dganigame-coder/space@b148479/navisoftspace/planets/earth.js",
        "moon": "https://cdn.jsdelivr.net/gh/dganigame-coder/space@adab28e/navisoftspace/planets/moon.js",
        "sun": "https://cdn.jsdelivr.net/gh/dganigame-coder/space@794525d/navisoftspace/planets/sun.js",
        "venus":"https://cdn.jsdelivr.net/gh/dganigame-coder/space@1d517a2/navisoftspace/planets/venus.js",
        "mercury":"https://cdn.jsdelivr.net/gh/dganigame-coder/space@e65ef7f/navisoftspace/planets/mercury.js",
        "uranus":"https://cdn.jsdelivr.net/gh/dganigame-coder/space@e19b4c4/navisoftspace/planets/uranus.js",
        "neptune":"https://cdn.jsdelivr.net/gh/dganigame-coder/space@4fd99fd/navisoftspace/planets/neptune.js",
        "saturn":"https://cdn.jsdelivr.net/gh/dganigame-coder/space@77f222c/navisoftspace/planets/saturn.js",
        "pluto":"https://cdn.jsdelivr.net/gh/dganigame-coder/space@1611a65/navisoftspace/planets/pluto.js"
        }
    }
 
    </script>
    <script type="module">
        let autoPilotActive = false;

        window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'p') {
            autoPilotActive = !autoPilotActive;
            console.log("Auto-Pilot:", autoPilotActive ? "ON" : "OFF");
         }
         });  
    
    import { initEngine , checkCollisions } from 'engine';
    import { loadSoundLibrary } from 'audio.js';
    import { initPilot, updateFlight } from 'pilot';
    import { createStars } from 'stars';

    import { createSun } from 'sun';   
    import { createEarth } from 'earth';
    import { createMoon } from 'moon';
    import { createMars } from 'mars';
    import { createJupiter } from 'jupiter';
    
    // ADD THESE REMAINING PLANETS
    import { createMercury } from 'mercury';
    import { createVenus } from 'venus';
    import { createSaturn } from 'saturn';
    import { createUranus } from 'uranus';
    import { createNeptune } from 'neptune';
    import { createPluto } from 'pluto'    

    const overlay = document.getElementById('overlay');

    overlay.onclick = () => {
        overlay.style.display = 'none';
        const engine = initEngine();
        // Add the background
       const starfield = createStars();
       engine.scene.add(starfield); 

        // --- 1. INITIALIZE ALL BODIES ---
        const sun = createSun();
        const mercury = createMercury();
        const venus = createVenus();
        const earth = createEarth();
        const moon = createMoon();
        const mars = createMars();
        const jupiter = createJupiter();
        const saturn = createSaturn();
        const uranus = createUranus();
        const neptune = createNeptune();
        const pluto = createPluto();

        await loadSoundLibrary(); 
        console.log("Audio systems initialized via User Gesture.");
        // --- 2. ADD EVERYTHING TO THE SCENE ---
        engine.scene.add(sun, mercury, venus, earth, moon, mars, jupiter, saturn, uranus, neptune, pluto);
        
        // --- 3. ADD EVERYTHING TO THE COLLISION ARRAY ---
        // This is what allows you to land on them and see their HUD data
        const bodies = [sun, mercury, venus, earth, moon, mars, jupiter, saturn, uranus, neptune , pluto];

        // --- ADD THE HUD CLICK LOGIC HERE ---
        const nearestLabel = document.getElementById('target-display');
        nearestLabel.style.cursor = "pointer";

        nearestLabel.addEventListener('click', () => {
        let closest = null;
        let minDist = Infinity;
    
       bodies.forEach(b => {
        const d = engine.camera.position.distanceTo(b.position);
        if (d < minDist) { 
            minDist = d; 
            closest = b; 
        }
       });

       if (closest) {
        // Point the ship directly at the nearest planet
        engine.camera.lookAt(closest.position);
        
        // Peer Tip: If you want to stop the ship so you don't fly past it:
        // velocity.set(0,0,0); 
        
        console.log("Locked on to " + closest.userData.name);
    }
    });
            // 3. Initialize Control Module
            initPilot();
            
               

function frame() {                        
    requestAnimationFrame(frame);

    // 1. INFINITE STARS
    // Centers the starfield on the pilot so the galaxy never ends
    if (engine.stars) {
        engine.stars.position.copy(engine.camera.position);
    }

    // 2. HUD & TARGETING DATA
    // We calculate this first so both the HUD and Auto-Pilot can use it
    let closestBody = null;
    let minDistance = Infinity;

    bodies.forEach(b => {
        if (b.onUpdate) b.onUpdate(); // Update planet rotations/orbits
        const dist = engine.camera.position.distanceTo(b.position);
        if (dist < minDistance) {
            minDistance = dist;
            closestBody = b;
        }
    });

    // 3. DEBUG AUTO-PILOT (HIDDEN P-KEY FEATURE)
    // Moves towards the 'NEAREST' planet at warp speed
    if (typeof autoPilotActive !== 'undefined' && autoPilotActive && closestBody) {
        engine.camera.lookAt(closestBody.position);
        engine.camera.translateZ(-2000); // Warp speed!

        // Auto-stop when close to the surface
        const planetRadius = closestBody.userData.r || 500;
        if (minDistance < planetRadius + 1200) {
            autoPilotActive = false;
        }
    }

    // 4. PHYSICS & REGULAR MOVEMENT
    checkCollisions(engine.camera, bodies);
    updateFlight(engine.camera, bodies);

    // 5. HUD VISUALS
    const nearestLabel = document.getElementById('target-display');
    if (closestBody && nearestLabel) {
        const auDist = (minDistance / 60000).toFixed(2);
        const name = closestBody.userData.name;
        const planetRadius = closestBody.userData.r || 500;

        // Base HUD Text
        nearestLabel.innerText = `NEAREST: ${name} (${auDist} AU)`;
        
        // Color Logic: Warp (Cyan) > Danger (Red) > Safe (Green)
        if (typeof autoPilotActive !== 'undefined' && autoPilotActive) {
            nearestLabel.innerText += " [WARP ACTIVE]";
            nearestLabel.style.color = "#00ffff"; 
        } else if (minDistance < planetRadius + 1000) {
            nearestLabel.style.color = "#ff5555"; 
        } else {
            nearestLabel.style.color = "#55ff55"; 
        }
    }

    // 6. RENDER
    engine.renderer.render(engine.scene, engine.camera);
}            frame();
        };
    </script>
</body>
</html>
