<!DOCTYPE html>
<html>
<head>
    <title>Nebula Visual Test</title>
    <style>body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }</style>
</head>
<body>
    <div style="position:absolute; top:10px; left:10px;">
        <h1>Nebula Sandbox</h1>
        <p>Inspecting: All Nebulae</p>
    </div>
    
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { createNebula } from './nebula.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 20000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        camera.position.z = 10000;

        // Define your list here to test
        const testNebulae = [
            { name: "Eagle Nebula", x: 0, y: 0, z: 0, count: 500, spread: 3000, size: 700, colors: [0x8800ff, 0xff00ff] },
            { name: "Orion Nebula", x: 5000, y: 0, z: 0, count: 800, spread: 2500, size: 500, colors: [0xffaa00, 0xff5500] }
        ];

        // Build them
        testNebulae.forEach(config => createNebula(scene, config));

        function animate() {
            requestAnimationFrame(animate);
            scene.rotation.y += 0.005; // Spin the whole scene to see the volume
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
