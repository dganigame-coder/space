<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stellar Capital | Fixed Selection</title>
    <style>
        html, body { overflow: hidden; width: 100%; height: 100%; margin: 0; background: #000; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }
        #ui {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0, 20, 40, 0.9); border: 1px solid #00f2ff;
            color: #00f2ff; padding: 10px; border-radius: 8px;
            pointer-events: none; font-family: sans-serif;
        }
        #trade-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 10, 20, 0.95); padding: 15px; border: 2px solid #00f2ff;
            border-radius: 12px; display: none; text-align: center; color: white;
        }
        button { background: #00f2ff; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui">
    <b>Stellar Capital</b><br>
    <span id="target">לחץ על אסטרואיד לבחירה</span>
</div>

<div id="trade-panel" id="panel">
    <h3 id="panel-title">Asset</h3>
    <button onclick="trade()">בצע עסקה</button>
    <button onclick="closePanel()" style="background:#444; color:white;">סגור</button>
</div>

<canvas id="renderCanvas"></canvas>

<script src="https://cdn.babylonjs.com/babylon.js"></script>

<script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    let selectedMesh = null;

    const createScene = function() {
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.02, 1);

        const camera = new BABYLON.ArcRotateCamera("cam", 0, Math.PI/3, 50, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        
        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
        light.intensity = 0.8;

        // יצירת אסטרואידים
        for (let i = 0; i < 30; i++) {
            const mesh = BABYLON.MeshBuilder.CreatePolyhedron("asset_" + i, {type: 1, size: 2}, scene);
            mesh.position = new BABYLON.Vector3(Math.random()*40-20, Math.random()*20-10, Math.random()*40-20);
            
            const mat = new BABYLON.StandardMaterial("m", scene);
            mat.diffuseColor = Math.random() > 0.5 ? new BABYLON.Color3(0, 1, 0.5) : new BABYLON.Color3(1, 0, 0);
            mesh.material = mat;

            // מאפשר לקרן "לפגוע" באובייקט
            mesh.isPickable = true; 
        }

        // --- התיקון הקריטי: זיהוי לחיצה מדויק ---
        scene.onPointerDown = function (evt, pickResult) {
            // אם הקרן פגעה באובייקט
            if (pickResult.hit && pickResult.pickedMesh) {
                
                // ניקוי בחירה קודמת
                if (selectedMesh) selectedMesh.renderOutline = false;

                selectedMesh = pickResult.pickedMesh;
                
                // סימון ויזואלי
                selectedMesh.renderOutline = true;
                selectedMesh.outlineColor = BABYLON.Color3.Yellow();
                selectedMesh.outlineWidth = 0.1;

                // עדכון ממשק
                document.getElementById("target").innerText = "נבחר: " + selectedMesh.name;
                document.getElementById("panel-title").innerText = selectedMesh.name;
                document.getElementById("trade-panel").style.display = "block";
                
                // מיקוד מצלמה
                camera.setTarget(selectedMesh.position);
            }
        };

        return scene;
    };

    const scene = createScene();
    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());

    function trade() {
        alert("עסקה בוצעה על " + selectedMesh.name);
        closePanel();
    }

    function closePanel() {
        document.getElementById("trade-panel").style.display = "none";
        if (selectedMesh) selectedMesh.renderOutline = false;
    }
</script>
</body>
</html>
