<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Stellar Capital: The Odyssey</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        #canvasZone { width: 100%; height: 100%; }
        #ui-layer {
            position: absolute; top: 20px; left: 20px;
            color: #00ffcc; background: rgba(0,0,0,0.7);
            padding: 15px; border: 1px solid #00ffcc; border-radius: 8px;
            pointer-events: none;
        }
        .market-up { color: #00ff00; }
        .market-down { color: #ff0000; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <h2>פורטפוליו גלקטי</h2>
        <div>יתרת מזומן: <span id="cash">$100,000</span></div>
        <div>מדד תנודתיות חלל: <span class="market-up">יציב</span></div>
    </div>
    <canvas id="renderCanvas"></canvas>
    
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</body>
</html>
