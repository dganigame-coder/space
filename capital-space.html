<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stellar Capital | משחק שוק ההון הגלקטי</title>
    <style>
        html, body {
            overflow: hidden; width: 100%; height: 100%;
            margin: 0; padding: 0; background-color: #05050a;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }
        
        /* ממשק עליון - סטטיסטיקות */
        #ui-header {
            position: absolute; top: 15px; left: 15px; right: 15px;
            background: rgba(0, 15, 35, 0.85);
            border: 1px solid #00f2ff; color: #00f2ff;
            padding: 12px; border-radius: 10px;
            pointer-events: none; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
        }
        .money-display { font-size: 16px; font-weight: bold; }

        /* חלונית נכס נבחר */
        #asset-info {
            position: absolute; top: 85px; right: 15px;
            background: rgba(0, 5, 15, 0.9);
            border-right: 4px solid #ffff00; color: white;
            padding: 10px; border-radius: 4px;
            display: none; width: 180px; z-index: 5;
        }

        /* פאנל מסחר תחתון */
        #trade-panel {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 10, 25, 0.95);
            padding: 20px; border-radius: 20px;
            border: 2px solid #00f2ff;
            display: none; text-align: center; color: white;
            min-width: 280px; z-index: 20;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
        }
        .btn {
            border: none; padding: 12px 25px; border-radius: 8px;
            font-weight: bold; font-size: 16px; cursor: pointer; margin: 5px;
        }
        .btn-buy { background: #00ff88; color: #000; }
        .btn-sell { background: #ff4444; color: #fff; }
        .btn-close { background: #444; color: #ccc; font-size: 12px; }
    </style>
</head>
<body>

    <div id="ui-header">
        <div style="font-weight: 900; letter-spacing: 1px;">STELLAR CAPITAL</div>
        <div class="money-display" id="portfolio-stats">מזומן: $100,000 | שווי: $100,000</div>
    </div>

    <div id="asset-info">
        <div id="info-name" style="font-weight: bold; color: #ffff00;">Asset Name</div>
        <div id="info-price" style="font-size: 20px;">$0.00</div>
        <div id="info-owned" style="font-size: 12px; opacity: 0.8;">בבעלותך: 0</div>
    </div>

    <div id="trade-panel">
        <h2 id="panel-title" style="margin: 0 0 10px 0;">נכס</h2>
        <div style="margin-bottom: 15px; opacity: 0.8;">בצע פעולה בשוק בזמן אמת:</div>
        <button class="btn btn-buy" onclick="trade('buy')">קנייה (Buy)</button>
        <button class="btn btn-sell" onclick="trade('sell')">מכירה (Sell)</button>
        <br>
        <button class="btn btn-close" onclick="closePanel()">סגור תצוגה</button>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        // משתני משחק
        let cash = 100000;
        let selectedAsset = null;
        const assets = [];

        const createScene = function() {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.03, 1);

            // מצלמה
            const camera = new BABYLON.ArcRotateCamera("cam", Math.PI/2, Math.PI/3, 60, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 20;
            camera.upperRadiusLimit = 120;

            // תאורה
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.6;
            const sun = new BABYLON.PointLight("sun", new BABYLON.Vector3(0, 0, 0), scene);
            sun.intensity = 1.8;

            // יצירת גופים שמימיים (נכסי שוק)
            for (let i = 0; i < 35; i++) {
                const isVolatile = Math.random() > 0.7; // אדומים הם תנודתיים (מסוכנים)
                const type = i < 5 ? 0 : 1; // 5 כוכבי לכת, השאר אסטרואידים
                
                const mesh = type === 0 ? 
                    BABYLON.MeshBuilder.CreateSphere("Planet_"+i, {diameter: 5}, scene) :
                    BABYLON.MeshBuilder.CreatePolyhedron("Asset_"+i, {type: 2, size: 2}, scene);

                // מיקום רנדומלי
                const angle = Math.random() * Math.PI * 2;
                const dist = 25 + Math.random() * 40;
                mesh.position = new BABYLON.Vector3(Math.cos(angle)*dist, (Math.random()-0.5)*15, Math.sin(angle)*dist);
                
                // עיצוב
                const mat = new BABYLON.StandardMaterial("mat"+i, scene);
                mat.diffuseColor = isVolatile ? new BABYLON.Color3(1, 0.2, 0.2) : new BABYLON.Color3(0.2, 1, 0.6);
                mat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                mesh.material = mat;

                // תכונות כלכליות
                mesh.price = Math.random() * 800 + 200;
                mesh.volatility = isVolatile ? 0.04 : 0.008; 
                mesh.owned = 0;
                mesh.isPickable = true;

                assets.push(mesh);
            }

            // עדכון מחירים בכל פריים (סימולציה של בורסה)
            scene.registerBeforeRender(() => {
                assets.forEach(a => {
                    // שינוי מחיר רנדומלי
                    const movement = 1 + (Math.random() * a.volatility * 2 - a.volatility);
                    a.price *= movement;
                    
                    // סיבוב האובייקט
                    a.rotation.y += 0.01;

                    // עדכון UI אם הנכס נבחר
                    if (selectedAsset === a) {
                        document.getElementById("info-price").innerText = "$" + a.price.toFixed(2);
                    }
                });
                updateFinanceUI();
            });

            // זיהוי לחיצה
            scene.onPointerDown = function (evt, pickResult) {
                if (pickResult.hit && pickResult.pickedMesh) {
                    if (selectedAsset) selectedAsset.renderOutline = false;

                    selectedAsset = pickResult.pickedMesh;
                    selectedAsset.renderOutline = true;
                    selectedAsset.outlineColor = BABYLON.Color3.Yellow();

                    // עדכון והצגת פאנלים
                    document.getElementById("asset-info").style.display = "block";
                    document.getElementById("trade-panel").style.display = "block";
                    document.getElementById("info-name").innerText = selectedAsset.name;
                    document.getElementById("info-owned").innerText = "בבעלותך: " + selectedAsset.owned;
                    document.getElementById("panel-title").innerText = selectedAsset.name;
                    
                    camera.setTarget(selectedAsset.position);
                }
            };

            return scene;
        };

        function updateFinanceUI() {
            let assetsValue = 0;
            assets.forEach(a => {
                if (a.owned) assetsValue += (a.owned * a.price);
            });
            const totalEquity = cash + assetsValue;
            
            const statsEl = document.getElementById("portfolio-stats");
            statsEl.innerText = `מזומן: $${cash.toLocaleString(undefined, {maximumFractionDigits:0})} | שווי תיק: $${totalEquity.toLocaleString(undefined, {maximumFractionDigits:0})}`;
            
            // שינוי צבע לפי רווח/הפסד (יחסית ל-100K)
            statsEl.style.color = totalEquity >= 100000 ? "#00ff88" : "#ff4444";
        }

        function trade(type) {
            if (!selectedAsset) return;

            if (type === 'buy') {
                if (cash >= selectedAsset.price) {
                    cash -= selectedAsset.price;
                    selectedAsset.owned++;
                } else {
                    alert("אין לך מספיק מזומן!");
                }
            } else if (type === 'sell') {
                if (selectedAsset.owned > 0) {
                    cash += selectedAsset.price;
                    selectedAsset.owned--;
                } else {
                    alert("אין לך יחידות מהנכס הזה למכירה!");
                }
            }
            document.getElementById("info-owned").innerText = "בבעלותך: " + selectedAsset.owned;
        }

        function closePanel() {
            document.getElementById("trade-panel").style.display = "none";
            document.getElementById("asset-info").style.display = "none";
            if (selectedAsset) selectedAsset.renderOutline = false;
            selectedAsset = null;
        }

        const scene = createScene();
        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());

    </script>
</body>
</html>
