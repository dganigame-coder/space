     <!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v8.0.2 Macro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        
        /* השכבה הזו שקופה למגע כדי שתוכל לסובב את הגלקסיה */
        #ui-layer { 
            position: absolute; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: space-between; 
            align-items: center; pointer-events: none; z-index: 10; 
        }

        #top-hud { width: 95%; display: flex; justify-content: space-between; margin-top: 15px; pointer-events: none; }
        .hud-box { background: rgba(0, 40, 80, 0.7); padding: 10px 15px; border-radius: 15px; border: 1px solid #00f2ff; color: #00f2ff; font-weight: bold; }
        
        #feedback { position: absolute; top: 25%; color: #00ff66; font-size: 3.5rem; font-weight: bold; text-shadow: 0 0 20px #00ff66; opacity: 0; transition: 0.4s; pointer-events: none; }
        
        #mission-control { text-align: center; pointer-events: none; }
        #scan-title { color: #fff; font-size: 1.8rem; text-shadow: 0 0 15px #00f2ff; margin-bottom: 5px; }
        #question { font-size: 5rem; color: #fff; text-shadow: 0 0 25px #fff; margin: 0; }
        #answer-display { font-size: 3.5rem; color: #ff00de; min-height: 4rem; text-shadow: 0 0 15px #ff00de; }

        /* רק המקלדת מגיבה למגע */
        #numpad { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; 
            padding: 20px; background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 30px; 
            backdrop-filter: blur(15px); transform: scale(0.85); 
            pointer-events: auto; margin-bottom: 10px; 
        }

        .btn { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); color: white; font-size: 1.8rem; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .btn-go { background: linear-gradient(45deg, #006622, #00ff66); border: none; grid-column: span 2; width: auto; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="top-hud">
        <div class="hud-box">🎖️ <span id="rank-name">צוערת קרקע</span></div>
        <div class="hud-box">📍 <span id="dist">0</span> ק"מ</div>
    </div>
    <div id="feedback">מעולה!</div>
    <div style="flex-grow: 1;"></div> <div id="mission-control">
        <p id="scan-title">כדור הארץ - הכנה לשיגור</p>
        <div id="question">? × ?</div>
        <div id="answer-display">?</div>
    </div>
    <div id="numpad">
        <div class="btn" onclick="press(1)">1</div><div class="btn" onclick="press(2)">2</div><div class="btn" onclick="press(3)">3</div>
        <div class="btn" onclick="press(4)">4</div><div class="btn" onclick="press(5)">5</div><div class="btn" onclick="press(6)">6</div>
        <div class="btn" onclick="press(7)">7</div><div class="btn" onclick="press(8)">8</div><div class="btn" onclick="press(9)">9</div>
        <div class="btn" style="color:#ff4444" onclick="del()">X</div><div class="btn" onclick="press(0)">0</div><div class="btn btn-go" onclick="check()">שיגור 🚀</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, stars, universeGroup, earth;
    let score = 0, currentAns = 0, inputStr = "", distance = 0;
    let targetZ = 0, isJumping = false, speed = 0.05;
    let targetRotX = 0, targetRotY = 0;

    const ranks = [
        { name: "צוערת קרקע", min: 0 },
        { name: "טייסת אטמוספירה", min: 1000 },
        { name: "מפקדת ירח", min: 384000 },
        { name: "חוקרת מאדים", min: 54000000 },
        { name: "קפטן גלקסיה", min: 100000000000 }
    ];

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 10000);
        camera.position.z = 150;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<10000; i++) starPos.push((Math.random()-0.5)*5000, (Math.random()-0.5)*5000, (Math.random()-0.5)*5000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 }));
        scene.add(stars);

        const earthGeo = new THREE.SphereGeometry(60, 32, 32);
        earth = new THREE.Mesh(earthGeo, new THREE.MeshStandardMaterial({ color: 0x2244ff, emissive: 0x112244 }));
        scene.add(earth);
        
        const light = new THREE.PointLight(0xffffff, 1.5, 1000);
        light.position.set(100, 100, 100);
        scene.add(light, new THREE.AmbientLight(0x505050));

        universeGroup = new THREE.Group();
        scene.add(universeGroup);

        // שליטה במגע - משופר
        let sX, sY;
        document.addEventListener('touchstart', e => { 
            if(!e.target.closest('#numpad')) {
                sX = e.touches[0].clientX; sY = e.touches[0].clientY; 
            }
        });
        document.addEventListener('touchmove', e => {
            if(!e.target.closest('#numpad')) {
                targetRotY += (e.touches[0].clientX - sX) * 0.01;
                targetRotX += (e.touches[0].clientY - sY) * 0.01;
                sX = e.touches[0].clientX; sY = e.touches[0].clientY;
            }
        });

        nextLevel();
        animate();
    }

    function generateObject(type) {
        universeGroup.clear();
        universeGroup.position.z = -1000; 
        universeGroup.rotation.set(0,0,0);
        targetRotX = 0; targetRotY = 0;
        const color = new THREE.Color().setHSL(Math.random(), 1, 0.5);
        const title = document.getElementById('scan-title');

        switch(type) {
            case 0: // שמש ענקית
                title.innerText = "מערכת שמש";
                universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(45,32,32), new THREE.MeshBasicMaterial({color: 0xffaa00})));
                let pG = new THREE.Group();
                let p = new THREE.Mesh(new THREE.SphereGeometry(12,24,24), new THREE.MeshStandardMaterial({color: 0x00f2ff}));
                p.position.x = 90; pG.add(p); universeGroup.add(pG);
                universeGroup.userData.rotateY = pG;
                break;
            case 1: // גלקסיה גדולה
                title.innerText = "גלקסיה ספירלית";
                const galGeo = new THREE.BufferGeometry(); const galPos = [];
                for(let i=0; i<8000; i++) {
                    const b = i % 3; const r = Math.random() * 200;
                    const a = (r * 0.1) + (b * (Math.PI * 2 / 3));
                    const s = (210 - r) * 0.15;
                    galPos.push(Math.cos(a)*r + (Math.random()-0.5)*s, (Math.random()-0.5)*15, Math.sin(a)*r + (Math.random()-0.5)*s);
                }
                galGeo.setAttribute('position', new THREE.Float32BufferAttribute(galPos, 3));
                let galPts = new THREE.Points(galGeo, new THREE.PointsMaterial({color: color, size: 1.5, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending}));
                universeGroup.add(galPts); universeGroup.userData.rotateY = galPts;
                break;
            case 2: // חור שחור
                title.innerText = "אופק האירועים";
                universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(35,32,32), new THREE.MeshBasicMaterial({color: 0x000000})));
                const dGeo = new THREE.BufferGeometry(); const dPos = [];
                for(let i=0; i<5000; i++) {
                    let a = Math.random()*Math.PI*2; let r = 60 + Math.random()*80;
                    dPos.push(Math.cos(a)*r, (Math.random()-0.5)*5, Math.sin(a)*r);
                }
                dGeo.setAttribute('position', new THREE.Float32BufferAttribute(dPos, 3));
                universeGroup.add(new THREE.Points(dGeo, new THREE.PointsMaterial({color: color, size: 1.2, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.8})));
                universeGroup.userData.rotateY = universeGroup;
                break;
            default: // כוכב טבעות
                title.innerText = "ענק גז";
                universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(40,32,32), new THREE.MeshStandardMaterial({color: color})));
                let ring = new THREE.Mesh(new THREE.TorusGeometry(75, 3, 2, 64), new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.5}));
                ring.rotation.x = 1.5; universeGroup.add(ring);
                universeGroup.userData.rotateY = universeGroup;
        }
    }

    function check() {
        if(parseInt(inputStr) === currentAns) {
            score++; distance = Math.pow(score, 4) * 800; 
            updateHUD();
            const fb = document.getElementById('feedback');
            fb.style.opacity = "1"; fb.style.transform = "scale(1.1)";
            isJumping = true; targetZ = 1600;
            setTimeout(() => {
                fb.style.opacity = "0";
                if(earth) { scene.remove(earth); earth = null; }
                generateObject(Math.floor(Math.random()*4));
                nextLevel();
            }, 1000);
        } else { del(); }
    }

    function updateHUD() {
        document.getElementById('dist').innerText = distance.toLocaleString();
        let rank = ranks[0].name;
        for(let r of ranks) { if(distance >= r.min) rank = r.name; }
        document.getElementById('rank-name').innerText = rank;
    }

    function nextLevel() {
        let n1 = Math.floor(Math.random() * 8) + 2; 
        let n2 = Math.floor(Math.random() * 9) + 2;
        currentAns = n1 * n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        inputStr = ""; document.getElementById('answer-display').innerText = "?";
    }

    function press(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('answer-display').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }

    function animate() {
        requestAnimationFrame(animate);
        
        if(isJumping) {
            if(earth) earth.position.z += 30; 
            universeGroup.position.z += (targetZ - universeGroup.position.z) * 0.1;
            speed = 60;
            if(universeGroup.position.z > 1500) { 
                isJumping = false; 
                universeGroup.position.z = -600; 
                speed = 0.2; 
            }
        } else {
            // התייצבות קרובה מאוד למצלמה (זום חזק)
            universeGroup.position.z += (-50 - universeGroup.position.z) * 0.05;
        }

        universeGroup.rotation.x += (targetRotX - universeGroup.rotation.x) * 0.05;
        universeGroup.rotation.y += (targetRotY - universeGroup.rotation.y) * 0.05;

        if(universeGroup.userData.rotateY) universeGroup.userData.rotateY.rotation.y += 0.01;
        if(earth) earth.rotation.y += 0.005;

        const p = stars.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { p[i+2] += speed; if(p[i+2] > 200) p[i+2] = -4000; }
        stars.geometry.attributes.position.needsUpdate = true;
        
        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
