<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל v9.0 - Touch Enabled</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, sans-serif; touch-action: none; }
        #ui { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: none; z-index: 10; }
        .hud { display: flex; justify-content: space-around; padding: 15px; }
        .stat { color: #00f2ff; font-weight: bold; text-shadow: 0 0 10px #000; font-size: 1.1rem; }
        #toast { position: absolute; top: 20%; width: 100%; text-align: center; color: #00ff66; font-size: 3rem; opacity: 0; transition: 0.3s; font-weight: bold; }
        #panel { margin-top: auto; padding-bottom: 40px; pointer-events: auto; display: flex; flex-direction: column; align-items: center; background: transparent; }
        #obj-info { color: #ffcc00; font-size: 1.4rem; margin-bottom: 10px; text-shadow: 2px 2px 10px #000; font-weight: bold; }
        #math { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; }
        #q { color: white; font-size: 4.5rem; font-weight: 900; text-shadow: 0 0 20px #000; }
        #a { color: #ff00de; font-size: 4.5rem; min-width: 80px; border-bottom: 6px solid #ff00de; text-align: center; font-weight: 900; }
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; width: 95%; max-width: 450px; }
        .btn { height: 60px; background: rgba(255, 255, 255, 0.1); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.7rem; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(8px); }
        .btn:active { background: #00f2ff; color: #000; }
        .btn-go { background: rgba(0, 255, 100, 0.3); grid-column: span 2; border-radius: 20px; font-weight: bold; border: 2px solid #00ff66; }
    </style>
</head>
<body>

<div id="ui">
    <div class="hud">
        <div class="stat" id="r-ui">צוערת</div>
        <div class="stat" id="d-ui">0 ק"מ</div>
    </div>
    <div id="toast">שיגור מוצלח! 🚀</div>
    <div id="panel">
        <div id="obj-info">סורק...</div>
        <div id="math">
            <div id="q">? × ?</div>
            <div id="a">?</div>
        </div>
        <div class="grid">
            <div class="btn" onclick="p(1)">1</div><div class="btn" onclick="p(2)">2</div><div class="btn" onclick="p(3)">3</div>
            <div class="btn" onclick="p(4)">4</div><div class="btn" onclick="p(5)">5</div><div class="btn" onclick="clr()" style="color:#ff4444">X</div>
            <div class="btn" onclick="p(6)">6</div><div class="btn" onclick="p(7)">7</div><div class="btn" onclick="p(8)">8</div>
            <div class="btn" onclick="p(9)">9</div><div class="btn" onclick="p(0)">0</div><div class="btn btn-go" onclick="check()">GO</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // ספרייה גנרית מורחבת (ניתן להוסיף עד 100 בקלות)
    const lib = [
        {n:"כדור הארץ", t:"p", c:0x2266ff}, {n:"מאדים", t:"p", c:0xff4400}, {n:"שבתאי", t:"p", c:0xdfbe9f, r:true},
        {n:"חור שחור", t:"bh", c:0x000000}, {n:"גלקסיית הספירלה", t:"gx", c:0x00f2ff}, {n:"ערפילית", t:"nb", c:0xff00ff},
        {n:"צדק", t:"p", c:0xd2b48c}, {n:"נפטון", t:"p", c:0x3355ff}, {n:"חור תולעת", t:"wh", c:0xaa00ff}
    ];
    for(let i=0; i<90; i++) lib.push({n: "גרם שמיים " + (i+10), t:"p", c: Math.random()*0xffffff});

    let sc, cam, rend, group, stars, target, curStr="", score=0, dist=0, isJump=false;
    let targetRotX = 0, targetRotY = 0, isDown = false, lastX, lastY;

    function init() {
        sc = new THREE.Scene();
        cam = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 2000);
        cam.position.z = 180;
        rend = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rend.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(rend.domElement);

        group = new THREE.Group(); sc.add(group);
        sc.add(new THREE.AmbientLight(0xffffff, 0.6));
        const l = new THREE.PointLight(0xffffff, 1); l.position.set(100,100,100); sc.add(l);

        const sG = new THREE.BufferGeometry(); const sP = [];
        for(let i=0; i<3000; i++) sP.push((Math.random()-0.5)*2000, (Math.random()-0.5)*2000, (Math.random()-0.5)*2000);
        sG.setAttribute('position', new THREE.Float32BufferAttribute(sP, 3));
        stars = new THREE.Points(sG, new THREE.PointsMaterial({color: 0xffffff, size: 1}));
        sc.add(stars);

        // --- מנגנון הזזה עם האצבע ---
        window.addEventListener('pointerdown', e => { if(e.clientY < window.innerHeight * 0.6) { isDown = true; lastX = e.clientX; lastY = e.clientY; }});
        window.addEventListener('pointermove', e => {
            if(!isDown) return;
            const dx = e.clientX - lastX; const dy = e.clientY - lastY;
            targetRotY += dx * 0.01; targetRotX += dy * 0.01;
            lastX = e.clientX; lastY = e.clientY;
        });
        window.addEventListener('pointerup', () => isDown = false);

        spawn(lib[0]);
        ask();
        loop();
    }

    function spawn(obj) {
        group.clear(); group.position.z = -500;
        document.getElementById('obj-info').innerText = obj.n;
        if(obj.t === "p") {
            group.add(new THREE.Mesh(new THREE.SphereGeometry(45,32,32), new THREE.MeshStandardMaterial({color: obj.c})));
            if(obj.r) {
                const r = new THREE.Mesh(new THREE.TorusGeometry(65,3,2,50), new THREE.MeshStandardMaterial({color:0x888888, transparent:true, opacity:0.5}));
                r.rotation.x = 1.5; group.add(r);
            }
        } else if(obj.t === "bh") {
            group.add(new THREE.Mesh(new THREE.SphereGeometry(30,32,32), new THREE.MeshBasicMaterial({color:0})));
            const d = new THREE.Mesh(new THREE.TorusGeometry(55,5,2,50), new THREE.MeshBasicMaterial({color:0xff6600}));
            d.rotation.x = 1.4; group.add(d);
        } else if(obj.t === "gx") {
            const gG = new THREE.BufferGeometry(); const gP = [];
            for(let i=0; i<2000; i++) { let r=Math.random()*110, a=r*0.15; gP.push(Math.cos(a)*r, (Math.random()-0.5)*15, Math.sin(a)*r); }
            gG.setAttribute('position', new THREE.Float32BufferAttribute(gP, 3));
            group.add(new THREE.Points(gG, new THREE.PointsMaterial({color:obj.c, size:1})));
        } else if(obj.t === "nb") {
            for(let i=0; i<12; i++) {
                const m = new THREE.Mesh(new THREE.SphereGeometry(Math.random()*30+5,8,8), new THREE.MeshBasicMaterial({color:obj.c, transparent:true, opacity:0.1, wireframe:true}));
                m.position.set((Math.random()-0.5)*100,(Math.random()-0.5)*100,(Math.random()-0.5)*100); group.add(m);
            }
        }
    }

    function ask() {
        let n1 = Math.floor(Math.random()*9)+2, n2 = Math.floor(Math.random()*9)+2;
        target = n1*n2; document.getElementById('q').innerText = `${n1} × ${n2}`;
        curStr = ""; document.getElementById('a').innerText = "?";
    }

    function p(v) { if(curStr.length < 3) { curStr += v; document.getElementById('a').innerText = curStr; } }
    function clr() { curStr = ""; document.getElementById('a').innerText = "?"; }

    function check() {
        if(parseInt(curStr) === target) {
            score++; dist += 30000;
            document.getElementById('d-ui').innerText = dist.toLocaleString() + " ק\"מ";
            document.getElementById('toast').style.opacity = 1;
            isJump = true;
            setTimeout(() => {
                document.getElementById('toast').style.opacity = 0;
                isJump = false;
                spawn(lib[Math.floor(Math.random()*lib.length)]);
                ask();
            }, 800);
        } else { clr(); }
    }

    function loop() {
        requestAnimationFrame(loop);
        if(isJump) {
            group.position.z += 40;
            const p = stars.geometry.attributes.position.array;
            for(let i=0; i<p.length; i+=3) { p[i+2]+=25; if(p[i+2]>200) p[i+2]=-1500; }
            stars.geometry.attributes.position.needsUpdate = true;
        } else {
            if(group.position.z < 0) group.position.z += 12;
            // החלקת הסיבוב
            group.rotation.x += (targetRotX - group.rotation.x) * 0.1;
            group.rotation.y += (targetRotY - group.rotation.y) * 0.1 + 0.005;
        }
        rend.render(sc, cam);
    }
    init();
</script>
</body>
</html>
