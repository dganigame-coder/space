    <!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v8.1.5</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #ui-layer { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; z-index: 10; }
        
        #top-hud { width: 100%; display: flex; justify-content: space-around; padding-top: 10px; }
        .hud-box { background: rgba(0, 242, 255, 0.05); padding: 5px 12px; border-radius: 15px; border: 1px solid rgba(0, 242, 255, 0.3); color: #00f2ff; font-size: 0.8rem; backdrop-filter: blur(4px); }
        
        #game-view { flex-grow: 1; }

        #control-panel { 
            max-height: 25vh; 
            padding-bottom: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            pointer-events: auto; 
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
        }
        
        #scan-title { color: #00f2ff; font-size: 1rem; margin: 0; text-shadow: 0 0 10px #000; }
        #question-row { display: flex; align-items: center; gap: 15px; margin: 5px 0; }
        #question { font-size: 2.5rem; color: #fff; text-shadow: 0 0 15px #000; margin: 0; }
        #answer-display { font-size: 2.5rem; color: #ff00de; min-width: 50px; text-align: center; }
        
        #numpad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 10px; background: rgba(255, 255, 255, 0.05); border-radius: 15px; backdrop-filter: blur(10px); }
        .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; font-size: 1.2rem; width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .btn-go { background: linear-gradient(45deg, #006622, #00ff66); border: none; width: 80px; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="top-hud">
        <div class="hud-box">📍 <span id="dist">0</span> ק"מ</div>
        <div class="hud-box">🎖️ <span id="rank-name">צוערת</span></div>
    </div>
    <div id="game-view"></div>
    <div id="control-panel">
        <p id="scan-title">מזהה אובייקט...</p>
        <div id="question-row">
            <div id="question">? × ?</div>
            <div id="answer-display">?</div>
        </div>
        <div id="numpad">
            <div class="btn" onclick="press(1)">1</div><div class="btn" onclick="press(2)">2</div><div class="btn" onclick="press(3)">3</div>
            <div class="btn" onclick="press(4)">4</div><div class="btn" onclick="press(5)">5</div><div class="btn" style="color:#ff4444" onclick="del()">X</div>
            <div class="btn" onclick="press(6)">6</div><div class="btn" onclick="press(7)">7</div><div class="btn" onclick="press(8)">8</div>
            <div class="btn" onclick="press(9)">9</div><div class="btn" onclick="press(0)">0</div><div class="btn btn-go" onclick="check()">שיגור</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, stars, universeGroup;
    let score = 0, currentAns = 0, inputStr = "", distance = 0;
    let isJumping = false, speed = 0.1, targetRotX = 0, targetRotY = 0;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 5000);
        camera.position.set(0, 10, 150);
        
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.PointLight(0xffffff, 1.5);
        light.position.set(50, 50, 100);
        scene.add(light, new THREE.AmbientLight(0xffffff, 0.3));

        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<6000; i++) starPos.push((Math.random()-0.5)*3000, (Math.random()-0.5)*3000, (Math.random()-0.5)*3000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 }));
        scene.add(stars);

        universeGroup = new THREE.Group();
        universeGroup.position.y = 30;
        scene.add(universeGroup);

        createObject("earth");
        nextLevel(); animate();
    }

    function createObject(type) {
        universeGroup.clear();
        universeGroup.position.z = -500;
        const title = document.getElementById('scan-title');
        
        if(type === "earth") {
            title.innerText = "מזהה: כדור הארץ";
            universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(45,32,32), new THREE.MeshStandardMaterial({color: 0x2266ff, emissive: 0x112244})));
        } else {
            const types = ["חור שחור", "שמש", "גלקסיה", "כוכב לכת סגול"];
            const choice = types[Math.floor(Math.random()*types.length)];
            title.innerText = "מזהה: " + choice;

            if(choice === "חור שחור") {
                // ליבה שחורה לגמרי עם טבעת אור
                universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(25,32,32), new THREE.MeshBasicMaterial({color: 0x000000})));
                const ring = new THREE.Mesh(new THREE.TorusGeometry(40, 3, 2, 100), new THREE.MeshBasicMaterial({color: 0xffaa00}));
                ring.rotation.x = 1.2; universeGroup.add(ring);
            } else if(choice === "שמש") {
                universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(40,32,32), new THREE.MeshBasicMaterial({color: 0xffcc00})));
            } else if(choice === "גלקסיה") {
                const gGeo = new THREE.BufferGeometry(); const gPos = [];
                for(let i=0; i<4000; i++) {
                    const r = Math.random()*120; const a = r*0.1 + (i%3)*(Math.PI*2/3);
                    gPos.push(Math.cos(a)*r, (Math.random()-0.5)*10, Math.sin(a)*r);
                }
                gGeo.setAttribute('position', new THREE.Float32BufferAttribute(gPos, 3));
                universeGroup.add(new THREE.Points(gGeo, new THREE.PointsMaterial({color: 0x00f2ff, size: 1.2})));
            } else {
                // הכדור הסגול שאהבת, אבל עכשיו עם שם מתאים!
                universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(40,32,32), new THREE.MeshStandardMaterial({color: 0xaa00ff})));
            }
        }
    }

    function check() {
        if(parseInt(inputStr) === currentAns) {
            score++; distance += 15000;
            document.getElementById('dist').innerText = distance.toLocaleString();
            isJumping = true;
            setTimeout(() => { createObject("random"); nextLevel(); }, 700);
        } else { del(); }
    }

    function nextLevel() {
        let n1 = Math.floor(Math.random()*8)+2, n2 = Math.floor(Math.random()*9)+2;
        currentAns = n1 * n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        inputStr = ""; document.getElementById('answer-display').innerText = "?";
        const ranks = ["צוערת", "טייסת", "מפקדת", "חוקרת", "קפטנית"];
        document.getElementById('rank-name').innerText = ranks[Math.min(Math.floor(score/5), 4)];
    }

    function press(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('answer-display').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }

    function animate() {
        requestAnimationFrame(animate);
        if(isJumping) {
            universeGroup.position.z += (1200 - universeGroup.position.z) * 0.12;
            speed = 50;
            if(universeGroup.position.z > 1100) { isJumping = false; universeGroup.position.z = -600; speed = 0.1; }
        } else {
            universeGroup.position.z += (0 - universeGroup.position.z) * 0.05;
        }
        universeGroup.rotation.y += 0.005;
        const p = stars.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { p[i+2] += speed; if(p[i+2] > 200) p[i+2] = -2000; }
        stars.geometry.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
