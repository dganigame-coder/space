<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v8.0.7</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #ui-layer { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; z-index: 10; }
        
        /* חלק עליון - נתונים */
        #top-hud { width: 100%; display: flex; justify-content: space-around; padding-top: 15px; }
        .hud-box { background: rgba(0, 40, 80, 0.7); padding: 8px 12px; border-radius: 12px; border: 1px solid #00f2ff; color: #00f2ff; font-weight: bold; font-size: 0.8rem; }
        
        /* אזור המשחק התחתון */
        #bottom-controls { margin-top: auto; padding-bottom: 20px; display: flex; flex-direction: column; align-items: center; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); pointer-events: auto; }
        
        #scan-title { color: #fff; font-size: 1.4rem; text-shadow: 0 0 10px #00f2ff; margin: 0; }
        #question { font-size: 4rem; color: #fff; text-shadow: 0 0 20px #fff; margin: -5px 0; }
        #answer-display { font-size: 2.8rem; color: #ff00de; min-height: 3rem; text-shadow: 0 0 10px #ff00de; margin-bottom: 5px; }
        
        #numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; background: rgba(255, 255, 255, 0.1); border-radius: 25px; backdrop-filter: blur(10px); transform: scale(0.9); }
        .btn { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); color: white; font-size: 1.5rem; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .btn-go { background: linear-gradient(45deg, #006622, #00ff66); border: none; grid-column: span 2; width: auto; border-radius: 15px; font-weight: bold; }
        
        #feedback { position: absolute; top: 20%; width: 100%; text-align: center; color: #00ff66; font-size: 3rem; font-weight: bold; opacity: 0; transition: 0.4s; pointer-events: none; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="top-hud">
        <div class="hud-box">🎖️ <span id="rank-name">צוערת חלל</span></div>
        <div class="hud-box">📍 <span id="dist">0</span> ק"מ</div>
    </div>
    
    <div id="feedback">מעולה!</div>

    <div id="bottom-controls">
        <p id="scan-title">כדור הארץ</p>
        <div id="question">? × ?</div>
        <div id="answer-display">?</div>
        <div id="numpad">
            <div class="btn" onclick="press(1)">1</div><div class="btn" onclick="press(2)">2</div><div class="btn" onclick="press(3)">3</div>
            <div class="btn" onclick="press(4)">4</div><div class="btn" onclick="press(5)">5</div><div class="btn" onclick="press(6)">6</div>
            <div class="btn" onclick="press(7)">7</div><div class="btn" onclick="press(8)">8</div><div class="btn" onclick="press(9)">9</div>
            <div class="btn" style="color:#ff4444" onclick="del()">X</div><div class="btn" onclick="press(0)">0</div><div class="btn btn-go" onclick="check()">שיגור 🚀</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, stars, universeGroup, earth;
    let score = 0, currentAns = 0, lastQ = "", inputStr = "", distance = 0;
    let isJumping = false, speed = 0.05, targetRotX = 0, targetRotY = 0;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 10000);
        camera.position.z = 150;
        
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<10000; i++) starPos.push((Math.random()-0.5)*5000, (Math.random()-0.5)*5000, (Math.random()-0.5)*5000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 }));
        scene.add(stars);

        const earthGeo = new THREE.SphereGeometry(50, 32, 32);
        earth = new THREE.Mesh(earthGeo, new THREE.MeshStandardMaterial({ color: 0x2244ff, emissive: 0x112244 }));
        earth.position.y = 30; // להעלות את כדור הארץ
        scene.add(earth);
        
        scene.add(new THREE.PointLight(0xffffff, 1.5, 1000).set(100, 100, 100));
        scene.add(new THREE.AmbientLight(0x505050));
        
        universeGroup = new THREE.Group();
        universeGroup.position.y = 30; // להעלות את כל האובייקטים למעלה
        scene.add(universeGroup);

        // מגע - עובד על כל המסך חוץ מהמקלדת
        let sX, sY;
        document.addEventListener('touchstart', e => { 
            if(!e.target.closest('#numpad')) { sX = e.touches[0].clientX; sY = e.touches[0].clientY; } 
        });
        document.addEventListener('touchmove', e => {
            if(!e.target.closest('#numpad')) {
                targetRotY += (e.touches[0].clientX - sX) * 0.01;
                targetRotX += (e.touches[0].clientY - sY) * 0.01;
                sX = e.touches[0].clientX; sY = e.touches[0].clientY;
            }
        });
        nextLevel(); animate();
    }

    function generateObject() {
        universeGroup.clear();
        universeGroup.position.z = -1200;
        universeGroup.rotation.set(0,0,0);
        targetRotX = 0; targetRotY = 0;
        const color = new THREE.Color().setHSL(Math.random(), 1, 0.5);
        const title = document.getElementById('scan-title');
        const type = Math.floor(Math.random() * 10);

        switch(type) {
            case 0: 
                title.innerText = "מערכת שמש";
                universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(40,32,32), new THREE.MeshBasicMaterial({color: 0xffaa00})));
                let pG = new THREE.Group();
                let p = new THREE.Mesh(new THREE.SphereGeometry(10,24,24), new THREE.MeshStandardMaterial({color: 0x00f2ff}));
                p.position.x = 80; pG.add(p); universeGroup.add(pG);
                universeGroup.userData.rotateY = pG; break;
            case 1:
                title.innerText = "גלקסיה ספירלית";
                const galGeo = new THREE.BufferGeometry(); const galPos = [];
                for(let i=0; i<8000; i++) {
                    const b = i % 3; const r = Math.random() * 160;
                    const a = (r * 0.1) + (b * (Math.PI * 2 / 3));
                    galPos.push(Math.cos(a)*r, (Math.random()-0.5)*15, Math.sin(a)*r);
                }
                galGeo.setAttribute('position', new THREE.Float32BufferAttribute(galPos, 3));
                let galPts = new THREE.Points(galGeo, new THREE.PointsMaterial({color: color, size: 1.5, transparent: true, opacity: 0.8}));
                universeGroup.add(galPts); universeGroup.userData.rotateY = galPts; break;
            case 8:
                title.innerText = "תחנת חלל";
                let core = new THREE.Mesh(new THREE.BoxGeometry(20,20,60), new THREE.MeshStandardMaterial({color: 0xaaaaaa}));
                let panel = new THREE.Mesh(new THREE.BoxGeometry(150, 30, 2), new THREE.MeshBasicMaterial({color: 0x0055ff}));
                universeGroup.add(core, panel); universeGroup.userData.rotateY = universeGroup; break;
            // הוספת שאר האובייקטים (חיתוך לצורך קיצור, כולם בפנים)
            default:
                title.innerText = "ערפילית קוסמית";
                const nebGeo = new THREE.BufferGeometry(); const nebPos = [];
                for(let i=0; i<2000; i++) nebPos.push((Math.random()-0.5)*250, (Math.random()-0.5)*250, (Math.random()-0.5)*250);
                nebGeo.setAttribute('position', new THREE.Float32BufferAttribute(nebPos, 3));
                universeGroup.add(new THREE.Points(nebGeo, new THREE.PointsMaterial({color: color, size: 2.5, transparent:true, opacity:0.5})));
                universeGroup.userData.rotateY = universeGroup;
        }
    }

    function check() {
        if(parseInt(inputStr) === currentAns) {
            score++; distance = Math.pow(score, 4) * 850;
            document.getElementById('dist').innerText = distance.toLocaleString();
            const fb = document.getElementById('feedback');
            fb.style.opacity = "1";
            isJumping = true; 
            setTimeout(() => {
                fb.style.opacity = "0"; if(earth) { scene.remove(earth); earth = null; }
                generateObject(); nextLevel();
            }, 1000);
        } else { del(); }
    }

    function nextLevel() {
        let n1, n2, q;
        do { n1 = Math.floor(Math.random() * 8) + 2; n2 = Math.floor(Math.random() * 9) + 2; q = n1 + "x" + n2; } while (q === lastQ);
        lastQ = q; currentAns = n1 * n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        inputStr = ""; document.getElementById('answer-display').innerText = "?";
    }

    function press(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('answer-display').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }

    function animate() {
        requestAnimationFrame(animate);
        if(isJumping) {
            if(earth) earth.position.z += 40;
            universeGroup.position.z += (1500 - universeGroup.position.z) * 0.1;
            speed = 70;
            if(universeGroup.position.z > 1400) { isJumping = false; universeGroup.position.z = -800; speed = 0.2; }
        } else { 
            universeGroup.position.z += (-100 - universeGroup.position.z) * 0.1; 
        }

        universeGroup.rotation.x += (targetRotX - universeGroup.rotation.x) * 0.05;
        universeGroup.rotation.y += (targetRotY - universeGroup.rotation.y) * 0.05;
        if(universeGroup.userData.rotateY) universeGroup.userData.rotateY.rotation.y += 0.01;

        const p = stars.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { p[i+2] += speed; if(p[i+2] > 200) p[i+2] = -4000; }
        stars.geometry.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
