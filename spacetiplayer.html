<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v8.1.4 Compact</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        
        #ui-layer { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            pointer-events: none; 
            z-index: 10; 
        }
        
        #top-hud { width: 100%; display: flex; justify-content: space-around; padding-top: 10px; }
        .hud-box { 
            background: rgba(0, 242, 255, 0.05);
            padding: 5px 12px; 
            border-radius: 15px; 
            border: 1px solid rgba(0, 242, 255, 0.3); 
            color: #00f2ff; 
            font-size: 0.8rem;
            backdrop-filter: blur(4px);
        }
        
        /* אזור המשחק - תופס 75% מהמסך */
        #game-view { flex-grow: 1; }

        /* פנל בקרה - מוגבל ל-1/4 מסך */
        #control-panel { 
            max-height: 25vh; 
            padding-bottom: 10px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-end;
            pointer-events: auto; 
            background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
        }
        
        #scan-title { color: #00f2ff; font-size: 0.9rem; margin: 0; opacity: 0.8; }
        
        #question-row { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            margin-bottom: 5px;
        }

        #question { 
            font-size: 2.2rem; 
            color: #fff; 
            text-shadow: 0 0 15px #000;
            margin: 0;
        }
        
        #answer-display { 
            font-size: 2.2rem; 
            color: #ff00de; 
            min-width: 50px;
            text-align: center;
            text-shadow: 0 0 10px #000;
        }
        
        #numpad { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); /* פריסה רוחבית יותר כדי לחסוך גובה */
            gap: 6px; 
            background: rgba(255, 255, 255, 0.03); 
            padding: 8px; 
            border-radius: 15px; 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .btn { 
            background: rgba(255, 255, 255, 0.08); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            color: white; 
            font-size: 1.2rem; 
            width: 45px; 
            height: 45px; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        
        .btn-go { 
            background: linear-gradient(45deg, rgba(0, 150, 50, 0.7), rgba(0, 255, 100, 0.7)); 
            border: none; 
            width: 80px;
            font-weight: bold; 
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="top-hud">
        <div class="hud-box">📍 <span id="dist">0</span> ק"מ</div>
        <div class="hud-box">🎖️ <span id="rank-name">צוערת</span></div>
    </div>
    
    <div id="game-view"></div>

    <div id="control-panel">
        <p id="scan-title">מזהה אובייקט</p>
        <div id="question-row">
            <div id="question">? × ?</div>
            <div id="answer-display">?</div>
        </div>
        <div id="numpad">
            <div class="btn" onclick="press(1)">1</div>
            <div class="btn" onclick="press(2)">2</div>
            <div class="btn" onclick="press(3)">3</div>
            <div class="btn" onclick="press(4)">4</div>
            <div class="btn" onclick="press(5)">5</div>
            <div class="btn" style="color:#ff4444" onclick="del()">X</div>
            <div class="btn" onclick="press(6)">6</div>
            <div class="btn" onclick="press(7)">7</div>
            <div class="btn" onclick="press(8)">8</div>
            <div class="btn" onclick="press(9)">9</div>
            <div class="btn" onclick="press(0)">0</div>
            <div class="btn btn-go" onclick="check()">שיגור</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, stars, universeGroup;
    let score = 0, currentAns = 0, inputStr = "", distance = 0;
    let isJumping = false, speed = 0.1, targetRotX = 0, targetRotY = 0;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 5000);
        camera.position.set(0, 5, 150); // מצלמה נמוכה יותר כדי שהאובייקט יהיה במרכז ה-75% העליונים
        
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const light = new THREE.PointLight(0xffffff, 1);
        light.position.set(50, 50, 100);
        scene.add(light);

        // כוכבים
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<5000; i++) starPos.push((Math.random()-0.5)*3000, (Math.random()-0.5)*3000, (Math.random()-0.5)*3000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 }));
        scene.add(stars);

        universeGroup = new THREE.Group();
        universeGroup.position.y = 20; // מרכוז בשטח הפנוי
        scene.add(universeGroup);

        createObject("earth");

        // שליטה בסיבוב
        let sX, sY;
        window.addEventListener('touchstart', e => {
            if(e.touches[0].clientY < window.innerHeight * 0.75) {
                sX = e.touches[0].clientX; sY = e.touches[0].clientY;
            }
        });
        window.addEventListener('touchmove', e => {
            if(sX !== undefined) {
                targetRotY += (e.touches[0].clientX - sX) * 0.01;
                targetRotX += (e.touches[0].clientY - sY) * 0.01;
                sX = e.touches[0].clientX; sY = e.touches[0].clientY;
            }
        });

        nextLevel(); animate();
    }

    function createObject(type) {
        universeGroup.clear();
        universeGroup.position.z = -500;
        const color = new THREE.Color().setHSL(Math.random(), 0.8, 0.5);
        
        if(type === "earth") {
            document.getElementById('scan-title').innerText = "מזהה: כדור הארץ";
            const geo = new THREE.SphereGeometry(45, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ color: 0x2266ff, emissive: 0x112244 });
            universeGroup.add(new THREE.Mesh(geo, mat));
        } else {
            const obs = ["גלקסיה", "חור שחור", "שמש", "ערפילית"];
            const choice = obs[Math.floor(Math.random()*obs.length)];
            document.getElementById('scan-title').innerText = "מזהה: " + choice;
            
            if(choice === "גלקסיה") {
                const gGeo = new THREE.BufferGeometry(); const gPos = [];
                for(let i=0; i<4000; i++) {
                    const r = Math.random()*120; const a = r*0.1 + (i%3)*(Math.PI*2/3);
                    gPos.push(Math.cos(a)*r, (Math.random()-0.5)*10, Math.sin(a)*r);
                }
                gGeo.setAttribute('position', new THREE.Float32BufferAttribute(gPos, 3));
                universeGroup.add(new THREE.Points(gGeo, new THREE.PointsMaterial({color: color, size: 1.2})));
            } else {
                universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(35,32,32), new THREE.MeshStandardMaterial({color: color})));
            }
        }
    }

    function check() {
        if(parseInt(inputStr) === currentAns) {
            score++; distance += 15000;
            document.getElementById('dist').innerText = distance.toLocaleString();
            isJumping = true;
            setTimeout(() => { createObject("random"); nextLevel(); }, 700);
        } else { del(); }
    }

    function nextLevel() {
        let n1 = Math.floor(Math.random()*8)+2, n2 = Math.floor(Math.random()*9)+2;
        currentAns = n1 * n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        inputStr = ""; document.getElementById('answer-display').innerText = "?";
        const ranks = ["צוערת", "טייסת", "מפקדת", "חוקרת", "קפטנית"];
        document.getElementById('rank-name').innerText = ranks[Math.min(Math.floor(score/5), 4)];
    }

    function press(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('answer-display').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }

    function animate() {
        requestAnimationFrame(animate);
        if(isJumping) {
            universeGroup.position.z += (1200 - universeGroup.position.z) * 0.12;
            speed = 50;
            if(universeGroup.position.z > 1100) { isJumping = false; universeGroup.position.z = -600; speed = 0.1; }
        } else {
            universeGroup.position.z += (0 - universeGroup.position.z) * 0.05;
        }

        universeGroup.rotation.x += (targetRotX - universeGroup.rotation.x) * 0.1;
        universeGroup.rotation.y += (targetRotY - universeGroup.rotation.y) * 0.1 + 0.005;

        const p = stars.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { p[i+2] += speed; if(p[i+2] > 200) p[i+2] = -2000; }
        stars.geometry.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
