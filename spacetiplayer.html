<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל v7.0 - Classic Stable</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; z-index: 10; }
        
        .hud { display: flex; justify-content: space-around; padding: 20px; }
        .stat { background: rgba(0, 242, 255, 0.2); color: #00f2ff; padding: 10px 20px; border-radius: 25px; border: 1px solid #00f2ff; font-weight: bold; backdrop-filter: blur(5px); }

        #feedback { position: absolute; top: 30%; width: 100%; text-align: center; color: #00ff66; font-size: 3rem; font-weight: bold; opacity: 0; transition: 0.3s; pointer-events: none; text-shadow: 0 0 20px #00ff66; }

        #panel { margin-top: auto; background: rgba(0, 0, 0, 0.85); padding: 30px 10px; pointer-events: auto; display: flex; flex-direction: column; align-items: center; border-top: 2px solid #00f2ff; }
        
        #label { color: #00f2ff; font-size: 1.2rem; margin-bottom: 10px; font-weight: bold; }
        
        #math { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        #q { color: white; font-size: 4rem; font-weight: 900; }
        #a { color: #ff00de; font-size: 4rem; min-width: 80px; text-align: center; font-weight: 900; border-bottom: 4px solid #ff00de; }

        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
        .key { width: 55px; height: 55px; background: #222; color: white; border: 1px solid #444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; transition: 0.1s; }
        .key:active { background: #00f2ff; color: black; transform: scale(0.9); }
        .go { background: #00ff66; color: black; border: none; width: 110px; border-radius: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui">
    <div class="hud">
        <div class="stat"><span id="rank">טירונית</span></div>
        <div class="stat">📍 <span id="dist">0</span> ק"מ</div>
    </div>
    <div id="feedback">פגיעה בול!</div>
    <div id="panel">
        <div id="label">מזהה: כדור הארץ</div>
        <div id="math">
            <div id="q">? × ?</div>
            <div id="a">?</div>
        </div>
        <div class="grid">
            <div class="key" onclick="t(1)">1</div><div class="key" onclick="t(2)">2</div><div class="key" onclick="t(3)">3</div>
            <div class="key" onclick="t(4)">4</div><div class="key" onclick="t(5)">5</div><div class="key" onclick="c()" style="color:#ff4444">X</div>
            <div class="key" onclick="t(6)">6</div><div class="key" onclick="t(7)">7</div><div class="key" onclick="t(8)">8</div>
            <div class="key" onclick="t(9)">9</div><div class="key" onclick="t(0)">0</div><div class="key go" onclick="ok()">GO</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, objGroup, stars, ans, cur = "", sc = 0, dist = 0, jump = false, spd = 0.2;
    const objs = ["כדור הארץ", "מאדים", "צדק", "שבתאי", "נפטון", "חור שחור", "גלקסיה"];

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 150;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        objGroup = new THREE.Group();
        scene.add(objGroup);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        let light = new THREE.PointLight(0xffffff, 1);
        light.position.set(50, 50, 100);
        scene.add(light);

        // כוכבים ברקע
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<2000; i++) starPos.push((Math.random()-0.5)*2000, (Math.random()-0.5)*2000, (Math.random()-0.5)*2000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1}));
        scene.add(stars);

        makeObj("כדור הארץ");
        gen();
        animate();
    }

    function makeObj(name) {
        objGroup.clear();
        document.getElementById('label').innerText = "מזהה: " + name;
        let mat = new THREE.MeshStandardMaterial({color: Math.random() * 0xffffff});
        let geo = new THREE.SphereGeometry(40, 32, 32);

        if(name === "חור שחור") mat = new THREE.MeshBasicMaterial({color: 0x000000});
        
        let mesh = new THREE.Mesh(geo, mat);
        objGroup.add(mesh);

        if(name === "שבתאי") {
            let ring = new THREE.Mesh(new THREE.TorusGeometry(55, 3, 2, 50), new THREE.MeshStandardMaterial({color: 0x888888}));
            ring.rotation.x = 1.5;
            objGroup.add(ring);
        }
    }

    function gen() {
        let n1 = Math.floor(Math.random()*9)+2, n2 = Math.floor(Math.random()*9)+2;
        ans = n1 * n2;
        document.getElementById('q').innerText = `${n1} × ${n2}`;
        cur = ""; document.getElementById('a').innerText = "?";
    }

    function t(n) { if(cur.length < 3) { cur += n; document.getElementById('a').innerText = cur; } }
    function c() { cur = ""; document.getElementById('a').innerText = "?"; }

    function ok() {
        if(parseInt(cur) === ans) {
            sc++; dist += 25000;
            document.getElementById('dist').innerText = dist.toLocaleString();
            const rks = ["טירונית", "טייסת", "מפקדת", "אדמירלית"];
            document.getElementById('rank').innerText = rks[Math.min(Math.floor(sc/5), 3)];
            
            document.getElementById('feedback').style.opacity = 1;
            jump = true;
            setTimeout(() => {
                document.getElementById('feedback').style.opacity = 0;
                makeObj(objs[Math.floor(Math.random()*objs.length)]);
                gen();
            }, 800);
        } else { c(); }
    }

    function animate() {
        requestAnimationFrame(animate);
        if(jump) {
            objGroup.position.z += (800 - objGroup.position.z) * 0.1;
            spd = 40;
            if(objGroup.position.z > 700) { jump = false; objGroup.position.z = -500; spd = 0.2; }
        } else {
            objGroup.position.z += (0 - objGroup.position.z) * 0.05;
        }
        objGroup.rotation.y += 0.01;
        
        const positions = stars.geometry.attributes.position.array;
        for(let i=0; i<positions.length; i+=3) {
            positions[i+2] += spd;
            if(positions[i+2] > 200) positions[i+2] = -1800;
        }
        stars.geometry.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
