<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל v7.0</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        
        /* פנל שקוף לחלוטין */
        #ui { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: none; z-index: 10; }
        
        .header { display: flex; justify-content: space-around; padding: 15px; }
        .stat-box { color: #00f2ff; font-weight: bold; text-shadow: 2px 2px 4px #000; font-size: 1.2rem; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 20px; }

        #msg { position: absolute; top: 20%; width: 100%; text-align: center; color: #00ff66; font-size: 3.5rem; opacity: 0; font-weight: bold; text-shadow: 0 0 20px #000; transition: 0.2s; }

        #panel { margin-top: auto; padding-bottom: 30px; pointer-events: auto; display: flex; flex-direction: column; align-items: center; background: transparent; }
        
        #obj-name { color: #ffcc00; font-size: 1.5rem; margin-bottom: 10px; text-shadow: 2px 2px 8px #000; font-weight: bold; }
        
        #math-display { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; }
        #q-text { color: #fff; font-size: 4.5rem; font-weight: 900; text-shadow: 0 0 20px #000; }
        #a-text { color: #ff00de; font-size: 4.5rem; min-width: 80px; border-bottom: 6px solid #ff00de; text-align: center; font-weight: 900; text-shadow: 0 0 20px #000; }

        .keypad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; width: 95%; max-width: 450px; }
        .btn { height: 65px; background: rgba(255, 255, 255, 0.2); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; border: 1px solid rgba(255,255,255,0.4); backdrop-filter: blur(4px); }
        .btn:active { background: #00f2ff; color: #000; transform: scale(0.9); }
        .btn-go { background: rgba(0, 255, 100, 0.5); grid-column: span 2; border-radius: 20px; font-weight: bold; border: 2px solid #00ff66; }
    </style>
</head>
<body>

<div id="ui">
    <div class="header">
        <div class="stat-box" id="rank-ui">צוערת</div>
        <div class="stat-box" id="dist-ui">0 ק"מ</div>
    </div>
    <div id="msg">מצוין! 🚀</div>
    <div id="panel">
        <div id="obj-name">מזהה...</div>
        <div id="math-display">
            <div id="q-text">? × ?</div>
            <div id="a-text">?</div>
        </div>
        <div class="keypad">
            <div class="btn" onclick="num(1)">1</div><div class="btn" onclick="num(2)">2</div><div class="btn" onclick="num(3)">3</div>
            <div class="btn" onclick="num(4)">4</div><div class="btn" onclick="num(5)">5</div><div class="btn" onclick="del()" style="color:#ff4444">X</div>
            <div class="btn" onclick="num(6)">6</div><div class="btn" onclick="num(7)">7</div><div class="btn" onclick="num(8)">8</div>
            <div class="btn" onclick="num(9)">9</div><div class="btn" onclick="num(0)">0</div><div class="btn btn-go" onclick="launch()">GO</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // --- JS גנרי מובנה (כאן את מוסיפה אובייקטים בקלות) ---
    const spaceData = [
        { n: "כדור הארץ", t: "p", c: 0x2266ff },
        { n: "מאדים", t: "p", c: 0xff4400 },
        { n: "שבתאי", t: "p", c: 0xdfbe9f, r: true },
        { n: "חור שחור", t: "bh", c: 0x000000 },
        { n: "ערפילית", t: "nb", c: 0x00ffcc },
        { n: "גלקסיה", t: "gx", c: 0xffffff },
        { n: "השמש", t: "p", c: 0xffcc00 }
    ];

    let scene, camera, renderer, currentGroup, stars, target, inputStr = "", score = 0, dist = 0, isWarp = false;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1500);
        camera.position.z = 150;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.PointLight(0xffffff, 1.5);
        light.position.set(50, 50, 100);
        scene.add(light, new THREE.AmbientLight(0xffffff, 0.4));

        // כוכבי רקע
        const sGeo = new THREE.BufferGeometry();
        const sPos = [];
        for(let i=0; i<2500; i++) sPos.push((Math.random()-0.5)*2000, (Math.random()-0.5)*2000, (Math.random()-0.5)*2000);
        sGeo.setAttribute('position', new THREE.Float32BufferAttribute(sPos, 3));
        stars = new THREE.Points(sGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.9}));
        scene.add(stars);

        create(spaceData[0]);
        newQ();
        loop();
    }

    function create(data) {
        if(currentGroup) scene.remove(currentGroup);
        currentGroup = new THREE.Group();
        document.getElementById('obj-name').innerText = data.n;

        if(data.t === "p") {
            currentGroup.add(new THREE.Mesh(new THREE.SphereGeometry(40, 32, 32), new THREE.MeshStandardMaterial({color: data.c})));
            if(data.r) {
                const ring = new THREE.Mesh(new THREE.TorusGeometry(60, 3, 2, 50), new THREE.MeshStandardMaterial({color: 0x888888, transparent: true, opacity: 0.5}));
                ring.rotation.x = 1.5; currentGroup.add(ring);
            }
        } else if(data.t === "bh") {
            currentGroup.add(new THREE.Mesh(new THREE.SphereGeometry(30, 32, 32), new THREE.MeshBasicMaterial({color: 0})));
            const disk = new THREE.Mesh(new THREE.TorusGeometry(55, 5, 2, 60), new THREE.MeshBasicMaterial({color: 0xff4400}));
            disk.rotation.x = 1.4; currentGroup.add(disk);
        } else if(data.t === "nb") {
            for(let i=0; i<12; i++) {
                const m = new THREE.Mesh(new THREE.SphereGeometry(Math.random()*30+10, 8, 8), new THREE.MeshBasicMaterial({color: data.c, transparent: true, opacity: 0.1, wireframe: true}));
                m.position.set((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100);
                currentGroup.add(m);
            }
        } else if(data.t === "gx") {
            const gG = new THREE.BufferGeometry(); const gP = [];
            for(let i=0; i<3000; i++) { let r=Math.random()*110, a=r*0.15; gP.push(Math.cos(a)*r, (Math.random()-0.5)*15, Math.sin(a)*r); }
            gG.setAttribute('position', new THREE.Float32BufferAttribute(gP, 3));
            currentGroup.add(new THREE.Points(gG, new THREE.PointsMaterial({color: 0x00f2ff, size: 1})));
        }

        scene.add(currentGroup);
    }

    function newQ() {
        let a = Math.floor(Math.random()*9)+2, b = Math.floor(Math.random()*9)+2;
        target = a * b;
        document.getElementById('q-text').innerText = `${a} × ${b}`;
        inputStr = ""; document.getElementById('a-text').innerText = "?";
    }

    function num(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('a-text').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('a-text').innerText = "?"; }

    function launch() {
        if(parseInt(inputStr) === target) {
            score++; dist += 25000;
            document.getElementById('dist-ui').innerText = dist.toLocaleString() + " ק\"מ";
            document.getElementById('msg').style.opacity = 1;
            isWarp = true;
            setTimeout(() => {
                document.getElementById('msg').style.opacity = 0;
                isWarp = false;
                create(spaceData[Math.floor(Math.random()*spaceData.length)]);
                newQ();
            }, 800);
        } else { del(); }
    }

    function loop() {
        requestAnimationFrame(loop);
        if(isWarp) {
            currentGroup.position.z += 30;
            const p = stars.geometry.attributes.position.array;
            for(let i=0; i<p.length; i+=3) { p[i+2] += 25; if(p[i+2]>200) p[i+2]=-1200; }
            stars.geometry.attributes.position.needsUpdate = true;
        } else {
            if(currentGroup.position.z > 0) currentGroup.position.z -= 15;
            currentGroup.rotation.y += 0.005;
        }
        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
