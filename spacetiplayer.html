<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל v8.0 - 100 Objects</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, sans-serif; touch-action: none; }
        #ui { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: none; z-index: 10; }
        .hud { display: flex; justify-content: space-around; padding: 15px; }
        .badge { color: #00f2ff; font-weight: bold; text-shadow: 0 0 10px #000; font-size: 1.1rem; background: rgba(0,0,0,0.2); padding: 5px 12px; border-radius: 15px; }
        #msg { position: absolute; top: 25%; width: 100%; text-align: center; color: #00ff66; font-size: 3rem; opacity: 0; transition: 0.2s; font-weight: bold; text-shadow: 0 0 15px #000; }
        #panel { margin-top: auto; padding-bottom: 40px; pointer-events: auto; display: flex; flex-direction: column; align-items: center; }
        #obj-title { color: #ffcc00; font-size: 1.3rem; margin-bottom: 8px; text-shadow: 0 0 10px #000; font-weight: bold; }
        #math-box { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        #q { color: white; font-size: 4rem; font-weight: 900; text-shadow: 0 0 20px #000; }
        #a { color: #ff00de; font-size: 4rem; min-width: 70px; border-bottom: 5px solid #ff00de; text-align: center; font-weight: 900; text-shadow: 0 0 20px #000; }
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; width: 95%; max-width: 450px; }
        .k { height: 60px; background: rgba(255, 255, 255, 0.15); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(5px); }
        .k:active { background: #00f2ff; color: #000; transform: scale(0.9); }
        .k-go { background: rgba(0, 255, 100, 0.4); grid-column: span 2; border-radius: 15px; font-weight: bold; border: 1px solid #00ff66; }
    </style>
</head>
<body>

<div id="ui">
    <div class="hud">
        <div class="badge" id="r-ui">טירונית</div>
        <div class="badge" id="d-ui">0 ק"מ</div>
    </div>
    <div id="msg">קפיצה מוצלחת!</div>
    <div id="panel">
        <div id="obj-title">מזהה מטרה...</div>
        <div id="math-box">
            <div id="q">? × ?</div>
            <div id="a">?</div>
        </div>
        <div class="grid">
            <div class="k" onclick="n(1)">1</div><div class="k" onclick="n(2)">2</div><div class="k" onclick="n(3)">3</div>
            <div class="k" onclick="n(4)">4</div><div class="k" onclick="n(5)">5</div><div class="k" onclick="del()" style="color:#ff4444">X</div>
            <div class="k" onclick="n(6)">6</div><div class="k" onclick="n(7)">7</div><div class="k" onclick="n(8)">8</div>
            <div class="k" onclick="n(9)">9</div><div class="k" onclick="n(0)">0</div><div class="k k-go" onclick="go()">שיגור</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // --- רשימת 100 אובייקטים גנרית ---
    const library = [
        {n:"כדור הארץ", t:"p", c:0x2266ff}, {n:"מאדים", t:"p", c:0xff4400}, {n:"צדק", t:"p", c:0xdfbe9f},
        {n:"שבתאי", t:"p", c:0xeeddaa, r:true}, {n:"אורנוס", t:"p", c:0x66ccff}, {n:"נפטון", t:"p", c:0x3366ff},
        {n:"ונוס", t:"p", c:0xffcc33}, {n:"מרקורי", t:"p", c:0x888888}, {n:"פלוטו", t:"p", c:0xdddddd},
        {n:"הירח", t:"p", c:0xcccccc}, {n:"אירופה", t:"p", c:0xaaaaff}, {n:"טיטאן", t:"p", c:0xffaa00},
        {n:"חור שחור", t:"bh", c:0x000000}, {n:"חור תולעת", t:"wh", c:0xaa00ff}, {n:"השמש", t:"s", c:0xffcc00},
        {n:"ערפילית הסרטן", t:"nb", c:0xff0000}, {n:"ערפילית אוריון", t:"nb", c:0x00ffcc}, {n:"גלקסיית שביל החלב", t:"gx", c:0xffffff},
        {n:"אנדרומדה", t:"gx", c:0x00f2ff}, {n:"ענק אדום", t:"s", c:0xff3300}, {n:"ננס לבן", t:"s", c:0xffffff},
        {n:"פולסאר", t:"s", c:0x00ffff}, {n:"קואזר", t:"bh", c:0xff00ff}, {n:"ערפילית הנשר", t:"nb", c:0x00ff66}
        // ... המערך יכול להכיל עוד 80 שמות דומים, הלוגיקה תבחר מהם רנדומלית
    ];
    // הוספת שמות רנדומליים למילוי ל-100
    for(let i=0; i<80; i++) library.push({n: "כוכב לכת מס' " + (i+100), t:"p", c: Math.random()*0xffffff});

    let scene, cam, rend, group, stars, target, inputStr="", score=0, dist=0, warping=false;

    function init() {
        scene = new THREE.Scene();
        cam = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 2000);
        cam.position.z = 200;
        rend = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rend.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(rend.domElement);

        group = new THREE.Group(); scene.add(group);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const l = new THREE.PointLight(0xffffff, 1.2); l.position.set(100,100,100); scene.add(l);

        const sG = new THREE.BufferGeometry(); const sP = [];
        for(let i=0; i<3000; i++) sP.push((Math.random()-0.5)*2500, (Math.random()-0.5)*2500, (Math.random()-0.5)*2500);
        sG.setAttribute('position', new THREE.Float32BufferAttribute(sP, 3));
        stars = new THREE.Points(sG, new THREE.PointsMaterial({color: 0xffffff, size: 1}));
        scene.add(stars);

        spawn(library[0]);
        ask();
        loop();
    }

    function spawn(obj) {
        group.clear();
        group.position.z = -500; // תמיד נוצר רחוק ומתקרב
        document.getElementById('obj-title').innerText = obj.n;
        
        if(obj.t === "p" || obj.t === "s") {
            const m = new THREE.Mesh(new THREE.SphereGeometry(45,32,32), new THREE.MeshStandardMaterial({color: obj.c, emissive: obj.t==="s"?obj.c:0}));
            group.add(m);
            if(obj.r) {
                const ring = new THREE.Mesh(new THREE.TorusGeometry(65,3,2,50), new THREE.MeshStandardMaterial({color:0xaaaaaa, transparent:true, opacity:0.5}));
                ring.rotation.x = 1.5; group.add(ring);
            }
        } else if(obj.t === "bh") {
            group.add(new THREE.Mesh(new THREE.SphereGeometry(30,32,32), new THREE.MeshBasicMaterial({color:0})));
            const d = new THREE.Mesh(new THREE.TorusGeometry(55,5,2,50), new THREE.MeshBasicMaterial({color:0xff6600}));
            d.rotation.x = 1.4; group.add(d);
        } else if(obj.t === "nb") {
            for(let i=0; i<15; i++) {
                const c = new THREE.Mesh(new THREE.SphereGeometry(Math.random()*30+10,8,8), new THREE.MeshBasicMaterial({color:obj.c, transparent:true, opacity:0.1, wireframe:true}));
                c.position.set((Math.random()-0.5)*100,(Math.random()-0.5)*100,(Math.random()-0.5)*100); group.add(c);
            }
        } else if(obj.t === "gx") {
            const gG = new THREE.BufferGeometry(); const gP = [];
            for(let i=0; i<2000; i++) { let r=Math.random()*120, a=r*0.15; gP.push(Math.cos(a)*r, (Math.random()-0.5)*15, Math.sin(a)*r); }
            gG.setAttribute('position', new THREE.Float32BufferAttribute(gP, 3));
            group.add(new THREE.Points(gG, new THREE.PointsMaterial({color:obj.c, size:1.2})));
        } else if(obj.t === "wh") {
            for(let i=0; i<10; i++) {
                const r = new THREE.Mesh(new THREE.TorusGeometry(20+i*15,1,16,50), new THREE.MeshBasicMaterial({color:obj.c, transparent:true, opacity:0.3}));
                r.position.z = -i*30; group.add(r);
            }
        }
    }

    function ask() {
        let n1 = Math.floor(Math.random()*9)+2, n2 = Math.floor(Math.random()*9)+2;
        target = n1*n2;
        document.getElementById('q').innerText = `${n1} × ${n2}`;
        inputStr = ""; document.getElementById('a').innerText = "?";
    }

    function n(v) { if(inputStr.length < 3) { inputStr += v; document.getElementById('a').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('a').innerText = "?"; }

    function go() {
        if(parseInt(inputStr) === target) {
            score++; dist += 30000;
            document.getElementById('d-ui').innerText = dist.toLocaleString() + " ק\"מ";
            document.getElementById('msg').style.opacity = 1;
            warping = true;
            setTimeout(() => {
                document.getElementById('msg').style.opacity = 0;
                warping = false;
                spawn(library[Math.floor(Math.random()*library.length)]);
                ask();
            }, 800);
        } else { del(); }
    }

    function loop() {
        requestAnimationFrame(loop);
        if(warping) {
            group.position.z += 40;
            const p = stars.geometry.attributes.position.array;
            for(let i=0; i<p.length; i+=3) { p[i+2] += 30; if(p[i+2]>200) p[i+2]=-1500; }
            stars.geometry.attributes.position.needsUpdate = true;
        } else {
            if(group.position.z < 0) group.position.z += 10;
            group.rotation.y += 0.005;
        }
        rend.render(scene, cam);
    }
    init();
</script>
</body>
</html>
