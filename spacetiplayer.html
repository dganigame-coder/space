 <!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v8.6 Stable</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #game-canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; z-index: 10; pointer-events: none; 
        }

        .hud-container { display: flex; justify-content: space-around; padding: 10px; pointer-events: auto; }
        .hud-box { background: rgba(0, 40, 80, 0.6); color: #00f2ff; padding: 5px 12px; border-radius: 10px; border: 1px solid #00f2ff; font-size: 0.8rem; }

        #success-pop { 
            position: absolute; top: 20%; width: 100%; text-align: center; 
            color: #00ff66; font-size: 2rem; font-weight: bold; opacity: 0; transition: 0.3s; 
        }

        #bottom-panel { 
            margin-top: auto; height: 25vh; background: rgba(0,0,0,0.8); 
            pointer-events: auto; display: flex; flex-direction: column; align-items: center; padding-bottom: 10px;
        }

        #obj-label { color: #00f2ff; font-size: 1rem; margin-top: 5px; }
        #math-area { display: flex; align-items: center; gap: 15px; margin: 5px 0; }
        #question { color: white; font-size: 2.5rem; font-weight: bold; }
        #answer { color: #ff00de; font-size: 2.5rem; min-width: 50px; text-align: center; }

        #numpad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
        .btn { 
            width: 45px; height: 45px; background: #333; color: white; border: 1px solid #555;
            border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }
        .btn:active { background: #555; }
        .btn-go { background: #006622; width: 80px; font-weight: bold; border: none; }
    </style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="ui-layer">
    <div class="hud-container">
        <div class="hud-box">דרגה: <span id="rank-txt">טירונית</span></div>
        <div class="hud-box">ניקוד: <span id="score-txt">0</span></div>
        <div class="hud-box">מרחק: <span id="dist-txt">0</span> ק"מ</div>
    </div>

    <div id="success-pop">כל הכבוד! 🌟</div>

    <div id="bottom-panel">
        <div id="obj-label">מזהה: כדור הארץ</div>
        <div id="math-area">
            <div id="question">7 × 8</div>
            <div id="answer">?</div>
        </div>
        <div id="numpad">
            <div class="btn" onclick="ip(1)">1</div><div class="btn" onclick="ip(2)">2</div><div class="btn" onclick="ip(3)">3</div>
            <div class="btn" onclick="ip(4)">4</div><div class="btn" onclick="ip(5)">5</div><div class="btn" onclick="del()" style="color:red">X</div>
            <div class="btn" onclick="ip(6)">6</div><div class="btn" onclick="ip(7)">7</div><div class="btn" onclick="ip(8)">8</div>
            <div class="btn" onclick="ip(9)">9</div><div class="btn" onclick="ip(0)">0</div><div class="btn btn-go" onclick="ck()">GO</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, universe, stars;
    let score = 0, distance = 0, currentA = 0, input = "";
    let rotX = 0, rotY = 0, isJumping = false, moveSpeed = 0.2;

    const names = ["כדור הארץ", "מאדים", "שבתאי", "חור שחור", "גלקסיה", "תחנת חלל", "הירח", "צדק", "נפטון", "סופרנובה", "ערפילית", "צביר כוכבים", "לוויין", "השמש", "מטאור", "גשושית", "חללית", "חור תולעת", "קוביית חלל", "כוכב נייטרון"];

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 2000);
        camera.position.z = 150;

        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        universe = new THREE.Group();
        universe.position.y = 15;
        scene.add(universe);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const light = new THREE.PointLight(0xffffff, 1);
        light.position.set(50,50,100);
        scene.add(light);

        // כוכבי רקע
        const sGeo = new THREE.BufferGeometry();
        const sPos = [];
        for(let i=0; i<5000; i++) sPos.push((Math.random()-0.5)*2000, (Math.random()-0.5)*2000, (Math.random()-0.5)*2000);
        sGeo.setAttribute('position', new THREE.Float32BufferAttribute(sPos, 3));
        stars = new THREE.Points(sGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1}));
        scene.add(stars);

        // מנגנון סיבוב מתוקן
        let down = false, ox, oy;
        window.addEventListener('pointerdown', e => { if(e.clientY < window.innerHeight*0.75) { down=true; ox=e.clientX; oy=e.clientY; }});
        window.addEventListener('pointermove', e => { if(down) { rotY += (e.clientX-ox)*0.01; rotX += (e.clientY-oy)*0.01; ox=e.clientX; oy=e.clientY; }});
        window.addEventListener('pointerup', () => down=false);

        makeObj("כדור הארץ");
        gen();
        loop();
    }

    function makeObj(name) {
        universe.clear();
        universe.position.z = -400;
        document.getElementById('obj-label').innerText = "מזהה: " + name;
        
        const geo = new THREE.SphereGeometry(40, 32, 32);
        let mat = new THREE.MeshStandardMaterial({color: Math.random() * 0xffffff});

        if(name === "חור שחור") {
            universe.add(new THREE.Mesh(new THREE.SphereGeometry(25,32,32), new THREE.MeshBasicMaterial({color: 0})));
            const ring = new THREE.Mesh(new THREE.TorusGeometry(45, 2, 2, 50), new THREE.MeshBasicMaterial({color: 0xff6600}));
            ring.rotation.x = 1.5; universe.add(ring);
        } else if(name === "גלקסיה") {
            const pGeo = new THREE.BufferGeometry(); const pPos = [];
            for(let i=0; i<3000; i++) { const r = Math.random()*100; const a = r*0.1; pPos.push(Math.cos(a)*r, (Math.random()-0.5)*10, Math.sin(a)*r); }
            pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
            universe.add(new THREE.Points(pGeo, new THREE.PointsMaterial({color: 0x00f2ff, size: 1})));
        } else if(name === "שבתאי") {
            universe.add(new THREE.Mesh(geo, mat));
            const r = new THREE.Mesh(new THREE.TorusGeometry(55, 3, 2, 50), new THREE.MeshStandardMaterial({color: 0x888888, transparent: true, opacity: 0.7}));
            r.rotation.x = 1.5; universe.add(r);
        } else {
            universe.add(new THREE.Mesh(geo, mat));
        }
    }

    function gen() {
        let n1 = Math.floor(Math.random()*9)+2, n2 = Math.floor(Math.random()*9)+2;
        currentA = n1 * n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        input = ""; document.getElementById('answer').innerText = "?";
    }

    function ip(n) { if(input.length < 3) { input += n; document.getElementById('answer').innerText = input; } }
    function del() { input = ""; document.getElementById('answer').innerText = "?"; }

    function ck() {
        if(parseInt(input) === currentA) {
            score++; distance += 15000;
            document.getElementById('score-txt').innerText = score;
            document.getElementById('dist-txt').innerText = distance.toLocaleString();
            document.getElementById('rank-txt').innerText = score > 20 ? "אדמירלית" : score > 10 ? "טייסת" : "צוערת";
            
            const pop = document.getElementById('success-pop');
            pop.style.opacity = 1;
            isJumping = true;
            setTimeout(() => { 
                pop.style.opacity = 0; 
                makeObj(names[Math.floor(Math.random()*names.length)]);
                gen(); 
            }, 800);
        } else { del(); }
    }

    function loop() {
        requestAnimationFrame(loop);
        if(isJumping) {
            universe.position.z += (1000 - universe.position.z) * 0.1;
            moveSpeed = 40;
            if(universe.position.z > 900) { isJumping = false; universe.position.z = -500; moveSpeed = 0.2; }
        } else {
            universe.position.z += (0 - universe.position.z) * 0.05;
        }

        universe.rotation.y += (rotY - universe.rotation.y) * 0.1 + 0.005;
        universe.rotation.x += (rotX - universe.rotation.x) * 0.1;

        const p = stars.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { p[i+2] += moveSpeed; if(p[i+2] > 200) p[i+2] = -1800; }
        stars.geometry.attributes.position.needsUpdate = true;

        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
