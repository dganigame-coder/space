<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v8.6.0 Mobile Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #ui-layer { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; z-index: 1000; }
        
        /* HUD עליון */
        #top-hud { width: 95%; display: flex; justify-content: space-between; margin: 15px auto 0; color: #00f2ff; font-weight: bold; font-size: 0.9rem; }
        .hud-box { background: rgba(0, 40, 80, 0.6); padding: 8px 15px; border-radius: 12px; border: 1px solid #00f2ff; backdrop-filter: blur(5px); }
        
        #scan-info { text-align: center; margin-top: 10px; pointer-events: none; }
        #scan-title { color: #fff; font-weight: bold; font-size: 1.6rem; text-shadow: 0 0 15px #00f2ff; margin: 0; }
        #scan-desc { color: #00f2ff; font-size: 0.9rem; margin: 2px 0; opacity: 0.8; }

        /* מרכז הבקרה - השאלה עם רקע כהה לקריאות */
        #lower-controls { margin-top: auto; width: 100%; display: flex; flex-direction: column; align-items: center; pointer-events: none; padding-bottom: env(safe-area-inset-bottom, 10px); }
        
        #mission-panel { 
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(10px); 
            border-radius: 20px; 
            padding: 15px 30px; 
            border: 1px solid rgba(0, 242, 255, 0.3);
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 200px;
        }

        #question { font-size: 3.5rem; color: #fff; margin: 0; text-shadow: 0 0 15px #fff; line-height: 1; }
        #answer-display { font-size: 2.8rem; color: #ff00de; font-weight: bold; min-height: 3rem; text-shadow: 0 0 10px #ff00de; margin-top: 5px; }

        /* מקלדת מובייל צמודה למטה */
        #numpad { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
            padding: 15px; 
            background: rgba(20, 20, 20, 0.8); 
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px 25px 0 0;
            pointer-events: auto; 
            width: 100%;
            box-sizing: border-box;
            direction: ltr;
        }

        .btn { 
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            color: white; 
            font-size: 1.8rem; 
            height: 55px; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: 0.1s;
        }
        .btn:active { background: #00f2ff; color: #000; transform: scale(0.95); }
        .btn-go { background: linear-gradient(45deg, #006622, #00ff66); color: #fff; grid-column: span 2; font-weight: bold; border: none; }
        .btn-del { color: #ff4444; font-weight: bold; }

        #feedback { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); color: #00ff66; font-size: 3rem; font-weight: bold; opacity: 0; pointer-events: none; z-index: 2000; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="top-hud">
        <div class="hud-box">🎖️ <span id="rank">אדמירל</span></div>
        <div class="hud-box">📍 <span id="dist">0</span> ק"מ</div>
    </div>

    <div id="scan-info">
        <p id="scan-title">מאתר...</p>
        <p id="scan-desc"></p>
    </div>

    <div id="feedback">מעולה!</div>

    <div id="lower-controls">
        <div id="mission-panel">
            <div id="question">? × ?</div>
            <div id="answer-display">?</div>
        </div>
        
        <div id="numpad">
            <div class="btn" onclick="p(1)">1</div><div class="btn" onclick="p(2)">2</div><div class="btn" onclick="p(3)">3</div>
            <div class="btn" onclick="p(4)">4</div><div class="btn" onclick="p(5)">5</div><div class="btn" onclick="p(6)">6</div>
            <div class="btn" onclick="p(7)">7</div><div class="btn" onclick="p(8)">8</div><div class="btn" onclick="p(9)">9</div>
            <div class="btn btn-del" onclick="clr()">X</div><div class="btn" onclick="p(0)">0</div><div class="btn btn-go" onclick="check()">GO🚀</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, universeGroup, stars;
    let score=0, target=0, input="", distance=0, warping=false, starSpd=0.5;
    let isDown=false, lx, ly, rx=0, ry=0;
    let currentType = "";
    let playlist = [];

    const catalog = [
        { name: "סופרנובה", cat: "פיצוץ כוכבי", color: 0xffaa00, type: 'supernova' },
        { name: "חור תולעת", cat: "גשר איינשטיין-רוזן", color: 0x00f2ff, type: 'wormhole' },
        { name: "חגורת אסטרואידים", cat: "קב' אסטרואידים", color: 0x888888, type: 'asteroids' },
        { name: "כדור הארץ", cat: "פלנטה", color: 0x2266ff, type: 'planet' },
        { name: "שבתאי", cat: "ענק גז", color: 0xeeddaa, type: 'rings' },
        { name: "חור שחור", cat: "סינגולריות", color: 0x000000, type: 'blackhole' },
        { name: "גלקסיה ספירלית", cat: "מבנה גלקטי", color: 0xffffff, type: 'galaxy' },
        { name: "ערפילית", cat: "ענן גז", color: 0x00ffcc, type: 'nebula' }
    ];

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 10000);
        camera.position.z = 250; // הרחקתי מעט את המצלמה

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const pl = new THREE.PointLight(0xffffff, 1.2);
        pl.position.set(100, 100, 150);
        scene.add(pl);

        const sGeo = new THREE.BufferGeometry();
        const sPos = [];
        for(let i=0; i<8000; i++) sPos.push((Math.random()-0.5)*5000, (Math.random()-0.5)*5000, (Math.random()-0.5)*5000);
        sGeo.setAttribute('position', new THREE.Float32BufferAttribute(sPos, 3));
        stars = new THREE.Points(sGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1}));
        scene.add(stars);

        universeGroup = new THREE.Group();
        scene.add(universeGroup);

        window.addEventListener('pointerdown', e => { if(e.clientY < window.innerHeight * 0.6) { isDown=true; lx=e.clientX; ly=e.clientY; }});
        window.addEventListener('pointermove', e => { if(!isDown) return; ry += (e.clientX - lx) * 0.005; rx += (e.clientY - ly) * 0.005; lx=e.clientX; ly=e.clientY; });
        window.addEventListener('pointerup', () => isDown=false);

        pickNext(); ask(); animate();
    }

    function pickNext() {
        if (playlist.length === 0) playlist = [...catalog].sort(() => Math.random() - 0.5);
        spawn(playlist.pop());
    }

    function spawn(obj) {
        universeGroup.clear();
        universeGroup.position.set(0, 20, -1000); // הגבהתי את האובייקט כדי שלא יוסתר
        currentType = obj.type;
        document.getElementById('scan-title').innerText = obj.name;
        document.getElementById('scan-desc').innerText = "סיווג: " + obj.cat;

        if(obj.type === 'supernova') {
            const core = new THREE.Mesh(new THREE.SphereGeometry(15, 32, 32), new THREE.MeshBasicMaterial({color: 0xffffff}));
            universeGroup.add(core);
            const pGeo = new THREE.BufferGeometry(); const pPos = [];
            for(let i=0; i<1500; i++) {
                const a1=Math.random()*Math.PI*2, a2=Math.random()*Math.PI*2, r=Math.random()*150;
                pPos.push(Math.sin(a1)*Math.cos(a2)*r, Math.sin(a1)*Math.sin(a2)*r, Math.cos(a1)*r);
            }
            pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
            universeGroup.add(new THREE.Points(pGeo, new THREE.PointsMaterial({color: 0xffaa00, size: 2, blending: THREE.AdditiveBlending})));
        } else if(obj.type === 'asteroids') {
            for(let i=0; i<80; i++) {
                const ast = new THREE.Mesh(new THREE.IcosahedronGeometry(Math.random()*5, 0), new THREE.MeshStandardMaterial({color: 0x888888}));
                ast.position.set((Math.random()-0.5)*300, (Math.random()-0.5)*200, (Math.random()-0.5)*200);
                ast.userData = {rs: Math.random()*0.03};
                universeGroup.add(ast);
            }
        } else if(obj.type === 'galaxy') {
            const gG = new THREE.BufferGeometry(); const gP = [];
            for(let i=0; i<5000; i++) { let r=Math.random()*160, a=r*0.2; gP.push(Math.cos(a)*r, (Math.random()-0.5)*20, Math.sin(a)*r); }
            gG.setAttribute('position', new THREE.Float32BufferAttribute(gP, 3));
            universeGroup.add(new THREE.Points(gG, new THREE.PointsMaterial({color: 0x88ccff, size:1.2, blending: THREE.AdditiveBlending})));
        } else {
            const m = new THREE.Mesh(new THREE.SphereGeometry(60, 32, 32), new THREE.MeshStandardMaterial({color: obj.color}));
            universeGroup.add(m);
            if(obj.type === 'rings') {
                const r = new THREE.Mesh(new THREE.TorusGeometry(100, 4, 2, 64), new THREE.MeshBasicMaterial({color: 0xcccccc, transparent:true, opacity:0.5}));
                r.rotation.x = 1.6; universeGroup.add(r);
            }
        }
    }

    function ask() {
        let n1=Math.floor(Math.random()*8)+2, n2=Math.floor(Math.random()*9)+2;
        target=n1*n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        input=""; document.getElementById('answer-display').innerText = "?";
    }

    function p(n) { if(input.length<3) { input+=n; document.getElementById('answer-display').innerText=input; } }
    function clr() { input=""; document.getElementById('answer-display').innerText="?"; }

    function check() {
        if(parseInt(input)===target) {
            score++; distance+=100000;
            document.getElementById('dist').innerText = Math.floor(distance).toLocaleString();
            const f=document.getElementById('feedback');
            f.style.opacity=1; warping=true;
            setTimeout(()=>{ f.style.opacity=0; pickNext(); ask(); },800);
        } else clr();
    }

    function animate() {
        requestAnimationFrame(animate);
        let t = Date.now() * 0.001;
        if(warping) {
            universeGroup.position.z += (1500 - universeGroup.position.z) * 0.1;
            starSpd = 50;
            if(universeGroup.position.z > 1300) { warping=false; universeGroup.position.z=-1200; starSpd=0.5; }
        } else {
            universeGroup.position.z += (0 - universeGroup.position.z) * 0.05;
            universeGroup.rotation.y += (ry - universeGroup.rotation.y) * 0.1 + 0.003;
            universeGroup.rotation.x += (rx - universeGroup.rotation.x) * 0.1;
            universeGroup.children.forEach(c => {
                if(currentType==='supernova' && c instanceof THREE.Points) c.scale.setScalar(1 + Math.sin(t*4)*0.1);
                if(currentType==='asteroids' && c.userData.rs) { c.rotation.x+=c.userData.rs; c.rotation.y+=c.userData.rs; }
            });
        }
        const pA = stars.geometry.attributes.position.array;
        for(let i=0; i<pA.length; i+=3) { pA[i+2]+=starSpd; if(pA[i+2]>500) pA[i+2]=-4000; }
        stars.geometry.attributes.position.needsUpdate=true;
        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
