 <!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל v9.0 - Stable</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; touch-action: none; }
        
        /* שכבת הממשק - הכל pointer-events: none חוץ מהכפתורים */
        #ui-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; pointer-events: none; z-index: 10; 
        }

        /* HUD עליון */
        #top-hud { display: flex; justify-content: space-between; padding: 15px; }
        .stat-badge { 
            background: rgba(0, 50, 100, 0.7); color: #00f2ff; padding: 8px 15px; 
            border-radius: 20px; border: 1px solid #00f2ff; font-weight: bold; font-size: 0.9rem;
        }

        #success-toast { 
            position: absolute; top: 25%; width: 100%; text-align: center; 
            color: #00ff66; font-size: 2.5rem; font-weight: bold; opacity: 0; transition: 0.3s;
            text-shadow: 0 0 15px #00ff66;
        }

        /* פנל בקרה תחתון */
        #control-panel { 
            margin-top: auto; background: rgba(0, 0, 0, 0.85); 
            padding: 15px 10px 25px 10px; pointer-events: auto;
            border-top: 1px solid rgba(0, 242, 255, 0.3);
            display: flex; flex-direction: column; align-items: center;
        }

        #obj-title { color: #00f2ff; font-size: 1.1rem; margin-bottom: 8px; letter-spacing: 1px; }
        
        #display-area { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        #quest { color: white; font-size: 3rem; font-weight: bold; }
        #ans-box { 
            color: #ff00de; font-size: 3rem; min-width: 60px; text-align: center; 
            border-bottom: 3px solid #ff00de; font-weight: bold;
        }

        /* מקלדת נומרית */
        .key-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
        .key { 
            width: 50px; height: 50px; background: #222; color: white; border: 1px solid #444;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; font-weight: bold; transition: 0.1s;
        }
        .key:active { background: #00f2ff; color: black; }
        .key-del { color: #ff4444; }
        .key-go { background: #008844; width: 90px; border: none; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="top-hud">
        <div class="stat-badge" id="rank-display">דרגה: טירונית</div>
        <div class="stat-badge" id="dist-display">0 ק"מ</div>
    </div>

    <div id="success-toast">מצוין! 🚀</div>

    <div id="control-panel">
        <div id="obj-title">מזהה: כדור הארץ</div>
        <div id="display-area">
            <div id="quest">? × ?</div>
            <div id="ans-box">?</div>
        </div>
        <div class="key-grid">
            <div class="key" onclick="num(1)">1</div><div class="key" onclick="num(2)">2</div><div class="key" onclick="num(3)">3</div>
            <div class="key" onclick="num(4)">4</div><div class="key" onclick="num(5)">5</div><div class="key key-del" onclick="del()">X</div>
            <div class="key" onclick="num(6)">6</div><div class="key" onclick="num(7)">7</div><div class="key" onclick="num(8)">8</div>
            <div class="key" onclick="num(9)">9</div><div class="key" onclick="num(0)">0</div><div class="key key-go" onclick="check()">שיגור</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, universe, stars;
    let targetAns = 0, currentInput = "", score = 0, distance = 0;
    let isWarping = false, warpSpeed = 0.2;
    let rotX = 0, rotY = 0;

    const spaceObjects = [
        { name: "כדור הארץ", color: 0x2266ff },
        { name: "מאדים", color: 0xff4400 },
        { name: "שבתאי", color: 0xdfbe9f, hasRing: true },
        { name: "חור שחור", color: 0x000000, isSpecial: "blackhole" },
        { name: "גלקסיה", isSpecial: "galaxy" },
        { name: "צדק", color: 0xd2b48c },
        { name: "נפטון", color: 0x3355ff },
        { name: "הירח", color: 0x888888 },
        { name: "השמש", color: 0xffcc00, emissive: true },
        { name: "תחנת חלל", isSpecial: "station" }
    ];

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 15, 180); // מצלמה גבוהה למניעת הסתרה

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        universe = new THREE.Group();
        scene.add(universe);

        // תאורה
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const pLight = new THREE.PointLight(0xffffff, 1.2);
        pLight.position.set(100, 100, 100);
        scene.add(pLight);

        // כוכבי רקע
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<4000; i++) {
            starPos.push((Math.random()-0.5)*2000, (Math.random()-0.5)*2000, (Math.random()-0.5)*2000);
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1}));
        scene.add(stars);

        // מנגנון סיבוב (Pointer Events)
        let isDown = false, px, py;
        window.onpointerdown = (e) => { if(e.clientY < window.innerHeight * 0.7) { isDown = true; px = e.clientX; py = e.clientY; }};
        window.onpointermove = (e) => { if(isDown) { rotY += (e.clientX - px) * 0.01; rotX += (e.clientY - py) * 0.01; px = e.clientX; py = e.clientY; }};
        window.onpointerup = () => isDown = false;

        buildObject(spaceObjects[0]);
        generateMath();
        animate();
    }

    function buildObject(data) {
        universe.clear();
        universe.position.z = -500;
        document.getElementById('obj-title').innerText = "מזהה: " + data.name;

        if(data.isSpecial === "blackhole") {
            universe.add(new THREE.Mesh(new THREE.SphereGeometry(25,32,32), new THREE.MeshBasicMaterial({color: 0})));
            const ring = new THREE.Mesh(new THREE.TorusGeometry(45, 2, 2, 60), new THREE.MeshBasicMaterial({color: 0xff6600}));
            ring.rotation.x = 1.4; universe.add(ring);
        } else if(data.isSpecial === "galaxy") {
            const gGeo = new THREE.BufferGeometry(); const gPos = [];
            for(let i=0; i<2500; i++) { let r=Math.random()*110, a=r*0.12; gPos.push(Math.cos(a)*r, (Math.random()-0.5)*10, Math.sin(a)*r); }
            gGeo.setAttribute('position', new THREE.Float32BufferAttribute(gPos, 3));
            universe.add(new THREE.Points(gGeo, new THREE.PointsMaterial({color: 0x00f2ff, size: 1.5})));
        } else if(data.isSpecial === "station") {
            const core = new THREE.Mesh(new THREE.CylinderGeometry(5,5,50), new THREE.MeshStandardMaterial({color:0xaaaaaa}));
            core.rotation.z = Math.PI/2; universe.add(core);
            const p = new THREE.Mesh(new THREE.BoxGeometry(25,1,50), new THREE.MeshStandardMaterial({color:0x0055ff}));
            p.position.x = 25; universe.add(p, p.clone().setX(-25));
        } else {
            const mat = new THREE.MeshStandardMaterial({
                color: data.color, 
                emissive: data.emissive ? data.color : 0, 
                emissiveIntensity: data.emissive ? 0.5 : 0
            });
            universe.add(new THREE.Mesh(new THREE.SphereGeometry(40, 32, 32), mat));
            if(data.hasRing) {
                const r = new THREE.Mesh(new THREE.TorusGeometry(55, 3, 2, 50), new THREE.MeshStandardMaterial({color: 0x888888, transparent:true, opacity:0.6}));
                r.rotation.x = 1.5; universe.add(r);
            }
        }
    }

    function generateMath() {
        let n1 = Math.floor(Math.random() * 9) + 2;
        let n2 = Math.floor(Math.random() * 9) + 2;
        targetAns = n1 * n2;
        document.getElementById('quest').innerText = `${n1} × ${n2}`;
        currentInput = ""; document.getElementById('ans-box').innerText = "?";
    }

    function num(n) { if(currentInput.length < 3) { currentInput += n; document.getElementById('ans-box').innerText = currentInput; } }
    function del() { currentInput = ""; document.getElementById('ans-box').innerText = "?"; }

    function check() {
        if(parseInt(currentInput) === targetAns) {
            score++; distance += 20000;
            document.getElementById('dist-display').innerText = distance.toLocaleString() + " ק\"מ";
            
            // דרגות
            const ranks = ["טירונית", "צוערת", "טייסת", "מפקדת", "אדמירלית"];
            document.getElementById('rank-display').innerText = "דרגה: " + ranks[Math.min(Math.floor(score/5), 4)];

            const toast = document.getElementById('success-toast');
            toast.style.opacity = 1;
            isWarping = true;
            
            setTimeout(() => {
                toast.style.opacity = 0;
                buildObject(spaceObjects[Math.floor(Math.random()*spaceObjects.length)]);
                generateMath();
            }, 800);
        } else { del(); }
    }

    function animate() {
        requestAnimationFrame(animate);
        
        if(isWarping) {
            universe.position.z += (1200 - universe.position.z) * 0.1;
            warpSpeed = 45;
            if(universe.position.z > 1100) { isWarping = false; universe.position.z = -600; warpSpeed = 0.2; }
        } else {
            universe.position.z += (0 - universe.position.z) * 0.05;
        }

        // סיבוב חלק
        universe.rotation.y += (rotY - universe.rotation.y) * 0.1 + 0.005;
        universe.rotation.x += (rotX - universe.rotation.x) * 0.1;

        // תנועת כוכבים
        const positions = stars.geometry.attributes.position.array;
        for(let i=0; i<positions.length; i+=3) {
            positions[i+2] += warpSpeed;
            if(positions[i+2] > 200) positions[i+2] = -1800;
        }
        stars.geometry.attributes.position.needsUpdate = true;

        renderer.render(scene, camera);
    }

    init();
    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>
</body>
</html>
