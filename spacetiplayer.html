<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל v9.5 - Final Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, sans-serif; touch-action: none; }
        #ui { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: none; z-index: 10; }
        .hud { display: flex; justify-content: space-around; padding: 15px; }
        .stat { color: #00f2ff; font-weight: bold; text-shadow: 0 0 10px #000; font-size: 1.1rem; background: rgba(0,0,0,0.3); padding: 5px 12px; border-radius: 15px; }
        #toast { position: absolute; top: 20%; width: 100%; text-align: center; color: #00ff66; font-size: 3rem; opacity: 0; transition: 0.3s; font-weight: bold; text-shadow: 0 0 20px #000; }
        #panel { margin-top: auto; padding-bottom: 40px; pointer-events: auto; display: flex; flex-direction: column; align-items: center; }
        #obj-info { color: #ffcc00; font-size: 1.4rem; margin-bottom: 10px; text-shadow: 2px 2px 10px #000; font-weight: bold; }
        #math { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        #q { color: white; font-size: 4.5rem; font-weight: 900; text-shadow: 0 0 20px #000; }
        #a { color: #ff00de; font-size: 4.5rem; min-width: 85px; border-bottom: 6px solid #ff00de; text-align: center; font-weight: 900; }
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; width: 95%; max-width: 450px; }
        .btn { height: 60px; background: rgba(255, 255, 255, 0.15); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.7rem; border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(5px); }
        .btn:active { background: #00f2ff; color: #000; }
        .btn-go { background: rgba(0, 255, 100, 0.4); grid-column: span 2; border-radius: 15px; font-weight: bold; border: 2px solid #00ff66; }
    </style>
</head>
<body>

<div id="ui">
    <div class="hud">
        <div class="stat" id="r-ui">צוערת</div>
        <div class="stat" id="d-ui">0 ק"מ</div>
    </div>
    <div id="toast">שיגור מוצלח! 🚀</div>
    <div id="panel">
        <div id="obj-info">מאתר אובייקט...</div>
        <div id="math">
            <div id="q">? × ?</div>
            <div id="a">?</div>
        </div>
        <div class="grid">
            <div class="btn" onclick="p(1)">1</div><div class="btn" onclick="p(2)">2</div><div class="btn" onclick="p(3)">3</div>
            <div class="btn" onclick="p(4)">4</div><div class="btn" onclick="p(5)">5</div><div class="btn" onclick="clr()" style="color:#ff4444">X</div>
            <div class="btn" onclick="p(6)">6</div><div class="btn" onclick="p(7)">7</div><div class="btn" onclick="p(8)">8</div>
            <div class="btn" onclick="p(9)">9</div><div class="btn" onclick="p(0)">0</div><div class="btn btn-go" onclick="check()">GO</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    const lib = [
        {n:"כדור הארץ", t:"p", c:0x2266ff}, {n:"מאדים", t:"p", c:0xff4400}, {n:"שבתאי", t:"p", c:0xdfbe9f, r:true},
        {n:"חור שחור", t:"bh", c:0x000000}, {n:"גלקסיה", t:"gx", c:0x00f2ff}, {n:"ערפילית", t:"nb", c:0xff00ff},
        {n:"צדק", t:"p", c:0xd2b48c}, {n:"חור תולעת", t:"wh", c:0xaa00ff}
    ];
    for(let i=0; i<92; i++) lib.push({n: "גרם שמיים " + (i+10), t:"p", c: Math.random()*0xffffff});

    let scene, camera, renderer, group, stars, target, curStr="", score=0, dist=0, isJump=false;
    let rotX = 0, rotY = 0, isDown = false, lx, ly;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 3000);
        camera.position.z = 200;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        group = new THREE.Group();
        scene.add(group);
        
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.PointLight(0xffffff, 1.2);
        sun.position.set(100, 100, 200);
        scene.add(sun);

        // כוכבי רקע - יציב יותר
        const sGeo = new THREE.BufferGeometry();
        const sPos = new Float32Array(3000 * 3);
        for(let i=0; i<3000*3; i++) sPos[i] = (Math.random()-0.5)*2500;
        sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
        stars = new THREE.Points(sGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1.5}));
        scene.add(stars);

        // מגע
        window.addEventListener('pointerdown', e => { if(e.clientY < window.innerHeight * 0.6) { isDown = true; lx = e.clientX; ly = e.clientY; }});
        window.addEventListener('pointermove', e => {
            if(!isDown) return;
            rotY += (e.clientX - lx) * 0.007;
            rotX += (e.clientY - ly) * 0.007;
            lx = e.clientX; ly = e.clientY;
        });
        window.addEventListener('pointerup', () => isDown = false);

        spawn(lib[0]);
        ask();
        loop();
    }

    function spawn(obj) {
        group.clear();
        group.position.set(0,0,-600); // מתחיל רחוק
        document.getElementById('obj-info').innerText = obj.n;
        
        if(obj.t === "p") {
            const m = new THREE.Mesh(new THREE.SphereGeometry(50,32,32), new THREE.MeshStandardMaterial({color: obj.c}));
            group.add(m);
            if(obj.r) {
                const ring = new THREE.Mesh(new THREE.TorusGeometry(75,2,2,60), new THREE.MeshStandardMaterial({color:0xaaaaaa, transparent:true, opacity:0.5}));
                ring.rotation.x = 1.5; group.add(ring);
            }
        } else if(obj.t === "gx") {
            const gG = new THREE.BufferGeometry(); const gP = new Float32Array(2000 * 3);
            for(let i=0; i<2000; i++) { 
                let r=Math.random()*130, a=r*0.2; 
                gP[i*3]=Math.cos(a)*r; gP[i*3+1]=(Math.random()-0.5)*20; gP[i*3+2]=Math.sin(a)*r; 
            }
            gG.setAttribute('position', new THREE.BufferAttribute(gP, 3));
            group.add(new THREE.Points(gG, new THREE.PointsMaterial({color:obj.c, size:1.2})));
        } else if(obj.t === "bh") {
            group.add(new THREE.Mesh(new THREE.SphereGeometry(35,32,32), new THREE.MeshBasicMaterial({color:0})));
            const d = new THREE.Mesh(new THREE.TorusGeometry(60,4,2,50), new THREE.MeshBasicMaterial({color:0xff4400}));
            d.rotation.x = 1.4; group.add(d);
        } else if(obj.t === "wh") {
            for(let i=0; i<12; i++) {
                const r = new THREE.Mesh(new THREE.TorusGeometry(20+i*18,0.5,16,50), new THREE.MeshBasicMaterial({color:obj.c, transparent:true, opacity:0.4}));
                r.position.z = -i*40; group.add(r);
            }
        }
    }

    function ask() {
        let n1 = Math.floor(Math.random()*9)+2, n2 = Math.floor(Math.random()*9)+2;
        target = n1*n2;
        document.getElementById('q').innerText = `${n1} × ${n2}`;
        curStr = ""; document.getElementById('a').innerText = "?";
    }

    function p(v) { if(curStr.length < 3) { curStr += v; document.getElementById('a').innerText = curStr; } }
    function clr() { curStr = ""; document.getElementById('a').innerText = "?"; }

    function check() {
        if(parseInt(curStr) === target) {
            score++; dist += 30000;
            document.getElementById('d-ui').innerText = dist.toLocaleString() + " ק\"מ";
            document.getElementById('toast').style.opacity = 1;
            isJump = true;
            setTimeout(() => {
                document.getElementById('toast').style.opacity = 0;
                isJump = false;
                spawn(lib[Math.floor(Math.random()*lib.length)]);
                ask();
            }, 900);
        } else { clr(); }
    }

    function loop() {
        requestAnimationFrame(loop);
        if(isJump) {
            group.position.z += 45;
            if(group.position.z > 400) group.position.z = -1000; // מונע "התנגשות" במצלמה
        } else {
            if(group.position.z < 0) group.position.z += 15;
            group.rotation.y += 0.005;
        }
        group.rotation.x += (rotX - group.rotation.x) * 0.1;
        group.rotation.y += (rotY - group.rotation.y) * 0.1;
        
        camera.lookAt(0,0,0);
        renderer.render(scene, camera);
    }
    init();
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
