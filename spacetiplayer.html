<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל v8.7 - APPROVED</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; z-index: 10; }
        .hud { display: flex; justify-content: space-around; padding: 15px; }
        .stat { background: rgba(0, 242, 255, 0.15); color: #00f2ff; padding: 8px 15px; border-radius: 20px; border: 1px solid #00f2ff; backdrop-filter: blur(5px); font-weight: bold; }
        #feedback { position: absolute; top: 30%; width: 100%; text-align: center; color: #00ff66; font-size: 3rem; font-weight: bold; opacity: 0; transition: 0.3s; pointer-events: none; text-shadow: 0 0 20px #00ff66; }
        #panel { margin-top: auto; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); padding: 20px; pointer-events: auto; display: flex; flex-direction: column; align-items: center; }
        #label { color: #00f2ff; font-size: 1.2rem; margin-bottom: 10px; font-weight: bold; }
        #math { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
        #q { color: white; font-size: 3.5rem; font-weight: 900; }
        #a { color: #ff00de; font-size: 3.5rem; min-width: 70px; text-align: center; font-weight: 900; border-bottom: 3px solid #ff00de; }
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
        .key { width: 50px; height: 50px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; transition: 0.1s; }
        .key:active { background: #00f2ff; color: black; transform: scale(0.9); }
        .go { background: #00ff66; color: black; border: none; width: 100px; border-radius: 15px; font-weight: bold; }
    </style>
</head>
<body>
<div id="ui">
    <div class="hud">
        <div class="stat"><span id="r">טירונית</span></div>
        <div class="stat">📍 <span id="d">0</span> ק"מ</div>
    </div>
    <div id="feedback">פגיעה בול!</div>
    <div id="panel">
        <div id="label">מזהה: כדור הארץ</div>
        <div id="math"><div id="q">? × ?</div><div id="a">?</div></div>
        <div class="grid">
            <div class="key" onclick="t(1)">1</div><div class="key" onclick="t(2)">2</div><div class="key" onclick="t(3)">3</div>
            <div class="key" onclick="t(4)">4</div><div class="key" onclick="t(5)">5</div><div class="key" onclick="c()" style="color:#ff4444">X</div>
            <div class="key" onclick="t(6)">6</div><div class="key" onclick="t(7)">7</div><div class="key" onclick="t(8)">8</div>
            <div class="key" onclick="t(9)">9</div><div class="key" onclick="t(0)">0</div><div class="key go" onclick="ok()">GO</div>
        </div>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let s, c_am, r, u, st, ans, cur = "", sc = 0, dist = 0, jump = false, spd = 0.2, rx = 0, ry = 0;
    const objs = ["כדור הארץ", "חור שחור", "גלקסיה", "שבתאי", "מאדים", "צדק", "נפטון", "תחנת חלל", "סופרנובה", "צביר כוכבים"];
    const rks = ["טירונית", "צוערת", "טייסת", "מפקדת", "אדמירלית", "אגדה"];

    function init() {
        s = new THREE.Scene();
        c_am = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 2000);
        c_am.position.set(0, 10, 180); // הרמת המצלמה כדי למנוע חיתוך מהפנל
        r = new THREE.WebGLRenderer({ antialias: true });
        r.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(r.domElement);
        u = new THREE.Group(); s.add(u);
        s.add(new THREE.AmbientLight(0xffffff, 0.6));
        const l = new THREE.PointLight(0xffffff, 1); l.position.set(50,50,100); s.add(l);
        const stG = new THREE.BufferGeometry(); const stP = [];
        for(let i=0; i<5000; i++) stP.push((Math.random()-0.5)*2000,(Math.random()-0.5)*2000,(Math.random()-0.5)*2000);
        stG.setAttribute('position', new THREE.Float32BufferAttribute(stP, 3));
        st = new THREE.Points(stG, new THREE.PointsMaterial({color: 0xffffff, size: 0.8})); s.add(st);
        
        let d = false, ox, oy;
        window.onpointerdown = e => { if(e.clientY < window.innerHeight*0.7) { d=true; ox=e.clientX; oy=e.clientY; } };
        window.onpointermove = e => { if(d) { ry+=(e.clientX-ox)*0.01; rx+=(e.clientY-oy)*0.01; ox=e.clientX; oy=e.clientY; } };
        window.onpointerup = () => d=false;
        
        newObj("כדור הארץ"); gen(); loop();
    }

    function newObj(n) {
        u.clear(); u.position.z = -500; document.getElementById('label').innerText = "מזהה: " + n;
        if(n === "חור שחור") {
            u.add(new THREE.Mesh(new THREE.SphereGeometry(25,32,32), new THREE.MeshBasicMaterial({color: 0})));
            const rg = new THREE.Mesh(new THREE.TorusGeometry(45,2,2,60), new THREE.MeshBasicMaterial({color: 0xffaa00}));
            rg.rotation.x = 1.4; u.add(rg);
        } else if(n === "גלקסיה") {
            const g = new THREE.BufferGeometry(); const p = [];
            for(let i=0; i<3000; i++) { let r=Math.random()*100, a=r*0.1; p.push(Math.cos(a)*r, (Math.random()-0.5)*10, Math.sin(a)*r); }
            g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
            u.add(new THREE.Points(g, new THREE.PointsMaterial({color: 0x00f2ff, size: 1.2})));
        } else {
            const m = new THREE.Mesh(new THREE.SphereGeometry(40,32,32), new THREE.MeshStandardMaterial({color: Math.random()*0xffffff}));
            u.add(m); if(n === "שבתאי") { const rg = new THREE.Mesh(new THREE.TorusGeometry(55,4,2,50), new THREE.MeshStandardMaterial({color: 0x888888, transparent: true, opacity: 0.5})); rg.rotation.x=1.5; u.add(rg); }
        }
    }

    function gen() {
        let n1 = Math.floor(Math.random()*9)+2, n2 = Math.floor(Math.random()*9)+2;
        ans = n1*n2; document.getElementById('q').innerText = `${n1} × ${n2}`;
        cur = ""; document.getElementById('a').innerText = "?";
    }

    function t(n) { if(cur.length < 3) { cur += n; document.getElementById('a').innerText = cur; } }
    function c() { cur = ""; document.getElementById('a').innerText = "?"; }

    function ok() {
        if(parseInt(cur) === ans) {
            sc++; dist += 25000;
            document.getElementById('d').innerText = dist.toLocaleString();
            document.getElementById('r').innerText = rks[Math.min(Math.floor(sc/5), rks.length-1)];
            const f = document.getElementById('feedback'); f.style.opacity = 1;
            jump = true; setTimeout(() => { f.style.opacity = 0; newObj(objs[Math.floor(Math.random()*objs.length)]); gen(); }, 800);
        } else { c(); }
    }

    function loop() {
        requestAnimationFrame(loop);
        if(jump) { u.position.z += (1100-u.position.z)*0.1; spd=40; if(u.position.z > 1000) { jump=false; u.position.z=-600; spd=0.2; } }
        else { u.position.z += (0-u.position.z)*0.05; }
        u.rotation.y += (ry - u.rotation.y)*0.1 + 0.005; u.rotation.x += (rx - u.rotation.x)*0.1;
        const p = st.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { p[i+2]+=spd; if(p[i+2]>200) p[i+2]=-1800; }
        st.geometry.attributes.position.needsUpdate = true;
        r.render(s, c_am);
    }
    init();
</script>
</body>
</html>
