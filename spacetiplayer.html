<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v8.5.3 Layout Fixed</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #ui-layer { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; z-index: 1000; }
        #top-hud { width: 95%; display: flex; justify-content: space-between; margin: 15px auto 0; color: #00f2ff; font-weight: bold; font-size: 0.9rem; }
        .hud-box { background: rgba(0, 40, 80, 0.6); padding: 8px 15px; border-radius: 12px; border: 1px solid #00f2ff; backdrop-filter: blur(5px); }
        #feedback { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%) scale(0.5); color: #00ff66; font-size: 3.5rem; font-weight: bold; text-shadow: 0 0 25px #00ff66; opacity: 0; transition: 0.3s; pointer-events: none; }
        #scan-title { color: #fff; font-weight: bold; font-size: 1.6rem; text-shadow: 0 0 15px #00f2ff; text-align: center; margin-top: 10px; }
        #scan-desc { color: #00f2ff; font-size: 0.9rem; text-align: center; margin: 0; opacity: 0.8; }
        #lower-controls { margin-top: auto; padding-bottom: 5px; width: 100%; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        #question { font-size: 3.8rem; color: #fff; margin: 0; text-shadow: 0 0 20px #fff; }
        #answer-display { font-size: 3.2rem; color: #ff00de; font-weight: bold; min-height: 3.5rem; text-shadow: 0 0 15px #ff00de; }
        
        /* סידור המקלדת משמאל לימין */
        #numpad { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            padding: 10px; 
            background: rgba(255, 255, 255, 0.05); 
            border-radius: 20px; 
            backdrop-filter: blur(15px); 
            pointer-events: auto; 
            transform: scale(0.75); 
            margin-bottom: 5px; 
            border: 1px solid rgba(255,255,255,0.1);
            direction: ltr; /* מבטיח שהגריד ירוץ משמאל לימין */
        }
        
        .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; font-size: 1.7rem; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .btn:active { background: #00f2ff; color: #000; }
        .btn-go { background: linear-gradient(45deg, #006622, #00ff66); grid-column: span 2; width: auto; border-radius: 15px; font-weight: bold; font-size: 1.5rem; border: none; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="top-hud">
        <div class="hud-box">🎖️ <span id="rank">אדמירל</span></div>
        <div class="hud-box">📍 <span id="dist">0</span> ק"מ</div>
    </div>
    <div id="feedback">מעולה!</div>
    <div id="data-scanner">
        <p id="scan-title">סורק מרחב...</p>
        <p id="scan-desc"></p>
    </div>
    <div id="lower-controls">
        <div id="mission-control">
            <div id="question">? × ?</div>
            <div id="answer-display">?</div>
        </div>
        <div id="numpad">
            <div class="btn" onclick="p(1)">1</div><div class="btn" onclick="p(2)">2</div><div class="btn" onclick="p(3)">3</div>
            <div class="btn" onclick="p(4)">4</div><div class="btn" onclick="p(5)">5</div><div class="btn" onclick="p(6)">6</div>
            <div class="btn" onclick="p(7)">7</div><div class="btn" onclick="p(8)">8</div><div class="btn" onclick="p(9)">9</div>
            <div class="btn" style="color:#ff4444" onclick="clr()">X</div><div class="btn" onclick="p(0)">0</div><div class="btn btn-go" onclick="check()">GO🚀</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, universeGroup, stars;
    let score=0, target=0, input="", distance=0, warping=false, starSpd=0.5;
    let isDown=false, lx, ly, rx=0, ry=0;
    let currentType = "";
    let playlist = [];

    const catalog = [
        { name: "סופרנובה", cat: "פיצוץ כוכבי", color: 0xffaa00, type: 'supernova' },
        { name: "חור תולעת", cat: "גשר איינשטיין-רוזן", color: 0x00f2ff, type: 'wormhole' },
        { name: "חגורת אסטרואידים", cat: "קב' אסטרואידים", color: 0x888888, type: 'asteroids' },
        { name: "כדור הארץ", cat: "פלנטה", color: 0x2266ff, type: 'planet' },
        { name: "שבתאי", cat: "ענק גז", color: 0xeeddaa, type: 'rings' },
        { name: "חור שחור", cat: "סינגולריות", color: 0x000000, type: 'blackhole' },
        { name: "גלקסיה ספירלית", cat: "מבנה גלקטי", color: 0xffffff, type: 'galaxy' },
        { name: "ערפילית", cat: "ענן גז", color: 0x00ffcc, type: 'nebula' }
    ];

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 10000);
        camera.position.z = 220;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const pl = new THREE.PointLight(0xffffff, 1.2);
        pl.position.set(100, 100, 150);
        scene.add(pl);

        const sGeo = new THREE.BufferGeometry();
        const sPos = [];
        for(let i=0; i<10000; i++) sPos.push((Math.random()-0.5)*5000, (Math.random()-0.5)*5000, (Math.random()-0.5)*5000);
        sGeo.setAttribute('position', new THREE.Float32BufferAttribute(sPos, 3));
        stars = new THREE.Points(sGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.8}));
        scene.add(stars);

        universeGroup = new THREE.Group();
        scene.add(universeGroup);

        window.addEventListener('pointerdown', e => { if(e.clientY < window.innerHeight * 0.7) { isDown=true; lx=e.clientX; ly=e.clientY; }});
        window.addEventListener('pointermove', e => { if(!isDown) return; ry += (e.clientX - lx) * 0.01; rx += (e.clientY - ly) * 0.01; lx=e.clientX; ly=e.clientY; });
        window.addEventListener('pointerup', () => isDown=false);

        pickNext();
        ask();
        animate();
    }

    function pickNext() {
        if (playlist.length === 0) playlist = [...catalog].sort(() => Math.random() - 0.5);
        spawn(playlist.pop());
    }

    function spawn(obj) {
        universeGroup.clear();
        universeGroup.position.z = -1000;
        currentType = obj.type;
        rx = 0; ry = 0;
        document.getElementById('scan-title').innerText = obj.name;
        document.getElementById('scan-desc').innerText = "סיווג: " + obj.cat;

        if(obj.type === 'supernova') {
            const core = new THREE.Mesh(new THREE.SphereGeometry(15, 32, 32), new THREE.MeshBasicMaterial({color: 0xffffff}));
            universeGroup.add(core);
            const pGeo = new THREE.BufferGeometry(); const pPos = [];
            for(let i=0; i<2000; i++) {
                const a1=Math.random()*Math.PI*2, a2=Math.random()*Math.PI*2, r=Math.random()*150;
                pPos.push(Math.sin(a1)*Math.cos(a2)*r, Math.sin(a1)*Math.sin(a2)*r, Math.cos(a1)*r);
            }
            pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
            universeGroup.add(new THREE.Points(pGeo, new THREE.PointsMaterial({color: 0xffaa00, size: 2, blending: THREE.AdditiveBlending})));
        } else if(obj.type === 'wormhole') {
            const tube = new THREE.Mesh(new THREE.TorusGeometry(60, 20, 16, 100), new THREE.MeshBasicMaterial({color: 0x00f2ff, wireframe: true, transparent:true, opacity:0.4}));
            tube.rotation.x = 1.5;
            universeGroup.add(tube);
            const pGeo = new THREE.BufferGeometry(); const pPos = [];
            for(let i=0; i<3000; i++) { let r=10+Math.random()*50, a=Math.random()*Math.PI*2; pPos.push(Math.cos(a)*r, Math.sin(a)*r, (Math.random()-0.5)*400); }
            pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
            universeGroup.add(new THREE.Points(pGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1.2, blending: THREE.AdditiveBlending})));
        } else if(obj.type === 'asteroids') {
            for(let i=0; i<120; i++) {
                const ast = new THREE.Mesh(new THREE.IcosahedronGeometry(Math.random()*5, 0), new THREE.MeshStandardMaterial({color: 0x888888}));
                ast.position.set((Math.random()-0.5)*300, (Math.random()-0.5)*200, (Math.random()-0.5)*200);
                ast.userData = {rs: Math.random()*0.05};
                universeGroup.add(ast);
            }
        } else if(obj.type === 'galaxy') {
            const gG = new THREE.BufferGeometry(); const gP = [];
            for(let i=0; i<6000; i++) { let r=Math.random()*150, a=r*0.18; gP.push(Math.cos(a)*r, (Math.random()-0.5)*15, Math.sin(a)*r); }
            gG.setAttribute('position', new THREE.Float32BufferAttribute(gP, 3));
            universeGroup.add(new THREE.Points(gG, new THREE.PointsMaterial({color: 0x88ccff, size:1.2, blending: THREE.AdditiveBlending})));
        } else if(obj.type === 'nebula') {
            for(let i=0; i<15; i++) {
                const n = new THREE.Mesh(new THREE.SphereGeometry(Math.random()*40+20, 8, 8), new THREE.MeshBasicMaterial({color: obj.color, transparent:true, opacity:0.1, wireframe:true}));
                n.position.set((Math.random()-0.5)*200, (Math.random()-0.5)*200, (Math.random()-0.5)*200);
                universeGroup.add(n);
            }
        } else if(obj.type === 'blackhole') {
            universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(30, 32, 32), new THREE.MeshBasicMaterial({color: 0x000000})));
            const d = new THREE.Mesh(new THREE.TorusGeometry(70, 8, 2, 80), new THREE.MeshBasicMaterial({color: 0xff3300, wireframe:true}));
            d.rotation.x = 1.4; universeGroup.add(d);
        } else {
            const m = new THREE.Mesh(new THREE.SphereGeometry(50, 32, 32), new THREE.MeshStandardMaterial({color: obj.color}));
            universeGroup.add(m);
            if(obj.type === 'rings') {
                const r = new THREE.Mesh(new THREE.TorusGeometry(85, 5, 2, 64), new THREE.MeshBasicMaterial({color: 0xcccccc, transparent:true, opacity:0.5}));
                r.rotation.x = 1.6; universeGroup.add(r);
            }
        }
    }

    function ask() {
        let n1=Math.floor(Math.random()*8)+2, n2=Math.floor(Math.random()*9)+2;
        target=n1*n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        input=""; document.getElementById('answer-display').innerText = "?";
    }

    function p(n) { if(input.length<3) { input+=n; document.getElementById('answer-display').innerText=input; } }
    function clr() { input=""; document.getElementById('answer-display').innerText="?"; }

    function check() {
        if(parseInt(input)===target) {
            score++; distance+=100000;
            document.getElementById('dist').innerText = Math.floor(distance).toLocaleString();
            const f=document.getElementById('feedback');
            f.style.opacity=1; f.style.transform="translate(-50%,-50%) scale(1.2)";
            warping=true;
            setTimeout(()=>{
                f.style.opacity=0; f.style.transform="translate(-50%,-50%) scale(0.5)";
                pickNext(); ask();
            },800);
        } else clr();
    }

    function animate() {
        requestAnimationFrame(animate);
        let t = Date.now() * 0.001;
        if(warping) {
            universeGroup.position.z += (1500 - universeGroup.position.z) * 0.1;
            starSpd = 60;
            if(universeGroup.position.z > 1300) { warping=false; universeGroup.position.z=-1200; starSpd=0.5; }
        } else {
            universeGroup.position.z += (0 - universeGroup.position.z) * 0.05;
            universeGroup.rotation.y += (ry - universeGroup.rotation.y) * 0.1 + 0.004;
            universeGroup.rotation.x += (rx - universeGroup.rotation.x) * 0.1;
            universeGroup.children.forEach(c => {
                if(currentType==='supernova' && c instanceof THREE.Points) c.scale.setScalar(1 + Math.sin(t*4)*0.15);
                if(currentType==='wormhole' && c instanceof THREE.Points) c.rotation.z += 0.15;
                if(currentType==='asteroids' && c.userData && c.userData.rs) { c.rotation.x+=c.userData.rs; c.rotation.y+=c.userData.rs; }
                if(currentType==='nebula') c.material.opacity = 0.08 + Math.sin(t*2)*0.04;
            });
        }
        const pA = stars.geometry.attributes.position.array;
        for(let i=0; i<pA.length; i+=3) { pA[i+2]+=starSpd; if(pA[i+2]>200) pA[i+2]=-4000; }
        stars.geometry.attributes.position.needsUpdate=true;
        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
