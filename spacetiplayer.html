<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v8.1.0 Interactive Odyssey</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #ui-layer { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; pointer-events: none; z-index: 1000; }
        #top-hud { width: 95%; display: flex; justify-content: space-between; margin-top: 15px; color: #00f2ff; font-weight: bold; font-size: 0.9rem; }
        .hud-box { background: rgba(0, 40, 80, 0.6); padding: 8px 15px; border-radius: 12px; border: 1px solid #00f2ff; backdrop-filter: blur(5px); }
        #feedback { position: absolute; top: 25%; color: #00ff66; font-size: 3.5rem; font-weight: bold; text-shadow: 0 0 25px #00ff66; opacity: 0; transition: 0.4s; transform: scale(0.5); pointer-events: none; }
        #scan-title { color: #fff; font-weight: bold; font-size: 1.8rem; margin: 10px 0 0; text-shadow: 0 0 15px #00f2ff; text-align: center; }
        #question { font-size: 4.5rem; color: #fff; margin: 5px 0; text-shadow: 0 0 25px #fff; }
        #answer-display { font-size: 4rem; color: #ff00de; font-weight: bold; min-height: 4rem; text-shadow: 0 0 15px #ff00de; }
        #numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 15px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 30px; backdrop-filter: blur(15px); pointer-events: auto; margin-bottom: 20px; transform: scale(0.9); }
        .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; font-size: 1.8rem; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.1s; }
        .btn:active { background: #00f2ff; color: #000; transform: scale(0.9); }
        .btn-go { background: linear-gradient(45deg, #006622, #00ff66); border: none; grid-column: span 2; width: auto; border-radius: 20px; font-weight: bold; color: #fff; text-shadow: 0 1px 5px #000; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="top-hud">
        <div class="hud-box">🎖️ <span id="rank-name">צוערת קרקע</span></div>
        <div class="hud-box">📍 <span id="dist">0</span> ק"מ</div>
    </div>
    <div id="feedback">מעולה!</div>
    <div id="data-scanner"><p id="scan-title">מכין מנועים...</p></div>
    <div style="display: flex; flex-direction: column; align-items: center;">
        <div id="mission-control" style="text-align: center;">
            <div id="question">? × ?</div>
            <div id="answer-display">?</div>
        </div>
        <div id="numpad">
            <div class="btn" onclick="press(1)">1</div><div class="btn" onclick="press(2)">2</div><div class="btn" onclick="press(3)">3</div>
            <div class="btn" onclick="press(4)">4</div><div class="btn" onclick="press(5)">5</div><div class="btn" onclick="press(6)">6</div>
            <div class="btn" onclick="press(7)">7</div><div class="btn" onclick="press(8)">8</div><div class="btn" onclick="press(9)">9</div>
            <div class="btn" style="color:#ff4444" onclick="del()">X</div><div class="btn" onclick="press(0)">0</div><div class="btn btn-go" onclick="check()">שיגור 🚀</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, stars, universeGroup, currentMesh;
    let score = 0, currentAns = 0, inputStr = "", distance = 0;
    let isJumping = false, starSpeed = 0.5;
    
    // משתני מגע (Touch)
    let isPointerDown = false;
    let pointerX = 0, pointerY = 0;
    let targetRotationX = 0, targetRotationY = 0;

    const ranks = [
        { name: "צוערת קרקע", min: 0 },
        { name: "טייסת אטמוספירה", min: 1000 },
        { name: "מפקדת ירח", min: 384000 },
        { name: "חוקרת מאדים", min: 5000000 },
        { name: "קצינת צדק", min: 50000000 },
        { name: "נווטת כוכבים", min: 500000000 }
    ];

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 10000);
        camera.position.z = 150;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // תאורה משופרת
        const light = new THREE.PointLight(0xffffff, 1.5, 1000);
        light.position.set(100, 100, 100);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x555555));

        // כוכבים
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<8000; i++) starPos.push((Math.random()-0.5)*4000, (Math.random()-0.5)*4000, (Math.random()-0.5)*4000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1 }));
        scene.add(stars);

        universeGroup = new THREE.Group();
        scene.add(universeGroup);

        // מאזיני מגע
        window.addEventListener('pointerdown', e => { 
            if(e.clientY < window.innerHeight * 0.6) { // רק אם נוגעים בחלק העליון של המסך
                isPointerDown = true;
                pointerX = e.clientX;
                pointerY = e.clientY;
            }
        });
        window.addEventListener('pointermove', e => {
            if(!isPointerDown) return;
            const deltaX = e.clientX - pointerX;
            const deltaY = e.clientY - pointerY;
            targetRotationY += deltaX * 0.01;
            targetRotationX += deltaY * 0.01;
            pointerX = e.clientX;
            pointerY = e.clientY;
        });
        window.addEventListener('pointerup', () => isPointerDown = false);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        generateObject(Math.floor(Math.random()*7));
        nextLevel();
        animate();
    }

    function generateObject(type) {
        universeGroup.clear();
        universeGroup.position.z = -800;
        targetRotationX = 0; targetRotationY = 0;
        const color = new THREE.Color().setHSL(Math.random(), 0.8, 0.5);
        const title = document.getElementById('scan-title');

        switch(type) {
            case 0:
                title.innerText = "כוכב לכת כחול";
                const p = new THREE.Mesh(new THREE.SphereGeometry(40,32,32), new THREE.MeshStandardMaterial({color: 0x2266ff, roughness: 0.6}));
                universeGroup.add(p);
                break;
            case 1:
                title.innerText = "פולסאר קוונטי";
                universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(15,32,32), new THREE.MeshBasicMaterial({color: 0xffffff})));
                let bG = new THREE.CylinderGeometry(1, 25, 600, 16);
                let bM = new THREE.MeshBasicMaterial({color: color, transparent: true, opacity: 0.3});
                let b1 = new THREE.Mesh(bG, bM); let b2 = new THREE.Mesh(bG, bM); b2.rotation.x = Math.PI;
                universeGroup.add(b1, b2);
                break;
            case 2:
                title.innerText = "חור שחור";
                universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(25,32,32), new THREE.MeshBasicMaterial({color: 0x000000})));
                const dGeo = new THREE.TorusGeometry(50, 5, 2, 100);
                const dMat = new THREE.MeshBasicMaterial({color: 0xff4400, wireframe: true});
                const disk = new THREE.Mesh(dGeo, dMat); disk.rotation.x = 1.4;
                universeGroup.add(disk);
                break;
            case 3:
                title.innerText = "גלקסיה";
                const galGeo = new THREE.BufferGeometry(); const galPos = [];
                for(let i=0; i<5000; i++) {
                    const r = Math.random() * 100; const a = r * 0.2;
                    galPos.push(Math.cos(a)*r, (Math.random()-0.5)*10, Math.sin(a)*r);
                }
                galGeo.setAttribute('position', new THREE.Float32BufferAttribute(galPos, 3));
                universeGroup.add(new THREE.Points(galGeo, new THREE.PointsMaterial({color: color, size: 1})));
                break;
            case 4:
                title.innerText = "ענק גז";
                universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(35,32,32), new THREE.MeshStandardMaterial({color: color})));
                let ring = new THREE.Mesh(new THREE.TorusGeometry(60, 3, 2, 64), new THREE.MeshBasicMaterial({color: 0xaaaaaa, transparent: true, opacity: 0.5}));
                ring.rotation.x = 1.5; universeGroup.add(ring);
                break;
            default:
                title.innerText = "תחנת חלל";
                universeGroup.add(new THREE.Mesh(new THREE.BoxGeometry(20, 20, 60), new THREE.MeshStandardMaterial({color: 0x888888})));
                let pnl = new THREE.Mesh(new THREE.BoxGeometry(100, 20, 1), new THREE.MeshBasicMaterial({color: 0x0044ff}));
                universeGroup.add(pnl);
        }
    }

    function check() {
        if(parseInt(inputStr) === currentAns) {
            score++; distance = Math.pow(score, 3.5) * 1000;
            updateHUD();
            const fb = document.getElementById('feedback');
            fb.style.opacity = "1"; fb.style.transform = "scale(1.2)";
            isJumping = true;
            setTimeout(() => {
                fb.style.opacity = "0"; fb.style.transform = "scale(0.5)";
                generateObject(Math.floor(Math.random()*6));
                nextLevel();
            }, 1000);
        } else { del(); }
    }

    function updateHUD() {
        document.getElementById('dist').innerText = Math.floor(distance).toLocaleString();
        let currentRank = ranks[0].name;
        for(let r of ranks) { if(distance >= r.min) currentRank = r.name; }
        document.getElementById('rank-name').innerText = currentRank;
    }

    function nextLevel() {
        let n1 = Math.floor(Math.random() * 8) + 2; 
        let n2 = Math.floor(Math.random() * 9) + 2;
        currentAns = n1 * n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        inputStr = ""; document.getElementById('answer-display').innerText = "?";
    }

    function press(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('answer-display').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }

    function animate() {
        requestAnimationFrame(animate);
        
        if(isJumping) {
            universeGroup.position.z += (1200 - universeGroup.position.z) * 0.1;
            starSpeed = 60;
            if(universeGroup.position.z > 1000) { isJumping = false; universeGroup.position.z = -1000; starSpeed = 0.5; }
        } else {
            universeGroup.position.z += (0 - universeGroup.position.z) * 0.05;
            // סיבוב אוטומטי עדין + השפעת מגע
            universeGroup.rotation.y += (targetRotationY - universeGroup.rotation.y) * 0.1 + 0.005;
            universeGroup.rotation.x += (targetRotationX - universeGroup.rotation.x) * 0.1;
        }

        const p = stars.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { 
            p[i+2] += starSpeed; 
            if(p[i+2] > 200) p[i+2] = -3000; 
        }
        stars.geometry.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
