<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל v9.2 - Anti-Repeat</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; z-index: 10; }
        .stats { display: flex; justify-content: space-around; padding: 10px; }
        .badge { background: rgba(0, 255, 255, 0.1); color: #00f2ff; padding: 5px 15px; border-radius: 15px; border: 1px solid #00f2ff; font-weight: bold; }
        #toast { position: absolute; top: 20%; width: 100%; text-align: center; color: #00ff66; font-size: 2.5rem; opacity: 0; transition: 0.3s; font-weight: bold; }
        #panel { margin-top: auto; background: rgba(0,0,0,0.9); padding: 15px; pointer-events: auto; display: flex; flex-direction: column; align-items: center; border-top: 2px solid #333; }
        #name-label { color: #fff; font-size: 1.2rem; margin-bottom: 5px; background: #222; padding: 2px 10px; border-radius: 5px; }
        #math-display { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        #q-text { color: #fff; font-size: 3rem; font-weight: bold; }
        #a-text { color: #ff00de; font-size: 3rem; min-width: 60px; border-bottom: 3px solid #ff00de; text-align: center; font-weight: bold; }
        .keys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
        .k { width: 48px; height: 48px; background: #333; color: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: bold; }
        .k:active { background: #00f2ff; color: #000; }
        .go { background: #008844; width: 80px; border: none; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stats">
        <div class="badge" id="rank-ui">דרגה: טירונית</div>
        <div class="badge" id="dist-ui">0 ק"מ</div>
    </div>
    <div id="toast">מעולה! 🌟</div>
    <div id="panel">
        <div id="name-label">מזהה אובייקט...</div>
        <div id="math-display">
            <div id="q-text">7 × 8</div>
            <div id="a-text">?</div>
        </div>
        <div class="keys">
            <div class="k" onclick="key(1)">1</div><div class="k" onclick="key(2)">2</div><div class="k" onclick="key(3)">3</div>
            <div class="k" onclick="key(4)">4</div><div class="k" onclick="key(5)">5</div><div class="k" onclick="del()" style="color:red">X</div>
            <div class="k" onclick="key(6)">6</div><div class="k" onclick="key(7)">7</div><div class="k" onclick="key(8)">8</div>
            <div class="k" onclick="key(9)">9</div><div class="k" onclick="key(0)">0</div><div class="k go" onclick="check()">GO</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let sc, cam, rend, uni, stars, targetA, input = "", score = 0, dist = 0, rx = 0, ry = 0, isJp = false, moveS = 0.2;
    let lastObjIndex = -1; // משתנה לזיכרון

    const lib = [
        { n: "כדור הארץ", c: 0x2266ff, type: "sphere" },
        { n: "מאדים", c: 0xff4400, type: "sphere" },
        { n: "שבתאי", c: 0xdfbe9f, type: "ring" },
        { n: "חור שחור", type: "blackhole" },
        { n: "גלקסיה", type: "galaxy" },
        { n: "השמש", c: 0xffcc00, type: "sun" },
        { n: "צדק", c: 0xd2b48c, type: "sphere" },
        { n: "נפטון", c: 0x3355ff, type: "sphere" },
        { n: "אורנוס", c: 0xaaffff, type: "ring-v" },
        { n: "ונוס", c: 0xffcc99, type: "sphere" },
        { n: "תחנת חלל", type: "station" },
        { n: "כוכב נייטרון", c: 0xffffff, type: "neutron" }
    ];

    function init() {
        sc = new THREE.Scene();
        cam = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
        cam.position.set(0, 15, 180);
        rend = new THREE.WebGLRenderer({ antialias: true });
        rend.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(rend.domElement);
        uni = new THREE.Group(); sc.add(uni);
        sc.add(new THREE.AmbientLight(0xffffff, 0.5));
        const l = new THREE.PointLight(0xffffff, 1); l.position.set(50,50,100); sc.add(l);
        const stG = new THREE.BufferGeometry(); const stP = [];
        for(let i=0; i<4000; i++) stP.push((Math.random()-0.5)*2000, (Math.random()-0.5)*2000, (Math.random()-0.5)*2000);
        stG.setAttribute('position', new THREE.Float32BufferAttribute(stP, 3));
        stars = new THREE.Points(stG, new THREE.PointsMaterial({color: 0xffffff, size: 0.8})); sc.add(stars);
        let dn = false, ox, oy;
        window.onpointerdown = e => { if(e.clientY < window.innerHeight*0.7) { dn=true; ox=e.clientX; oy=e.clientY; }};
        window.onpointermove = e => { if(dn) { ry += (e.clientX-ox)*0.01; rx += (e.clientY-oy)*0.01; ox=e.clientX; oy=e.clientY; }};
        window.onpointerup = () => dn=false;
        spawn(lib[0]); gen(); loop();
    }

    function spawn(obj) {
        uni.clear(); uni.position.z = -500;
        document.getElementById('name-label').innerText = "מזהה: " + obj.n;
        if(obj.type === "blackhole") {
            uni.add(new THREE.Mesh(new THREE.SphereGeometry(25,32,32), new THREE.MeshBasicMaterial({color:0})));
            const r = new THREE.Mesh(new THREE.TorusGeometry(45,2,2,50), new THREE.MeshBasicMaterial({color:0xff6600}));
            r.rotation.x = 1.5; uni.add(r);
        } else if(obj.type === "galaxy") {
            const pG = new THREE.BufferGeometry(); const pP = [];
            for(let i=0; i<2500; i++) { let r=Math.random()*100, a=r*0.12; pP.push(Math.cos(a)*r, (Math.random()-0.5)*10, Math.sin(a)*r); }
            pG.setAttribute('position', new THREE.Float32BufferAttribute(pP, 3));
            uni.add(new THREE.Points(pG, new THREE.PointsMaterial({color:0x00f2ff, size:1.2})));
        } else if(obj.type === "ring") {
            uni.add(new THREE.Mesh(new THREE.SphereGeometry(35,32,32), new THREE.MeshStandardMaterial({color:obj.c})));
            const r = new THREE.Mesh(new THREE.TorusGeometry(55,3,2,50), new THREE.MeshStandardMaterial({color:0x888888, transparent:true, opacity:0.5}));
            r.rotation.x = 1.5; uni.add(r);
        } else if(obj.type === "ring-v") {
            uni.add(new THREE.Mesh(new THREE.SphereGeometry(35,32,32), new THREE.MeshStandardMaterial({color:obj.c})));
            const r = new THREE.Mesh(new THREE.TorusGeometry(55,1.5,2,50), new THREE.MeshStandardMaterial({color:0xffffff, transparent:true, opacity:0.4}));
            r.rotation.y = 1.5; uni.add(r);
        } else if(obj.type === "station") {
            const b = new THREE.Mesh(new THREE.BoxGeometry(10,10,40), new THREE.MeshStandardMaterial({color:0xaaaaaa}));
            const p = new THREE.Mesh(new THREE.BoxGeometry(60,1,30), new THREE.MeshStandardMaterial({color:0x0044ff}));
            uni.add(b, p);
        } else if(obj.type === "neutron") {
            uni.add(new THREE.Mesh(new THREE.SphereGeometry(20,32,32), new THREE.MeshBasicMaterial({color:0xffffff})));
            const h = new THREE.Mesh(new THREE.SphereGeometry(45,32,32), new THREE.MeshBasicMaterial({color:0x00f2ff, transparent:true, opacity:0.2, wireframe:true}));
            uni.add(h);
        } else {
            uni.add(new THREE.Mesh(new THREE.SphereGeometry(40,32,32), new THREE.MeshStandardMaterial({color:obj.c, emissive: obj.type==="sun"?obj.c:0})));
        }
    }

    function gen() {
        let n1 = Math.floor(Math.random()*9)+2, n2 = Math.floor(Math.random()*9)+2;
        targetA = n1*n2; document.getElementById('q-text').innerText = `${n1} × ${n2}`;
        input = ""; document.getElementById('a-text').innerText = "?";
    }

    function key(n) { if(input.length < 3) { input += n; document.getElementById('a-text').innerText = input; } }
    function del() { input = ""; document.getElementById('a-text').innerText = "?"; }

    function check() {
        if(parseInt(input) === targetA) {
            score++; dist += 15000;
            document.getElementById('dist-ui').innerText = dist.toLocaleString() + " ק\"מ";
            const rks = ["טירונית", "צוערת", "טייסת", "מפקדת", "אגדה"];
            document.getElementById('rank-ui').innerText = "דרגה: " + rks[Math.min(Math.floor(score/5), 4)];
            const t = document.getElementById('toast'); t.style.opacity = 1;
            isJp = true;
            
            // מנגנון בחירה ללא חזרות:
            let nextIndex;
            do { nextIndex = Math.floor(Math.random() * lib.length); } 
            while (nextIndex === lastObjIndex); // אל תבחר את מה שהיה הרגע
            lastObjIndex = nextIndex;

            setTimeout(() => { 
                t.style.opacity = 0; 
                spawn(lib[nextIndex]); 
                gen(); 
            }, 800);
        } else { del(); }
    }

    function loop() {
        requestAnimationFrame(loop);
        if(isJp) { uni.position.z += (1100-uni.position.z)*0.1; moveS=40; if(uni.position.z>1000){ isJp=false; uni.position.z=-550; moveS=0.2; } }
        else { uni.position.z += (0-uni.position.z)*0.05; }
        uni.rotation.y += (ry - uni.rotation.y)*0.1 + 0.005; uni.rotation.x += (rx - uni.rotation.x)*0.1;
        const p = stars.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { p[i+2]+=moveS; if(p[i+2]>200) p[i+2]=-1800; }
        stars.geometry.attributes.position.needsUpdate = true;
        rend.render(sc, cam);
    }
    init();
</script>
</body>
</html>
