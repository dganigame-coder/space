  <!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v8.1.6 Rotation Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        
        /* שכבת הממשק - חשוב: pointer-events: none כדי שהמגע יעבור ל-3D */
        #ui-layer { 
            position: absolute; width: 100%; height: 100%; 
            display: flex; flex-direction: column; 
            pointer-events: none; z-index: 10; 
        }
        
        #top-hud { width: 100%; display: flex; justify-content: space-around; padding-top: 10px; }
        .hud-box { background: rgba(0, 242, 255, 0.1); padding: 5px 12px; border-radius: 15px; color: #00f2ff; font-size: 0.8rem; backdrop-filter: blur(4px); pointer-events: auto; }
        
        #game-view { flex-grow: 1; }

        /* הפנל התחתון - רק הוא חוסם מגע */
        #control-panel { 
            max-height: 25vh; padding-bottom: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            pointer-events: auto; 
            background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
        }
        
        #question-row { display: flex; align-items: center; gap: 20px; margin: 8px 0; }
        #question { font-size: 2.5rem; color: #fff; text-shadow: 0 0 15px #000; }
        #answer-display { font-size: 2.5rem; color: #ff00de; min-width: 60px; text-align: center; }
        
        #numpad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; padding: 10px; background: rgba(255, 255, 255, 0.05); border-radius: 15px; backdrop-filter: blur(10px); }
        .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; font-size: 1.2rem; width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .btn-go { background: linear-gradient(45deg, #006622, #00ff66); border: none; width: 85px; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="top-hud">
        <div class="hud-box">📍 <span id="dist">0</span> ק"מ</div>
        <div class="hud-box">🎖️ <span id="rank-name">צוערת</span></div>
    </div>
    <div id="game-view"></div>
    <div id="control-panel">
        <div id="question-row">
            <div id="question">? × ?</div>
            <div id="answer-display">?</div>
        </div>
        <div id="numpad">
            <div class="btn" onclick="press(1)">1</div><div class="btn" onclick="press(2)">2</div><div class="btn" onclick="press(3)">3</div>
            <div class="btn" onclick="press(4)">4</div><div class="btn" onclick="press(5)">5</div><div class="btn" style="color:#ff4444" onclick="del()">X</div>
            <div class="btn" onclick="press(6)">6</div><div class="btn" onclick="press(7)">7</div><div class="btn" onclick="press(8)">8</div>
            <div class="btn" onclick="press(9)">9</div><div class="btn" onclick="press(0)">0</div><div class="btn btn-go" onclick="check()">שיגור</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, stars, universeGroup;
    let score = 0, currentAns = 0, inputStr = "", distance = 0;
    let isJumping = false, speed = 0.1;
    let targetRotX = 0, targetRotY = 0;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 5000);
        camera.position.set(0, 0, 150);
        
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const light = new THREE.PointLight(0xffffff, 1);
        light.position.set(50, 50, 100);
        scene.add(light);

        universeGroup = new THREE.Group();
        universeGroup.position.y = 25; 
        scene.add(universeGroup);

        // כוכבים
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<5000; i++) starPos.push((Math.random()-0.5)*3000, (Math.random()-0.5)*3000, (Math.random()-0.5)*3000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 }));
        scene.add(stars);

        // --- מנגנון סיבוב משופר ---
        let isDragging = false;
        let previousMouseX = 0, previousMouseY = 0;

        const onDown = (x, y) => {
            if (y < window.innerHeight * 0.75) { // רק אם נוגעים מעל הפנל
                isDragging = true;
                previousMouseX = x; previousMouseY = y;
            }
        };

        const onMove = (x, y) => {
            if (isDragging) {
                const deltaX = x - previousMouseX;
                const deltaY = y - previousMouseY;
                targetRotY += deltaX * 0.01;
                targetRotX += deltaY * 0.01;
                previousMouseX = x; previousMouseY = y;
            }
        };

        window.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
        window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('touchstart', e => onDown(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchmove', e => onMove(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchend', () => isDragging = false);

        createObject("earth");
        nextLevel(); animate();
    }

    function createObject(type) {
        universeGroup.clear();
        universeGroup.position.z = -500;
        if(type === "earth") {
            universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(45,32,32), new THREE.MeshStandardMaterial({color: 0x2266ff})));
        } else {
            const color = new THREE.Color().setHSL(Math.random(), 0.8, 0.5);
            universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(40,32,32), new THREE.MeshStandardMaterial({color: color})));
        }
    }

    function press(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('answer-display').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }
    function check() {
        if(parseInt(inputStr) === currentAns) {
            score++; distance += 15000;
            document.getElementById('dist').innerText = distance.toLocaleString();
            isJumping = true;
            setTimeout(() => { createObject("random"); nextLevel(); }, 700);
        } else { del(); }
    }
    function nextLevel() {
        let n1 = Math.floor(Math.random()*8)+2, n2 = Math.floor(Math.random()*9)+2;
        currentAns = n1 * n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        inputStr = ""; document.getElementById('answer-display').innerText = "?";
    }

    function animate() {
        requestAnimationFrame(animate);
        if(isJumping) {
            universeGroup.position.z += (1200 - universeGroup.position.z) * 0.12;
            speed = 50;
            if(universeGroup.position.z > 1100) { isJumping = false; universeGroup.position.z = -600; speed = 0.1; }
        } else {
            universeGroup.position.z += (0 - universeGroup.position.z) * 0.05;
        }
        
        // החלת הסיבוב
        universeGroup.rotation.x += (targetRotX - universeGroup.rotation.x) * 0.1;
        universeGroup.rotation.y += (targetRotY - universeGroup.rotation.y) * 0.1;

        const p = stars.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { p[i+2] += speed; if(p[i+2] > 200) p[i+2] = -2000; }
        stars.geometry.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
