  <!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל v6.9</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        
        /* פנל שקוף לחלוטין לפי הבקשה שלך */
        #ui { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: none; z-index: 10; }
        
        .header { display: flex; justify-content: space-between; padding: 15px; }
        .box { color: #00f2ff; font-weight: bold; text-shadow: 2px 2px 4px #000; font-size: 1.2rem; }

        #msg { position: absolute; top: 25%; width: 100%; text-align: center; color: #00ff66; font-size: 3.5rem; opacity: 0; font-weight: bold; text-shadow: 0 0 20px #000; transition: 0.2s; }

        #panel { margin-top: auto; padding: 20px 10px; pointer-events: auto; display: flex; flex-direction: column; align-items: center; background: transparent; }
        
        #obj-info { color: #fff; font-size: 1.4rem; margin-bottom: 10px; text-shadow: 2px 2px 8px #000; font-weight: bold; }
        
        #math-row { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        #q { color: #fff; font-size: 4.5rem; font-weight: 900; text-shadow: 0 0 15px #000; }
        #a { color: #ff00de; font-size: 4.5rem; min-width: 80px; border-bottom: 5px solid #ff00de; text-align: center; font-weight: 900; text-shadow: 0 0 15px #000; }

        .keys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; width: 100%; max-width: 450px; }
        .k { height: 60px; background: rgba(255, 255, 255, 0.15); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(5px); }
        .k:active { background: #00f2ff; color: #000; }
        .k-go { background: rgba(0, 255, 100, 0.4); grid-column: span 2; border-radius: 15px; font-weight: bold; border: 1px solid #00ff66; }
    </style>
</head>
<body>

<div id="ui">
    <div class="header">
        <div class="box" id="dist-txt">0 ק"מ</div>
        <div class="box" id="rank-txt">טירונית</div>
    </div>
    <div id="msg">מצוין!</div>
    <div id="panel">
        <div id="obj-info">מזהה אובייקט...</div>
        <div id="math-row">
            <div id="q">? × ?</div>
            <div id="a">?</div>
        </div>
        <div class="keys">
            <div class="k" onclick="press(1)">1</div><div class="k" onclick="press(2)">2</div><div class="k" onclick="press(3)">3</div>
            <div class="k" onclick="press(4)">4</div><div class="k" onclick="press(5)">5</div><div class="k" onclick="clr()" style="color:#ff4444">X</div>
            <div class="k" onclick="press(6)">6</div><div class="k" onclick="press(7)">7</div><div class="k" onclick="press(8)">8</div>
            <div class="k" onclick="press(9)">9</div><div class="k" onclick="press(0)">0</div><div class="k k-go" onclick="check()">GO</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // רשימה גנרית פשוטה שעובדת תמיד
    const spaceLibrary = [
        { name: "כדור הארץ", color: 0x2266ff },
        { name: "מאדים", color: 0xff4400 },
        { name: "שבתאי", color: 0xdfbe9f, hasRings: true },
        { name: "נפטון", color: 0x3355ff },
        { name: "צדק", color: 0xd2b48c },
        { name: "ונוס", color: 0xffcc33 }
    ];

    let scene, camera, renderer, currentObj, stars, targetAns, input = "", score = 0, dist = 0, warping = false;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.z = 150;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.PointLight(0xffffff, 1.2);
        light.position.set(50, 50, 100);
        scene.add(light, new THREE.AmbientLight(0xffffff, 0.5));

        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<2000; i++) starPos.push((Math.random()-0.5)*1500, (Math.random()-0.5)*1500, (Math.random()-0.5)*1500);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.8}));
        scene.add(stars);

        spawn(spaceLibrary[0]);
        gen();
        animate();

        // החזרת השליטה עם האצבע
        let isDown = false, lx, ly;
        window.addEventListener('pointerdown', e => { if(e.clientY < window.innerHeight * 0.6) { isDown = true; lx = e.clientX; ly = e.clientY; }});
        window.addEventListener('pointermove', e => {
            if(!isDown || !currentObj) return;
            currentObj.rotation.y += (e.clientX - lx) * 0.01;
            currentObj.rotation.x += (e.clientY - ly) * 0.01;
            lx = e.clientX; ly = e.clientY;
        });
        window.addEventListener('pointerup', () => isDown = false);
    }

    function spawn(data) {
        if(currentObj) scene.remove(currentObj);
        currentObj = new THREE.Group();
        document.getElementById('obj-info').innerText = "אובייקט: " + data.name;

        const sphere = new THREE.Mesh(new THREE.SphereGeometry(45, 32, 32), new THREE.MeshStandardMaterial({color: data.color}));
        currentObj.add(sphere);

        if(data.hasRings) {
            const ring = new THREE.Mesh(new THREE.TorusGeometry(65, 3, 2, 50), new THREE.MeshStandardMaterial({color: 0x888888, transparent: true, opacity: 0.5}));
            ring.rotation.x = 1.5;
            currentObj.add(ring);
        }

        scene.add(currentObj);
        currentObj.position.z = -500; // מתחיל רחוק ומתקרב
    }

    function gen() {
        let n1 = Math.floor(Math.random()*9)+2, n2 = Math.floor(Math.random()*9)+2;
        targetAns = n1 * n2;
        document.getElementById('q').innerText = `${n1} × ${n2}`;
        input = ""; document.getElementById('a').innerText = "?";
    }

    function press(n) { if(input.length < 3) { input += n; document.getElementById('a').innerText = input; } }
    function clr() { input = ""; document.getElementById('a').innerText = "?"; }

    function check() {
        if(parseInt(input) === targetAns) {
            score++; dist += 30000;
            document.getElementById('dist-txt').innerText = dist.toLocaleString() + " ק\"מ";
            document.getElementById('msg').style.opacity = 1;
            warping = true;
            setTimeout(() => {
                document.getElementById('msg').style.opacity = 0;
                warping = false;
                spawn(spaceLibrary[Math.floor(Math.random()*spaceLibrary.length)]);
                gen();
            }, 800);
        } else { clr(); }
    }

    function animate() {
        requestAnimationFrame(animate);
        if(warping) {
            currentObj.position.z += 25;
            const p = stars.geometry.attributes.position.array;
            for(let i=0; i<p.length; i+=3) { p[i+2] += 20; if(p[i+2]>200) p[i+2]=-1000; }
            stars.geometry.attributes.position.needsUpdate = true;
        } else {
            if(currentObj.position.z < 0) currentObj.position.z += 15;
            currentObj.rotation.y += 0.005;
        }
        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
