<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל v6.8 - Modular</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: none; z-index: 10; }
        .header { display: flex; justify-content: space-between; padding: 15px; }
        .box { color: #00f2ff; font-weight: bold; text-shadow: 2px 2px 4px #000; font-size: 1.1rem; }
        #msg { position: absolute; top: 25%; width: 100%; text-align: center; color: #00ff66; font-size: 3rem; opacity: 0; font-weight: bold; text-shadow: 0 0 20px #000; }
        #panel { margin-top: auto; padding: 20px 10px; pointer-events: auto; display: flex; flex-direction: column; align-items: center; background: transparent; }
        #obj-info { color: #fff; font-size: 1.2rem; margin-bottom: 5px; text-shadow: 2px 2px 5px #000; font-weight: bold; }
        #math-row { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        #q { color: #fff; font-size: 4rem; font-weight: 900; text-shadow: 0 0 15px #000; }
        #a { color: #ff00de; font-size: 4rem; min-width: 70px; border-bottom: 5px solid #ff00de; text-align: center; font-weight: 900; text-shadow: 0 0 15px #000; }
        .keys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; width: 100%; max-width: 420px; }
        .k { height: 60px; background: rgba(255, 255, 255, 0.15); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(2px); }
        .k:active { background: #00f2ff; color: #000; }
        .k-go { background: rgba(0, 255, 100, 0.4); grid-column: span 2; border-radius: 15px; font-weight: bold; border: 1px solid #00ff66; }
    </style>
</head>
<body>

<div id="ui">
    <div class="header">
        <div class="box" id="dist-txt">0 ק"מ</div>
        <div class="box" id="rank-txt">טירונית</div>
    </div>
    <div id="msg">מצוין!</div>
    <div id="panel">
        <div id="obj-info">טוען נתונים...</div>
        <div id="math-row">
            <div id="q">? × ?</div>
            <div id="a">?</div>
        </div>
        <div class="keys">
            <div class="k" onclick="press(1)">1</div><div class="k" onclick="press(2)">2</div><div class="k" onclick="press(3)">3</div>
            <div class="k" onclick="press(4)">4</div><div class="k" onclick="press(5)">5</div><div class="k" onclick="clr()" style="color:#ff4444">X</div>
            <div class="k" onclick="press(6)">6</div><div class="k" onclick="press(7)">7</div><div class="k" onclick="press(8)">8</div>
            <div class="k" onclick="press(9)">9</div><div class="k" onclick="press(0)">0</div><div class="k k-go" onclick="check()">GO</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="spaceData.js"></script>

<script src="gameLogic.js"></script>

</body>
</html>
