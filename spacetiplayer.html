<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v7.5.0 Galaxy Hero</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #ui-layer { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; pointer-events: none; z-index: 1000; }
        #top-hud { width: 95%; display: flex; justify-content: space-between; margin-top: 15px; color: #00f2ff; font-weight: bold; font-size: 0.85rem; }
        .rank-box { background: rgba(0, 242, 255, 0.1); padding: 5px 10px; border-radius: 10px; border: 1px solid #00f2ff; }
        #feedback { position: absolute; top: 40%; color: #00ff66; font-size: 3rem; font-weight: bold; text-shadow: 0 0 20px #00ff66; opacity: 0; transition: 0.3s; transform: scale(0.5); }
        #scan-title { color: #fff; font-weight: bold; font-size: 1.5rem; margin: 10px 0 0; text-shadow: 0 0 15px #00f2ff; }
        #question { font-size: 3.8rem; color: #fff; margin: 10px 0 0; text-shadow: 0 0 20px #fff; }
        #answer-display { font-size: 2.5rem; color: #ff00de; font-weight: bold; min-height: 3rem; }
        #numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 15px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 30px; backdrop-filter: blur(15px); transform: scale(0.8); pointer-events: auto; }
        .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; font-size: 1.6rem; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .btn-go { background: rgba(0, 255, 100, 0.2); border-color: #0f0; grid-column: span 2; width: auto; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="top-hud">
        <div class="rank-box">🎖️ <span id="rank-name">צוערת חלל</span></div>
        <div>🚀 מרחק: <span id="dist">0</span></div>
    </div>
    <div id="feedback">כל הכבוד!</div>
    <div id="data-scanner"><p id="scan-title">סורק...</p></div>
    <div style="display: flex; flex-direction: column; align-items: center; padding-bottom: 5px;">
        <div id="mission-control">
            <div id="question">? × ?</div>
            <div id="answer-display">?</div>
        </div>
        <div id="numpad">
            <div class="btn" onclick="press(1)">1</div><div class="btn" onclick="press(2)">2</div><div class="btn" onclick="press(3)">3</div>
            <div class="btn" onclick="press(4)">4</div><div class="btn" onclick="press(5)">5</div><div class="btn" onclick="press(6)">6</div>
            <div class="btn" onclick="press(7)">7</div><div class="btn" onclick="press(8)">8</div><div class="btn" onclick="press(9)">9</div>
            <div class="btn" style="color:#ff4444" onclick="del()">X</div><div class="btn" onclick="press(0)">0</div><div class="btn btn-go" onclick="check()">קפיצה 🚀</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, stars, universeGroup;
    let score = 0, currentAns = 0, inputStr = "", distance = 0;
    let targetZ = 0, isJumping = false, speed = 0.2;
    let targetRotX = 0, targetRotY = 0;

    const ranks = ["צוערת חלל", "חוקרת כוכבים", "קצינת ניווט", "קפטן גלקסיה", "מפקדת עליונה"];
    const praises = ["מדהים!", "קפיצת וורפ!", "אלופה!", "גאונה!", "בול במטרה!"];

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 5000);
        camera.position.z = 150;
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<10000; i++) starPos.push((Math.random()-0.5)*4000, (Math.random()-0.5)*4000, (Math.random()-0.5)*4000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 }));
        scene.add(stars);

        let sX, sY;
        document.addEventListener('touchstart', e => { if(!e.target.closest('#numpad')) { sX = e.touches[0].clientX; sY = e.touches[0].clientY; } });
        document.addEventListener('touchmove', e => {
            if(!e.target.closest('#numpad')) {
                targetRotY += (e.touches[0].clientX - sX) * 0.01;
                targetRotX += (e.touches[0].clientY - sY) * 0.01;
                sX = e.touches[0].clientX; sY = e.touches[0].clientY;
            }
        });

        generateNewSystem();
        nextLevel();
        animate();
    }

    function generateNewSystem() {
        if(universeGroup) scene.remove(universeGroup);
        universeGroup = new THREE.Group();
        universeGroup.position.z = -800;
        
        const type = Math.floor(Math.random() * 7); // הוספנו עוד 2 סוגים
        const color = new THREE.Color().setHSL(Math.random(), 1, 0.5);
        const title = document.getElementById('scan-title');

        if(type === 0) { // מערכת שמש
            title.innerText = "מערכת שמש";
            universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(15, 32, 32), new THREE.MeshBasicMaterial({color: 0xffaa00})));
            const pGroup = new THREE.Group();
            const planet = new THREE.Mesh(new THREE.SphereGeometry(5, 24, 24), new THREE.MeshStandardMaterial({color: color}));
            planet.position.x = 40; pGroup.add(planet); universeGroup.add(pGroup);
            universeGroup.userData.rotateY = pGroup;
        } else if(type === 1) { // פולסאר
            title.innerText = "פולסאר מגנטי";
            const core = new THREE.Mesh(new THREE.SphereGeometry(8, 32, 32), new THREE.MeshBasicMaterial({color: 0xffffff}));
            universeGroup.add(core);
            const beamGeo = new THREE.CylinderGeometry(1, 10, 300, 16);
            const beamMat = new THREE.MeshBasicMaterial({color: color, transparent: true, opacity: 0.3});
            const beam1 = new THREE.Mesh(beamGeo, beamMat);
            const beam2 = new THREE.Mesh(beamGeo, beamMat);
            beam2.rotation.x = Math.PI; universeGroup.add(beam1, beam2);
            universeGroup.userData.rotateZ = universeGroup;
        } else if(type === 2) { // חגורת אסטרואידים
            title.innerText = "חגורת אסטרואידים";
            for(let i=0; i<50; i++) {
                const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(Math.random()*3, 0), new THREE.MeshBasicMaterial({color: 0x888888}));
                let r = 40 + Math.random()*20; let a = Math.random()*Math.PI*2;
                rock.position.set(Math.cos(a)*r, (Math.random()-0.5)*10, Math.sin(a)*r);
                universeGroup.add(rock);
            }
            universeGroup.userData.rotateY = universeGroup;
        } else if(type === 3) { // חור שחור
            title.innerText = "אופק האירועים";
            universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(20, 32, 32), new THREE.MeshBasicMaterial({color: 0x000000})));
            const pts = []; for(let i=0; i<2000; i++){ let r=35+Math.random()*40; let a=Math.random()*Math.PI*2; pts.push(Math.cos(a)*r, 0, Math.sin(a)*r); }
            const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
            const d = new THREE.Points(g, new THREE.PointsMaterial({color: color, size: 2, blending: THREE.AdditiveBlending}));
            universeGroup.add(d); universeGroup.userData.rotateY = d;
        } else if(type === 4) { // סופרנובה
            title.innerText = "סופרנובה פועמת";
            const g = new THREE.SphereGeometry(10, 32, 32);
            const m = new THREE.MeshBasicMaterial({color: color, transparent: true, opacity: 0.5});
            const s = new THREE.Mesh(g, m); universeGroup.add(s);
            universeGroup.userData.pulse = s;
        } else if(type === 5) { // גלקסיה
            title.innerText = "גלקסיה ספירלית";
            const pts = []; for(let i=0; i<3000; i++){ let r=Math.random()*90; let a=r*0.2; pts.push(Math.cos(a)*r, 0, Math.sin(a)*r); }
            const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
            universeGroup.add(new THREE.Points(g, new THREE.PointsMaterial({color: color, size: 1})));
        } else { // ערפילית
            title.innerText = "ערפילית גז";
            const pts = []; for(let i=0; i<1000; i++) pts.push((Math.random()-0.5)*120, (Math.random()-0.5)*120, (Math.random()-0.5)*120);
            const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
            universeGroup.add(new THREE.Points(g, new THREE.PointsMaterial({color: color, size: 4, transparent: true, opacity: 0.4})));
        }

        scene.add(universeGroup);
        isJumping = true; targetZ = 0;
    }

    function check() {
        const fb = document.getElementById('feedback');
        if(parseInt(inputStr) === currentAns) {
            score++; distance += 500;
            document.getElementById('dist').innerText = distance;
            document.getElementById('rank-name').innerText = ranks[Math.min(Math.floor(score/5), 4)];
            
            fb.innerText = praises[Math.floor(Math.random()*praises.length)];
            fb.style.opacity = "1"; fb.style.transform = "scale(1.2)";
            
            targetZ = 1200; isJumping = true;
            setTimeout(() => { 
                fb.style.opacity = "0"; fb.style.transform = "scale(0.5)";
                generateNewSystem(); nextLevel(); 
            }, 1500);
        } else { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }
    }

    function nextLevel() {
        let n1 = Math.floor(Math.random()*8)+2, n2 = Math.floor(Math.random()*9)+1;
        currentAns = n1*n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        inputStr = ""; document.getElementById('answer-display').innerText = "?";
    }

    function press(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('answer-display').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }

    function animate() {
        requestAnimationFrame(animate);
        if(isJumping) {
            universeGroup.position.z += (targetZ - universeGroup.position.z) * 0.08;
            speed = 45;
            if(Math.abs(universeGroup.position.z - targetZ) < 1) { isJumping = false; speed = 0.2; }
        }
        universeGroup.rotation.x += (targetRotX - universeGroup.rotation.x) * 0.05;
        universeGroup.rotation.y += (targetRotY - universeGroup.rotation.y) * 0.05;

        if(universeGroup.userData.rotateY) universeGroup.userData.rotateY.rotation.y += 0.03;
        if(universeGroup.userData.rotateZ) universeGroup.userData.rotateZ.rotation.z += 0.1;
        if(universeGroup.userData.pulse) {
            let s = 1 + Math.sin(Date.now()*0.005)*0.3;
            universeGroup.userData.pulse.scale.set(s,s,s);
        }

        const p = stars.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { p[i+2]+=speed; if(p[i+2]>150) p[i+2]=-2000; }
        stars.geometry.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
