<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLM Autonomous Driver 3D</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }
        #ai-overlay { 
            position: absolute; bottom: 20px; left: 20px; 
            background: rgba(0,0,0,0.7); color: #0f0; padding: 15px;
            font-family: 'Courier New', monospace; border-left: 4px solid #0f0;
            max-width: 400px; font-size: 14px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ai-overlay">Initializing SLM Brain...</div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const aiText = document.getElementById("ai-overlay");

        let car, roads = [], obstacles = [];
        let driveState = "IDLE";

        const createScene = async function () {
            const scene = new BABYLON.Scene(engine);
            
            // --- 4K Lighting & Environment ---
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;
            const skybox = BABYLON.MeshBuilder.CreateBox("skyBox", {size:1000.0}, scene);
            const skyboxMaterial = new BABYLON.StandardMaterial("skyBox", scene);
            skyboxMaterial.backFaceCulling = false;
            skyboxMaterial.reflectionTexture = new BABYLON.CubeTexture("https://playground.babylonjs.com/textures/skybox", scene);
            skyboxMaterial.reflectionTexture.coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
            skyboxMaterial.diffuseColor = new BABYLON.Color3(0, 0, 0);
            skyboxMaterial.specularColor = new BABYLON.Color3(0, 0, 0);
            skybox.material = skyboxMaterial;

            // --- Procedural GPS Map Generation ---
            // On every reset (refresh), we generate a random seed for road layouts
            generateCity(scene);

            // --- The Autonomous Car ---
            car = BABYLON.MeshBuilder.CreateBox("car", {height: 0.5, width: 1, depth: 2}, scene);
            car.position.y = 0.3;
            const carMat = new BABYLON.PBRMaterial("carMat", scene);
            carMat.metallic = 0.9; carMat.roughness = 0.1; carMat.albedoColor = new BABYLON.Color3(0.1, 0.5, 1);
            car.material = carMat;

            // --- AI Camera ---
            const camera = new BABYLON.FollowCamera("carCam", new BABYLON.Vector3(0, 5, -10), scene);
            camera.lockedTarget = car;
            camera.radius = 10; camera.heightOffset = 4;

            // --- SLM AI "Voice" Simulation ---
            setInterval(() => updateAIDecision(), 4000);

            return scene;
        };

        function generateCity(scene) {
            // Create a randomized grid
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 200, height: 200}, scene);
            const roadMat = new BABYLON.StandardMaterial("roadMat", scene);
            roadMat.diffuseTexture = new BABYLON.Texture("https://playground.babylonjs.com/textures/grass.png", scene);
            
            // Random Traffic Light
            const signal = BABYLON.MeshBuilder.CreateSphere("signal", {diameter: 0.5}, scene);
            signal.position = new BABYLON.Vector3(0, 2, 10);
            const sigMat = new BABYLON.StandardMaterial("sigMat", scene);
            sigMat.emissiveColor = BABYLON.Color3.Red();
            signal.material = sigMat;
            
            // Rule logic: AI senses this light
            scene.onBeforeRenderObservable.add(() => {
                let dist = BABYLON.Vector3.Distance(car.position, signal.position);
                if (dist < 5 && sigMat.emissiveColor.equals(BABYLON.Color3.Red())) {
                    driveState = "STOPPED_AT_RED";
                } else {
                    driveState = "CRUISING";
                    car.moveWithCollisions(new BABYLON.Vector3(0, 0, 0.05));
                }
            });
        }

        function updateAIDecision() {
            // Simulated SLM Output (In a real app, fetch from a local LLM endpoint)
            const thoughts = {
                "CRUISING": [
                    "Optimal path detected via GPS. Maintaining 40km/h.",
                    "Analyzing road curvature. No pedestrians detected.",
                    "Adjusting torque for fuel efficiency. Path is clear."
                ],
                "STOPPED_AT_RED": [
                    "Red light detected. Applying regenerative braking.",
                    "Waiting for cross-traffic priority. Rule 4.2 applied.",
                    "Scanning for pedestrians at the crosswalk."
                ]
            };
            const currentThoughts = thoughts[driveState];
            const text = currentThoughts[Math.floor(Math.random() * currentThoughts.length)];
            
            aiText.innerText = "AI BRAIN: " + text;
            
            // Text-to-Speech (The AI "Speaks")
            const msg = new SpeechSynthesisUtterance(text);
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        const scene = createScene().then(s => {
            engine.runRenderLoop(() => s.render());
        });

        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
