<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Autonomous SLM Driver v1.7.0 - HD</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; }
        #renderCanvas { width: 100%; height: 100%; }

        /* The New Loading UI */
        #loading-screen {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, #0a0a1a 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; color: #00f2ff; font-family: 'Courier New', monospace;
            transition: opacity 1s ease-in-out;
        }
        .progress-container { width: 300px; height: 4px; background: #111; border-radius: 10px; margin: 20px; border: 1px solid #00f2ff33; }
        #progress-bar { width: 0%; height: 100%; background: #00f2ff; box-shadow: 0 0 15px #00f2ff; transition: width 0.2s; }
        #status-text { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; }
        #start-btn { 
            display: none; padding: 15px 40px; background: transparent; 
            border: 1px solid #00f2ff; color: #00f2ff; cursor: pointer;
            text-transform: uppercase; letter-spacing: 3px; font-weight: bold;
            transition: 0.3s;
        }
        #start-btn:hover { background: #00f2ff; color: #000; box-shadow: 0 0 30px #00f2ff; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div id="status-text">Initializing AI Core...</div>
        <div class="progress-container"><div id="progress-bar"></div></div>
        <button id="start-btn">Initialize Neural Link</button>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        
        // UI Elements
        const loadingScreen = document.getElementById("loading-screen");
        const progressBar = document.getElementById("progress-bar");
        const statusText = document.getElementById("status-text");
        const startBtn = document.getElementById("start-btn");

        const bootSequence = [
            { p: 10, t: "Downloading Babylon Engine Libraries..." },
            { p: 30, t: "Warming up GPU Shaders & 4K Buffers..." },
            { p: 55, t: "Generating Procedural GPS Grid..." },
            { p: 80, t: "Mapping AI Collision Ray-Matrix..." },
            { p: 100, t: "System Ready. Awaiting Handshake." }
        ];

        let currentStep = 0;

        function runLoader() {
            if (currentStep < bootSequence.length) {
                const step = bootSequence[currentStep];
                progressBar.style.width = step.p + "%";
                statusText.innerText = step.t;
                currentStep++;
                setTimeout(runLoader, 600 + Math.random() * 1000); // Simulated load time
            } else {
                startBtn.style.display = "block";
                statusText.style.display = "none";
                document.querySelector(".progress-container").style.display = "none";
            }
        }

        // Start the fake loading process
        runLoader();

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0, 0, 0);

            // Lighting & Road (Detailed v1.6 Core)
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            const car = BABYLON.MeshBuilder.CreateBox("car", {width: 2, height: 1, depth: 4}, scene);
            car.position.y = 1;
            
            const road = BABYLON.MeshBuilder.CreateGround("road", {width: 20, height: 5000}, scene);
            const roadMat = new BABYLON.StandardMaterial("rMat", scene);
            roadMat.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            road.material = roadMat;

            // Simple Obstacle
            const ped = BABYLON.MeshBuilder.CreateSphere("ped", {diameter: 1.5}, scene);
            ped.position = new BABYLON.Vector3(0, 1, 100);

            const camera = new BABYLON.FollowCamera("cam", new BABYLON.Vector3(0, 10, -20), scene);
            camera.lockedTarget = car;

            // Logic
            let speed = 0;
            scene.onBeforeRenderObservable.add(() => {
                if(speed > 0) {
                   car.position.z += speed;
                   if(BABYLON.Vector3.Distance(car.position, ped.position) < 15) {
                       speed = 0;
                       speakAI("Safety override: Pedestrian detected. Waiting for path clearance.");
                   }
                }
            });

            window.startSimulation = () => {
                loadingScreen.style.opacity = "0";
                setTimeout(() => loadingScreen.style.display = "none", 1000);
                speed = 0.5;
                speakAI("Neural link established. Autonomous drive initiated. Scanning current GPS sector.");
            };

            function speakAI(msg) {
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(msg));
            }

            return scene;
        };

        const scene = createScene();
        engine.runRenderLoop(() => scene.render());
        startBtn.onclick = () => window.startSimulation();
        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
