<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Autonomous SLM Driver v1.3.0</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
        #renderCanvas { width: 100%; height: 100%; }
        #slm-monitor {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 600px; background: rgba(10, 25, 40, 0.9);
            border: 2px solid #00d4ff; color: #fff; padding: 20px;
            font-family: 'Courier New', monospace; border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4); text-align: center;
        }
    </style>
</head>
<body>
    <div id="slm-monitor">
        <div style="font-size: 0.7em; color: #00d4ff; margin-bottom: 5px;">SLM BRAIN v1.3.0 | LIVE TELEMETRY</div>
        <div id="ai-speech">Click anywhere to start AI Voice Engine...</div>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const aiSpeech = document.getElementById("ai-speech");

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.05, 0.05, 0.1, 1);

            // --- Enhanced Lighting ---
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.8;
            const spot = new BABYLON.SpotLight("spot", new BABYLON.Vector3(0, 20, -10), new BABYLON.Vector3(0, -1, 0.5), Math.PI / 3, 2, scene);
            spot.intensity = 1.5;

            // --- Visible Road System ---
            const ground = BABYLON.MeshBuilder.CreateGround("road", {width: 100, height: 1000}, scene);
            const roadMat = new BABYLON.PBRMaterial("roadMat", scene);
            roadMat.albedoColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            roadMat.roughness = 0.5;
            // Add grid lines so you can see movement
            roadMat.emissiveColor = new BABYLON.Color3(0.1, 0.1, 0.2);
            ground.material = roadMat;

            // --- The AI Car ---
            const car = BABYLON.MeshBuilder.CreateBox("car", {width: 2, height: 1, depth: 4}, scene);
            car.position.y = 1;
            const carMat = new BABYLON.PBRMaterial("carMat", scene);
            carMat.albedoColor = new BABYLON.Color3(0, 0.8, 1);
            carMat.metallic = 0.9;
            car.material = carMat;

            // --- Animated People (Pedestrians) ---
            const people = [];
            for(let i=0; i<5; i++) {
                let p = BABYLON.MeshBuilder.CreateCapsule("person"+i, {height: 1.8, radius: 0.4}, scene);
                p.position = new BABYLON.Vector3(Math.random() * 6 - 3, 1, 40 + (i * 40));
                const pMat = new BABYLON.StandardMaterial("pMat"+i, scene);
                pMat.diffuseColor = new BABYLON.Color3(1, 1, 0); // Bright Yellow for visibility
                p.material = pMat;
                people.push(p);
            }

            // --- Camera (Fixed Position behind car) ---
            const camera = new BABYLON.FollowCamera("followCam", new BABYLON.Vector3(0, 10, -15), scene);
            camera.lockedTarget = car;
            camera.radius = 12;
            camera.heightOffset = 4;
            camera.cameraAcceleration = 0.05;

            // --- Driving Rules & SLM Logic ---
            let speed = 0.2;
            let currentStatus = "";

            scene.onBeforeRenderObservable.add(() => {
                let closestPerson = null;
                let minDist = 100;

                people.forEach(p => {
                    let d = BABYLON.Vector3.Distance(car.position, p.position);
                    if (d < minDist) { minDist = d; closestPerson = p; }
                    // Animate people walking slightly
                    p.position.x += Math.sin(Date.now() * 0.002) * 0.02;
                });

                if (minDist < 12) {
                    speed = Math.max(0, speed - 0.01); // Brake
                    updateSLM("Caution: Pedestrian detected. Adjusting speed to maintain safety gap.");
                } else {
                    speed = Math.min(0.4, speed + 0.005); // Accelerate
                    updateSLM("Road clear. Navigating via GPS to destination. Optimal speed 45mph.");
                }

                car.moveWithCollisions(new BABYLON.Vector3(0, 0, speed));
            });

            function updateSLM(msg) {
                if (currentStatus === msg) return;
                currentStatus = msg;
                aiSpeech.innerText = msg;
                
                const synth = window.speechSynthesis;
                if (!synth.speaking) {
                    const utter = new SpeechSynthesisUtterance(msg);
                    utter.rate = 1.1;
                    utter.pitch = 0.9;
                    synth.speak(utter);
                }
            }

            return scene;
        };

        const scene = createScene();
        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());
        window.addEventListener("click", () => window.speechSynthesis.speak(new SpeechSynthesisUtterance("AI Engine Synchronized.")));
    </script>
</body>
</html>
