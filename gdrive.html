<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Autonomous SLM Driver v1.5.0</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }
        #slm-monitor {
            position: absolute; top: 20px; left: 20px; 
            background: rgba(0, 20, 40, 0.9); color: #00ffcc; 
            padding: 20px; font-family: 'monospace'; border: 2px solid #00ffcc;
            border-radius: 10px; pointer-events: none; max-width: 400px;
        }
    </style>
</head>
<body>
    <div id="slm-monitor">
        <div style="font-size: 10px; opacity: 0.7;">CORE_V1.5.0_STABLE</div>
        <div id="ai-text">INITIALIZING ENGINE... CLICK SCREEN TO SYNC AUDIO.</div>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const aiText = document.getElementById("ai-text");

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.02, 0.02, 0.05);

            // --- Robust Lighting (Prevents Black Screen) ---
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 1.0;

            // --- The Car ---
            const car = BABYLON.MeshBuilder.CreateBox("car", {width: 2, height: 1, depth: 4}, scene);
            car.position.y = 1;
            const carMat = new BABYLON.StandardMaterial("carMat", scene);
            carMat.diffuseColor = new BABYLON.Color3(0, 0.5, 1);
            carMat.emissiveColor = new BABYLON.Color3(0, 0.1, 0.2);
            car.material = carMat;

            // --- The Road (Infinite GPS Reset) ---
            const road = BABYLON.MeshBuilder.CreateGround("road", {width: 20, height: 2000}, scene);
            const roadMat = new BABYLON.StandardMaterial("roadMat", scene);
            roadMat.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            roadMat.specularColor = new BABYLON.Color3(0, 0, 0);
            road.material = roadMat;

            // --- Procedural Pedestrians ---
            const peds = [];
            for (let i = 0; i < 10; i++) {
                let ped = BABYLON.MeshBuilder.CreateSphere("ped" + i, {diameter: 1.5}, scene);
                ped.position = new BABYLON.Vector3(Math.random() * 8 - 4, 1, 50 + (i * 100));
                let pMat = new BABYLON.StandardMaterial("pMat", scene);
                pMat.diffuseColor = new BABYLON.Color3(1, 1, 0);
                ped.material = pMat;
                peds.push(ped);
            }

            // --- Force Camera Focus ---
            const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 20, car.position, scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 10;
            camera.upperRadiusLimit = 50;

            // --- Driving & AI Logic ---
            let speed = 0.5;
            scene.onBeforeRenderObservable.add(() => {
                let obstacleDetected = false;
                
                peds.forEach(p => {
                    let distance = BABYLON.Vector3.Distance(car.position, p.position);
                    // Check if pedestrian is in front and close
                    if (distance < 20 && p.position.z > car.position.z) {
                        obstacleDetected = true;
                    }
                });

                if (obstacleDetected) {
                    speed = Math.max(0, speed - 0.05); // Smooth deceleration
                    speakAI("Detection: Non-autonomous entity in path. Executing safety stop.");
                } else {
                    speed = Math.min(0.8, speed + 0.01); // Smooth acceleration
                    speakAI("GPS Active. Navigating through sector. Speed optimal.");
                }

                car.position.z += speed;
                camera.target = car.position; // Keep camera locked
            });

            let lastMsg = "";
            function speakAI(msg) {
                if (msg === lastMsg) return;
                lastMsg = msg;
                aiText.innerText = msg;
                const utterance = new SpeechSynthesisUtterance(msg);
                utterance.rate = 1.2;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }

            return scene;
        };

        const scene = createScene();
        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());
        window.onclick = () => window.speechSynthesis.speak(new SpeechSynthesisUtterance("System online."));
    </script>
</body>
</html>
