<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deep Space Simulator - Singularity Trajectory</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
    #space-canvas { width: 100vw; height: 100vh; display: block; }
    #hud {
      position: absolute; top: 24px; left: 24px; color: #00f0ff;
      pointer-events: none; text-shadow: 0 0 8px rgba(0, 240, 255, 0.7); z-index: 10;
    }
    .hud-title { font-size: 16px; font-weight: bold; letter-spacing: 2px; margin-bottom: 8px; }
    .hud-stat { font-size: 12px; line-height: 1.6; }
    .warning { color: #ff3344; text-shadow: 0 0 8px rgba(255, 51, 68, 0.8); animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { opacity: 0.4; } to { opacity: 1.0; } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- 1. Imported OrbitControls for navigation -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="hud">
    <div class="hud-title">[ NAV-COMPUTER TELEMETRY ]</div>
    <div class="hud-stat">OBJECT: Gargantua Singularity</div>
    <div class="hud-stat">VELOCITY: 0.88 c</div>
    <!-- Fixed LaTeX formatting bug -->
    <div class="hud-stat">SCHWARZSCHILD RADIUS (r<sub>s</sub>): 2.95 km</div>
    <div class="hud-stat warning">GRAVITATIONAL TIDE: EXTREME</div>
  </div>
  <canvas id="space-canvas"></canvas>

  <script>
    const canvas = document.getElementById('space-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 8); // Moved closer

    // 2. Initialize Navigation Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const fragmentShader = `
      uniform float u_time;
      uniform vec2 u_resolution;
      uniform vec3 u_cameraPos;
      uniform mat4 u_cameraWorldMatrix;

      // 3. Increased Ray Steps so light reaches the black hole
      #define MAX_STEPS 200
      #define MAX_DIST 50.0

      float hash(float n) { return fract(sin(n) * 43758.5453); }
      float noise(vec3 x) {
        vec3 p = floor(x);
        vec3 f = fract(x);
        f = f * f * (3.0 - 2.0 * f);
        float n = p.x + p.y * 57.0 + 113.0 * p.z;
        return mix(mix(mix(hash(n+0.0), hash(n+1.0), f.x),
                       mix(hash(n+57.0), hash(n+58.0), f.x), f.y),
                   mix(mix(hash(n+113.0), hash(n+114.0), f.x),
                       mix(hash(n+170.0), hash(n+171.0), f.x), f.y), f.z);
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
        vec3 ro = u_cameraPos;
        
        // 4. Bind Ray Direction to the OrbitControls Camera Matrix
        vec3 rdView = normalize(vec3(uv, -1.0));
        vec3 rd = (u_cameraWorldMatrix * vec4(rdView, 0.0)).xyz;
        
        vec3 col = vec3(0.0);
        vec3 bhPos = vec3(0.0, 0.0, 0.0);
        float rs = 1.5;
        float dt = 0.1; // Increased step distance
        vec3 pos = ro;
        vec3 diskColor = vec3(0.0);

        for(int i = 0; i < MAX_STEPS; i++) {
          vec3 toBH = bhPos - pos;
          float distSq = dot(toBH, toBH);
          float dist = sqrt(distSq);

          if(dist < rs) { col = vec3(0.0); break; }

          vec3 gravityPull = normalize(toBH) * (1.2 / distSq);
          rd = normalize(rd + gravityPull * dt);

          if (abs(pos.y) < 0.15 && dist > rs + 0.3 && dist < rs + 5.0) {
            float temp = 1.0 / (dist - rs);
            vec3 colorGrad = mix(vec3(1.0, 0.3, 0.05), vec3(0.1, 0.5, 1.0), temp);
            float n = noise(pos * 2.5 - vec3(u_time * 0.8, 0.0, u_time * 0.8));
            diskColor += colorGrad * n * 0.08;
          }

          pos += rd * dt;

          if(dist > MAX_DIST) {
            float stars = pow(noise(rd * 120.0), 16.0) * 4.0;
            col += vec3(stars);
            break;
          }
        }

        col += diskColor;
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    const vertexShader = `
      void main() {
        gl_Position = vec4(position, 1.0);
      }
    `;

    const material = new THREE.ShaderMaterial({
      uniforms: {
        u_time: { value: 0 },
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        u_cameraPos: { value: camera.position },
        u_cameraWorldMatrix: { value: camera.matrixWorld }
      },
      vertexShader,
      fragmentShader
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(mesh);

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      
      controls.update(); // Process mouse inputs
      
      // Update Uniforms with current camera position/rotation
      camera.updateMatrixWorld();
      material.uniforms.u_cameraPos.value.copy(camera.position);
      material.uniforms.u_cameraWorldMatrix.value.copy(camera.matrixWorld);
      material.uniforms.u_time.value = clock.getElapsedTime();
      
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
