<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v7.0.0 Odyssey</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #ui-layer { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; pointer-events: none; z-index: 1000; }
        
        #top-hud { width: 95%; display: flex; justify-content: space-between; margin-top: 15px; color: #00f2ff; font-weight: bold; font-size: 0.85rem; text-shadow: 0 0 8px #00f2ff; }
        .rank-box { background: rgba(0, 242, 255, 0.1); padding: 5px 10px; border-radius: 10px; border: 1px solid #00f2ff; }

        #data-scanner { margin-top: 5px; color: #fff; text-align: center; text-shadow: 0 0 10px #00f2ff; }
        #scan-title { color: #00f2ff; font-weight: bold; font-size: 1.4rem; margin: 0; }
        #scan-desc { font-size: 0.8rem; color: rgba(255,255,255,0.7); margin: 2px 0; }

        #mission-control { text-align: center; margin-bottom: 5px; }
        #question { font-size: 3.5rem; color: #fff; margin: 0; text-shadow: 0 0 20px #fff; }
        #answer-display { font-size: 2.2rem; color: #ff00de; font-weight: bold; min-height: 2.5rem; }

        #numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 30px; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); transform: scale(0.8); pointer-events: auto; }
        .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; font-size: 1.6rem; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn:active { background: #ff00de; }
        .btn-go { background: rgba(0, 255, 100, 0.2); border-color: #0f0; grid-column: span 2; width: auto; border-radius: 20px; font-weight: bold; }

        #version-tag { position: absolute; bottom: 5px; left: 10px; color: rgba(0, 242, 255, 0.3); font-size: 0.6rem; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="top-hud">
        <div class="rank-box">🎖️ דרגה: <span id="rank-name">צוערת חלל</span></div>
        <div>🚀 מרחק: <span id="dist">0</span> שנות אור</div>
    </div>

    <div id="data-scanner">
        <p id="scan-title">סורק...</p>
        <p id="scan-desc">מזהה חתימה קוסמית...</p>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; padding-bottom: 10px;">
        <div id="mission-control">
            <div id="question">טוען...</div>
            <div id="answer-display">?</div>
        </div>
        <div id="numpad">
            <div class="btn" onclick="press(1)">1</div><div class="btn" onclick="press(2)">2</div><div class="btn" onclick="press(3)">3</div>
            <div class="btn" onclick="press(4)">4</div><div class="btn" onclick="press(5)">5</div><div class="btn" onclick="press(6)">6</div>
            <div class="btn" onclick="press(7)">7</div><div class="btn" onclick="press(8)">8</div><div class="btn" onclick="press(9)">9</div>
            <div class="btn" style="color:#ff4444" onclick="del()">X</div><div class="btn" onclick="press(0)">0</div><div class="btn btn-go" onclick="check()">קפיצה 🌌</div>
        </div>
    </div>
    <div id="version-tag">OS_v7.0.0 // GALAXY_MASTER</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, stars, universeGroup;
    let score = 0, currentAns = 0, inputStr = "", distance = 0;
    let targetZ = 0, isJumping = false, speed = 0.2;
    let targetRotX = 0, targetRotY = 0;

    const ranks = ["צוערת חלל", "חוקרת כוכבים", "קצינת ניווט", "קפטן גלקסיה", "מפקדת עליונה"];

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 5000);
        camera.position.z = 100;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // רקע כוכבים
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<15000; i++) starPos.push((Math.random()-0.5)*4000, (Math.random()-0.5)*4000, (Math.random()-0.5)*4000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 }));
        scene.add(stars);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // הזזה עם האצבע
        let sX, sY;
        document.addEventListener('touchstart', e => { if(!e.target.closest('#numpad')) { sX = e.touches[0].clientX; sY = e.touches[0].clientY; } });
        document.addEventListener('touchmove', e => {
            if(!e.target.closest('#numpad')) {
                targetRotY += (e.touches[0].clientX - sX) * 0.01;
                targetRotX += (e.touches[0].clientY - sY) * 0.01;
                sX = e.touches[0].clientX; sY = e.touches[0].clientY;
            }
        });

        generateNewSystem();
        nextLevel();
        animate();
    }

    function generateNewSystem() {
        if(universeGroup) scene.remove(universeGroup);
        universeGroup = new THREE.Group();
        universeGroup.position.z = -800; // פרופורציה קרובה יותר לדלג מהר
        
        const type = Math.floor(Math.random() * 5);
        const hue = Math.random();
        const color = new THREE.Color().setHSL(hue, 1, 0.5);
        const title = document.getElementById('scan-title');
        const desc = document.getElementById('scan-desc');

        if(type === 0) { // חור שחור
            title.innerText = "חור שחור קוונטי";
            desc.innerText = "זהירות: עיקום אור קיצוני מסביב לליבה.";
            universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(15,32,32), new THREE.MeshBasicMaterial({color: 0x000000})));
            const disk = new THREE.Mesh(new THREE.TorusGeometry(35, 1.5, 2, 100), new THREE.MeshBasicMaterial({color: color, transparent:true, opacity:0.7}));
            disk.rotation.x = 1.6; universeGroup.add(disk);
            universeGroup.userData.type = "blackhole"; universeGroup.userData.part = disk;
        } 
        else if(type === 1) { // סופרנובה
            title.innerText = "סופרנובה מתפרצת";
            desc.innerText = "פיצוץ כוכבי אדיר המפזר יסודות ביקום.";
            const core = new THREE.Mesh(new THREE.IcosahedronGeometry(12, 1), new THREE.MeshBasicMaterial({color: 0xffffff}));
            const glow = new THREE.Mesh(new THREE.SphereGeometry(25, 32, 32), new THREE.MeshBasicMaterial({color: color, transparent:true, opacity:0.3, wireframe:true}));
            universeGroup.add(core); universeGroup.add(glow);
            universeGroup.userData.type = "supernova"; universeGroup.userData.part = glow;
        }
        else if(type === 2) { // ערפילית
            title.innerText = "ערפילית גז";
            desc.innerText = "ענן פלזמה זוהר שבו נולדים כוכבים.";
            const pts = []; for(let i=0; i<800; i++) pts.push((Math.random()-0.5)*80, (Math.random()-0.5)*80, (Math.random()-0.5)*80);
            const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
            const cloud = new THREE.Points(g, new THREE.PointsMaterial({color: color, size: 4, transparent: true, opacity: 0.6}));
            universeGroup.add(cloud);
        }
        else if(type === 3) { // גלקסיה
            title.innerText = "גלקסיה ספירלית";
            desc.innerText = "מיליארדי כוכבים המסתחררים סביב מרכז הכובד.";
            const pts = []; for(let i=0; i<3000; i++) { let r = Math.random()*70; let a = r*0.4; pts.push(Math.cos(a)*r, (Math.random()-0.5)*5, Math.sin(a)*r); }
            const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
            universeGroup.add(new THREE.Points(g, new THREE.PointsMaterial({color: color, size: 0.8})));
        }
        else { // מערכת שמש
            title.innerText = "מערכת שמש";
            desc.innerText = "שמש מרכזית עם כוכבי לכת במסלול.";
            universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(12,32,32), new THREE.MeshBasicMaterial({color: color})));
            const p = new THREE.Mesh(new THREE.SphereGeometry(4,32,32), new THREE.MeshStandardMaterial({color: 0x888888}));
            p.position.x = 35; const piv = new THREE.Group(); piv.add(p); universeGroup.add(piv);
            universeGroup.userData.type = "solar"; universeGroup.userData.part = piv;
        }

        scene.add(universeGroup);
        isJumping = true; targetZ = 0;
    }

    function check() {
        if(parseInt(inputStr) === currentAns) {
            score++;
            distance += 500;
            document.getElementById('dist').innerText = distance;
            document.getElementById('rank-name').innerText = ranks[Math.min(Math.floor(score/5), ranks.length-1)];
            targetZ = 1000; isJumping = true;
            setTimeout(() => { generateNewSystem(); targetRotX=0; targetRotY=0; nextLevel(); }, 1500);
        } else { del(); }
    }

    function nextLevel() {
        let n1 = Math.floor(Math.random()*8)+2, n2 = Math.floor(Math.random()*9)+1;
        currentAns = n1*n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        inputStr = ""; document.getElementById('answer-display').innerText = "?";
    }

    function press(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('answer-display').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }

    function animate() {
        requestAnimationFrame(animate);
        if(isJumping) {
            universeGroup.position.z += (targetZ - universeGroup.position.z) * 0.08;
            speed = 40;
            if(Math.abs(universeGroup.position.z - targetZ) < 1) { isJumping = false; speed = 0.2; }
        }
        universeGroup.rotation.x += (targetRotX - universeGroup.rotation.x) * 0.05;
        universeGroup.rotation.y += (targetRotY - universeGroup.rotation.y) * 0.05;

        // אנימציות ספציפיות
        if(universeGroup.userData.type === "blackhole") universeGroup.userData.part.rotation.z += 0.05;
        if(universeGroup.userData.type === "solar") universeGroup.userData.part.rotation.y += 0.03;
        if(universeGroup.userData.type === "supernova") {
            let s = 1 + Math.sin(Date.now()*0.005)*0.2;
            universeGroup.userData.part.scale.set(s,s,s);
        }

        const p = stars.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { p[i+2]+=speed; if(p[i+2]>100) p[i+2]=-2000; }
        stars.geometry.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
