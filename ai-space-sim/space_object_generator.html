<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Autonomous 3D Space & AI Texture Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg-color: #030712; --card-bg: rgba(17, 24, 39, 0.9); --accent-cyan: #38bdf8; --accent-indigo: #818cf8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: #f9fafb; overflow: hidden; height: 100vh; }
    #webgl-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    .hud-panel { position: absolute; background: var(--card-bg); border: 1px solid #1f2937; backdrop-filter: blur(12px); border-radius: 14px; padding: 1.25rem; z-index: 10; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6); }
    #control-panel { top: 20px; right: 20px; width: 380px; display: flex; flex-direction: column; gap: 0.75rem; max-height: 92vh; overflow-y: auto; }
    #info-panel { top: 20px; left: 20px; width: 340px; pointer-events: none; }
    h2 { font-size: 1rem; color: var(--accent-cyan); display: flex; align-items: center; gap: 0.5rem; }
    h3 { font-size: 1.05rem; color: var(--accent-cyan); margin-bottom: 0.3rem; }
    .input-group { display: flex; flex-direction: column; gap: 0.3rem; }
    label { font-size: 0.75rem; color: #9ca3af; font-weight: 500; }
    input, textarea { background: #0b0f19; border: 1px solid #1f2937; color: #f9fafb; padding: 0.6rem; border-radius: 8px; font-size: 0.85rem; outline: none; font-family: 'Inter', sans-serif; }
    input:focus, textarea:focus { border-color: var(--accent-cyan); }
    textarea { resize: vertical; height: 75px; }
    button { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo)); color: #030712; border: none; padding: 0.7rem; font-weight: 600; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: opacity 0.2s, transform 0.1s; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    .ai-log { background: #0b0f19; border: 1px solid #1f2937; border-radius: 8px; padding: 0.75rem; font-size: 0.8rem; color: #9ca3af; max-height: 120px; overflow-y: auto; white-space: pre-wrap; }
    #status-bar { font-size: 0.75rem; color: #34d399; text-align: center; font-weight: 500; }
  </style>
</head>
<body>

  <div id="webgl-container"></div>

  <!-- Telemetry Inspector (Top Left) -->
  <div id="info-panel" class="hud-panel">
      <h3 id="objectTitle">Deep Space Sector</h3>
      <p id="objectDesc" style="font-size: 0.825rem; color: #9ca3af;">Enter a custom prompt to instruct Gemini to compose 3D space objects and generate procedural textures via AI Horde.</p>
  </div>

  <!-- Gemini & AI Horde Control Panel (Top Right) -->
  <div id="control-panel" class="hud-panel">
      <h2>🌌 Gemini 3D & AI Horde Engine</h2>
      
      <div class="input-group">
          <label for="apiKey">Gemini API Key</label>
          <input type="password" id="apiKey" placeholder="AIzaSy...">
      </div>

      <div class="input-group">
          <label for="userPrompt">Natural Language Prompt</label>
          <textarea id="userPrompt">A fiery volcanic planet with glowing lava cracks and dark basalt mountains orbiting a red giant star.</textarea>
      </div>

      <button onclick="runPipeline()">🚀 Translate, Texture & Render</button>
      <div id="status-bar">System Idle. Ready.</div>

      <div class="input-group">
          <label>Gemini Architecture & AI Horde Log</label>
          <div id="agentLog" class="ai-log">Waiting for prompt submission...</div>
      </div>
  </div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
      // 1. Scene, Camera, Renderer Setup
      const container = document.getElementById('webgl-container');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
      camera.position.set(0, 0, 15);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.9));
      let objectGroup = new THREE.Group();
      scene.add(objectGroup);

      // 2. Dynamic Gemini Model Waterfall Discovery
      let dynamicModelQueue = ['gemini-2.5-flash', 'gemini-1.5-flash'];

      async function discoverGeminiModels(apiKey) {
          if (!apiKey) return;
          try {
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const data = await res.json();
              if (data && data.models) {
                  const validModels = data.models
                      .filter(m => m.supportedGenerationMethods?.includes('generateContent') && !m.name.includes('tts') && !m.name.includes('embedding') && !m.name.includes('gemma'))
                      .map(m => m.name.replace('models/', ''));
                  if (validModels.length > 0) {
                      validModels.sort((a, b) => (b.includes('flash') ? 1 : 0) - (a.includes('flash') ? 1 : 0));
                      dynamicModelQueue = validModels;
                  }
              }
          } catch (err) {
              console.warn("Using default model fallback queue.");
          }
      }

      async function callGeminiWithWaterfall(promptText, apiKey, expectJson = false) {
          if (apiKey && dynamicModelQueue.length <= 2) {
              await discoverGeminiModels(apiKey);
          }
          let lastError = null;
          for (const model of dynamicModelQueue) {
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), 12000);
              try {
                  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                  const bodyPayload = { contents: [{ parts: [{ text: promptText }] }] };
                  if (expectJson) bodyPayload.generationConfig = { responseMimeType: "application/json" };

                  const response = await fetch(url, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify(bodyPayload),
                      signal: controller.signal
                  });
                  clearTimeout(timeoutId);
                  if (response.status === 429 || response.status === 503 || response.status === 403) continue;
                  if (!response.ok) throw new Error(`Model ${model} status ${response.status}`);
                  const data = await response.json();
                  const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                  if (!text) throw new Error(`Model ${model} empty response`);
                  return text;
              } catch (err) {
                  clearTimeout(timeoutId);
                  lastError = err;
              }
          }
          throw new Error(`All waterfall models failed: ${lastError?.message}`);
      }

      // 3. AI Horde Texture Generation Integration
      async function generateTextureViaAIHorde(texturePrompt) {
          const API_BASE = "https://aihorde.net/api/v2";
          const payload = {
              prompt: texturePrompt + " ### blurry, low quality",
              params: { width: 512, height: 512, steps: 20, cfg_scale: 7, n: 1 },
              nsfw: false, censor_nsfw: true, r2: true
          };

          const submitted = await fetch(`${API_BASE}/generate/async`, {
              method: "POST",
              headers: { "apikey": "0000000000", "Client-Agent": "SpaceExplorer:1.0", "Content-Type": "application/json" },
              body: JSON.stringify(payload)
          }).then(r => r.json());

          if (!submitted.id) throw new Error("AI Horde request rejected.");
          
          // Poll for completion (up to 3 minutes)
          for (let i = 0; i < 45; i++) {
              await new Promise(r => setTimeout(r, 4000));
              const check = await fetch(`${API_BASE}/generate/check/${submitted.id}`).then(r => r.json());
              if (check.done) {
                  const status = await fetch(`${API_BASE}/generate/status/${submitted.id}`).then(r => r.json());
                  if (status.generations?.[0]?.img) {
                      return status.generations[0].img;
                  }
              }
          }
          throw new Error("AI Horde generation timed out.");
      }

      // 4. Main Pipeline Execution
      async function runPipeline() {
          const apiKey = document.getElementById('apiKey').value.trim();
          const userPrompt = document.getElementById('userPrompt').value.trim();
          const statusBar = document.getElementById('status-bar');
          const agentLog = document.getElementById('agentLog');

          if (!apiKey) {
              alert('Please provide your Gemini API key.');
              return;
          }

          statusBar.textContent = "🤖 Gemini translating prompt to instructions...";
          agentLog.textContent = "Analyzing prompt structure & preparing object hierarchy...";

          try {
              const instructionPrompt = `You are an advanced astrophysical scene composer. Translate this user prompt into 3D scene objects and specific AI image generation prompts for textures.
              User Prompt: "${userPrompt}"
              
              Return ONLY valid JSON with this exact structure:
              {
                "sectorTitle": "string",
                "lore": "string",
                "objects": [
                  {
                    "name": "string",
                    "geometryType": "sphere",
                    "color": "#38bdf8",
                    "roughness": 0.5,
                    "metalness": 0.1,
                    "texturePrompt": "Detailed prompt for generating surface texture map"
                  }
                ]
              }`;

              const rawText = await callGeminiWithWaterfall(instructionPrompt, apiKey, true);
              const jsonMatch = rawText.match(/\{[\s\S]*\}/);
              if (!jsonMatch) throw new Error("Invalid JSON returned from Gemini.");
              
              const sceneConfig = JSON.parse(jsonMatch[0]);
              agentLog.textContent = `[Sector]: ${sceneConfig.sectorTitle}\n[Lore]: ${sceneConfig.lore}\n\nInitiating AI Horde texture generation...`;
              statusBar.textContent = "🎨 Generating textures via AI Horde...";

              while(objectGroup.children.length > 0) { objectGroup.remove(objectGroup.children[0]); }

              const textureLoader = new THREE.TextureLoader();

              for (const objDef of sceneConfig.objects) {
                  let texture = null;
                  try {
                      const imgUrl = await generateTextureViaAIHorde(objDef.texturePrompt);
                      texture = await textureLoader.loadAsync(imgUrl);
                  } catch (e) {
                      console.warn("AI Horde texture fallback to solid color:", e);
                  }

                  const geometry = new THREE.SphereGeometry(2.5, 64, 64);
                  const material = new THREE.MeshStandardMaterial({
                      color: texture ? 0xffffff : new THREE.Color(objDef.color || '#38bdf8'),
                      roughness: objDef.roughness || 0.5,
                      metalness: objDef.metalness || 0.1,
                      map: texture
                  });

                  const mesh = new THREE.Mesh(geometry, material);
                  objectGroup.add(mesh);
                  
                  document.getElementById('objectTitle').textContent = objDef.name;
                  document.getElementById('objectDesc').innerHTML = `Sector: <strong>${sceneConfig.sectorTitle}</strong><br>${sceneConfig.lore}`;
              }

              statusBar.textContent = "✨ 3D Object & Textures successfully rendered!";
              agentLog.textContent += "\n\nPipeline complete!";

          } catch (error) {
              statusBar.textContent = "❌ Pipeline error encountered.";
              agentLog.textContent = "Error: " + error.message;
              console.error(error);
          }
      }

      // 5. Animation Loop
      function animate() {
          requestAnimationFrame(animate);
          objectGroup.rotation.y += 0.003;
          renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
      });
  </script>
</body>
</html>
