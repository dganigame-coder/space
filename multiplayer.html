<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מפענח האנרגיה - Space Code</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #020205;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: moveStars 20s linear infinite;
        }
        @keyframes moveStars {
            from { transform: translateY(-100vh); }
            to { transform: translateY(100vh); }
        }
        #ship {
            position: absolute;
            width: 60px;
            height: 60px;
            transition: transform 0.1s;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #ship-img {
            width: 100%;
            filter: drop-shadow(0 0 10px #00f2ff);
        }
        #target-display {
            background: rgba(0, 242, 255, 0.2);
            border: 2px solid #00f2ff;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 5px;
            text-shadow: 0 0 5px #00f2ff;
        }
        .crystal {
            position: absolute;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/1999/xhtml" viewBox="0 0 100 100"><polygon points="50,5 95,50 50,95 5,50" fill="rgba(255,0,255,0.6)" stroke="white" stroke-width="2"/></svg>');
            background-size: contain;
            cursor: pointer;
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            z-index: 20;
        }
        .stat { font-size: 24px; font-weight: bold; }
        .laser {
            position: absolute;
            width: 4px;
            height: 20px;
            background: #ff00ff;
            box-shadow: 0 0 10px #ff00ff;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div class="stat">אנרגיה: <span id="score">0</span></div>
        <div class="stat">שלב: <span id="level">1</span></div>
    </div>
    
    <div id="ship">
        <div id="target-display">?</div>
        <img id="ship-img" src="icon.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2026/2026510.png'">
    </div>
</div>

<script>
    const container = document.getElementById('game-container');
    const ship = document.getElementById('ship');
    const targetDisplay = document.getElementById('target-display');
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');

    let score = 0;
    let level = 1;
    let targetNum = 0;
    let firstFactor = null;
    let crystals = [];
    let shipX = window.innerWidth / 2;
    let shipY = window.innerHeight - 100;

    // יצירת כוכבים ברקע
    for(let i=0; i<50; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.width = star.style.height = Math.random() * 3 + 'px';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.animationDuration = (Math.random() * 10 + 5) + 's';
        container.appendChild(star);
    }

    function initLevel() {
        // בוחרים תרגיל כפל בראש אבל מציגים רק את התוצאה
        const a = Math.floor(Math.random() * 8) + 2;
        const b = Math.floor(Math.random() * 8) + 2;
        targetNum = a * b;
        targetDisplay.innerText = targetNum;
        firstFactor = null;
        targetDisplay.style.background = "rgba(0, 242, 255, 0.2)";
        
        // מנקים קריסטלים ישנים
        crystals.forEach(c => c.el.remove());
        crystals = [];

        // יוצרים קריסטלים - אחד נכון, השאר רנדומליים
        const factors = [a, b];
        while(factors.length < 6) {
            const randomNum = Math.floor(Math.random() * 9) + 2;
            if(!factors.includes(randomNum)) factors.push(randomNum);
        }
        
        factors.sort(() => Math.random() - 0.5).forEach(num => {
            createCrystal(num);
        });
    }

    function createCrystal(num) {
        const el = document.createElement('div');
        el.className = 'crystal';
        el.innerText = num;
        const x = Math.random() * (window.innerWidth - 60) + 30;
        const y = -Math.random() * 500;
        container.appendChild(el);
        crystals.push({ el, num, x, y, speed: Math.random() * 2 + 1 + (level*0.2) });
    }

    // תנועת חללית (עכבר או מגע)
    container.addEventListener('pointermove', (e) => {
        shipX = e.clientX;
        shipY = e.clientY - 30;
        ship.style.left = (shipX - 30) + 'px';
        ship.style.top = (shipY - 40) + 'px';
    });

    function gameLoop() {
        crystals.forEach((c, index) => {
            c.y += c.speed;
            c.el.style.left = c.x + 'px';
            c.el.style.top = c.y + 'px';

            // בדיקת התנגשות
            const dx = c.x - (shipX - 25);
            const dy = c.y - (shipY - 30);
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < 40) {
                handleCollection(c, index);
            }

            // יציאה מהמסך
            if (c.y > window.innerHeight) {
                c.y = -100;
                c.x = Math.random() * (window.innerWidth - 60);
            }
        });
        requestAnimationFrame(gameLoop);
    }

    function handleCollection(crystal, index) {
        if (firstFactor === null) {
            // קריסטל ראשון
            firstFactor = crystal.num;
            crystal.el.remove();
            crystals.splice(index, 1);
            targetDisplay.innerText = firstFactor + " × ?";
            targetDisplay.style.background = "rgba(255, 0, 255, 0.4)";
        } else {
            // בדיקת המכפלה
            if (firstFactor * crystal.num === targetNum) {
                // הצלחה!
                score += 10;
                scoreEl.innerText = score;
                shootLasers();
                if(score % 50 === 0) { level++; levelEl.innerText = level; }
                initLevel();
            } else {
                // טעות - איפוס
                targetDisplay.style.background = "red";
                setTimeout(initLevel, 500);
            }
            crystal.el.remove();
            crystals.splice(index, 1);
        }
    }

    function shootLasers() {
        for(let i=0; i<5; i++) {
            const laser = document.createElement('div');
            laser.className = 'laser';
            laser.style.left = shipX + (i*10-20) + 'px';
            laser.style.top = shipY + 'px';
            container.appendChild(laser);
            
            let pos = shipY;
            const interval = setInterval(() => {
                pos -= 10;
                laser.style.top = pos + 'px';
                if(pos < -20) {
                    clearInterval(interval);
                    laser.remove();
                }
            }, 20);
        }
    }

    initLevel();
    gameLoop();
</script>

</body>
</html>
