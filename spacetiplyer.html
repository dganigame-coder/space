<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v6.2.0 Real Nebula</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #ui-layer { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; pointer-events: none; z-index: 1000; }
        #top-hud { width: 90%; display: flex; justify-content: space-between; margin-top: 15px; color: #00f2ff; font-weight: bold; font-size: 0.9rem; text-shadow: 0 0 8px #00f2ff; }
        #data-scanner { margin-top: 10px; color: #fff; text-align: center; text-shadow: 0 0 10px #00f2ff; }
        #scan-title { color: #00f2ff; font-weight: bold; font-size: 1.2rem; margin: 0; }
        #scan-desc { font-size: 0.75rem; margin: 2px 0 0 0; color: rgba(255,255,255,0.6); }
        #mission-control { margin-bottom: 5px; text-align: center; }
        #question { font-size: 3.2rem; color: #fff; margin: 0; text-shadow: 0 0 20px #fff; font-weight: 200; }
        #answer-display { font-size: 2rem; color: #ff00de; min-height: 2.2rem; font-weight: bold; text-shadow: 0 0 10px #ff00de; }
        #numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transform: scale(0.85); pointer-events: auto; }
        .btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; font-size: 1.5rem; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn:active { background: rgba(255, 0, 222, 0.4); transform: scale(0.9); }
        .btn-go { background: rgba(0, 255, 100, 0.15); border-color: #0f0; grid-column: span 2; width: auto; border-radius: 20px; font-weight: bold; }
        #version-tag { position: absolute; bottom: 10px; left: 15px; color: rgba(0, 242, 255, 0.4); font-size: 0.7rem; font-family: monospace; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="top-hud">
        <div>📡 סטטוס: סריקה עמוקה</div>
        <div>🚀 מרחק: <span id="dist">0</span> שנות אור</div>
    </div>
    <div id="data-scanner">
        <p id="scan-title">מאתר חלקיקים...</p>
        <p id="scan-desc">ניתוח ענני גז בין-כוכביים</p>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; padding-bottom: 20px;">
        <div id="mission-control"><div id="question">טוען...</div><div id="answer-display">?</div></div>
        <div id="numpad">
            <div class="btn" onclick="press(1)">1</div><div class="btn" onclick="press(2)">2</div><div class="btn" onclick="press(3)">3</div>
            <div class="btn" onclick="press(4)">4</div><div class="btn" onclick="press(5)">5</div><div class="btn" onclick="press(6)">6</div>
            <div class="btn" onclick="press(7)">7</div><div class="btn" onclick="press(8)">8</div><div class="btn" onclick="press(9)">9</div>
            <div class="btn" style="color:#ff4444" onclick="del()">X</div><div class="btn" onclick="press(0)">0</div><div class="btn btn-go" onclick="check()">קפיצה 🌌</div>
        </div>
    </div>
    <div id="version-tag">OS_v6.2.0 // NEBULA_SPRITE_ENGINE</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, stars, universeGroup;
    let speed = 0, score = 0, currentAns = 0, inputStr = "";
    let targetZ = 0, isJumping = false;
    let rotX = 0, rotY = 0, targetRotX = 0, targetRotY = 0;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 5000);
        camera.position.z = 80;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<10000; i++) starPos.push((Math.random()-0.5)*4000, (Math.random()-0.5)*4000, (Math.random()-0.5)*4000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 }));
        scene.add(stars);

        let sX, sY;
        document.addEventListener('touchstart', e => { if(!e.target.closest('#numpad')) { sX = e.touches[0].clientX; sY = e.touches[0].clientY; } });
        document.addEventListener('touchmove', e => {
            if(!e.target.closest('#numpad')) {
                targetRotY += (e.touches[0].clientX - sX) * 0.01;
                targetRotX += (e.touches[0].clientY - sY) * 0.01;
                sX = e.touches[0].clientX; sY = e.touches[0].clientY;
            }
        });

        generateNewSystem();
        nextLevel();
        animate();
    }

    function createNebula(color) {
        const group = new THREE.Group();
        const spriteCount = 400;
        
        // יצירת טקסטורת ענן בסיסית בעזרת קנבס
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, 'rgba(255,255,255,0.3)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 64, 64);
        const texture = new THREE.CanvasTexture(canvas);

        const material = new THREE.PointsMaterial({
            size: 35,
            map: texture,
            transparent: true,
            opacity: 0.6,
            color: color,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const geo = new THREE.BufferGeometry();
        const pos = [];
        for (let i = 0; i < spriteCount; i++) {
            pos.push((Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60);
        }
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        const cloud = new THREE.Points(geo, material);
        group.add(cloud);
        return group;
    }

    function generateNewSystem() {
        if(universeGroup) scene.remove(universeGroup);
        universeGroup = new THREE.Group();
        universeGroup.position.z = -1500;
        
        const type = Math.floor(Math.random() * 5);
        const hue = Math.random();
        const mainColor = new THREE.Color().setHSL(hue, 1, 0.5);
        let colorName = hue * 360 < 50 ? "הלהבה" : hue * 360 < 150 ? "הברקת" : hue * 360 < 270 ? "הספיר" : "המגנטה";

        const title = document.getElementById('scan-title');
        if(type === 2) { // ערפילית אמיתית
            title.innerText = `ערפילית ${colorName}`;
            universeGroup.add(createNebula(mainColor));
        } else if(type === 3) { // גלקסיה
            title.innerText = `גלקסיית ${colorName}`;
            const pts = []; for(let i=0;i<5000;i++){ let r=Math.random()*70; let a=r*0.4; pts.push(Math.cos(a)*r,(Math.random()-0.5)*5,Math.sin(a)*r); }
            const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
            universeGroup.add(new THREE.Points(g, new THREE.PointsMaterial({color:mainColor, size:0.7, blending: THREE.AdditiveBlending})));
        } else {
            // שאר האובייקטים (שמש, חור שחור וכו')
            title.innerText = `אובייקט ${colorName}`;
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(15,32,32), new THREE.MeshBasicMaterial({color: mainColor}));
            universeGroup.add(mesh);
        }

        scene.add(universeGroup);
        isJumping = true; targetZ = 0;
    }

    function check() {
        if(parseInt(inputStr) === currentAns) {
            score++;
            document.getElementById('dist').innerText = score * 500;
            targetZ = 1200; isJumping = true;
            setTimeout(() => { generateNewSystem(); targetRotX=0; targetRotY=0; nextLevel(); }, 1800);
        } else { del(); }
    }

    function nextLevel() {
        let n1 = Math.floor(Math.random()*8)+2, n2 = Math.floor(Math.random()*9)+1;
        currentAns = n1*n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        inputStr = ""; document.getElementById('answer-display').innerText = "?";
    }

    function press(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('answer-display').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }

    function animate() {
        requestAnimationFrame(animate);
        if(isJumping) {
            universeGroup.position.z += (targetZ - universeGroup.position.z) * 0.05;
            speed = 35;
            if(Math.abs(universeGroup.position.z - targetZ) < 1) { isJumping = false; speed = 0.2; }
        }
        rotX += (targetRotX - rotX) * 0.05; rotY += (targetRotY - rotY) * 0.05;
        universeGroup.rotation.x = rotX; universeGroup.rotation.y = rotY;
        
        const p = stars.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { p[i+2]+=speed; if(p[i+2]>100) p[i+2]=-2500; }
        stars.geometry.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
