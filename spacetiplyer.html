<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v4.4.0 Interactive Orbit</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #ui { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; pointer-events: none; z-index: 100; }
        #top-bar { width: 95%; display: flex; justify-content: space-between; padding: 10px; color: #00f2ff; font-weight: bold; font-size: 1rem; text-shadow: 0 0 10px #00f2ff; }
        #main-panel { display: flex; flex-direction: column; align-items: center; transition: transform 0.8s ease-in-out; pointer-events: none; margin-bottom: 20px; transform: scale(0.8); transform-origin: bottom; }
        .hide-ui { transform: scale(0.8) translateY(150%) !important; }
        #mission-control { background: rgba(0, 10, 30, 0.7); padding: 10px 30px; border-radius: 30px; border: 1.5px solid #00f2ff; backdrop-filter: blur(10px); pointer-events: auto; margin-bottom: 10px; }
        #question { font-size: 2.8rem; color: #fff; margin: 0; text-align: center; }
        #answer-display { font-size: 2rem; color: #ff00de; text-align: center; min-height: 2.5rem; font-weight: bold; }
        #numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; width: 220px; pointer-events: auto; background: rgba(0, 0, 0, 0.8); border: 2px solid #ff00de; border-radius: 25px; }
        .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(0, 242, 255, 0.3); color: white; font-size: 1.4rem; padding: 12px; border-radius: 12px; text-align: center; cursor: pointer; }
        .btn:active { background: #ff00de; }
        .btn-go { background: linear-gradient(45deg, #0f0, #008000); grid-column: span 2; font-weight: bold; }
        #version-tag { position: absolute; bottom: 5px; left: 10px; color: rgba(0, 242, 255, 0.3); font-size: 0.6rem; }
    </style>
</head>
<body>

<div id="ui">
    <div id="top-bar">
        <div>🚀 <span id="dist">0</span> שנות אור</div>
        <div>🏆 <span id="rank">חוקרת גלקסיות</span></div>
    </div>
    <div id="main-panel">
        <div id="mission-control"><div id="question">טוען...</div><div id="answer-display">?</div></div>
        <div id="numpad">
            <div class="btn" onclick="press(1)">1</div><div class="btn" onclick="press(2)">2</div><div class="btn" onclick="press(3)">3</div>
            <div class="btn" onclick="press(4)">4</div><div class="btn" onclick="press(5)">5</div><div class="btn" onclick="press(6)">6</div>
            <div class="btn" onclick="press(7)">7</div><div class="btn" onclick="press(8)">8</div><div class="btn" onclick="press(9)">9</div>
            <div class="btn" style="color:#ff4444" onclick="del()">X</div><div class="btn" onclick="press(0)">0</div><div class="btn btn-go" onclick="check()">קפיצה! 🌌</div>
        </div>
    </div>
    <div id="version-tag">SYSTEM v4.4.0 - SOLVE & ORBIT MODE</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, stars, currentStructure;
    let speed = 0, score = 0, currentAns = 0, inputStr = "";
    let targetZ = -50; // המרחק שבו המערכת עוצרת מול הפנים
    let isTransitioning = false;
    let rotX = 0, rotY = 0;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 5000);
        camera.position.z = 30;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // רקע כוכבים
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<10000; i++) starPos.push((Math.random()-0.5)*3000, (Math.random()-0.5)*3000, (Math.random()-0.5)*3000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.2 }));
        scene.add(stars);

        const light = new THREE.PointLight(0xffffff, 3, 1000);
        camera.add(light);
        scene.add(camera);
        scene.add(new THREE.AmbientLight(0x444444));

        // שליטה באצבע - סיבוב סביב האובייקט
        let isDragging = false;
        let lastX, lastY;

        document.addEventListener('touchstart', e => { isDragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; });
        document.addEventListener('touchend', () => { isDragging = false; });
        document.addEventListener('touchmove', e => {
            if(!isDragging) return;
            let deltaX = e.touches[0].clientX - lastX;
            let deltaY = e.touches[0].clientY - lastY;
            rotY += deltaX * 0.01;
            rotX += deltaY * 0.01;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        });

        genStructure();
        nextLevel();
        animate();
    }

    function genStructure() {
        if(currentStructure) scene.remove(currentStructure);
        currentStructure = new THREE.Group();
        currentStructure.position.z = -1200; // מתחיל רחוק מאוד

        const dice = Math.random();
        if(dice < 0.6) {
            // מערכת שמש עשירה
            const sun = new THREE.Mesh(new THREE.SphereGeometry(10,32,32), new THREE.MeshBasicMaterial({color: 0xffaa00}));
            currentStructure.add(sun);
            
            // כוכב לכת 1
            const p1 = new THREE.Mesh(new THREE.SphereGeometry(3,32,32), new THREE.MeshStandardMaterial({color: 0x4488ff}));
            p1.position.x = 25;
            currentStructure.add(p1);

            // כוכב לכת 2 עם טבעת
            const p2Group = new THREE.Group();
            const p2 = new THREE.Mesh(new THREE.SphereGeometry(4,32,32), new THREE.MeshStandardMaterial({color: 0xff7744}));
            const ring = new THREE.Mesh(new THREE.TorusGeometry(7, 0.2, 2, 64), new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.5}));
            ring.rotation.x = 1.5;
            p2Group.add(p2); p2Group.add(ring);
            p2Group.position.x = -40;
            currentStructure.add(p2Group);
            
            currentStructure.userData = {type:'solar', p1, p2Group};
        } else {
            // חור שחור דרמטי
            const bh = new THREE.Mesh(new THREE.SphereGeometry(12,32,32), new THREE.MeshBasicMaterial({color: 0x000000}));
            const disk = new THREE.Mesh(new THREE.TorusGeometry(22, 1.5, 2, 100), new THREE.MeshBasicMaterial({color: 0x00f2ff, transparent:true, opacity:0.8}));
            disk.rotation.x = 1.5;
            currentStructure.add(bh); currentStructure.add(disk);
            currentStructure.userData = {type:'bh', disk};
        }

        scene.add(currentStructure);
        isTransitioning = true;
    }

    function check() {
        if(parseInt(inputStr) === currentAns) {
            score++;
            document.getElementById('dist').innerText = score * 500;
            document.getElementById('main-panel').classList.add('hide-ui');
            
            // "זריקת" האובייקט הנוכחי קדימה/הצידה ויצירת חדש
            isTransitioning = true;
            targetZ = 500; // האובייקט עף מעבר למצלמה
            
            setTimeout(() => {
                genStructure();
                targetZ = -60; // האובייקט החדש עוצר מול הפנים
                rotX = 0; rotY = 0; // איפוס זווית מבט
                document.getElementById('main-panel').classList.remove('hide-ui');
                nextLevel();
            }, 2500);
        } else { del(); }
    }

    function nextLevel() {
        let n1 = Math.floor(Math.random()*8)+2, n2 = Math.floor(Math.random()*9)+1;
        currentAns = n1*n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        inputStr = ""; document.getElementById('answer-display').innerText = "?";
    }

    function press(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('answer-display').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }

    function animate() {
        requestAnimationFrame(animate);

        // תנועה לעבר המצלמה (עוצר ב-targetZ)
        if(isTransitioning) {
            currentStructure.position.z += (targetZ - currentStructure.position.z) * 0.03;
            speed = 10; // אפקט מהירות בכוכבים בזמן מעבר
            if(Math.abs(currentStructure.position.z - targetZ) < 1) {
                isTransitioning = false;
                speed = 0.2;
            }
        }

        // סיבוב המערכת לפי האצבע
        currentStructure.rotation.y = rotY;
        currentStructure.rotation.x = rotX;

        // אנימציה פנימית של המערכת (תמיד עובד)
        const data = currentStructure.userData;
        const time = Date.now() * 0.001;
        if(data.type === 'solar') {
            data.p1.position.x = Math.cos(time) * 25;
            data.p1.position.z = Math.sin(time) * 25;
            data.p2Group.position.x = Math.cos(time * 0.6) * -40;
            data.p2Group.position.z = Math.sin(time * 0.6) * -40;
            data.p2Group.rotation.y += 0.01;
        } else if(data.type === 'bh') {
            data.disk.rotation.z += 0.05;
        }

        // תנועת כוכבים ברקע
        const p = stars.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { p[i+2]+=speed; if(p[i+2]>20) p[i+2]=-2500; }
        stars.geometry.attributes.position.needsUpdate = true;

        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
