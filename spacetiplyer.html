<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מסע חלל - לוח הכפל</title>

<style>
body { margin:0; overflow:hidden; background:black; font-family:Arial; }

#ui {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
  pointer-events:none;
}

#top {
  color:#00f2ff;
  font-size:20px;
  margin-top:10px;
  text-shadow:0 0 10px #00f2ff;
}

#mission {
  background:rgba(0,0,0,0.7);
  border:2px solid #00f2ff;
  border-radius:20px;
  padding:15px;
  margin-bottom:10px;
  text-align:center;
  pointer-events:auto;
}

#question { font-size:32px; color:white; }
#answer { font-size:26px; color:#ff00de; min-height:30px; }

#rank { font-size:18px; color:#ffeb3b; }

#pad {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.btn {
  background:#111;
  color:white;
  padding:12px;
  font-size:18px;
  border-radius:10px;
  cursor:pointer;
  text-align:center;
}

.btn:active { background:#ff00de; }

.go { grid-column:span 2; background:green; }
</style>
</head>

<body>

<div id="ui">
  <div id="top">
    🚀 מרחק: <span id="score">0</span> |
    🌟 שלב: <span id="level">1</span> |
    🏆 דרגה: <span id="rank">צוער</span>
  </div>

  <div id="mission">
    <div id="question">טוען...</div>
    <div id="answer">?</div>

    <div id="pad">
      <div class="btn" onclick="press(1)">1</div>
      <div class="btn" onclick="press(2)">2</div>
      <div class="btn" onclick="press(3)">3</div>
      <div class="btn" onclick="press(4)">4</div>
      <div class="btn" onclick="press(5)">5</div>
      <div class="btn" onclick="press(6)">6</div>
      <div class="btn" onclick="press(7)">7</div>
      <div class="btn" onclick="press(8)">8</div>
      <div class="btn" onclick="press(9)">9</div>
      <div class="btn" onclick="del()">מחק</div>
      <div class="btn" onclick="press(0)">0</div>
      <div class="btn go" onclick="check()">קפיצה! 🌌</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 3000);
camera.position.z = 15;

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ⭐ כוכבים
const geo = new THREE.BufferGeometry();
const pos = [];
for(let i=0;i<12000;i++){
  pos.push((Math.random()-0.5)*2000,
           (Math.random()-0.5)*2000,
           (Math.random()-0.5)*2000);
}
geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));

const stars = new THREE.Points(geo, new THREE.PointsMaterial({color:0xffffff, size:1}));
scene.add(stars);

// ☀️ אור
const light = new THREE.PointLight(0xffffff,2);
light.position.set(50,0,0);
scene.add(light);

// 🪐 כוכב
const planet = new THREE.Mesh(
  new THREE.SphereGeometry(5,64,64),
  new THREE.MeshStandardMaterial({color:0x3399ff})
);
scene.add(planet);

// 🌙 ירח
const moon = new THREE.Mesh(
  new THREE.SphereGeometry(1.5,32,32),
  new THREE.MeshStandardMaterial({color:0xaaaaaa})
);
scene.add(moon);

// 💥 חלקיקים (סופרנובה)
let particles = [];
function explode(){
  for(let i=0;i<100;i++){
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.2),
      new THREE.MeshBasicMaterial({color:0xffaa00})
    );
    p.position.set(0,0,0);
    p.velocity = new THREE.Vector3(
      (Math.random()-0.5)*2,
      (Math.random()-0.5)*2,
      (Math.random()-0.5)*2
    );
    scene.add(p);
    particles.push(p);
  }
}

// 🎮 משחק
let answer = 0, input="", score=0, level=1;

function rankName(){
  if(level < 5) return "צוער";
  if(level < 10) return "טייס";
  if(level < 20) return "מפקד חלל";
  return "אלוף הגלקסיה";
}

function newQuestion(){
  let a = Math.floor(Math.random()*level)+1;
  let b = Math.floor(Math.random()*10)+1;
  answer = a*b;
  document.getElementById("question").innerText = `${a} × ${b}`;
  input="";
  updateAnswer();
}

function updateAnswer(){
  document.getElementById("answer").innerText = input || "?";
}

function press(n){ if(input.length<3){ input+=n; updateAnswer(); } }
function del(){ input=""; updateAnswer(); }

function speak(text){
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "he-IL";
  speechSynthesis.speak(msg);
}

function check(){
  if(parseInt(input) === answer){
    score+=100; level++;
    document.getElementById("score").innerText=score;
    document.getElementById("level").innerText=level;
    document.getElementById("rank").innerText=rankName();

    speak("כל הכבוד!");
    explode();

    speed = 40;

    setTimeout(newQuestion,1500);

  } else {
    speak("נסה שוב");
    input=""; updateAnswer();
  }
}

// 🌌 אנימציה
let speed=0.5, t=0;

function animate(){
  requestAnimationFrame(animate);

  t+=0.02;

  planet.rotation.y+=0.003;
  moon.position.x=Math.cos(t)*10;
  moon.position.z=Math.sin(t)*10;

  // כוכבים
  const p=stars.geometry.attributes.position.array;
  for(let i=2;i<p.length;i+=3){
    p[i]+=speed;
    if(p[i]>50) p[i]=-1000;
  }
  stars.geometry.attributes.position.needsUpdate=true;

  // חלקיקים
  particles.forEach((p,i)=>{
    p.position.add(p.velocity);
    p.velocity.multiplyScalar(0.95);
  });

  speed*=0.98;

  renderer.render(scene,camera);
}

newQuestion();
animate();
</script>

</body>
</html>
