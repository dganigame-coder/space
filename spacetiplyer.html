<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v4.3.0 Zoom-In</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #ui { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; pointer-events: none; z-index: 100; }
        #top-bar { width: 95%; display: flex; justify-content: space-between; padding: 10px; color: #00f2ff; font-weight: bold; font-size: 1rem; text-shadow: 0 0 10px #00f2ff; }
        #discovery-alert { margin-top: 40px; color: #ffeb3b; font-size: 1.8rem; font-weight: bold; text-shadow: 0 0 20px #ffeb3b; opacity: 0; transition: 0.8s; text-align: center; }
        #main-panel { display: flex; flex-direction: column; align-items: center; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; margin-bottom: 15px; transform: scale(0.8); transform-origin: bottom; }
        .hide-ui { transform: scale(0.8) translateY(150%) !important; }
        #mission-control { background: rgba(0, 10, 30, 0.7); padding: 10px 30px; border-radius: 30px; border: 1px solid #00f2ff; backdrop-filter: blur(10px); pointer-events: auto; margin-bottom: 8px; }
        #question { font-size: 2.5rem; color: #fff; margin: 0; text-align: center; }
        #answer-display { font-size: 1.8rem; color: #ff00de; text-align: center; min-height: 2.2rem; }
        #numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; width: 220px; pointer-events: auto; background: rgba(0, 0, 0, 0.8); border: 2px solid #ff00de; border-radius: 25px; }
        .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(0, 242, 255, 0.4); color: white; font-size: 1.3rem; padding: 12px; border-radius: 12px; text-align: center; cursor: pointer; }
        .btn:active { background: #ff00de; }
        .btn-go { background: linear-gradient(45deg, #0f0, #008000); grid-column: span 2; font-weight: bold; }
        #version-tag { position: absolute; bottom: 5px; left: 10px; color: rgba(0, 242, 255, 0.3); font-size: 0.6rem; }
    </style>
</head>
<body>

<div id="ui">
    <div id="top-bar">
        <div>🚀 <span id="dist">0</span> שנות אור</div>
        <div>🏆 <span id="rank">מפקדת אמיצה</span></div>
    </div>
    <div id="discovery-alert">מתקרבים ליעד... 📡</div>
    <div id="main-panel">
        <div id="mission-control"><div id="question">טוען...</div><div id="answer-display">?</div></div>
        <div id="numpad">
            <div class="btn" onclick="press(1)">1</div><div class="btn" onclick="press(2)">2</div><div class="btn" onclick="press(3)">3</div>
            <div class="btn" onclick="press(4)">4</div><div class="btn" onclick="press(5)">5</div><div class="btn" onclick="press(6)">6</div>
            <div class="btn" onclick="press(7)">7</div><div class="btn" onclick="press(8)">8</div><div class="btn" onclick="press(9)">9</div>
            <div class="btn" style="color:#ff4444" onclick="del()">X</div><div class="btn" onclick="press(0)">0</div><div class="btn btn-go" onclick="check()">טוס קרוב! 🌌</div>
        </div>
    </div>
    <div id="version-tag">SYSTEM v4.3.0 - DYNAMIC FLY-BY ENGINE</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, stars, currentStructure;
    let speed = 0.1, targetSpeed = 0.1, score = 0, currentAns = 0, inputStr = "";
    let lookX = 0, lookY = 0;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 5000);
        camera.position.z = 20;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // כוכבים
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<10000; i++) starPos.push((Math.random()-0.5)*3000, (Math.random()-0.5)*3000, (Math.random()-0.5)*3000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.2 }));
        scene.add(stars);

        const sunLight = new THREE.PointLight(0xffffff, 4, 1000);
        camera.add(sunLight);
        scene.add(camera);
        scene.add(new THREE.AmbientLight(0x222222));

        // מגע - הזזת המצלמה
        document.addEventListener('touchmove', (e) => {
            lookX = (e.touches[0].clientX - window.innerWidth/2) * 0.02;
            lookY = (e.touches[0].clientY - window.innerHeight/2) * 0.02;
        });

        genStructure();
        nextLevel();
        animate();
    }

    function genStructure() {
        if(currentStructure) scene.remove(currentStructure);
        currentStructure = new THREE.Group();
        
        // המבנה נוצר תמיד ב- (0,0, -1000) כדי שנתקרב אליו
        currentStructure.position.set(0, 0, -1000);
        
        const dice = Math.random();
        const alert = document.getElementById('discovery-alert');
        alert.style.opacity = "1";

        if(dice < 0.5) {
            alert.innerText = "מערכת שמש כפולה! 🪐";
            // שמש מרכזית
            const sun = new THREE.Mesh(new THREE.SphereGeometry(8,32,32), new THREE.MeshBasicMaterial({color: 0xffcc00}));
            currentStructure.add(sun);
            // כוכב לכת 1
            const p1 = new THREE.Mesh(new THREE.SphereGeometry(3,32,32), new THREE.MeshStandardMaterial({color: 0x00ffcc}));
            p1.position.x = 25;
            currentStructure.add(p1);
            // כוכב לכת 2 + ירח
            const p2Group = new THREE.Group();
            const p2 = new THREE.Mesh(new THREE.SphereGeometry(4,32,32), new THREE.MeshStandardMaterial({color: 0xff5500}));
            const moon = new THREE.Mesh(new THREE.SphereGeometry(1,16,16), new THREE.MeshStandardMaterial({color: 0xaaaaaa}));
            moon.position.x = 8;
            p2Group.add(p2); p2Group.add(moon);
            p2Group.position.x = -35;
            currentStructure.add(p2Group);
            currentStructure.userData = {type:'solar', p1, p2Group, moon};
        } else {
            alert.innerText = "חור שחור קרוב! 🌑";
            const bh = new THREE.Mesh(new THREE.SphereGeometry(10,32,32), new THREE.MeshBasicMaterial({color: 0x000000}));
            const disk = new THREE.Mesh(new THREE.TorusGeometry(18, 1, 2, 100), new THREE.MeshBasicMaterial({color: 0x00f2ff, transparent:true, opacity:0.7}));
            disk.rotation.x = 1.5;
            currentStructure.add(bh); currentStructure.add(disk);
            currentStructure.userData = {type:'bh', disk};
        }

        scene.add(currentStructure);
        setTimeout(()=>alert.style.opacity="0", 2500);
    }

    function check() {
        if(parseInt(inputStr) === currentAns) {
            score++; targetSpeed = 40; // מהירות טיסה
            document.getElementById('dist').innerText = score * 500;
            document.getElementById('main-panel').classList.add('hide-ui');
            
            // יצירת מבנה חדש רחוק בזמן שאנחנו טסים
            setTimeout(genStructure, 1000);
            
            setTimeout(()=> {
                document.getElementById('main-panel').classList.remove('hide-ui');
                nextLevel();
            }, 4000);
        } else { del(); }
    }

    function nextLevel() {
        let n1 = Math.floor(Math.random()*8)+2, n2 = Math.floor(Math.random()*9)+1;
        currentAns = n1*n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        inputStr = ""; document.getElementById('answer-display').innerText = "?";
    }

    function press(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('answer-display').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }

    function animate() {
        requestAnimationFrame(animate);
        speed += (targetSpeed - speed) * 0.05;
        if(targetSpeed > 0.2) targetSpeed -= 0.4;

        // המבנה מתקרב אלינו
        currentStructure.position.z += speed;

        // כשהוא מגיע ממש קרוב (Z > -50), הוא מאט כדי שנוכל לראות אותו
        if(currentStructure.position.z > -100 && targetSpeed < 1) {
            speed *= 0.9; 
        }

        // אם עברנו אותו, הוא מתאפס לרחוק
        if(currentStructure.position.z > 50) currentStructure.position.z = -1500;

        // אנימציה של המערכת
        const data = currentStructure.userData;
        if(data.type === 'solar') {
            const t = Date.now() * 0.001;
            data.p1.position.x = Math.cos(t) * 25;
            data.p1.position.z = Math.sin(t) * 25;
            data.p2Group.position.x = Math.cos(t*0.7) * -35;
            data.p2Group.position.z = Math.sin(t*0.7) * -35;
            data.moon.position.x = Math.cos(t*3) * 8;
            data.moon.position.z = Math.sin(t*3) * 8;
        } else if(data.type === 'bh') {
            data.disk.rotation.z += 0.05;
        }

        // הזזת המצלמה עם האצבע
        camera.position.x += (lookX - camera.position.x) * 0.05;
        camera.position.y += (-lookY - camera.position.y) * 0.05;
        camera.lookAt(0,0,currentStructure.position.z);

        const p = stars.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { p[i+2]+=speed; if(p[i+2]>20) p[i+2]=-2000; }
        stars.geometry.attributes.position.needsUpdate = true;

        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
