<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מסע חלל - לוח הכפל</title>

<style>
body { margin:0; overflow:hidden; background:black; font-family:Arial; touch-action:none; }

#ui {
  position:absolute; width:100%; height:100%;
  display:flex; flex-direction:column;
  justify-content:space-between; align-items:center;
  pointer-events:none;
}

#top {
  color:#00f2ff; font-size:18px; margin-top:10px;
  text-shadow:0 0 10px #00f2ff;
}

#panel {
  background:rgba(0,0,0,0.7);
  border:2px solid #00f2ff;
  border-radius:20px;
  padding:12px;
  margin-bottom:10px;
  pointer-events:auto;
  text-align:center;
}

#question { font-size:28px; color:white; }
#answer { font-size:24px; color:#ff00de; min-height:28px; }
#rank { color:#ffeb3b; }

#pad {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:8px;
}

.btn {
  background:#111; color:white;
  padding:10px; font-size:16px;
  border-radius:10px;
}

.go { grid-column:span 2; background:green; }
</style>
</head>

<body>

<div id="ui">
  <div id="top">
    🚀 מרחק: <span id="score">0</span> |
    🌟 שלב: <span id="level">1</span> |
    🏆 <span id="rank">צוער</span>
  </div>

  <div id="panel">
    <div id="question"></div>
    <div id="answer">?</div>

    <div id="pad">
      <div class="btn" onclick="press(1)">1</div>
      <div class="btn" onclick="press(2)">2</div>
      <div class="btn" onclick="press(3)">3</div>
      <div class="btn" onclick="press(4)">4</div>
      <div class="btn" onclick="press(5)">5</div>
      <div class="btn" onclick="press(6)">6</div>
      <div class="btn" onclick="press(7)">7</div>
      <div class="btn" onclick="press(8)">8</div>
      <div class="btn" onclick="press(9)">9</div>
      <div class="btn" onclick="del()">מחק</div>
      <div class="btn" onclick="press(0)">0</div>
      <div class="btn go" onclick="check()">קפיצה! 🌌</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ====== THREE ======
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 3000);
camera.position.z = 10;

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ⭐ כוכבים
const geo = new THREE.BufferGeometry();
const pos = [];
for(let i=0;i<12000;i++){
  pos.push((Math.random()-0.5)*2000,
           (Math.random()-0.5)*2000,
           (Math.random()-0.5)*2000);
}
geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
const stars = new THREE.Points(geo, new THREE.PointsMaterial({size:1}));
scene.add(stars);

// 🪐 כוכבי לכת דינמיים
let planets = [];
function createPlanet(){
  const p = new THREE.Mesh(
    new THREE.SphereGeometry(3,32,32),
    new THREE.MeshStandardMaterial({color: new THREE.Color().setHSL(Math.random(),0.7,0.5)})
  );
  p.position.set((Math.random()-0.5)*100, (Math.random()-0.5)*60, -300);
  scene.add(p);
  planets.push(p);
}
for(let i=0;i<3;i++) createPlanet();

// ☀️ אור
scene.add(new THREE.PointLight(0xffffff,2));

// ====== שליטה עם אצבע ======
let targetX=0, targetY=0;

document.addEventListener("touchmove",(e)=>{
  targetX = (e.touches[0].clientX/window.innerWidth - 0.5)*2;
  targetY = (e.touches[0].clientY/window.innerHeight - 0.5)*2;
},{passive:true});

// ====== משחק ======
let answer=0,input="",score=0,level=1;

function rank(){
  if(level<5) return "צוער";
  if(level<10) return "טייס";
  if(level<20) return "מפקד חלל";
  return "אלוף הגלקסיה";
}

function newQ(){
  let a=Math.floor(Math.random()*level)+1;
  let b=Math.floor(Math.random()*10)+1;
  answer=a*b;
  document.getElementById("question").innerText=`${a} × ${b}`;
  input=""; update();
}

function update(){ document.getElementById("answer").innerText=input||"?"; }

function press(n){ if(input.length<3){ input+=n; update(); } }
function del(){ input=""; update(); }

function speak(t){
  let u=new SpeechSynthesisUtterance(t);
  u.lang="he-IL"; speechSynthesis.speak(u);
}

function check(){
  if(parseInt(input)===answer){
    speak("כל הכבוד!");
    score+=100; level++;
    document.getElementById("score").innerText=score;
    document.getElementById("level").innerText=level;
    document.getElementById("rank").innerText=rank();
    speed=40;
    explode();
    setTimeout(newQ,1200);
  } else {
    speak("נסה שוב");
    input=""; update();
  }
}

// 💥 פיצוץ
let parts=[];
function explode(){
  for(let i=0;i<50;i++){
    let p=new THREE.Mesh(
      new THREE.SphereGeometry(0.2),
      new THREE.MeshBasicMaterial({color:0xffaa00})
    );
    p.position.set(0,0,0);
    p.v=new THREE.Vector3(
      (Math.random()-0.5)*3,
      (Math.random()-0.5)*3,
      (Math.random()-0.5)*3
    );
    scene.add(p);
    parts.push(p);
  }
}

// ====== אנימציה ======
let speed=0.5;

function animate(){
  requestAnimationFrame(animate);

  // מצלמה חלקה
  camera.position.x += (targetX*8 - camera.position.x)*0.05;
  camera.position.y += (-targetY*6 - camera.position.y)*0.05;
  camera.lookAt(scene.position);

  // כוכבים
  let p=stars.geometry.attributes.position.array;
  for(let i=2;i<p.length;i+=3){
    p[i]+=speed;
    if(p[i]>50) p[i]=-1000;
  }
  stars.geometry.attributes.position.needsUpdate=true;

  // כוכבי לכת
  planets.forEach(pl=>{
    pl.position.z += speed;
    pl.rotation.y += 0.01;

    if(pl.position.z>50){
      pl.position.z=-300;
      pl.position.x=(Math.random()-0.5)*100;
      pl.position.y=(Math.random()-0.5)*60;
    }
  });

  // חלקיקים
  parts.forEach(p=>{
    p.position.add(p.v);
    p.v.multiplyScalar(0.95);
  });

  speed*=0.97;

  renderer.render(scene,camera);
}

newQ();
animate();
</script>

</body>
</html>
