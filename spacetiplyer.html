<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v5.2.0 Fixed</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        
        /* שכבת הממשק - חייבת להיות עם pointer-events: none כדי לא לחסום את ה-Three.js */
        #ui-layer { 
            position: absolute; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: space-between; align-items: center; 
            pointer-events: none; z-index: 1000; 
        }

        /* פאנל סורק עליון */
        #data-scanner { 
            width: 85%; margin-top: 40px; background: rgba(0, 30, 80, 0.5); 
            border: 1px solid #00f2ff; border-radius: 20px; padding: 12px;
            color: #fff; text-align: center; backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); opacity: 1;
        }
        #scan-title { color: #00f2ff; font-weight: bold; font-size: 1.4rem; margin: 0; }
        #scan-desc { font-size: 1rem; margin: 5px 0 0 0; color: #e0e0e0; }

        /* פאנל מקלדת - pointer-events: auto מאפשר לחיצה! */
        #bottom-panel { 
            display: flex; flex-direction: column; align-items: center; 
            padding-bottom: 30px; pointer-events: auto; transform: scale(0.9);
        }
        
        #mission-control { 
            background: rgba(0, 10, 30, 0.9); padding: 15px 40px; border-radius: 40px; 
            border: 2px solid #00f2ff; margin-bottom: 15px; text-align: center;
        }
        #question { font-size: 3.5rem; color: #fff; margin: 0; line-height: 1; }
        #answer-display { font-size: 2.2rem; color: #ff00de; min-height: 2.5rem; font-weight: bold; margin-top: 5px; }
        
        #numpad { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; 
            padding: 15px; background: rgba(0, 0, 0, 0.85); 
            border: 3px solid #ff00de; border-radius: 30px; box-shadow: 0 0 25px rgba(255,0,222,0.4);
        }
        
        .btn { 
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(0, 242, 255, 0.4); 
            color: white; font-size: 1.8rem; width: 65px; height: 65px; 
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; pointer-events: auto;
        }
        .btn:active { background: #ff00de; transform: scale(0.9); }
        .btn-go { background: linear-gradient(45deg, #0f0, #008000); grid-column: span 2; width: auto; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="data-scanner">
        <p id="scan-title">מאתר אובייקטים...</p>
        <p id="scan-desc">ממתין לסריקה ראשונית של המרחב.</p>
    </div>

    <div id="bottom-panel">
        <div id="mission-control">
            <div id="question">טוען...</div>
            <div id="answer-display">?</div>
        </div>
        <div id="numpad">
            <div class="btn" onclick="press(1)">1</div><div class="btn" onclick="press(2)">2</div><div class="btn" onclick="press(3)">3</div>
            <div class="btn" onclick="press(4)">4</div><div class="btn" onclick="press(5)">5</div><div class="btn" onclick="press(6)">6</div>
            <div class="btn" onclick="press(7)">7</div><div class="btn" onclick="press(8)">8</div><div class="btn" onclick="press(9)">9</div>
            <div class="btn" style="color:#ff4444" onclick="del()">X</div><div class="btn" onclick="press(0)">0</div><div class="btn btn-go" onclick="check()">קפיצה! 🌌</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, stars, universeGroup;
    let speed = 0, targetSpeed = 0.2, score = 0, currentAns = 0, inputStr = "";
    let targetZ = 0, isJumping = false;
    let rotX = 0, rotY = 0, targetRotX = 0, targetRotY = 0;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 5000);
        camera.position.z = 50;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<10000; i++) starPos.push((Math.random()-0.5)*4000, (Math.random()-0.5)*4000, (Math.random()-0.5)*4000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.2 }));
        scene.add(stars);

        scene.add(new THREE.AmbientLight(0x666666));
        const light = new THREE.PointLight(0xffffff, 3, 1000);
        light.position.set(50,50,50);
        scene.add(light);

        // שליטת אצבע
        let startX, startY;
        document.addEventListener('touchstart', e => { 
            if(e.target.classList.contains('btn')) return; // אל תזיז את המצלמה כשלוחצים על כפתור
            startX = e.touches[0].clientX; startY = e.touches[0].clientY; 
        });
        document.addEventListener('touchmove', e => {
            if(e.target.classList.contains('btn')) return;
            targetRotY += (e.touches[0].clientX - startX) * 0.007;
            targetRotX += (e.touches[0].clientY - startY) * 0.007;
            startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        });

        generateNewSystem();
        nextLevel();
        animate();
    }

    function generateNewSystem() {
        if(universeGroup) scene.remove(universeGroup);
        universeGroup = new THREE.Group();
        universeGroup.position.z = -1500;
        
        const type = Math.floor(Math.random() * 5);
        const hue = Math.random();
        const mainColor = new THREE.Color().setHSL(hue, 1, 0.5);
        let colorName = hue * 360 < 50 ? "הזהב" : hue * 360 < 150 ? "הברקת" : hue * 360 < 270 ? "הספיר" : "המגנטה";

        const title = document.getElementById('scan-title');
        const desc = document.getElementById('scan-desc');

        if(type === 0) {
            title.innerText = `מערכת שמש ${colorName}`;
            desc.innerText = "כוכבי לכת במסלול סביב שמש בוערת.";
            universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(10,32,32), new THREE.MeshBasicMaterial({color: mainColor})));
            const p = new THREE.Mesh(new THREE.SphereGeometry(3,32,32), new THREE.MeshStandardMaterial({color: 0xaaaaaa}));
            p.position.x = 25; const piv = new THREE.Group(); piv.add(p); universeGroup.add(piv);
        } else if(type === 1) {
            title.innerText = `חור שחור ${colorName}`;
            desc.innerText = "זהירות! כוח המשיכה כאן מעקם את האור.";
            universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(12,32,32), new THREE.MeshBasicMaterial({color: 0x000000})));
            const disk = new THREE.Mesh(new THREE.TorusGeometry(22,1.5,2,100), new THREE.MeshBasicMaterial({color: mainColor, transparent:true, opacity:0.8}));
            disk.rotation.x = 1.5; universeGroup.add(disk);
            universeGroup.userData.disk = disk;
        } else if(type === 2) {
            title.innerText = `ערפילית ${colorName}`;
            desc.innerText = "ענן גז זוהר שבו נולדים כוכבים חדשים.";
            universeGroup.add(new THREE.Mesh(new THREE.IcosahedronGeometry(18,1), new THREE.MeshBasicMaterial({color: mainColor, wireframe:true, transparent:true, opacity:0.6})));
        } else if(type === 3) {
            title.innerText = `גלקסיית ${colorName}`;
            desc.innerText = "מליארדי כוכבים מסתחררים סביב מרכז הגלקסיה.";
            const pts = []; for(let i=0;i<2500;i++){ let r=Math.random()*40; let a=r*0.5; pts.push(Math.cos(a)*r,(Math.random()-0.5)*3,Math.sin(a)*r); }
            const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
            universeGroup.add(new THREE.Points(g, new THREE.PointsMaterial({color:mainColor, size:0.6})));
        } else {
            title.innerText = `חור תולעת ${colorName}`;
            desc.innerText = "שער קוסמי למקום לא ידוע ביקום.";
            const wh = new THREE.Mesh(new THREE.TorusGeometry(18,8,16,100), new THREE.MeshBasicMaterial({color: mainColor, wireframe:true, transparent:true, opacity:0.5}));
            universeGroup.add(wh); universeGroup.rotation.y = 1.5;
        }

        scene.add(universeGroup);
        isJumping = true; targetZ = 0;
    }

    function check() {
        if(parseInt(inputStr) === currentAns) {
            score++;
            document.getElementById('bottom-panel').style.opacity = "0.3";
            targetZ = 1200; isJumping = true;
            setTimeout(() => {
                generateNewSystem();
                targetRotX = 0; targetRotY = 0;
                document.getElementById('bottom-panel').style.opacity = "1";
                nextLevel();
            }, 1800);
        } else { del(); }
    }

    function nextLevel() {
        let n1 = Math.floor(Math.random()*8)+2, n2 = Math.floor(Math.random()*9)+1;
        currentAns = n1*n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        inputStr = ""; document.getElementById('answer-display').innerText = "?";
    }

    function press(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('answer-display').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }

    function animate() {
        requestAnimationFrame(animate);
        if(isJumping) {
            universeGroup.position.z += (targetZ - universeGroup.position.z) * 0.06;
            speed = 20;
            if(Math.abs(universeGroup.position.z - targetZ) < 1) { isJumping = false; speed = 0.2; }
        }
        rotX += (targetRotX - rotX) * 0.1; rotY += (targetRotY - rotY) * 0.1;
        universeGroup.rotation.x = rotX; universeGroup.rotation.y = rotY;
        
        const p = stars.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { p[i+2]+=speed; if(p[i+2]>50) p[i+2]=-2500; }
        stars.geometry.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
