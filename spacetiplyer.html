<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: Explorer v4.4.0</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        
        #ui { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; pointer-events: none; z-index: 100; }
        
        #top-info { 
            width: 95%; display: flex; justify-content: space-between; padding: 10px; color: #00f2ff; 
            font-weight: bold; font-size: 1.1rem; text-shadow: 0 0 10px #00f2ff;
        }

        #main-panel { 
            display: flex; flex-direction: column; align-items: center; 
            pointer-events: none; margin-bottom: 20px;
            transform: scale(0.9); transform-origin: bottom;
        }

        #mission-control { 
            background: rgba(0, 10, 30, 0.4); padding: 15px 40px; border-radius: 50px; 
            border: 1px solid rgba(0, 242, 255, 0.3); backdrop-filter: blur(15px); pointer-events: auto; margin-bottom: 10px;
        }
        #question { font-size: 3rem; color: #fff; margin: 0; text-align: center; text-shadow: 0 0 15px #fff; }
        #answer-display { font-size: 2rem; color: #ff00de; text-align: center; min-height: 2.5rem; text-shadow: 0 0 10px #ff00de; }

        #numpad { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; 
            padding: 15px; width: 85%; max-width: 240px; pointer-events: auto;
            background: rgba(0, 0, 0, 0.6); border: 2px solid rgba(255, 0, 222, 0.4); 
            border-radius: 30px; margin-bottom: 20px; box-shadow: 0 0 30px rgba(255, 0, 222, 0.2);
        }
        
        .btn { 
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(0, 242, 255, 0.2); 
            color: white; font-size: 1.5rem; padding: 15px; border-radius: 15px;
            text-align: center; cursor: pointer; transition: 0.1s;
        }
        .btn:active { background: #ff00de; transform: scale(0.9); }
        .btn-go { background: linear-gradient(45deg, #0f0, #008000); grid-column: span 2; font-weight: bold; text-shadow: 0 0 5px #fff; }

        #version-tag { position: absolute; bottom: 5px; left: 10px; color: rgba(0, 242, 255, 0.5); font-size: 0.75rem; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui">
    <div id="top-info">
        <div>🏆 דרגה: <span id="rank">מגלת גלקסיות</span></div>
        <div>🚀 מרחק: <span id="dist">0</span> שנות אור</div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; pointer-events: none;">
        <div id="mission-control">
            <div id="question"> 6 × 7 </div>
            <div id="answer-display">?</div>
        </div>

        <div id="numpad">
            <div class="btn" onclick="press(1)">1</div><div class="btn" onclick="press(2)">2</div><div class="btn" onclick="press(3)">3</div>
            <div class="btn" onclick="press(4)">4</div><div class="btn" onclick="press(5)">5</div><div class="btn" onclick="press(6)">6</div>
            <div class="btn" onclick="press(7)">7</div><div class="btn" onclick="press(8)">8</div><div class="btn" onclick="press(9)">9</div>
            <div class="btn" style="color:#ff4444" onclick="del()">X</div><div class="btn" onclick="press(0)">0</div><div class="btn btn-go" onclick="check()">קפיצה! 🌌</div>
        </div>
    </div>
    
    <div id="version-tag">SYSTEM v4.4.0 - COSMIC NEBULA GENERATOR</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, stars, currentStructure, currentNebula;
    let speed = 0.2, targetSpeed = 0.2, score = 0, currentAns = 0, inputStr = "";

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 5000);
        camera.position.z = 5;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        // כוכבים
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<12000; i++) starPos.push((Math.random()-0.5)*4000, (Math.random()-0.5)*4000, (Math.random()-0.5)*4000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.0, transparent: true }));
        scene.add(stars);

        const sunLight = new THREE.PointLight(0xffffff, 2.5, 1000);
        sunLight.position.set(25, 25, 25);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x111111));

        generateRandomCosmicPhenomenon(); // יוצר את המבנה הראשון

        nextLevel();
        animate();
    }

    // פונקציית הקסם: יוצרת מבנה חלל אקראי לחלוטין (ערפילית, סופרנובה, חור תולעת וכו')
    function generateRandomCosmicPhenomenon() {
        // ניקוי המבנים הקודמים
        if(currentStructure) scene.remove(currentStructure);
        if(currentNebula) scene.remove(currentNebula);

        currentStructure = new THREE.Group();
        currentStructure.position.set((Math.random()-0.5)*30, (Math.random()-0.5)*20, -1500); // מתחיל רחוק מאוד

        const dice = Math.random();
        
        // יצירת ערפילית (Nebula) ייחודית בכל מקרה
        const nebGeo = new THREE.IcosahedronGeometry(Math.random()*40 + 60, 2);
        const nebColor = new THREE.Color().setHSL(Math.random(), 0.8, 0.4);
        const nebMat = new THREE.MeshBasicMaterial({ 
            color: nebColor, transparent: true, opacity: 0.1, side: THREE.BackSide, blending: THREE.AdditiveBlending 
        });
        currentNebula = new THREE.Mesh(nebGeo, nebMat);
        currentNebula.position.copy(currentStructure.position);
        scene.add(currentNebula);

        if (dice < 0.4) {
            // 40% סיכוי לסופרנובה (Supernova)
            const snGeo = new THREE.DodecahedronGeometry(20, 1);
            const snMat = new THREE.MeshBasicMaterial({ 
                color: nebColor, transparent: true, opacity: 0.6, wireframe: true, blending: THREE.AdditiveBlending 
            });
            const supernovaMesh = new THREE.Mesh(snGeo, snMat);
            currentStructure.add(supernovaMesh);
        } else if (dice < 0.7) {
            // 30% סיכוי לגלקסיה (Galaxy)
            const galGeo = new THREE.TorusGeometry(15, 3, 2, 100);
            const galColor = new THREE.Color().setHSL(Math.random(), 1, 0.5);
            const galMat = new THREE.MeshBasicMaterial({ 
                color: galColor, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending 
            });
            const galaxyMesh = new THREE.Mesh(galGeo, galMat);
            galaxyMesh.rotation.x = Math.PI / (Math.random()*4 + 1.5);
            currentStructure.add(galaxyMesh);
        } else {
            // 30% סיכוי לחור תולעת (Wormhole)
            const wormGeo = new THREE.TorusGeometry(20, 12, 16, 128);
            const wormColor = new THREE.Color().setHSL(Math.random(), 1, 0.7);
            const wormMat = new THREE.MeshBasicMaterial({ 
                color: wormColor, transparent: true, opacity: 0.3, wireframe: true 
            });
            const wormholeMesh = new THREE.Mesh(wormGeo, wormMat);
            currentStructure.add(wormholeMesh);
            currentStructure.rotation.y = Math.PI / 2;
        }

        scene.add(currentStructure);
    }

    function check() {
        if(parseInt(inputStr) === currentAns) {
            score++;
            targetSpeed = 25.0; // מהירות וואו מטורפת!
            document.getElementById('dist').innerText = score * 500;
            
            // הכנת המבנה הבא (הוא יהיה שונה!)
            setTimeout(() => { generateRandomCosmicPhenomenon(); }, 1200);

            setTimeout(() => { nextLevel(); }, 800);
        } else {
            targetSpeed = 0.05;
            del();
        }
    }

    function nextLevel() {
        let n1 = Math.floor(Math.random()*8)+2;
        let n2 = Math.floor(Math.random()*9)+1;
        currentAns = n1*n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        inputStr = "";
        document.getElementById('answer-display').innerText = "?";
    }

    function press(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('answer-display').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }

    function animate() {
        requestAnimationFrame(animate);
        speed += (targetSpeed - speed) * 0.05;
        if(targetSpeed > 0.25) targetSpeed -= 0.25;

        // המבנה הנוכחי והערפילית מתקרבים אלינו
        currentStructure.position.z += speed;
        currentNebula.position.z += speed;
        currentNebula.rotation.x += 0.001; // סיבוב איטי מאוד של הערפילית
        currentNebula.rotation.y += 0.001;

        if(currentStructure.position.z > 25) { // לופ אם חלפו
            currentStructure.position.z = -1800;
            currentNebula.position.z = -1800;
        }

        const pCoords = stars.geometry.attributes.position.array;
        for(let i=0; i<pCoords.length; i+=3) {
            pCoords[i+2] += speed;
            if(pCoords[i+2] > 10) pCoords[i+2] = -2500;
        }
        stars.geometry.attributes.position.needsUpdate = true;
        // מתיחת כוכבים במהירות גבוהה
        stars.scale.z = 1 + (speed * 0.4);

        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
