
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v6.0.0 Cosmic Float</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        
        #ui-layer { 
            position: absolute; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: space-between; align-items: center; 
            pointer-events: none; z-index: 1000; 
        }

        /* סורק צף מינימליסטי */
        #data-scanner { 
            margin-top: 25px; color: #fff; text-align: center;
            text-shadow: 0 0 10px #00f2ff;
        }
        #scan-title { color: #00f2ff; font-weight: bold; font-size: 1.3rem; margin: 0; letter-spacing: 1px; }
        #scan-desc { font-size: 0.8rem; margin: 2px 0 0 0; color: rgba(255,255,255,0.7); font-style: italic; }

        /* השאלה זוהרת באוויר */
        #mission-control { 
            margin-bottom: 5px; text-align: center;
        }
        #question { font-size: 3.5rem; color: #fff; margin: 0; text-shadow: 0 0 20px #fff, 0 0 40px #00f2ff; font-weight: 200; }
        #answer-display { font-size: 2.2rem; color: #ff00de; min-height: 2.5rem; font-weight: bold; text-shadow: 0 0 15px #ff00de; }

        /* מקלדת זכוכית צפה */
        #bottom-area {
            width: 100%; display: flex; justify-content: center; padding-bottom: 25px;
            pointer-events: auto;
        }
        
        #numpad { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; 
            padding: 15px; background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            transform: scale(0.85);
        }
        
        .btn { 
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); 
            color: white; font-size: 1.6rem; width: 55px; height: 55px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .btn:active { background: rgba(255, 0, 222, 0.5); transform: scale(0.8); }
        .btn-go { background: rgba(0, 255, 100, 0.2); border-color: #0f0; grid-column: span 2; width: auto; border-radius: 20px; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="data-scanner">
        <p id="scan-title">מזהה אות...</p>
        <p id="scan-desc">ניתוח ספקטרוסקופי פעיל</p>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center;">
        <div id="mission-control">
            <div id="question">6 × 7</div>
            <div id="answer-display">?</div>
        </div>

        <div id="bottom-area">
            <div id="numpad">
                <div class="btn" onclick="press(1)">1</div><div class="btn" onclick="press(2)">2</div><div class="btn" onclick="press(3)">3</div>
                <div class="btn" onclick="press(4)">4</div><div class="btn" onclick="press(5)">5</div><div class="btn" onclick="press(6)">6</div>
                <div class="btn" onclick="press(7)">7</div><div class="btn" onclick="press(8)">8</div><div class="btn" onclick="press(9)">9</div>
                <div class="btn" style="color:#ff4444" onclick="del()">X</div><div class="btn" onclick="press(0)">0</div><div class="btn btn-go" onclick="check()">קפיצה 🚀</div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, stars, universeGroup;
    let speed = 0, targetSpeed = 0.2, score = 0, currentAns = 0, inputStr = "";
    let targetZ = 0, isJumping = false;
    let rotX = 0, rotY = 0, targetRotX = 0, targetRotY = 0;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 5000);
        camera.position.z = 70;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // כוכבים רנדומליים
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<15000; i++) starPos.push((Math.random()-0.5)*4000, (Math.random()-0.5)*4000, (Math.random()-0.5)*4000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.9 }));
        scene.add(stars);

        scene.add(new THREE.AmbientLight(0x888888));
        const light = new THREE.PointLight(0xffffff, 2, 1000);
        light.position.set(50,50,50);
        scene.add(light);

        document.addEventListener('touchstart', e => { 
            if(e.target.closest('#bottom-area')) return;
            this.startX = e.touches[0].clientX; this.startY = e.touches[0].clientY; 
        });
        document.addEventListener('touchmove', e => {
            if(e.target.closest('#bottom-area')) return;
            targetRotY += (e.touches[0].clientX - this.startX) * 0.008;
            targetRotX += (e.touches[0].clientY - this.startY) * 0.008;
            this.startX = e.touches[0].clientX; this.startY = e.touches[0].clientY;
        });

        generateNewSystem();
        nextLevel();
        animate();
    }

    function generateNewSystem() {
        if(universeGroup) scene.remove(universeGroup);
        universeGroup = new THREE.Group();
        universeGroup.position.z = -1500;
        
        const type = Math.floor(Math.random() * 5);
        const hue = Math.random();
        const mainColor = new THREE.Color().setHSL(hue, 1, 0.5);
        let colorName = hue * 360 < 50 ? "הלהבה" : hue * 360 < 150 ? "הברקת" : hue * 360 < 270 ? "הספיר" : "המגנטה";

        const title = document.getElementById('scan-title');
        const desc = document.getElementById('scan-desc');

        if(type === 0) {
            title.innerText = `מערכת שמש ${colorName}`;
            desc.innerText = "שמש מרכזית יציבה עם כוכב לכת במסלול.";
            universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(15,32,32), new THREE.MeshBasicMaterial({color: mainColor})));
            const p = new THREE.Mesh(new THREE.SphereGeometry(4,32,32), new THREE.MeshStandardMaterial({color: 0x666666}));
            p.position.x = 40; const piv = new THREE.Group(); piv.add(p); universeGroup.add(piv);
        } else if(type === 1) {
            title.innerText = `חור שחור ${colorName}`;
            desc.innerText = "זהירות: עיקום אור קיצוני מזוהה במרכז.";
            universeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(15,32,32), new THREE.MeshBasicMaterial({color: 0x000000})));
            const disk = new THREE.Mesh(new THREE.TorusGeometry(28,2,2,100), new THREE.MeshBasicMaterial({color: mainColor, transparent:true, opacity:0.8}));
            disk.rotation.x = 1.5; universeGroup.add(disk);
            universeGroup.userData.disk = disk;
        } else if(type === 2) {
            title.innerText = `ערפילית ${colorName}`;
            desc.innerText = "ענן פלזמה בין-כוכבי המכיל יסודות נדירים.";
            universeGroup.add(new THREE.Mesh(new THREE.IcosahedronGeometry(25,1), new THREE.MeshBasicMaterial({color: mainColor, wireframe:true, transparent:true, opacity:0.6})));
        } else if(type === 3) {
            title.innerText = `גלקסיית ${colorName}`;
            desc.innerText = "מיליארדי כוכבים מסתחררים סביב ליבה בוערת.";
            const pts = []; for(let i=0;i<4000;i++){ let r=Math.random()*60; let a=r*0.5; pts.push(Math.cos(a)*r,(Math.random()-0.5)*5,Math.sin(a)*r); }
            const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
            universeGroup.add(new THREE.Points(g, new THREE.PointsMaterial({color:mainColor, size:0.8})));
        } else {
            title.innerText = `חור תולעת ${colorName}`;
            desc.innerText = "מעבר ממדי לא ידוע. יציבות: 88%.";
            const wh = new THREE.Mesh(new THREE.TorusGeometry(25,12,16,100), new THREE.MeshBasicMaterial({color: mainColor, wireframe:true, transparent:true, opacity:0.5}));
            universeGroup.add(wh); universeGroup.rotation.y = 1.5;
        }

        scene.add(universeGroup);
        isJumping = true; targetZ = 0;
    }

    function check() {
        if(parseInt(inputStr) === currentAns) {
            score++;
            targetZ = 1200; isJumping = true;
            setTimeout(() => {
                generateNewSystem();
                targetRotX = 0; targetRotY = 0;
                nextLevel();
            }, 1800);
        } else { del(); }
    }

    function nextLevel() {
        let n1 = Math.floor(Math.random()*8)+2, n2 = Math.floor(Math.random()*9)+1;
        currentAns = n1*n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        inputStr = ""; document.getElementById('answer-display').innerText = "?";
    }

    function press(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('answer-display').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }

    function animate() {
        requestAnimationFrame(animate);
        if(isJumping) {
            universeGroup.position.z += (targetZ - universeGroup.position.z) * 0.05;
            speed = 30;
            if(Math.abs(universeGroup.position.z - targetZ) < 1) { isJumping = false; speed = 0.2; }
        }
        rotX += (targetRotX - rotX) * 0.1; rotY += (targetRotY - rotY) * 0.1;
        universeGroup.rotation.x = rotX; universeGroup.rotation.y = rotY;
        
        const p = stars.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { p[i+2]+=speed; if(p[i+2]>70) p[i+2]=-2500; }
        stars.geometry.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
