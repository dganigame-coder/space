<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v4.2.0 Explorer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #ui { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; pointer-events: none; z-index: 100; }
        #top-bar { width: 95%; display: flex; justify-content: space-between; padding: 10px; color: #00f2ff; font-weight: bold; font-size: 1rem; text-shadow: 0 0 10px #00f2ff; }
        #discovery-alert { margin-top: 40px; color: #ffeb3b; font-size: 1.8rem; font-weight: bold; text-shadow: 0 0 20px #ffeb3b; opacity: 0; transition: 0.8s; text-align: center; }
        #main-panel { display: flex; flex-direction: column; align-items: center; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; margin-bottom: 15px; transform: scale(0.85); transform-origin: bottom; }
        .hide-ui { transform: scale(0.85) translateY(140%) !important; }
        #mission-control { background: rgba(0, 10, 30, 0.7); padding: 10px 30px; border-radius: 30px; border: 1px solid #00f2ff; backdrop-filter: blur(10px); pointer-events: auto; margin-bottom: 8px; }
        #question { font-size: 2.5rem; color: #fff; margin: 0; text-align: center; }
        #answer-display { font-size: 1.8rem; color: #ff00de; text-align: center; min-height: 2.2rem; }
        #numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; width: 220px; pointer-events: auto; background: rgba(0, 0, 0, 0.8); border: 2px solid #ff00de; border-radius: 25px; }
        .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(0, 242, 255, 0.4); color: white; font-size: 1.3rem; padding: 12px; border-radius: 12px; text-align: center; cursor: pointer; }
        .btn:active { background: #ff00de; }
        .btn-go { background: linear-gradient(45deg, #0f0, #008000); grid-column: span 2; font-weight: bold; }
        #version-tag { position: absolute; bottom: 5px; left: 10px; color: rgba(0, 242, 255, 0.3); font-size: 0.65rem; }
    </style>
</head>
<body>

<div id="ui">
    <div id="top-bar">
        <div>🚀 <span id="dist">0</span> שנות אור</div>
        <div>🏆 <span id="rank">מגלת עולמות</span></div>
    </div>
    <div id="discovery-alert">מזהה מערכת חדשה...</div>
    <div id="main-panel">
        <div id="mission-control"><div id="question">טוען...</div><div id="answer-display">?</div></div>
        <div id="numpad">
            <div class="btn" onclick="press(1)">1</div><div class="btn" onclick="press(2)">2</div><div class="btn" onclick="press(3)">3</div>
            <div class="btn" onclick="press(4)">4</div><div class="btn" onclick="press(5)">5</div><div class="btn" onclick="press(6)">6</div>
            <div class="btn" onclick="press(7)">7</div><div class="btn" onclick="press(8)">8</div><div class="btn" onclick="press(9)">9</div>
            <div class="btn" style="color:#ff4444" onclick="del()">X</div><div class="btn" onclick="press(0)">0</div><div class="btn btn-go" onclick="check()">קפיצה! 🌌</div>
        </div>
    </div>
    <div id="version-tag">SYSTEM v4.2.0 - TOUCH & SOLAR SYSTEMS ACTIVE</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, stars, currentStructure, moon;
    let speed = 0.1, targetSpeed = 0.1, score = 0, currentAns = 0, inputStr = "";
    let mouseX = 0, mouseY = 0;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 5000);
        camera.position.z = 15;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // יצירת אלפי כוכבים
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<15000; i++) starPos.push((Math.random()-0.5)*4000, (Math.random()-0.5)*4000, (Math.random()-0.5)*4000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.1 }));
        scene.add(stars);

        const light = new THREE.PointLight(0xffffff, 3, 1000);
        camera.add(light); scene.add(camera);
        scene.add(new THREE.AmbientLight(0x333333));

        // --- פונקציות מגע ותנועה ---
        document.addEventListener('touchstart', (e) => {
            mouseX = (e.touches[0].clientX - window.innerWidth / 2) / 100;
            mouseY = (e.touches[0].clientY - window.innerHeight / 2) / 100;
        }, {passive: false});

        document.addEventListener('touchmove', (e) => {
            mouseX = (e.touches[0].clientX - window.innerWidth / 2) / 100;
            mouseY = (e.touches[0].clientY - window.innerHeight / 2) / 100;
        }, {passive: false});

        genStructure();
        nextLevel();
        animate();
    }

    function genStructure() {
        if(currentStructure) scene.remove(currentStructure);
        currentStructure = new THREE.Group();
        currentStructure.position.set(0, 0, -1500); // מתחיל רחוק
        
        const dice = Math.random();
        const alert = document.getElementById('discovery-alert');
        alert.style.opacity = "1";

        if(dice < 0.5) {
            // מערכת שמש: כוכב לכת + ירח
            alert.innerText = "מערכת שמש חדשה! 🪐";
            const col = new THREE.Color().setHSL(Math.random(), 0.8, 0.5);
            const planet = new THREE.Mesh(new THREE.SphereGeometry(5,64,64), new THREE.MeshStandardMaterial({color:col, emissive:col, emissiveIntensity:0.2}));
            currentStructure.add(planet);

            const mCol = new THREE.Color(0x888888);
            moon = new THREE.Mesh(new THREE.SphereGeometry(1.2,32,32), new THREE.MeshStandardMaterial({color:mCol}));
            moon.position.set(10, 0, 0);
            currentStructure.add(moon);
        } else if(dice < 0.8) {
            // חור שחור עם טבעת מסתובבת
            alert.innerText = "חור שחור ענקי! 🌑";
            const bh = new THREE.Mesh(new THREE.SphereGeometry(6,32,32), new THREE.MeshBasicMaterial({color:0x000000}));
            const r = new THREE.Mesh(new THREE.TorusGeometry(10, 0.8, 2, 100), new THREE.MeshBasicMaterial({color:0xff3300, transparent:true, opacity:0.8}));
            r.rotation.x = 1.6;
            currentStructure.add(bh); currentStructure.add(r);
            currentStructure.userData = {r};
        } else {
            // חור תולעת מרהיב
            alert.innerText = "חור תולעת זוהר! 🌀";
            const wh = new THREE.Mesh(new THREE.TorusGeometry(8, 5, 16, 100), new THREE.MeshBasicMaterial({color:0x00f2ff, wireframe:true, transparent:true, opacity:0.5}));
            currentStructure.add(wh);
            currentStructure.userData = {wh};
        }
        
        scene.add(currentStructure);
        setTimeout(()=> alert.style.opacity="0", 3000);
    }

    function check() {
        if(parseInt(inputStr) === currentAns) {
            score++; targetSpeed = 40;
            document.getElementById('dist').innerText = score * 500;
            document.getElementById('main-panel').classList.add('hide-ui');
            setTimeout(genStructure, 1000);
            setTimeout(()=> { document.getElementById('main-panel').classList.remove('hide-ui'); nextLevel(); }, 4000);
        } else { del(); }
    }

    function nextLevel() {
        let n1 = Math.floor(Math.random()*8)+2, n2 = Math.floor(Math.random()*9)+1;
        currentAns = n1*n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        inputStr = ""; document.getElementById('answer-display').innerText = "?";
    }

    function press(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('answer-display').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }

    function animate() {
        requestAnimationFrame(animate);
        speed += (targetSpeed - speed) * 0.05;
        if(targetSpeed > 0.2) targetSpeed -= 0.35;

        // שליטה במצלמה עם האצבע
        camera.position.x += (mouseX - camera.position.x) * 0.05;
        camera.position.y += (-mouseY - camera.position.y) * 0.05;
        camera.lookAt(scene.position);

        currentStructure.position.z += speed;
        
        // אנימציה פנימית למבנים
        if(moon) {
            const time = Date.now() * 0.002;
            moon.position.x = Math.cos(time) * 12;
            moon.position.z = Math.sin(time) * 12;
        }
        if(currentStructure.userData.r) currentStructure.userData.r.rotation.z += 0.05;
        if(currentStructure.userData.wh) currentStructure.userData.wh.rotation.z += 0.03;

        if(currentStructure.position.z > 100) currentStructure.position.z = -1500;

        const p = stars.geometry.attributes.position.array;
        for(let i=0; i<p.length; i+=3) { p[i+2]+=speed; if(p[i+2]>20) p[i+2]=-2500; }
        stars.geometry.attributes.position.needsUpdate = true;
        
        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
