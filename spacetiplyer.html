<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מסע הכפל: v4.0.0 - האינסוף</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        
        #ui { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; pointer-events: none; z-index: 100; }
        
        #top-bar { width: 95%; display: flex; justify-content: space-between; padding: 10px; color: #00f2ff; font-weight: bold; font-size: 1.1rem; text-shadow: 0 0 10px #00f2ff; }
        
        #discovery-alert { 
            margin-top: 60px; color: #ffeb3b; font-size: 2.8rem; font-weight: bold; 
            text-shadow: 0 0 25px #ffeb3b; opacity: 0; transition: 0.8s; text-align: center;
        }

        #main-panel { 
            display: flex; flex-direction: column; align-items: center; 
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
            pointer-events: none; margin-bottom: 20px;
        }
        .hide-ui { transform: translateY(120%); }

        #mission-control { 
            background: rgba(0, 10, 30, 0.6); padding: 15px 40px; border-radius: 50px; 
            border: 2px solid #00f2ff; backdrop-filter: blur(15px); pointer-events: auto; margin-bottom: 10px;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
        }
        #question { font-size: 3.5rem; color: #fff; margin: 0; text-align: center; text-shadow: 0 0 20px #fff; }
        #answer-display { font-size: 2.5rem; color: #ff00de; text-align: center; min-height: 3rem; text-shadow: 0 0 15px #ff00de; }

        #numpad { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; 
            padding: 15px; width: 85%; max-width: 250px; pointer-events: auto;
            background: rgba(0, 0, 0, 0.7); border: 2px solid #ff00de; border-radius: 30px; margin-bottom: 20px;
            box-shadow: 0 0 40px rgba(255, 0, 222, 0.3);
        }
        
        .btn { 
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(0, 242, 255, 0.3); 
            color: white; font-size: 1.5rem; padding: 15px; border-radius: 15px;
            text-align: center; cursor: pointer; transition: 0.2s;
        }
        .btn:active { background: #ff00de; transform: scale(0.9); }
        .btn-go { background: linear-gradient(45deg, #0f0, #008000); grid-column: span 2; font-weight: bold; text-shadow: 0 0 5px #fff; }

        #version-tag { position: absolute; bottom: 5px; left: 10px; color: rgba(0, 242, 255, 0.4); font-size: 0.7rem; }
    </style>
</head>
<body>

<div id="ui">
    <div id="top-bar">
        <div>🚀 <span id="dist">0</span> שנות אור</div>
        <div>🏆 <span id="rank">מפקדת אומץ</span></div>
    </div>

    <div id="discovery-alert">מזהה מבנה קוסמי מוזר...</div>

    <div id="main-panel">
        <div id="mission-control">
            <div id="question"> טוען... </div>
            <div id="answer-display">?</div>
        </div>
        <div id="numpad">
            <div class="btn" onclick="press(1)">1</div><div class="btn" onclick="press(2)">2</div><div class="btn" onclick="press(3)">3</div>
            <div class="btn" onclick="press(4)">4</div><div class="btn" onclick="press(5)">5</div><div class="btn" onclick="press(6)">6</div>
            <div class="btn" onclick="press(7)">7</div><div class="btn" onclick="press(8)">8</div><div class="btn" onclick="press(9)">9</div>
            <div class="btn" style="color:#ff4444" onclick="del()">X</div><div class="btn" onclick="press(0)">0</div><div class="btn btn-go" onclick="check()">קפוץ לחלל! 🌌</div>
        </div>
    </div>
    
    <div id="version-tag">SYSTEM v4.0.0 - PROXIMITY GENERATOR ACTIVE</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, stars, currentStructure, wormhole, ring;
    let speed = 0.1, targetSpeed = 0.1, score = 0, currentAns = 0, inputStr = "";
    let targetRotationX = 0, targetRotationY = 0;
    let currentType = '';

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 5000);
        camera.position.z = 10;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // כוכבים
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<15000; i++) starPos.push((Math.random()-0.5)*4000, (Math.random()-0.5)*4000, (Math.random()-0.5)*4000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.2 }));
        scene.add(stars);

        // תאורה PBR פוטוריאליסטית הצמודה למצלמה (פנס החללית)
        const shipLight = new THREE.PointLight(0xffffff, 3, 1000);
        camera.add(shipLight); 
        scene.add(camera);
        scene.add(new THREE.AmbientLight(0x222222)); // אור סביבתי עדין

        generateRandomSpaceStructure(); // יוצר את המבנה הראשון

        window.addEventListener('mousemove', e => { targetRotationY = (e.clientX - window.innerWidth/2) * 0.001; targetRotationX = (e.clientY - window.innerHeight/2) * 0.001; });
        window.addEventListener('touchmove', e => { targetRotationY = (e.touches[0].clientX - window.innerWidth/2) * 0.002; targetRotationX = (e.touches[0].clientY - window.innerHeight/2) * 0.002; });

        nextLevel();
        animate();
    }

    // פונקציית הקסם: יוצרת מבנה חלל אקראי לחלוטין (כוכב, חור שחור, או חור תולעת)
    function generateRandomSpaceStructure() {
        // ניקוי המבנה הקודם
        if(currentStructure) scene.remove(currentStructure);
        
        // הגרלת סוג המבנה
        const dice = Math.random();
        const size = 5 + Math.random() * 5;
        currentStructure = new THREE.Group(); // קבוצה שתכיל את כל חלקי המבנה
        currentStructure.position.set((Math.random()-0.5)*40, (Math.random()-0.5)*20, -1800); // מתחיל רחוק מאוד

        const alert = document.getElementById('discovery-alert');
        alert.style.opacity = "1";

        if (dice < 0.4) {
            // 40% סיכוי לכוכב לכת אקראי
            currentType = 'planet';
            alert.innerText = "זיהוי: כוכב לכת לא מוכר! 🪐";
            
            const randomColor = new THREE.Color().setHSL(Math.random(), 0.8, 0.6);
            const pGeo = new THREE.SphereGeometry(size, 64, 64);
            const pMat = new THREE.MeshStandardMaterial({ color: randomColor, emissive: randomColor, emissiveIntensity: 0.2 });
            const planet = new THREE.Mesh(pGeo, pMat);
            currentStructure.add(planet);

            if(Math.random() > 0.5) { // 50% סיכוי לטבעת
                const rGeo = new THREE.TorusGeometry(size * 1.8, 0.2, 2, 100);
                const rMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 });
                const ringMesh = new THREE.Mesh(rGeo, rMat);
                ringMesh.rotation.x = Math.PI / (Math.random()*4 + 1.5);
                currentStructure.add(ringMesh);
            }
        } else if (dice < 0.7) {
            // 30% סיכוי לחור שחור
            currentType = 'black_hole';
            alert.innerText = "זהירות: חור שחור לפנינו! 🌑";
            
            // הגרלת צבע לטבעת האש (הטבעת יכולה להיות כתומה, סגולה, או אדומה)
            const ringColor = new THREE.Color().setHSL(Math.random(), 1, 0.5);
            
            const bhGeo = new THREE.SphereGeometry(size, 32, 32);
            const bhMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const blackHoleMesh = new THREE.Mesh(bhGeo, bhMat);
            currentStructure.add(blackHoleMesh);

            const ringGeo = new THREE.TorusGeometry(size * 1.6, 0.6, 2, 128);
            const ringMat = new THREE.MeshBasicMaterial({ color: ringColor, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            const accretionDisk = new THREE.Mesh(ringGeo, ringMat);
            accretionDisk.rotation.x = 1.5;
            currentStructure.add(accretionDisk);
            
            // תנועה אקראית של טבעת האש
            currentStructure.userData = { ring: accretionDisk, spin: Math.random() > 0.5 ? 0.05 : -0.05 };
        } else {
            // 30% סיכוי לחור תולעת
            currentType = 'wormhole';
            alert.innerText = "מתקרבים לחור תולעת! 🌀🌌";
            
            // הגרלת צבע למנהרת חור התולעת
            const wormholeColor = new THREE.Color().setHSL(Math.random(), 1, 0.7);

            const rGeo = new THREE.TorusGeometry(size * 1.5, size * 0.8, 16, 128);
            const rMat = new THREE.MeshBasicMaterial({ color: wormholeColor, transparent: true, opacity: 0.3, wireframe: true });
            wormhole = new THREE.Mesh(rGeo, rMat);
            currentStructure.add(wormhole);
            currentStructure.rotation.y = 1.5;
        }

        scene.add(currentStructure);
        setTimeout(() => alert.style.opacity = "0", 3000);
    }

    function check() {
        if(parseInt(inputStr) === currentAns) {
            score++;
            targetSpeed = 40.0; // מהירות Hyper-drive!
            document.getElementById('dist').innerText = score * 500;
            
            const panel = document.getElementById('main-panel');
            panel.classList.add('hide-ui');

            // הכנת המבנה הבא (הוא יהיה שונה!)
            setTimeout(() => { generateRandomSpaceStructure(); }, 1200);

            setTimeout(() => { panel.classList.remove('hide-ui'); nextLevel(); }, 4000);
        } else {
            targetSpeed = 0.05;
            del();
        }
    }

    function nextLevel() {
        let n1 = Math.floor(Math.random()*8)+2;
        let n2 = Math.floor(Math.random()*9)+1;
        currentAns = n1*n2;
        document.getElementById('question').innerText = `${n1} × ${n2}`;
        inputStr = "";
        document.getElementById('answer-display').innerText = "?";
    }

    function press(n) { if(inputStr.length < 3) { inputStr += n; document.getElementById('answer-display').innerText = inputStr; } }
    function del() { inputStr = ""; document.getElementById('answer-display').innerText = "?"; }

    function animate() {
        requestAnimationFrame(animate);
        speed += (targetSpeed - speed) * 0.04;
        if(targetSpeed > 0.2) targetSpeed -= 0.3;

        camera.rotation.y += ( -targetRotationY - camera.rotation.y ) * 0.05;
        camera.rotation.x += ( -targetRotationX - camera.rotation.x ) * 0.05;

        currentStructure.position.z += speed;
        
        // אנימציות אקראיות לכל סוג מבנה
        if(currentType === 'planet') {
            currentStructure.rotation.y += 0.005; // סיבוב איטי של כוכב הלכת
        } else if(currentType === 'black_hole') {
            currentStructure.userData.ring.rotation.z += currentStructure.userData.spin; // סיבוב מהיר של טבעת האש
            if(currentStructure.position.z > -100 && speed > 5) camera.position.set((Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, 10 + (Math.random()-0.5)*0.5); // רעידת מצלמה כשמתקרבים לחור שחור במהירות
            else camera.position.set(0,0,10);
        } else if(currentType === 'wormhole') {
            wormhole.rotation.z += 0.02; // סיבוב המנהרה
            currentStructure.rotation.x += 0.001; // סיבוב המבנה כולו
        }

        if(currentStructure.position.z > 50) currentStructure.position.z = -1800; // לופ אם חלפו

        // כוכבים נמתחים במהירות
        const pCoords = stars.geometry.attributes.position.array;
        for(let i=0; i<pCoords.length; i+=3) {
            pCoords[i+2] += speed;
            if(pCoords[i+2] > 20) pCoords[i+2] = -2500;
        }
        stars.geometry.attributes.position.needsUpdate = true;
        stars.scale.z = 1 + (speed * 0.5);

        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
