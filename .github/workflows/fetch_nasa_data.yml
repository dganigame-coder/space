name: Fetch NASA Quasar Data

on:
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab
  schedule:
    - cron: '0 0 * * 0' # Optional: runs automatically every Sunday

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install astroquery astropy requests

      - name: Run data fetch script
        run: python scripts/fetch_quasar.py
