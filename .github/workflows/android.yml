name: Deploy and Build

on:
  push:
    branches:
      - main

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          # Finds the directory containing package.json and cd into it
          cd "$(dirname "$(find . -name "package.json" | head -n 1)")"
          npm install

      - name: Build
        run: |
          cd "$(dirname "$(find . -name "package.json" | head -n 1)")"
          npm run build || echo "No build step"

      - name: Deploy to Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

  build-android:
    needs: deploy-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install and Sync
        run: |
          # Find project folder and perform setup
          PROJECT_DIR="$(dirname "$(find . -name "package.json" | head -n 1)")"
          cd "$PROJECT_DIR"
          npm install
          npx cap sync android

      - name: Build APK
        run: |
          # This assumes the android folder is inside your project folder
          PROJECT_DIR="$(dirname "$(find . -name "package.json" | head -n 1)")"
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename and Upload APK
        run: |
          # Find the APK wherever it was built
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          mkdir -p final_output
          mv "$APK_PATH" final_output/navisoft.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: navisoft-package
          path: final_output/navisoft.apk
