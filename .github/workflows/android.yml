name: Deploy and Build

on:
  push:
    branches:
      - main

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build || echo "No build step"

      - name: Deploy to Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

  build-android:
    needs: deploy-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          echo "--- DEBUG: Locating APK ---"
          find . -name "app-debug.apk"

      - name: Rename and Prepare APK
        run: |
          # Find the path dynamically
          APK_PATH=$(find android -name "app-debug.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          # Create a clean folder for the output
          mkdir -p final_output
          # Move and rename
          mv "$APK_PATH" final_output/navisoft.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: navisoft-package
          path: final_output/navisoft.apk
