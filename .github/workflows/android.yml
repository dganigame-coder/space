name: Deploy and Build

on:
  push:
    branches:
      - main

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    # This block forces the runner to look inside the 'space' folder
    defaults:
      run:
        working-directory: ./space 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build || echo "No build step"

      - name: Deploy to Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

  build-android:
    needs: deploy-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./space
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename and Prepare APK
        run: |
          # Finds the file in the android folder
          APK_PATH=$(find android -name "app-debug.apk" | head -n 1)
          mkdir -p final_output
          mv "$APK_PATH" final_output/navisoft.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: navisoft-package
          path: space/final_output/navisoft.apk
