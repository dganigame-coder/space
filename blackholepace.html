<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360° Relativistic Black Hole Simulator</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #instructions {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(5, 5, 10, 0.6); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
            padding: 8px 16px; color: #94a3b8; font-size: 0.8rem; pointer-events: none;
            font-family: sans-serif; letter-spacing: 1px; text-transform: uppercase;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="instructions">Drag to orbit 360°</div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        camera.position.set(0, 1.5, 4.5);

        // --- NEW: Add Interactive 360-degree Controls ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 10;
        controls.minDistance = 2;

        // Starfield
        const starGeo = new THREE.BufferGeometry();
        const starCount = 400;
        const starPos = new Float32Array(starCount * 3);
        for(let i=0; i<starCount*3; i+=3) {
            const r = 25 + Math.random() * 15;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            starPos[i] = r * Math.sin(phi) * Math.cos(theta);
            starPos[i+1] = r * Math.sin(phi) * Math.sin(theta);
            starPos[i+2] = r * Math.cos(phi);
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: 0.8 });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // Event Horizon Core Shadow
        const shadowGeo = new THREE.SphereGeometry(0.65, 32, 32);
        const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
        scene.add(shadowMesh);

        const diskUniforms = {
            u_time: { value: 0 },
            u_camPos: { value: new THREE.Vector3() }
        };

        const vertexShader = `
            uniform vec3 u_camPos;
            varying vec3 vPos;
            varying float vDoppler;

            void main() {
                vec3 p = position;
                float r = length(p.xz);
                
                // Dynamic Vertex Warping relative to current camera position
                vec3 toCam = normalize(u_camPos - p);
                
                // Real-time Einstein Lensing estimation: pull back-facing geometry toward the viewer
                float viewDot = dot(normalize(p), toCam);
                if (viewDot < 0.1) {
                    float warpFactor = pow(0.65 / r, 2.0) * 0.85;
                    p += toCam * warpFactor * 0.5;
                }

                vPos = p;
                vDoppler = 1.0 - (p.x / r) * 0.45;

                gl_Position = projectionMatrix + modelViewMatrix * vec4(p, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float u_time;
            varying vec3 vPos;
            varying float vDoppler;

            float mobileNoise(vec2 p) {
                return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
            }

            void main() {
                float r = length(vPos.xz);
                float phi = atan(vPos.z, vPos.x);

                float n = mobileNoise(vec2(r * 4.0 - u_time * 2.5, phi * 3.0));
                float edgeFade = smoothstep(0.65, 1.1, r) * smoothstep(3.2, 2.0, r);
                
                float finalDensity = (0.35 + n * 0.65) * edgeFade * vDoppler;

                if (finalDensity < 0.02) discard;

                vec3 color = vec3(1.0, 0.48, 0.12) * finalDensity * 2.5;
                color += vec3(0.25, 0.45, 1.0) * pow(smoothstep(2.8, 0.65, r), 3.0) * finalDensity;

                gl_FragColor = vec4(color, finalDensity);
            }
        `;

        const diskGeo = new THREE.RingGeometry(0.7, 3.4, 64, 16);
        diskGeo.rotateX(-Math.PI / 2); 

        const diskMat = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: diskUniforms,
            transparent: true,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
        });

        const diskMesh = new THREE.Mesh(diskGeo, diskMat);
        scene.add(diskMesh);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            
            diskUniforms.u_time.value = clock.getElapsedTime();
            diskUniforms.u_camPos.value.copy(camera.position);

            // Update user input tracking
            controls.update();
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
