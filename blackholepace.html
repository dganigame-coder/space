<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate 360° Singularity Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020205; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; z-index: 1; }
        
        /* The UI Panel Dashboard Configuration Layout */
        #dashboard {
            position: absolute; top: 16px; left: 16px; z-index: 10;
            background: rgba(6, 6, 14, 0.85); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px;
            padding: 20px; width: 290px; color: #f1f5f9;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }
        h1 { font-size: 0.95rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; color: #3b82f6; }
        .subtitle { font-size: 0.65rem; color: #64748b; text-transform: uppercase; margin-bottom: 16px; letter-spacing: 1px; }
        .control-row { margin-bottom: 14px; }
        label { display: flex; justify-content: space-between; font-size: 0.75rem; color: #cbd5e1; margin-bottom: 4px; }
        .val-disp { font-family: monospace; color: #34d399; font-weight: bold; }
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #2563eb; cursor: pointer; }
        
        .btn-action {
            width: 100%; background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.4);
            color: #60a5fa; padding: 8px; border-radius: 8px; font-size: 0.75rem; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; transition: all 0.2s;
        }
        .btn-action:active { background: rgba(59, 130, 246, 0.4); color: #fff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="dashboard">
        <h1>Singularity Core</h1>
        <div class="subtitle">Relativistic System Config</div>

        <div class="control-row">
            <label>Singularity Mass <span id="mass-lbl" class="val-disp">4.0M ☉</span></label>
            <input type="range" id="mass-mod" min="2.0" max="7.0" step="0.1" value="4.0">
        </div>

        <div class="control-row">
            <label>Accretion Density <span id="density-lbl" class="val-disp">1.0x</span></label>
            <input type="range" id="density-mod" min="0.2" max="2.0" step="0.1" value="1.0">
        </div>

        <button class="btn-action" id="reset-cam">Reset View Position</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Core Configuration States
        let config = { mass: 0.65, density: 1.0 };

        function initCamera() {
            camera.position.set(0, 1.8, 4.8);
        }
        initCamera();

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.maxDistance = 15;
        controls.minDistance = 2.0;

        document.getElementById('reset-cam').addEventListener('click', () => {
            initCamera();
            controls.target.set(0, 0, 0);
            controls.update();
        });

        document.getElementById('mass-mod').addEventListener('input', (e) => {
            let v = parseFloat(e.target.value);
            config.mass = v * 0.1625; // Re-scale base radius calculation
            shadowMesh.scale.setScalar(v * 0.154);
            document.getElementById('mass-lbl').innerText = v.toFixed(1) + 'M ☉';
        });

        document.getElementById('density-mod').addEventListener('input', (e) => {
            config.density = parseFloat(e.target.value);
            document.getElementById('density-lbl').innerText = config.density.toFixed(1) + 'x';
        });

        // Background Star Matrix
        const starGeo = new THREE.BufferGeometry();
        const starCount = 400;
        const starPos = new Float32Array(starCount * 3);
        for(let i=0; i<starCount*3; i+=3) {
            const r = 25 + Math.random() * 15;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            starPos[i] = r * Math.sin(phi) * Math.cos(theta);
            starPos[i+1] = r * Math.sin(phi) * Math.sin(theta);
            starPos[i+2] = r * Math.cos(phi);
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: 0.8 })));

        // Core Shadow Mesh Sphere
        const shadowMesh = new THREE.Mesh(
            new THREE.SphereGeometry(1, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0x000000 })
        );
        shadowMesh.scale.setScalar(4.0 * 0.154);
        scene.add(shadowMesh);

        // Volumetric Particle Matrix Allocation
        const pCount = 10000;
        const diskGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(pCount * 3);
        const randoms = new Float32Array(pCount);

        for (let i = 0; i < pCount; i++) {
            const r = 0.9 + Math.pow(Math.random(), 2.5) * 3.5; 
            const theta = Math.random() * Math.PI * 2;
            positions[i * 3] = Math.cos(theta) * r;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 0.1 * (r * 0.4);
            positions[i * 3 + 2] = Math.sin(theta) * r;
            randoms[i] = Math.random();
        }
        diskGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        diskGeo.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

        const uniforms = {
            u_time: { value: 0 },
            u_camPos: { value: new THREE.Vector3() },
            u_mass: { value: 0.65 },
            u_density: { value: 1.0 }
        };

        const diskMat = new THREE.ShaderMaterial({
            vertexShader: `
                uniform float u_time;
                uniform vec3 u_camPos;
                uniform float u_mass;
                attribute float aRandom;
                varying vec3 vPos;
                varying float vDoppler;

                void main() {
                    vec3 p = position;
                    float r = length(p.xz);
                    float speed = sqrt(1.0 / (r * r * r)) * 1.2;
                    float angle = u_time * speed + (aRandom * 6.28);
                    p.x = cos(angle) * r;
                    p.z = sin(angle) * r;

                    vec3 toCam = normalize(u_camPos - p);
                    if (dot(normalize(p), toCam) < 0.2) {
                        p += vec3(0.0, 1.0, 0.0) * toCam.y * (pow(u_mass / r, 2.0) * 0.65) * (1.0 - abs(toCam.y));
                    }

                    vPos = p;
                    vDoppler = 1.0 + dot(normalize(vec3(-p.z, 0.0, p.x)), toCam) * 0.55;
                    vec4 mvPos = modelViewMatrix * vec4(p, 1.0);
                    gl_PointSize = (18.0 / -mvPos.z) * (0.6 + aRandom * 0.8);
                    gl_Position = projectionMatrix * mvPos;
                }
            `,
            fragmentShader: `
                uniform float u_density;
                varying vec3 vPos;
                varying float vDoppler;
                void main() {
                    vec2 c = gl_PointCoord - vec2(0.5);
                    if (length(c) > 0.5) discard;
                    float r = length(vPos.xz);
                    float alpha = smoothstep(0.5, 0.0, length(c)) * smoothstep(0.8, 1.3, r) * smoothstep(4.5, 2.5, r) * vDoppler * 0.6 * u_density;
                    if (alpha < 0.01) discard;
                    gl_FragColor = vec4((vec3(1.0, 0.45, 0.1) + vec3(0.3, 0.6, 1.0) * pow(smoothstep(3.0, 0.8, r), 2.5)) * vDoppler, alpha);
                }
            `,
            uniforms: uniforms,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        scene.add(new THREE.Points(diskGeo, diskMat));

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            uniforms.u_time.value = clock.getElapsedTime();
            uniforms.u_camPos.value.copy(camera.position);
            uniforms.u_mass.value = config.mass;
            uniforms.u_density.value = config.density;
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
