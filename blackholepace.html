<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Realistic Volumetric Black Hole Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; background: #000; }
        #overlay {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(5, 5, 10, 0.85); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px;
            padding: 20px; width: 300px; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            color: #e2e8f0; pointer-events: auto;
        }
        h1 { font-size: 1rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; color: #93c5fd; }
        .slider-box { margin-bottom: 15px; }
        label { display: flex; justify-content: space-between; font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; }
        input[type="range"] { width: 100%; -webkit-appearance: none; background: rgba(255,255,255,0.1); height: 4px; border-radius: 2px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #3b82f6; cursor: pointer; }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="overlay">
        <h1>Singularity Core</h1>
        <div class="slider-box">
            <label>Observer Pitch Angle <span id="pitch-val">12°</span></label>
            <input type="range" id="pitch-slider" min="2" max="45" step="1" value="12">
        </div>
        <div class="slider-box">
            <label>Accretion Density <span id="density-val">High</span></label>
            <input type="range" id="density-slider" min="1" max="3" step="1" value="2">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth / 2; // Render at lower res for pixel-computation performance
        let height = canvas.height = window.innerHeight / 2;
        let imgData = ctx.createImageData(width, height);

        let options = {
            pitch: 12 * Math.PI / 180,
            density: 2,
            time: 0
        };

        document.getElementById('pitch-slider').addEventListener('input', (e) => {
            options.pitch = parseInt(e.target.value) * Math.PI / 180;
            document.getElementById('pitch-val').innerText = e.target.value + '°';
        });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth / 2;
            height = canvas.height = window.innerHeight / 2;
            imgData = ctx.createImageData(width, height);
        });

        // Pseudo-noise function to generate plasma/gas textures dynamically
        function noise(x, y, z) {
            let X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
            x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
            let u = x * x * (3 - 2 * x), v = y * y * (3 - 2 * y);
            let n = X + Y * 57 + Z * 113;
            return Math.sin(n + u + v + z * 0.3) * 0.5 + 0.5;
        }

        function render() {
            let data = imgData.data;
            let cx = width / 2;
            let cy = height / 2;
            let t = options.time;

            let rs = 28; // Schwarzschild radius in pixel space
            let cosP = Math.cos(options.pitch);
            let sinP = Math.sin(options.pitch);

            for (let y = 0; y < height; y++) {
                let dy = y - cy;
                for (let x = 0; x < width; x++) {
                    let dx = x - cx;
                    
                    // Core ray position calculations
                    let rIdx = (y * width + x) * 4;
                    let r_raw = Math.sqrt(dx * dx + dy * dy);

                    if (r_raw < rs) {
                        // Complete gravitational collapse inside Event Horizon
                        data[rIdx] = 0; data[rIdx+1] = 0; data[rIdx+2] = 0; data[rIdx+3] = 255;
                        continue;
                    }

                    // Einstein Relativistic Ray-Deflection Mechanics
                    // Bends straight 2D screen coordinates into a pseudo-3D warped spacetime manifold
                    let deflection = (rs * rs * rs) / (r_raw * 0.85);
                    let warpedR = r_raw - deflection;

                    // Calculate spatial position on the inclined accretion disk plane
                    let angle = Math.atan2(dy, dx);
                    let diskX = Math.cos(angle) * warpedR;
                    let diskY = (Math.sin(angle) * warpedR) / sinP; 
                    let diskDist = Math.sqrt(diskX * diskX + diskY * diskY);

                    // Initialize background space void color
                    let r = 2, g = 2, b = 6; 

                    // Accretion disk volumetric rendering limits
                    if (diskDist > rs * 1.2 && diskDist < rs * 6) {
                        // Procedural gas bands using math noise spirals
                        let radialSpeed = t * 2.5 + (150 / diskDist);
                        let gasTex = noise(diskDist * 0.12 - radialSpeed, Math.atan2(diskY, diskX) * 5, t * 0.2);
                        gasTex += noise(diskDist * 0.3, Math.atan2(diskY, diskX) * 12, t) * 0.3;

                        // Density attenuation falloff curves
                        let edgeFade = Math.sin((diskDist - rs * 1.2) / (rs * 4.8) * Math.PI);
                        let density = gasTex * edgeFade * (options.density * 0.8);

                        // Asymmetric Relativistic Doppler Boosting (Left side approaches, Right side recedes)
                        let orbitalDirection = diskX; 
                        let doppler = 1.0 - (orbitalDirection / diskDist) * 0.55;
                        density *= doppler;

                        if (density > 0.02) {
                            // Thermal color curves (Hot blue/white inner ring to dark crimson outer boundary)
                            let heat = Math.min(1, (rs * 3) / diskDist);
                            r += density * (180 + heat * 75);
                            g += density * (80 + heat * 175);
                            b += density * (30 + heat * 225);
                        }
                    }

                    // Gravitational Photon Lensing Ring overlay (The ultra-thin light wrap at horizon boundary)
                    if (r_raw >= rs && r_raw < rs + 4) {
                        let RingIntensity = Math.pow(1 - (r_raw - rs) / 4, 3.5) * 190;
                        r += RingIntensity; g += RingIntensity * 0.6; b += RingIntensity * 0.3;
                    }

                    // Apply rendered pixel array values
                    data[rIdx]     = Math.min(255, r);
                    data[rIdx + 1] = Math.min(255, g);
                    data[rIdx + 2] = Math.min(255, b);
                    data[rIdx + 3] = 255;
                }
            }

            ctx.putImageData(imgData, 0, 0);
            
            // Smoothly scale performance frame output up to full screen size
            ctx.drawImage(canvas, 0, 0, width, height, 0, 0, window.innerWidth, window.innerHeight);
            
            options.time += 0.03;
            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
