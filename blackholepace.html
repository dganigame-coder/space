<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relativistic WebGL Black Hole Simulator</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(4, 4, 8, 0.8); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px;
            padding: 24px; width: 320px; color: #f8fafc;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 4px 0; color: #60a5fa; }
        .desc { font-size: 0.75rem; color: #64748b; margin-bottom: 20px; text-transform: uppercase; }
        .control { margin-bottom: 16px; }
        label { display: flex; justify-content: space-between; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 6px; }
        .val { font-family: monospace; color: #34d399; }
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #3b82f6; cursor: pointer; box-shadow: 0 0 8px rgba(59,130,246,0.6); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <h1>Singularity Engine</h1>
        <div class="desc">WebGL Relativistic Spacetime</div>
        
        <div class="control">
            <label>Camera Tilt <span id="tilt-val" class="val">0.15 rad</span></label>
            <input type="range" id="tilt" min="-0.5" max="0.5" step="0.01" value="0.15">
        </div>
        <div class="control">
            <label>Disk Outer Limit <span id="disk-val" class="val">5.5 Rs</span></label>
            <input type="range" id="disk" min="3.0" max="8.0" step="0.1" value="5.5">
        </div>
    </div>

    <script>
        // Setup Three.js Boilerplate
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Uniforms data structure passed straight to GPU
        const uniforms = {
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            u_time: { value: 0 },
            u_camTilt: { value: 0.15 },
            u_diskOuter: { value: 5.5 }
        };

        // UI Event Listeners
        document.getElementById('tilt').addEventListener('input', (e) => {
            uniforms.u_camTilt.value = parseFloat(e.target.value);
            document.getElementById('tilt-val').innerText = uniforms.u_camTilt.value.toFixed(2) + ' rad';
        });
        document.getElementById('disk').addEventListener('input', (e) => {
            uniforms.u_diskOuter.value = parseFloat(e.target.value);
            document.getElementById('disk-val').innerText = uniforms.u_diskOuter.value.toFixed(1) + ' Rs';
        });

        // GLSL Vertex Shader (Passes screen geometry layout)
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        // GLSL Fragment Shader: Pure Spacetime Gravitational Lensing Mathematics
        const fragmentShader = `
            uniform vec2 u_resolution;
            uniform float u_time;
            uniform float u_camTilt;
            uniform float u_diskOuter;
            varying vec2 vUv;

            // GPU Pseudo-random noise for fluid gas texture
            float noise(vec2 p) {
                return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
            }

            float fbm(vec2 p) {
                float v = 0.0;
                float amt = 0.5;
                for (int i = 0; i < 4; i++) {
                    v += amt * noise(p);
                    p *= 2.0;
                    amt *= 0.5;
                }
                return v;
            }

            void main() {
                // Normalize screen coordinates (-1 to 1 layout)
                vec2 uv = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / u_resolution.y;

                // Set up mathematical camera metrics
                vec3 rayOri = vec3(0.0, u_camTilt * 3.5, 7.0); 
                vec3 rayDir = normalize(vec3(uv, -1.8));

                // Relativistic Raymarching Engine loop
                vec3 p = rayOri;
                float stepSize = 0.04;
                vec3 totalColor = vec3(0.0);
                float accumulatedAlpha = 0.0;

                float rs = 0.7; // Schwarzschild Radius boundary baseline

                for (int i = 0; i < 160; i++) {
                    float r2 = dot(p, p);
                    float r = sqrt(r2);

                    if (r < rs) {
                        // Ray fell inside Event Horizon: Terminate light path instantly
                        break;
                    }

                    // --- CRITICAL PHYSICS: Einstein General Relativity Ray Bending ---
                    // Force vector dragging rays toward mass center based on inverse cube law
                    vec3 gravityF = (-1.5 * rs * cross(cross(p, rayDir), rayDir)) / (r2 * r);
                    rayDir = normalize(rayDir + gravityF * stepSize);
                    p += rayDir * stepSize;

                    // Test interception intersect with flat accretion disk plane (y = 0)
                    float thicknessLimit = 0.06;
                    if (abs(p.y) < thicknessLimit) {
                        float diskR = length(p.xz);

                        // Render parameters inside the accretion disk metrics
                        if (diskR > rs * 1.5 && diskR < u_diskOuter) {
                            // Map moving gas fields using fractal noise spirals
                            float phi = atan(p.z, p.x);
                            vec2 texUV = vec2(diskR * 2.5 - u_time * 1.8, phi * 2.5 + diskR * 0.4);
                            float gasDensity = fbm(texUV) * smoothstep(rs * 1.5, rs * 2.5, diskR) * smoothstep(u_diskOuter, u_diskOuter - 1.0, diskR);

                            // Relativistic Doppler Beaming (Left-side approaches user, boosts illumination)
                            float doppler = 1.0 - (p.z / diskR) * 0.55;
                            gasDensity *= doppler;

                            if (gasDensity > 0.05) {
                                // Dynamic core heat gradients (No hard solid vector lines)
                                float heatMap = smoothstep(u_diskOuter, rs * 1.5, diskR);
                                vec3 hotCoreColor = vec3(1.0, 0.55, 0.2) + vec3(0.2, 0.4, 1.0) * pow(heatMap, 3.0);
                                
                                float alpha = gasDensity * 0.25;
                                totalColor += (1.0 - accumulatedAlpha) * hotCoreColor * alpha * 4.0;
                                accumulatedAlpha += (1.0 - accumulatedAlpha) * alpha;

                                if (accumulatedAlpha >= 0.98) break;
                            }
                        }
                    }
                }

                // Smoothly merge space void black with the gas energy emission fields
                gl_FragColor = vec4(totalColor, 1.0);
            }
        `;

        // Assemble Shader Material asset components
        const material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: uniforms
        });

        const geometry = new THREE.PlaneGeometry(2, 2);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Core Render and Animation Ticking Event Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            uniforms.u_time.value = clock.getElapsedTime();
            renderer.render(scene, camera);
        }

        // Keep Viewport Scaled Perfectly
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
