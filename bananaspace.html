     <!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Logic - Zen Mode</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; touch-action: none; }
        #ui {
            position: absolute; top: 5%; width: 100%;
            text-align: center; pointer-events: none; z-index: 100;
        }
        #core-target {
            font-size: 80px; font-weight: 900;
            color: #00f2ff; text-shadow: 0 0 20px #00f2ff;
        }
        #status-bar { color: #ff00ff; font-size: 18px; margin-top: 10px; letter-spacing: 2px; }
        .cube-label {
            position: absolute; color: white; font-size: 26px; font-weight: bold;
            pointer-events: none; z-index: 50; text-shadow: 0 0 10px black;
        }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
</head>
<body>
    <div id="ui">
        <div id="core-target">--</div>
        <div id="status-bar">סריקה גלקטית...</div>
    </div>
    <div id="labels-container"></div>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // תאורה
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const pLight = new THREE.PointLight(0x00f2ff, 2, 50);
        scene.add(pLight);

        // חללית - יהלום אנרגיה
        const ship = new THREE.Mesh(
            new THREE.OctahedronGeometry(0.4), 
            new THREE.MeshPhongMaterial({ color: 0x00f2ff, emissive: 0x002233, wireframe: true })
        );
        scene.add(ship);
        camera.position.z = 10; // התרחקות מהאקשן כדי לראות טוב יותר

        let targetNum, activePart = null, items = [];

        function initLevel() {
            const a = Math.floor(Math.random() * 8) + 2;
            const b = Math.floor(Math.random() * 8) + 2;
            targetNum = a * b;
            
            document.getElementById('core-target').innerText = targetNum;
            document.getElementById('core-target').style.color = "#00f2ff";
            document.getElementById('status-bar').innerText = activePart ? "מחפש רכיב משלים ל-" + activePart : "אסוף רכיב קוד ראשון";
            
            items.forEach(item => { scene.remove(item.mesh); item.label.remove(); });
            items = [];

            const pool = [a, b, 2, 3, 4, 5, 6, 7, 8, 9].sort(() => Math.random() - 0.5).slice(0, 5);
            pool.forEach(n => {
                const mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(0.8, 0.8, 0.8),
                    new THREE.MeshPhongMaterial({ color: 0xff00ff, flatShading: true })
                );
                // מתחילים רחוק מאוד (Z = -40) ובקצב רגוע
                mesh.position.set((Math.random()-0.5)*10, (Math.random()-0.5)*15, -40);
                scene.add(mesh);

                const label = document.createElement('div');
                label.className = 'cube-label';
                label.innerText = n;
                document.getElementById('labels-container').appendChild(label);
                items.push({ mesh, label, num: n, speed: 0.08 + (Math.random() * 0.04) }); // מהירות איטית פי 2
            });
        }

        let mx = 0, my = 0;
        window.addEventListener('pointermove', (e) => {
            mx = (e.clientX / window.innerWidth) * 2 - 1;
            my = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        function animate() {
            requestAnimationFrame(animate);
            
            ship.position.x += (mx * 6 - ship.position.x) * 0.05;
            ship.position.y += (my * 8 - ship.position.y) * 0.05;
            ship.rotation.y += 0.02;

            items.forEach((item, i) => {
                item.mesh.position.z += item.speed;
                item.mesh.rotation.x += 0.01;
                
                const v = item.mesh.position.clone().project(camera);
                item.label.style.left = (v.x + 1) / 2 * window.innerWidth + 'px';
                item.label.style.top = (-v.y + 1) / 2 * window.innerHeight + 'px';

                // בדיקת פגיעה
                if(ship.position.distanceTo(item.mesh.position) < 1.0) {
                    if(!activePart) {
                        activePart = item.num;
                        ship.material.color.setHex(0xff00ff);
                        initLevel();
                    } else {
                        if(activePart * item.num === targetNum) {
                            activePart = null;
                            ship.material.color.setHex(0x00ff00);
                            document.getElementById('core-target').style.color = "#00ff00";
                            setTimeout(initLevel, 800);
                        } else {
                            activePart = null;
                            ship.material.color.setHex(0xff0000);
                            document.getElementById('core-target').style.color = "#ff0000";
                            setTimeout(initLevel, 800);
                        }
                    }
                    scene.remove(item.mesh); item.label.remove(); items.splice(i, 1);
                }
                
                // איפוס קוביה שחלפה
                if(item.mesh.position.z > 10) {
                    item.mesh.position.z = -40;
                    item.mesh.position.x = (Math.random()-0.5)*10;
                    item.mesh.position.y = (Math.random()-0.5)*15;
                }
            });
            renderer.render(scene, camera);
        }

        initLevel();
        animate();
    </script>
</body>
</html>
